<!DOCTYPE html>
<html lang="en" class="theme-clinical">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Live Chart — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js?v=2026.08.21-03"></script>
<script src="/auth.js?v=2026.08.21-03"></script>
<script src="/navbar.js?v=2026.08.21-03"></script>
<script src="/anesthesia.js?v=2026.08.21-03"></script>
<link rel="stylesheet" href="/tokens.css?v=2026.08.21-03">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
/* Ground, teal and hairline come from the clinical theme. This block used to
   redefine all four, which pinned the page to the old green-black ground and
   to the pre-homepage teal no matter what the theme said. */
body{font-family:var(--font);background:var(--ground);color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;}
#loader{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;}
.spin{width:30px;height:30px;border:3px solid rgba(27,107,90,.25);border-top-color:var(--teal2);
  border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
#app{display:none;max-width:1000px;margin:0 auto;padding:30px 20px 60px;}
h1{font-family:var(--sans);font-size:26px;font-weight:700;margin-bottom:4px;}
.sub{font-size:14px;color:var(--muted);margin-bottom:22px;}
.card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius-md);
  overflow:hidden;margin-bottom:14px;}
.card-h{padding:12px 16px;border-bottom:1px solid rgba(27,107,90,.16);font-size:12.5px;
  font-weight:700;color:var(--accent);}
.card-b{padding:16px;}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;text-decoration:none;color:inherit;
  border-bottom:1px solid rgba(255,255,255,.05);transition:background .15s;}
.row:hover{background:rgba(126,207,192,.07);}
.row:last-child{border-bottom:none;}
.row-main{flex:1;min-width:0;}
.row-name{font-size:15px;font-weight:600;}
.row-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.badge{font-size:11px;font-weight:600;border-radius:var(--radius-sm);padding:4px 9px;white-space:nowrap;}
.b-live{background:rgba(27,107,90,.18);border:1px solid rgba(42,138,116,.35);color:var(--accent);}
.b-done{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.6);}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:14px;line-height:1.7;}
/* Teal, not amber. A Standalone Clinical Case is a legitimate use of the
   product, not a degraded state, and an alert colour would tell the opposite
   story. */
.ac-standalone{display:flex;flex-direction:column;gap:3px;margin:0 0 16px;padding:13px 16px;
  border-radius:var(--radius-md);background:var(--brand-tint);border:1px solid var(--brand-tint-2);}
.ac-standalone b{font-size:13px;font-weight:700;color:var(--ink);}
.ac-standalone span{font-size:12.5px;color:var(--ink-2);line-height:1.6;}
.ac-standalone a{color:var(--brand-read);}
label{display:block;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;margin:10px 0 4px;}
input,select{width:100%;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);
  border-radius:var(--radius-sm);padding:10px 12px;color:#fff;font-family:inherit;font-size:14.5px;min-height:44px;outline:none;}
input:focus,select:focus{border-color:var(--teal2);}
select option{background:var(--dark3);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-size:14.5px;
  font-weight:600;cursor:pointer;background:var(--teal);color:#fff;min-height:46px;margin-top:14px;}
.btn:hover{background:var(--teal2);}
.btn.ghost{background:none;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);}
.msg{display:none;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;margin-top:10px;
  background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);color:#FFB4A8;}
/* Waiting is not failing. An account that has not been verified yet is a
   state, not an error, and painting it in the refusal colour tells a new
   clinician something went wrong on their first visit. */
.msg.msg-wait{background:rgba(232,168,56,.1);border-color:rgba(232,168,56,.28);color:rgba(255,220,150,.92);}
.qrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.qrow input{flex:1 1 260px;min-width:0;}
.tabs{display:flex;gap:5px;flex-wrap:wrap;}
.tab{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:var(--radius-sm);
  padding:8px 13px;font-size:13px;font-family:inherit;color:rgba(255,255,255,.6);
  cursor:pointer;min-height:40px;}
.tab:hover{color:#fff;background:rgba(126,207,192,.1);}
.tab.on{background:rgba(27,107,90,.26);border-color:var(--teal2);color:#fff;font-weight:600;}
@media(max-width:560px){ .g2{grid-template-columns:1fr;} #app{padding:20px 14px 50px;}
  .qrow{flex-direction:column;align-items:stretch;} .tabs{justify-content:stretch;} .tab{flex:1;} }
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="app">
  <div id="tools-bar"></div>
  <h1>Live Chart</h1>
  <p class="sub">The digital anesthesia record. Cases you are charting, or have a treating
    relationship with — the database decides which, not this page.</p>

  <div class="qrow">
    <input id="q" placeholder="Search by name, MRN, procedure or room" oninput="render()" autocomplete="off">
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="card">
    <div class="card-h">START A NEW RECORD</div>
    <div class="card-b">
      <!-- The label, the placeholder and the two identity fields below are
           rewritten in place for a Standalone Clinical Case. Written here as
           the verified-clinician form because that is the one most people
           see; openStandalone() adjusts it once, on load, rather than the page
           carrying two copies of the same markup. -->
      <label for="n-name" id="n-name-lab">Patient name</label>
      <input id="n-name" placeholder="As identified in theatre" autocomplete="off">
      <div id="n-idwrap">
        <label for="n-mrn">Hospital / MRN</label>
        <input id="n-mrn" autocomplete="off">
      </div>
      <!-- Date of birth OR age. A new record starts with neither: an empty
           field is an honest statement, and a patient whose birthday nobody
           knows is a normal morning in theatre, not an error. -->
      <label id="n-dob-lab">Date of birth / age</label>
      <div id="n-dobwrap"></div>
      <div class="g2">
        <div><label for="n-weight">Weight (kg)</label><input id="n-weight" type="number" step="0.1"></div>
        <div><label for="n-height">Height (cm)</label><input id="n-height" type="number" step="0.5"></div>
      </div>
      <div class="g2">
        <!-- Sex was only ever on the case header, so a new record started
             without it and it had to be filled in afterwards. ANES.createCase
             has always forwarded the column; the form simply never asked. It
             matters more here than most: dosing and airway prediction both use
             it, and on a Standalone Clinical Case it is one of the few things
             that describes the physiology at all. -->
        <div><label for="n-sex">Sex</label>
          <select id="n-sex"><option value="">—</option><option value="female">Female</option>
            <option value="male">Male</option><option value="other">Other</option>
            <option value="unknown">Unknown</option></select></div>
        <div><label for="n-asa">ASA</label>
          <select id="n-asa"><option value="">—</option><option>I</option><option>II</option>
            <option>III</option><option>IV</option><option>V</option><option>VI</option></select></div>
      </div>
      <!-- Full width, not a lonely half. Adding Sex to the row above left
           Urgency alone in a two-column grid with a gap beside it. -->
      <label for="n-urgency">Urgency</label>
      <select id="n-urgency"><option value="elective">Elective</option>
        <option value="urgent">Urgent</option><option value="emergency">Emergency</option></select>
      <label for="n-proc">Planned procedure</label>
      <input id="n-proc" placeholder="e.g. Laparoscopic cholecystectomy" autocomplete="off">
      <label for="n-diag">Diagnosis</label>
      <input id="n-diag" placeholder="e.g. Symptomatic cholelithiasis" autocomplete="off">
      <label for="n-allergy">Allergies</label>
      <input id="n-allergy" placeholder="Leave blank only if genuinely none known" autocomplete="off">
      <button class="btn" id="n-go" onclick="createCase()">Open record</button>
      <div class="msg" id="n-err"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-h" id="list-h">RECORDS</div>
    <div id="list"></div>
  </div>
</div>

<script>
/* The list is whatever RLS returns. There is no "my cases" filter in the query
   because there does not need to be one: a doctor simply cannot select a case
   they have no relationship with, so the client asking for everything and the
   client asking for its own rows return the same thing. */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* Four views over the same list rather than four queries: RLS already decided
   what this doctor may see, and re-asking the server per tab would only add
   round-trips and a second place for the filter to drift. */
var VIEWS = [
  { id:'active',    label:'Active',    hint:'Open records you are charting now' },
  { id:'recent',    label:'Recent',    hint:'Everything from the last 14 days' },
  { id:'finalized', label:'Finalized', hint:'Signed records' },
  { id:'all',       label:'All',       hint:'Every record you can see' }
];
var _view = 'active', _cases = [];

function inView(c){
  if(_view === 'active')    return c.status !== 'finalized';
  if(_view === 'finalized') return c.status === 'finalized';
  if(_view === 'recent'){
    var d = new Date(c.case_date || c.created_at);
    return (Date.now() - d.getTime()) <= 14*86400000;
  }
  return true;
}
function matches(c, q){
  if(!q) return true;
  return [c.display_name, c.mrn, c.planned_procedure, c.actual_procedure, c.operating_room, c.surgeon]
    .filter(Boolean).join(' ').toLowerCase().indexOf(q) >= 0;
}
function setView(v){ _view = v; renderTabs(); render(); }
function renderTabs(){
  el('tabs').innerHTML = VIEWS.map(function(v){
    return '<button class="tab' + (_view===v.id?' on':'') + '" title="' + esc(v.hint) +
           '" onclick="setView(\'' + v.id + '\')">' + esc(v.label) + '</button>';
  }).join('');
}

async function load(){
  _cases = await ANES.listCases();
  renderTabs();
  render();
}

function render(){
  var q = (el('q').value || '').trim().toLowerCase();
  var cases = _cases.filter(inView).filter(function(c){ return matches(c, q); });
  var view = VIEWS.filter(function(v){ return v.id === _view; })[0] || VIEWS[0];
  el('list-h').textContent = view.label.toUpperCase() + ' — ' + cases.length +
    (cases.length === 1 ? ' RECORD' : ' RECORDS');
  if(!cases.length){
    el('list').innerHTML = '<div class="empty">' +
      (q ? 'Nothing matches &ldquo;' + esc(q) + '&rdquo; in this view.'
         : (_view === 'active' ? 'No open records.<br>Start one above — you can fill in the detail as the case goes.'
                               : 'Nothing here yet.')) + '</div>';
    return;
  }
  el('list').innerHTML = cases.map(function(c){
    var live = c.status !== 'finalized';
    var bits = [];
    var age = ANES.ageLabel(c);
    if(age) bits.push(age);
    if(c.planned_procedure) bits.push(c.planned_procedure);
    if(c.case_date) bits.push(new Date(c.case_date).toLocaleDateString());
    if(c.operating_room) bits.push(c.operating_room);
    return '<a class="row" href="/anesthesia-record.html?case=' + encodeURIComponent(c.id) + '">' +
      '<div class="row-main"><div class="row-name">' + esc(c.display_name || 'Unnamed case') + '</div>' +
      '<div class="row-sub">' + esc(bits.join(' · ')) + '</div></div>' +
      '<span class="badge ' + (live ? 'b-live' : 'b-done') + '">' +
      (live ? 'In progress' : 'Finalized') + '</span></a>';
  }).join('');
}

/* A failed creation must never look like nothing happened.

   The clinician taps Open record and either the chart opens or they are told,
   in the server's own words, why it did not — visibly, next to the button they
   pressed, and it stays on screen until they act. A refusal that scrolls out of
   view or fades after five seconds is indistinguishable from a dead button, and
   a dead button in theatre means the case gets charted on paper. */
var _creating = false;
function showCreateError(text, hint){
  var err = el('n-err');
  err.className = 'msg msg-err';
  err.innerHTML = '<strong>The record was not created.</strong><br>' + esc(text) +
    (hint ? '<br><span style="opacity:.8">' + esc(hint) + '</span>' : '');
  err.style.display = 'block';
  try { err.scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){}
}
/* PostgREST speaks in policy names. Say what it means for the person holding
   the iPad, without pretending to know more than the server told us. */
function createHint(msg){
  msg = String(msg || '');
  if(/row-level security|permission denied|violates row-level/i.test(msg))
    return 'Your account is not permitted to open anesthesia records. This needs a doctor ' +
           'account with approved verification — an administrator account is not the same thing.';
  if(/not signed in|JWT|session/i.test(msg))
    return 'Your session may have expired. Reload the page and sign in again.';
  if(/Failed to fetch|NetworkError|network/i.test(msg))
    return 'The server could not be reached. Check the connection and try again.';
  return 'Nothing was saved. You can correct the details and try again.';
}

/* ── STANDALONE CLINICAL CASE ──────────────────────────────────────────────
   Not a sandbox and not a demo. The anesthesia record it opens is the real
   one, the same chart a verified clinician keeps, with the same drugs, vitals,
   airway, events and timings. What it does not carry is a patient's identity,
   because a doctor account that has not been verified has no standing to hold
   one.

   So this rewrites three things and leaves the rest of the form alone: the
   name field becomes a case title, the MRN field goes, and the date-of-birth
   control becomes age. Age stays because dosing needs it and "44 years"
   describes a physiology rather than a person.

   Everything here is presentation. v9_5_verification_boundary.sql refuses
   mrn, date_of_birth, surgery_id, clinic_patient_id and patient_user_id on
   the write side for exactly this caller, so a console cannot get past it. */
function openStandalone(){
  el('n-name-lab').textContent = 'Case title';
  el('n-name').placeholder = 'e.g. Morning laparoscopic case';
  el('n-idwrap').style.display = 'none';
  el('n-dob-lab').textContent = 'Age';
  el('q').placeholder = 'Search by title, procedure or room';

  var head = document.querySelector('.card-h');
  if(head) head.textContent = 'START A STANDALONE CLINICAL CASE';

  var note = document.createElement('div');
  note.className = 'ac-standalone';
  note.innerHTML =
    '<b>Standalone Clinical Case</b>' +
    '<span>This is a standalone clinical case. Do not enter identifiable patient ' +
    'information until your account is verified. Full anesthesia documentation is ' +
    'available, saved to your account and not attached to a patient record. ' +
    'Complete <a href="/doctor-pending.html">professional verification</a> to chart ' +
    'for your own patients.</span>';
  /* Above the form, not above the list. Inserting it before #list put it
     inside the "Active — 0 records" card, where it read as a note about the
     empty list rather than an explanation of the form above it. It belongs
     before the thing it describes. */
  var form = document.querySelector('.card');
  if(form && form.parentNode) form.parentNode.insertBefore(note, form);
}

async function createCase(){
  if(_creating) return;                     // a second tap must not open a second case
  var err = el('n-err'); err.style.display = 'none';
  var name = el('n-name').value.trim();
  if(name.length < 2){
    showCreateError(ANES.standalone ? 'Give the case a title.' : 'Enter the patient name.', '');
    el('n-name').focus(); return; }

  /* Refused here rather than by the database, so the clinician is told which
     field is wrong while they are still looking at it. */
  var age = ANES.readDob('n-dob');
  if(age.error){
    showCreateError(age.error, ANES.standalone
      ? 'Give an age, or leave it blank.'
      : 'Correct the date of birth, give an age instead, or leave both blank.');
    var f = el('n-dob-wrap'); if(f) try { f.scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){}
    return;
  }

  _creating = true;
  var btn = el('n-go'); btn.disabled = true; btn.textContent = 'Opening…';
  var r;
  try {
    r = await ANES.createCase({
      display_name: name,
      /* NULL, not "whatever is in the hidden input". A Standalone Clinical
         Case carries no identifiers, and sending an empty string would be a
         value where the policy expects an absence. The database refuses these
         columns for this caller anyway — this is the form agreeing with it
         rather than discovering it. */
      mrn: ANES.standalone ? null : (el('n-mrn').value.trim() || null),
      date_of_birth: ANES.standalone ? null : age.date_of_birth,
      age_value: age.age_value,
      age_unit: age.age_unit,
      sex: el('n-sex').value || null,
      weight_kg: parseFloat(el('n-weight').value) || null,
      height_cm: parseFloat(el('n-height').value) || null,
      asa_class: el('n-asa').value || null,
      urgency: el('n-urgency').value,
      planned_procedure: el('n-proc').value.trim() || null,
      diagnosis: el('n-diag').value.trim() || null,
      allergies: el('n-allergy').value.trim() || null
    });
  } catch(e){
    r = { error:{ message: e && e.message ? e.message : String(e) } };
  }
  _creating = false;
  btn.disabled = false; btn.textContent = 'Open record';

  if(!r || r.error || !r.id){
    var msg = (r && r.error && r.error.message) ||
              'The server did not return a record. Nothing was saved.';
    try { console.error('[live chart] case creation failed', r && r.error); } catch(e){}
    showCreateError(msg, createHint(msg));
    return;
  }
  location.href = '/anesthesia-record.html?case=' + encodeURIComponent(r.id);
}

(async function(){
  /* requireRole('staff') is a courtesy, not the boundary: it decides what to
     render. A patient is sent to their own area, and even if someone reached
     this URL anyway the queries return nothing and every write is refused.

     An unapproved doctor is no longer redirected away — see the note in
     auth.js. But letting them fill in a patient name, a date of birth and an
     ASA class only to have the INSERT refused would be worse than the old
     bounce, not better: they would have typed real patient details into a
     form that was never going to save. So the form is closed here, with the
     reason stated, and the record list below still renders (empty, because
     the database gives them nothing) rather than pretending to be broken. */
  var auth = await window.requireRole('staff');
  if(!auth) return;

  /* STANDALONE MODE IS NOT A NEW MODE. It is what this page has always done.
     The New Case form below passes no surgery_id, no clinic_patient_id and no
     patient_user_id, so every chart created here is about nobody in this
     database — the identity is whatever the clinician types, exactly as it
     would be on paper.

     That is why an unverified doctor can use this page in full. What they
     cannot do is open a chart that IS attached to a patient record, and that
     is enforced by v9_5_verification_boundary.sql rather than by this line:
     the RESTRICTIVE policy refuses any row whose three link columns are not
     all null, on read and on write. Removing the notice below would not grant
     anybody anything.

     The notice exists so the limit is legible rather than discovered. A
     clinician who charts a real case here and later finds it is not on the
     patient's record has been misled by silence. */
  if(auth.unverifiedDoctor){
    ANES.setStandalone(true);
    openStandalone();
  }

  el('tools-bar').innerHTML = window.nbToolsBar('/anesthesia-cases.html');
  // Empty: a new record starts with no date of birth and no age.
  el('n-dobwrap').innerHTML = ANES.dobFieldHtml('n-dob', {});
  await load();
  el('loader').style.display = 'none';
  el('app').style.display = 'block';
})();
</script>
</body>
</html>
