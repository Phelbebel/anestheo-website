  'shield-check':'<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  'pill':'<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>',
  'activity':'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  'wind':'<path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/>',
  'scan':'<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
  'target':'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  'droplets':'<path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 4.8 7 3.5c-.29 1.3-1.14 2.63-2.29 3.56S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>',
  'gauge':'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  'alert-triangle':'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  'flame':'<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  'heart-pulse':'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
  'hospital':'<path d="M12 6v4"/><path d="M14 14h-4"/><path d="M14 18h-4"/><path d="M14 8h-4"/><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h2"/><path d="M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"/>',
  'search':'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  'star':'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  'clock':'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  'arrow-right':'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  'external-link':'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  'sparkles':'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>'
};
function dIcon(name, cls){
  return '<svg class="dico'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(DICONS[name]||'')+'</svg>';
}
window.dIcon=dIcon;

// SECTION 2 — Patient management (clinic_patients table)
var _wsPatients = [], _wsPtFilter = 'all', _wsDoctorId = null;

function wsToken(){
  var a = new Uint8Array(18);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}
function wsQStatusLabel(s){
  return {not_sent:'Not sent',sent:'Sent',opened:'Opened',in_progress:'In progress',completed:'Completed'}[s] || 'Not sent';
}
function wsQStatusClass(s){
  return {not_sent:'b-closed',sent:'b-new',opened:'b-new',in_progress:'b-review',completed:'b-answered'}[s] || 'b-closed';
}
function wsVisitLabel(s){
  return {not_arrived:'Not arrived',arrived:'Arrived',reviewed:'Reviewed'}[s] || 'Not arrived';
}
function wsVisitClass(s){
  return {not_arrived:'b-closed',arrived:'b-review',reviewed:'b-approved'}[s] || 'b-closed';
}
function wsStatusLabel(s){ return {awaiting_questionnaire:'Awaiting questionnaire',awaiting_consultation:'Awaiting consultation',ready_for_surgery:'Ready for surgery',completed:'Completed'}[s] || 'Awaiting questionnaire'; }
function wsDeriveStatus(p){
  if(p.patient_status) return wsStatusLabel(p.patient_status);
  if(p.questionnaire_status !== 'completed') return 'Awaiting questionnaire';
  if(p.consultation_status === 'reviewed') return 'Awaiting consultation';
  return 'Awaiting consultation';
}

// ── Patient-initiated review requests (Epic B inbox) ──
// ============================================================
// PHASE 1 — Unified Action Center + Active Cases (derived, no stored status)
// Supersedes wsLoadRequests / wsLoadPendingReviews / wsLoadActivePatients.
// All action functions (wsOpenPatient, wsDetail, wsRespondRequest, document
// review, approval) are reused unchanged.
// ============================================================
var URGENCY_CRITICAL=2, URGENCY_SOON=7;
var _wsRequests=[], _wsConsults=[], _wsActiveClinicIds={}, _wsMyPatients=[];
var _wsSurgByClinic={}, _wsHiddenSurgIds={};
// iPad especially: opening a record must not cost the doctor their place in a
// long list. Filter/tab/search already persist (wsMpStateSet); scroll does not,
// so it is captured on open and restored on close.
var _wsScrollY=null;
function wsRememberScroll(){ _wsScrollY=(window.pageYOffset||document.documentElement.scrollTop||0); }
function wsRestoreScroll(){
  if(_wsScrollY==null) return;
  var y=_wsScrollY; _wsScrollY=null;
  try{ window.scrollTo(0,y); }catch(e){}
}
// Remember the doctor's last working state on the My Patients dashboard (UI only).
function wsMpStateKey(){ return 'anestheo_mpstate_'+(window.__wsUserId||'x'); }
function wsMpStateGet(){ try{ return JSON.parse(localStorage.getItem(wsMpStateKey())||'{}'); }catch(e){ return {}; } }
function wsMpStateSet(patch){ try{ var m=wsMpStateGet(); for(var k in patch){ m[k]=patch[k]; } localStorage.setItem(wsMpStateKey(), JSON.stringify(m)); }catch(e){} }
function wsFmtDate(d){ if(!d) return '—'; var dt=new Date(d); if(isNaN(dt.getTime())) return '—';
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return dt.getDate()+' '+mo[dt.getMonth()]+' '+dt.getFullYear(); }
function wsUrgency(date){
  if(!date) return {days:null,label:'',critical:false,soon:false};
  var days=Math.round((new Date(date).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/86400000);
  var label;
  if(days<0) label='Surgery date passed';
  else if(days===0) label='Surgery today';
  else if(days===1) label='Surgery tomorrow';
  else if(days<=2) label='Surgery in 48 hours';
  else if(days<=14) label='Surgery in '+days+' days';
  else if(days<=60) label='Surgery in ~'+Math.round(days/7)+' weeks';
  else label='Surgery in ~'+Math.round(days/30)+' months';
  return {days:days, label:label, critical:(days>=0&&days<=URGENCY_CRITICAL), soon:(days>=0&&days<=URGENCY_SOON)};
}

// Lane rule (pre-migration safe): care_state if present, else is_consultation.
function wsIsConsult(cr, sg){ if(sg && sg.care_state) return sg.care_state==='consultation'; return !!(cr && cr.is_consultation); }
function wsBridgeStage(rs, sg){
  if(sg && sg.completed_at) return 'completed';
  if(rs==='approved') return (sg && sg.surgery_date) ? 'scheduled' : 'approved';
  if(rs==='pending'||rs==='in_review'||rs==='changes_requested') return 'review';
  return 'awaiting';
}
function wsClinicStage(p){
  if(p.patient_status==='completed') return 'completed';
  if(p.patient_status==='ready_for_surgery') return 'scheduled';
  if(p.consultation_status==='reviewed') return 'approved';
  if(p.questionnaire_status==='completed') return 'review';
  return 'awaiting';
}
function wsStageLabel(s){ return {awaiting:'Awaiting questionnaire', review:'Questionnaire submitted — awaiting your review', approved:'Plan approved', scheduled:'Scheduled for surgery', completed:'Completed'}[s]||s; }
var WS_MP_STAGES=['awaiting','review','approved','scheduled','completed'];
// Views that are NOT workflow stages. They slice the same list by the other
// two dimensions — organization (important) and lifecycle (archived, deleted)
// — and are listed separately so nothing ever treats them as a stage.
var WS_MP_VIEWS=['important','archived','deleted'];
function wsMpIsView(v){ return WS_MP_VIEWS.indexOf(v)>=0; }

async function wsLoadCases(){
  var uid=window.__wsUserId; if(!uid) return;
  var crs=[];
  // A care request that was deleted in its own right stays hidden even if its
  // journey is restored — its own deleted_at is the last word. The parent rule
  // is applied below, once the journeys are known.
  try { var r=await window.sb.from('care_requests').select('*').eq('doctor_id',uid).is('deleted_at',null).in('status',['requested','accepted','closed']); crs=(r&&r.data)||[]; }catch(e){}
  var surgById={}, surgByClinic={};
  try { var s=await window.sb.from('patient_surgeries').select('*').eq('assigned_doctor_id',uid);
    ((s&&s.data)||[]).forEach(function(x){ surgById[x.id]=x; if(x.clinic_patient_id) surgByClinic[x.clinic_patient_id]=x; }); }catch(e){}
  var clinics=[];
  try { var cp=await window.sb.from('clinic_patients').select('*').eq('doctor_id',uid); clinics=(cp&&cp.data)||[]; }catch(e){}
  // Lifecycle: soft-deleted records live in the Recycle Bin, never in the
  // ordinary workspace. Archived records DO stay — they have their own stage.
  // wsVisible mirrors journey_visible()/clinic_patient_visible(): a record is
  // hidden when it is deleted, or when a parent above it is deleted. The server
  // predicate is authoritative at open time; this is the list-side twin so a
  // deleted record never even renders a control.
  var deletedClinicIds={}, hiddenSurgIds={};
  clinics.forEach(function(p){ if(p.deleted_at) deletedClinicIds[p.id]=true; });
  clinics=clinics.filter(function(p){ return !p.deleted_at; });
  Object.keys(surgById).forEach(function(k){
    var x=surgById[k];
    if(x.deleted_at || (x.clinic_patient_id && deletedClinicIds[x.clinic_patient_id])){
      hiddenSurgIds[k]=true;
      delete surgById[k];
      if(x.clinic_patient_id) delete surgByClinic[x.clinic_patient_id];
    }
  });
  // care_request_visible(): hidden when the request itself is deleted (already
  // filtered server-side above) OR when the journey it belongs to is. Restoring
  // the journey brings an intact request back, because nothing was written to
  // the request when the parent was deleted.
  crs=crs.filter(function(c){ return !(c.surgery_id && hiddenSurgIds[c.surgery_id]); });
  // Shared with the canonical opener so following a clinic patient to its journey
  // costs no extra query on the common path. _wsHiddenSurgIds is shared with the
  // other lists so one definition of "hidden" serves every surface.
  _wsSurgByClinic=surgByClinic; _wsHiddenSurgIds=hiddenSurgIds;

  // ── Consultation Requests workflow (care_requests only) ──
  _wsRequests=[]; _wsConsults=[]; _wsConsultsDone=[]; var surgicalReqs=[];
  crs.forEach(function(c){
    var sg=surgById[c.surgery_id]||null;
    if(c.status==='requested'){ _wsRequests.push(c); return; }
    if(c.status==='closed'){ if(wsIsConsult(c,sg)) _wsConsultsDone.push(c); return; }
    if(c.status==='accepted'){
      if(wsIsConsult(c,sg)){
        _wsConsults.push({ id:c.id, origin:'patient', surgery_id:c.surgery_id, patient_id:c.patient_id,
          patient_name:c.patient_name||(sg&&sg.patient_name)||'Patient', message:c.message||'',
          doctor_notes:((sg&&sg.doctor_notes!=null)?sg.doctor_notes:c.consult_notes)||'', responded_at:c.responded_at });
      } else { surgicalReqs.push(c); }
    }
  });
  _wsRequests.sort(function(a,b){ return new Date(a.requested_at||0)-new Date(b.requested_at||0); });
  _wsConsults.sort(function(a,b){ return new Date(b.responded_at||0)-new Date(a.responded_at||0); });
  _wsConsultsDone.sort(function(a,b){ return new Date(b.responded_at||0)-new Date(a.responded_at||0); });

  // ── My Patients (surgical ONLY): accepted-surgical care_requests + ALL clinic patients ──
  var pids=surgicalReqs.map(function(c){return c.patient_id;}).filter(Boolean);
  var q={};
  if(pids.length){ try{ var qq=await window.sb.from('preop_questionnaires').select('patient_id,status,completion,review_state').in('patient_id',pids); ((qq&&qq.data)||[]).forEach(function(x){q[x.patient_id]=x;}); }catch(e){} }
  var mp=[]; _wsActiveMap={};
  surgicalReqs.forEach(function(c){
    var sg=surgById[c.surgery_id]||{}; var qd=q[c.patient_id]||{}; var rs=qd.review_state||'not_submitted';
    var stage=wsBridgeStage(rs, sg);
    _wsActiveMap[c.patient_id]={name:c.patient_name,surgeryId:c.surgery_id};
    mp.push({ key:'b'+c.id, origin:'patient', stage:stage, name:c.patient_name||sg.patient_name||'Patient',
      procedure:c.procedure||sg.procedure_type||'', hospital:sg.hospital||'', surgeryDate:sg.surgery_date||null,

      statusText:wsStageLabel(stage), patientId:c.patient_id, surgeryId:c.surgery_id,
      archived:!!sg.archived_at, archivedAt:sg.archived_at||null, archivedBy:sg.archived_by||null,
      updatedAt:(sg.updated_at||c.responded_at||c.requested_at||null),
      // Lifecycle and organization travel with the row so a menu can be built
      // without another read. Star is independent of both workflow and state.
      starred:!!sg.is_starred, lcState:window.PatientLifecycle.stateOf(sg),
      // A patient-requested row IS a journey. If the care request has no

  });
  clinics.forEach(function(p){

      updatedAt:(p.updated_at||p.questionnaire_submitted_at||p.sent_at||p.created_at||null),

  _wsMyPatients=mp;

  wsRenderMyPatients();
  wsRenderRequests();
  wsRenderConsultations();
  wsRenderConsultsDone();

  // Operating List shares this data; refresh it if the doctor is viewing it.

/* ════════ Operating List (Phase 1 — read-only, date-first) ════════
   Reuses _wsMyPatients (loaded by wsLoadCases) + the existing open functions.
   Two additive, RLS-scoped reads enrich the active day with risk flags and
   document review status. No DB / SQL / RPC / schema changes; no change to the
   Patient Management, consultation, or patient-workspace workflows. */
var _wsCasesLoaded = false, _wsOlOffset = 1, _wsOlRisk = {}, _wsOlDocs = {}, _wsOlPlan = {}, _wsOlQ = {}, _wsOlFilter = 'all';
// Missing documents = requirements the doctor REQUESTED (checked in the plan)
// that the patient has NOT uploaded yet (no requirement_documents row for that key).
function wsOlMissing(c){
  var req=_wsOlPlan[c.surgeryId]||[]; if(!req.length) return 0;
  var up=(_wsOlDocs[c.surgeryId]&&_wsOlDocs[c.surgeryId].keys)||{};
  var m=0; req.forEach(function(k){ if(!up[k]) m++; }); return m;
}
function wsOlDateStr(off){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+off);
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function wsOlSameDay(sd, off){ return !!sd && String(sd).slice(0,10)===wsOlDateStr(off); }
function wsOlNice(off){ var d=new Date(); d.setDate(d.getDate()+off);
  var ds=d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  return off===0?('Today · '+ds):off===1?('Tomorrow · '+ds):ds; }
function wsOlCount(off){ return (_wsMyPatients||[]).filter(function(p){ return p.stage!=='completed' && wsOlSameDay(p.surgeryDate,off); }).length; }
function wsOlCasesFor(off){ return (_wsMyPatients||[]).filter(function(p){ return p.stage!=='completed' && wsOlSameDay(p.surgeryDate,off); }); }
function wsOlFlags(pid){ var a=_wsOlRisk[pid]; if(!Array.isArray(a)) return [];
  return a.map(function(f){ return typeof f==='string'?f:((f&&(f.label||f.flag||f.name))||''); }).filter(Boolean); }
function wsOlSetDate(off){ _wsOlOffset=off; wsLoadOpList(); }
function wsOlPickDate(v){ if(!v) return; var t=new Date(); t.setHours(0,0,0,0);
  var off=Math.round((new Date(v+'T00:00:00').getTime()-t.getTime())/86400000); wsOlSetDate(off); }
window.wsOlSetDate=wsOlSetDate; window.wsOlPickDate=wsOlPickDate;

async function wsLoadOpList(){
  var body=document.getElementById('ws-ol-body'); if(!body) return;
  wsRenderOlDates();
  if(!_wsCasesLoaded){ var sm=document.getElementById('ws-ol-summary'); if(sm) sm.innerHTML='';
    body.innerHTML='<div class="ws-ol-empty">Loading your list…</div>'; return; }
  var cases=wsOlCasesFor(_wsOlOffset);
  _wsOlRisk={}; _wsOlDocs={}; _wsOlPlan={}; _wsOlQ={};
  var pids=cases.map(function(c){return c.patientId;}).filter(Boolean);
  var sids=cases.map(function(c){return c.surgeryId;}).filter(Boolean);
  try{ if(pids.length){ var q=await window.sb.from('preop_questionnaires').select('patient_id,risk_flags').in('patient_id',pids);
    ((q&&q.data)||[]).forEach(function(x){ _wsOlRisk[x.patient_id]=x.risk_flags||[]; }); } }catch(e){}
  try{ if(sids.length){ var dr=await window.sb.from('requirement_documents').select('surgery_id,requirement_key,reviewed_at').in('surgery_id',sids);
    ((dr&&dr.data)||[]).forEach(function(x){ var o=_wsOlDocs[x.surgery_id]||(_wsOlDocs[x.surgery_id]={t:0,u:0,keys:{}}); o.t++; if(!x.reviewed_at) o.u++; if(x.requirement_key) o.keys[x.requirement_key]=1; }); } }catch(e){}
  // Requested requirements (checked) from the latest draft/approved plan → drives "missing documents".
  try{ if(sids.length){ var pp=await window.sb.from('preparation_plans').select('surgery_id,plan_content,status,updated_at').in('surgery_id',sids);
    var best={}; ((pp&&pp.data)||[]).forEach(function(x){ if(x.status!=='draft'&&x.status!=='approved') return;
      var rank=(x.status==='approved'?2:1), cur=best[x.surgery_id];
      if(!cur||rank>cur.rank||(rank===cur.rank&&new Date(x.updated_at||0)>new Date(cur.updated_at||0))) best[x.surgery_id]={rank:rank,updated_at:x.updated_at,plan:x.plan_content}; });
    Object.keys(best).forEach(function(sid){ var reqs=(best[sid].plan&&best[sid].plan.requirements)||[];
      _wsOlPlan[sid]=reqs.filter(function(r){return r&&r.checked;}).map(function(r){return r.key;}).filter(Boolean); }); } }catch(e){}
  // Unanswered patient questions (status not answered/closed) — a one-click-approve blocker.
  try{ if(pids.length){ var qn=await window.sb.from('questions').select('patient_id,status').is('deleted_at',null).in('patient_id',pids);
    ((qn&&qn.data)||[]).forEach(function(x){ var st=x.status||'new'; if(st!=='answered'&&st!=='closed') _wsOlQ[x.patient_id]=(_wsOlQ[x.patient_id]||0)+1; }); } }catch(e){}
  wsRenderOpList(cases);
}
function wsRenderOlDates(){
  var el=document.getElementById('ws-ol-dates'); if(!el) return;
  function pill(off,lbl){ return '<button class="ws-ol-dpill'+(_wsOlOffset===off?' on':'')+'" onclick="wsOlSetDate('+off+')">'+lbl+' <span class="n">'+wsOlCount(off)+'</span></button>'; }
  var custom=(_wsOlOffset!==0 && _wsOlOffset!==1);
  el.innerHTML = pill(0,'Today')+pill(1,'Tomorrow')+
    '<input type="date" class="ws-ol-dpill'+(custom?' on':'')+'" style="color-scheme:dark;" value="'+wsOlDateStr(_wsOlOffset)+'" onchange="wsOlPickDate(this.value)" title="Pick a date">';
}
// ── triage helpers (mission control) ──
function wsOlIsReady(c){ return c.stage==='scheduled'||c.stage==='approved'; }
// One-click Approve is offered ONLY for clearly-safe, clearly-straightforward
// cases: submitted & under review, no high-risk flags, no missing documents,
// no documents still to review (approve_plan would block), no open questions.
function wsOlEligible(c){
  if(!c.patientId || c.origin!=='patient' || !c.surgeryId) return false;   // only surgical w/ identity
  if(c.stage!=='review') return false;                                     // submitted, awaiting your review
  if(wsOlFlags(c.patientId).length>0) return false;                        // no high-risk flags
  if(wsOlMissing(c)>0) return false;                                       // no missing documents
  var d=_wsOlDocs[c.surgeryId]; if(d && d.u>0) return false;               // no documents to review
  if((_wsOlQ[c.patientId]||0)>0) return false;                            // no unanswered questions
  return true;
}
function wsOlPriority(c){
  var p=0, flags=wsOlFlags(c.patientId).length;
  if(flags) p+=100;                          // unsafe → top
  if(c.stage==='awaiting') p+=80;            // blocks the list (no questionnaire)
  if(wsOlMissing(c)>0) p+=50;                // missing documents
  var d=_wsOlDocs[c.surgeryId]; if(d&&d.u>0) p+=30;
  if((_wsOlQ[c.patientId]||0)>0) p+=20;
  if(c.stage==='review') p+=10;
  return p;
}
// ── Clinical command strip ─────────────────────────────────────────────
// Additive only: every figure comes from data this page already loaded, and
// every card jumps to an EXISTING section. No new navigation, no new routes.
function wsCommandStrip(cases){
  var host = document.getElementById('ws-cmd'); if(!host) return;
  var today = (cases||[]).length;
  var needRev = (cases||[]).filter(function(c){ return c.stage==='review'; }).length;
  var missing = (cases||[]).filter(function(c){ return wsOlMissing(c)>0; }).length;
  var flagged = (cases||[]).filter(function(c){ return wsOlFlags(c.patientId).length>0; }).length;
  var pendingC = (_wsRequests||[]).length + (_wsConsults||[]).filter(function(c){ return !c.responded_at; }).length;
  var openQ = (_wsAsk||[]).filter(function(q){ return q && q.status && q.status!=='answered' && q.status!=='closed'; }).length;
  var askKnown = Array.isArray(_wsAsk) && _wsAsk.length > 0;

  function card(n, label, onclick, warn, disabled){
    return '<button class="ws-cmd-c'+(warn&&n?' warn':'')+'" type="button"'+
      (disabled?' disabled':' onclick="'+onclick+'"')+'>'+
      '<span class="ws-cmd-n">'+(n===null?'n/a':n)+'</span>'+
      '<span class="ws-cmd-l">'+wsEsc(label)+'</span></button>';
  }
  host.innerHTML = '<div class="ws-cmd-h">Today</div><div class="ws-cmd">'+
    card(today,   "Cases on this day",      "wsOlFilter('all')") +
    card(needRev, 'Awaiting your review',   "wsOlFilter('review')", true) +
    card(flagged, 'Flagged risks',          "wsOlFilter('risk')", true) +
    card(missing, 'Missing documents',      "wsOlFilter('docs')", true) +
    card(pendingC,'Pending consultations',  "wsShow('patients');wsWf('crequests')", true) +
    card(askKnown ? openQ : null, 'Open patient questions', "wsShow('ask')", true, !askKnown) +
    '</div>' +
    /* One entry, not an embedded chart. Doctor Home is where you see what
       needs attention; the anesthesia record is a workspace of its own and
       duplicating it here would give the same data two homes. */
    '<a class="ws-livechart" href="/anesthesia-cases.html">' +
      '<span class="ws-lc-t">Live Chart</span>' +
      '<span class="ws-lc-d">Start or continue an anesthesia record</span>' +
      '<span class="ws-lc-go" aria-hidden="true">&rarr;</span>' +
    '</a>';
}

function wsRenderOpList(cases){
  wsRenderOlDates();
  try{ wsCommandStrip(cases); }catch(e){ console.warn('command strip:', e.message); }
  var sum=document.getElementById('ws-ol-summary'), body=document.getElementById('ws-ol-body');
  var total=cases.length;
  var needs=cases.filter(function(c){return c.stage==='review';}).length;
  var ready=cases.filter(wsOlIsReady).length;
  var highRisk=cases.filter(function(c){return wsOlFlags(c.patientId).length>0;}).length;
  var missingDocs=cases.filter(function(c){return wsOlMissing(c)>0;}).length;
  function chip(key,cls,val,label){
    var on=(_wsOlFilter===key), dis=(key!=='all'&&!val);
    return '<button class="ws-ol-chip '+cls+(on?' on':'')+(dis?' off':'')+'" '+(dis?'disabled ':'')+'onclick="wsOlFilter(\''+key+'\')">' +
      '<span class="d"></span><b>'+val+'</b><span class="l">'+label+'</span></button>';
  }
  if(sum) sum.innerHTML =
    chip('all','',total,(total===1?'case':'cases')) +
    chip('review','rev',needs,'need review') +
    chip('risk','risk',highRisk,'flagged risks') +
    chip('docs','docs',missingDocs,'missing documents') +
    chip('ready','ready',ready,'ready &amp; approved');
  if(!total){
    body.innerHTML='<div class="ws-ol-empty"><b>No surgical cases on '+wsEsc(wsOlNice(_wsOlOffset))+'</b>Choose another day above, or manage patients in Patient Management.</div>';
    return;
  }
  // Active filter narrows which cases are shown (counts above stay full-day totals).
  function matchFilter(c){
    switch(_wsOlFilter){
      case 'review': return c.stage==='review';
      case 'risk':   return wsOlFlags(c.patientId).length>0;
      case 'docs':   return wsOlMissing(c)>0;
      case 'ready':  return wsOlIsReady(c);
      default:       return true;
    }
  }
  var shown=cases.filter(matchFilter);
  // Attention first (unsafe/blocked rise to the top); ready fades to a quiet group.
  var attention=shown.filter(function(c){return !wsOlIsReady(c);}).sort(function(a,b){
    var d=wsOlPriority(b)-wsOlPriority(a); return d!==0?d:(a.name||'').localeCompare(b.name||''); });
  var done=shown.filter(wsOlIsReady).sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
  var html='';
  if(_wsOlFilter!=='all'){
    html += '<div class="ws-ol-filterbar"><span>Showing '+shown.length+' '+({review:'needing review',risk:'high-risk',docs:'with missing documents',ready:'ready'}[_wsOlFilter]||'')+'</span>' +
      '<button class="ws-ol-clearf" onclick="wsOlFilter(\'all\')">Clear filter &times;</button></div>';
  }
  if(attention.length){
    if(_wsOlFilter==='all') html += '<div class="ws-ol-band"><span class="dot"></span>Needs your attention <span class="cnt">'+attention.length+'</span></div>';
    html += '<div class="ws-ol-cards">' + attention.map(wsOlCardHtml).join('') + '</div>';
  } else if(_wsOlFilter==='all'){
    html += '<div class="ws-ol-allclear"><span class="ic">&#10003;</span> All cases are reviewed and ready. Nothing needs your attention '+(_wsOlOffset===1?'for tomorrow':'on this day')+'.</div>';
  }
  if(done.length){
    if(_wsOlFilter==='all') html += '<div class="ws-ol-band quiet"><span class="dot"></span>Ready for surgery <span class="cnt">'+done.length+'</span></div>';
    html += '<div class="ws-ol-ready">' + done.map(wsOlReadyHtml).join('') + '</div>';
  }
  if(!attention.length && !done.length){
    html += '<div class="ws-ol-empty"><b>Nothing matches this filter</b>Clear the filter to see the full day.</div>';
  }
  body.innerHTML=html;
  wsOlAttachGlow();
}
// Beautiful hover lighting — the accent glow follows the cursor across each card.
function wsOlAttachGlow(){
  var body=document.getElementById('ws-ol-body');
  if(!body || body._glow) return; body._glow=true;
  body.addEventListener('mousemove',function(e){
    var card=e.target.closest && e.target.closest('.ws-ol-card'); if(!card) return;
    var r=card.getBoundingClientRect();
    card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');
    card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');
  });
}
// Interactive summary chips → instant filter (click the active chip again to clear).
function wsOlFilter(key){

window.wsOlFilter=wsOlFilter;
function wsOlChips(c){
  var flags=wsOlFlags(c.patientId), docs=_wsOlDocs[c.surgeryId], chips='';

  flags.slice(0,3).forEach(function(f){ chips+='<span class="ws-ol-c risk">'+wsEsc(f)+'</span>'; });
  if(flags.length>3) chips+='<span class="ws-ol-c muted">+'+(flags.length-3)+' more</span>';
  var miss=wsOlMissing(c);
  if(miss) chips+='<span class="ws-ol-c urgent">'+miss+' document'+(miss>1?'s':'')+' missing</span>';
  if(docs && docs.u) chips+='<span class="ws-ol-c doc">'+docs.u+' to review</span>';
  if((_wsOlQ[c.patientId]||0)>0) chips+='<span class="ws-ol-c doc">'+_wsOlQ[c.patientId]+' open question'+((_wsOlQ[c.patientId]>1)?'s':'')+'</span>';

// Primary urgency accent for the card's left rail / glow.

function wsOlSignal(c){

// One-click Approve — reuses the EXISTING approve_plan RPC (no save needed; it
// promotes any draft plan, and already blocks if any document is unreviewed).
async function wsOlApprove(sid, btn){
  if(!sid) return;
  var card=document.querySelector('#ws-ol-body .ws-ol-card[data-sid="'+sid+'"]');
  if(btn){ btn.disabled=true; btn.classList.add('loading'); btn.innerHTML=dIcon('shield-check')+'Approving…'; }
  try{
    var r=await window.sb.rpc('approve_plan',{p_surgery_id:sid});
    if(r && r.error) throw new Error(r.error.message);
    wsToast('Plan approved');
    // Premium transition: flash the card green, then let it slide/fade out before
    // the Ready section absorbs it on the next render (no jarring instant swap).
    if(card){
      card.classList.add('approved-flash');
      await new Promise(function(res){ setTimeout(res,240); });
      card.classList.add('leaving');
      await new Promise(function(res){ setTimeout(res,300); });
    }
    await wsLoadCases();         // refresh from server; the hook re-renders the Operating List
  }catch(e){
    if(btn){ btn.disabled=false; btn.classList.remove('loading'); btn.innerHTML=dIcon('shield-check')+'Approve'; }
    if(card) card.classList.remove('approved-flash','leaving');
    wsToast((e&&e.message)||'Could not approve — open the case to review.');
  }
}
window.wsOlApprove=wsOlApprove;
window.wsLoadOpList=wsLoadOpList;

/* ════════ Live Tools = the integrated Anesthesia Workstation ════════

// Row 1 statistics (computed from the full surgical list, independent of stage/search).
function wsRenderMpStats(){
  // Active patients only — archived records are excluded from the headline.
  var a=(_wsMyPatients||[]).filter(function(p){return !p.archived;});
  var set=function(id,n){ var e=document.getElementById(id); if(e) e.textContent=n; };
  // Headline — the single source for "how many patients" + "who needs me".
  set('ws-mp-hl-total', a.length);
  var pl=document.getElementById('ws-mp-hl-total'); var lab=pl&&pl.parentNode&&pl.parentNode.querySelector('.hl-total-l');
  if(lab) lab.textContent=(a.length===1?'patient':'patients');
  var attn=a.filter(function(p){return p.stage==='review';}).length;
  var pill=document.getElementById('ws-mp-hl-pill');
  if(pill){
    pill.classList.toggle('zero', attn===0);
    pill.innerHTML = attn>0
      ? '<span class="d"></span><b>'+attn+'</b> '+(attn===1?'patient needs':'patients need')+' your review'
      : '<span class="d"></span>All caught up &mdash; no patients awaiting review';
  }
}
// Client-side sort comparators (no new queries).
function wsMpComparator(mode){
  if(mode==='name') return function(a,b){ return (a.name||'').localeCompare(b.name||''); };
  if(mode==='updated') return function(a,b){ return (new Date(b.updatedAt||0).getTime())-(new Date(a.updatedAt||0).getTime()); };
  return function(a,b){ var ad=a.surgeryDate?new Date(a.surgeryDate).getTime():Infinity, bd=b.surgeryDate?new Date(b.surgeryDate).getTime():Infinity; return ad-bd; };
}
// My Patients board — surgical-only, grouped by the 5 derived stages.
function wsRenderMyPatients(){
  // stage counts on the pipeline (active only) + Row 1 statistics
  WS_MP_STAGES.forEach(function(st){
    var el=document.getElementById('ws-mp-'+st+'-n');
    if(el) el.textContent=_wsMyPatients.filter(function(p){return !p.archived && p.stage===st;}).length||0;
  });
  var an=document.getElementById('ws-mp-archived-n');
  if(an) an.textContent=_wsMyPatients.filter(function(p){return p.archived;}).length||0;
  // Important counts ACTIVE starred patients only: a star on an archived record
  // is remembered, but Important is a working list, not a memorial.
  var imp=document.getElementById('ws-mp-important-n');
  if(imp) imp.textContent=_wsMyPatients.filter(function(p){return p.starred && !p.archived;}).length||0;
  var del=document.getElementById('ws-mp-deleted-n');
  if(del) del.textContent=(_wsRecycle?_wsRecycle.length:0)||0;
  wsRenderMpStats();
  var box=document.getElementById('ws-mp-list'); if(!box) return;
  // The Recycle Bin is a different read entirely (recycle_bin_list), not a
  // filter over the active list, because a deleted record is deliberately not
  // in the active list at all.
  if(_wsMpStage==='deleted'){ wsRenderRecycleBin(box); return; }
  var term=(_wsMpSearch||'').trim().toLowerCase();
  var archView=(_wsMpStage==='archived'), impView=(_wsMpStage==='important');
  var list=_wsMyPatients.filter(function(p){
    // Archived rows appear ONLY under Archived. Important shows active starred
    // patients across every stage. Every other filter is a workflow stage.
    if(archView){ if(!p.archived) return false; }
    else if(impView){ if(p.archived || !p.starred) return false; }
    else { if(p.archived) return false; if(p.stage!==_wsMpStage) return false; }
    if(!term) return true;
    return [p.name,p.procedure,p.hospital].filter(Boolean).join(' ').toLowerCase().indexOf(term)>=0;
  }).sort(wsMpComparator(_wsMpSort));
  // Starred first within the chosen order — the star is a priority marker, so
  // it should shorten the search, not just decorate the row.
  list.sort(function(a,b){ return (b.starred?1:0)-(a.starred?1:0); });
  if(!list.length){
    if(term){
      box.innerHTML='<div class="ws-mp-empty"><div class="emo">&#128269;</div>'+
        '<div class="t">No patients match &ldquo;'+wsEsc(_wsMpSearch.trim())+'&rdquo;</div>'+
        '<div class="s">Try a different name, procedure, or hospital.</div>'+
        '<button class="ws-btn pc-green ws-mp-clearbtn" onclick="wsMpClearSearch()">Clear search</button></div>';
    } else {
      box.innerHTML='<div class="ws-empty">'+wsMpEmpty(_wsMpStage)+'</div>';
    }
    return;
  }
  var ringMap={awaiting:'r0',review:'r1',approved:'r2',scheduled:'r3',completed:'r4'};
  box.innerHTML=list.map(function(p){
    var initial=((p.name||'P').trim().charAt(0)||'P').toUpperCase();
    var meta=[p.procedure,p.hospital].filter(Boolean).map(wsEsc).join(' &middot; ');
    var urg=wsUrgency(p.surgeryDate);
    // Surgery-date urgency: red today/tomorrow, orange within 7 days, normal otherwise.
    var dcls=''; if(urg.days!=null && urg.days>=0){ if(urg.days<=1) dcls='red'; else if(urg.days<=URGENCY_SOON) dcls='orange'; }
    var rel=urg.label?urg.label.replace(/^Surgery /,''):''; rel=rel?(rel.charAt(0).toUpperCase()+rel.slice(1)):'';
    var relIco=(dcls==='red'?'&#128308; ':(dcls==='orange'?'&#9888; ':''));
    var dateChip=p.surgeryDate
      ? '<div class="ws-mp-datechip '+dcls+'"><div class="dl">Surgery</div><div class="dd">'+wsEsc(wsFmtDate(p.surgeryDate))+'</div>'+(rel?'<div class="dr">'+relIco+wsEsc(rel)+'</div>':'')+'</div>'
      : '<div class="ws-mp-datechip none"><div class="dl">Surgery</div><div class="dd">Not scheduled</div></div>';
    var pct=Math.max(0,Math.min(100,p.progress||0));
    var origChip=p.origin==='clinic'?'<span class="ws-orig doc">Created</span>':'<span class="ws-orig pt">Requested</span>';
    var action=(p.stage==='review')?'Review &rarr;':'Open &rarr;';
    // One ref per row, carried from the query that knows which table it came
    // from. Archived rows open through exactly the same ref as active ones —
    // the opener adds the archived banner; there is no separate id path and no
    // empty-string fallback.
    var ref={kind:p.openKind,id:p.openId};
    var openable=window.ClinicalOpen && window.ClinicalOpen.isOpenable(ref);
    // Awaiting Questionnaire (invited patients): show send-questionnaire actions.
    var qActions=(!p.archived && p.origin==='clinic'&&p.stage==='awaiting')
      ? '<div class="ws-q-row" onclick="event.stopPropagation()">'+wsQActions(p.clinicId, p.questionnaire_status&&p.questionnaire_status!=='not_sent')+'</div>' : '';
    // Archived rows: show who/when + a Restore action; no clinical primary button.
    var sub = p.archived
      ? 'Archived'+(p.archivedAt?' on '+wsEsc(wsFmtDate(p.archivedAt)):'')+(p.archivedBy===window.__wsUserId?' by you':'')
      : wsEsc(p.statusText);
    // Say so, rather than leaving a row that looks clickable and is not.
    if(!openable) sub += ' &middot; <span style="color:var(--hint);">No record to open yet</span>';
    // Every row carries the same three-dot menu, built from the same ref.
    var lcMenu = openable ? wsLcMenuHtml(ref, (p.archived?'archived':'active'), !!p.starred) : '';
    var right = p.archived
      ? (openable
          ? '<button class="ws-btn ws-mp-act wsx-restore" onclick="event.stopPropagation();wsLcAct(\''+ref.kind+'\',\''+ref.id+'\',\'restore_archive\')">&#8630; Restore</button>'+lcMenu
          : '')
      : (openable
          ? '<button class="ws-btn pc-green ws-mp-act"'+window.ClinicalOpen.refAttr(ref,'event.stopPropagation();')+'>'+action+'</button>'+lcMenu
          : '');
    var progOrArch = p.archived
      ? '<div class="ws-mp-sub" style="margin-top:2px;color:var(--hint);">Data preserved &middot; can be restored</div>'
      : '<div class="ws-mp-prog"><div class="ws-mp-bar"><div class="ws-mp-fill" style="width:'+pct+'%"></div></div><span class="ws-mp-pct">'+pct+'%</span></div>'+qActions;
    return '<div class="ws-mp-row'+(p.archived?' arch':'')+(openable?'':' ws-mp-noopen')+'"'+(openable?window.ClinicalOpen.refAttr(ref):'')+'>'+
      '<div class="ws-mp-ava '+(p.archived?'r4':(ringMap[p.stage]||'r4'))+'"><span class="av-in">'+wsEsc(initial)+'</span></div>'+
      '<div class="ws-mp-main"><div class="ws-mp-top">'+origChip+
        (p.starred?'<span class="ws-star on" title="Important">&#9733;</span>':'')+
        '<span class="ws-mp-nm">'+wsEsc(p.name)+'</span>'+(meta?'<span class="ws-mp-meta">'+meta+'</span>':'')+'</div>'+
        '<div class="ws-mp-sub">'+sub+'</div>'+
        progOrArch+'</div>'+
      '<div class="ws-mp-right">'+dateChip+right+'</div>'+
    '</div>';
  }).join('');
}
function wsMpEmpty(st){ return {awaiting:'No patients awaiting questionnaire.',review:'Nothing awaiting your review.',approved:'No approved patients.',scheduled:'No scheduled surgeries.',completed:'No completed patients yet.',archived:'No archived patients. Archive a completed or inactive patient from their record.',important:'Nothing marked Important. Use the &#8942; menu on any patient to mark them.'}[st]||'No patients in this stage.'; }

/* ══════════ Recycle Bin ══════════════════════════════════════════════════
   Read through recycle_bin_list(), which answers the authorization question
   positively — a patient or a pending doctor receives an empty set rather than
   an error. It is deliberately NOT a filter over the active list: a deleted
   record is not in the active list at all, which is the whole point.

   Permanent deletion is offered only where the server has already said it is
   eligible. Where it is not, the row states the reason instead, because "there
   is a signed anesthesia record" is information the doctor needs. */
var _wsRecycle=[], _wsRecycleErr=null, _wsRecycleLoaded=false, _wsDetailId=null;

async function wsLoadRecycleBin(){
  var r=await window.PatientLifecycle.recycleBin();
  _wsRecycleLoaded=true;
  if(!r.ok){ _wsRecycle=[]; _wsRecycleErr=r.reason||'The Recycle Bin could not be read.'; }
  else { _wsRecycle=r.rows||[]; _wsRecycleErr=null; }
  _wsRecycle.sort(function(a,b){ return new Date(b.deleted_at||0)-new Date(a.deleted_at||0); });
  var del=document.getElementById('ws-mp-deleted-n'); if(del) del.textContent=_wsRecycle.length||0;
  if(_wsMpStage==='deleted'){ var box=document.getElementById('ws-mp-list'); if(box) wsRenderRecycleBin(box); }
}
window.wsLoadRecycleBin=wsLoadRecycleBin;

function wsRenderRecycleBin(box){
  if(!_wsRecycleLoaded){ box.innerHTML='<div class="ws-empty">Loading the Recycle Bin&hellip;</div>'; wsLoadRecycleBin(); return; }
  if(_wsRecycleErr){ box.innerHTML='<div class="ws-empty">'+wsEsc(_wsRecycleErr)+'</div>'; return; }
  var term=(_wsMpSearch||'').trim().toLowerCase();
  var rows=_wsRecycle.filter(function(r){
    if(!term) return true;
    return [r.label,r.detail].filter(Boolean).join(' ').toLowerCase().indexOf(term)>=0;
  });
  if(!rows.length){
    box.innerHTML='<div class="ws-empty">'+(term
      ? 'Nothing in the Recycle Bin matches &ldquo;'+wsEsc(_wsMpSearch.trim())+'&rdquo;.'
      : 'The Recycle Bin is empty. Deleted patients stay here until they are restored or permanently deleted.')+'</div>';
    return;
  }
  box.innerHTML='<div class="ws-bin-note">Deleted patients are kept here. Nothing has been destroyed &mdash; restore returns a record to exactly the state it was in when it was deleted.</div>'+
    rows.map(function(r){
      var kindLabel=(r.kind==='journey')?'Journey':'Patient';
      var who=r.deleted_by_name||'';
      var when=r.deleted_at?wsFmtDate(r.deleted_at):'';
      var sub=['Deleted'+(when?' on '+wsEsc(when):''),(who?'by '+wsEsc(who):'')].filter(Boolean).join(' ');
      var why=r.delete_reason?'<div class="ws-bin-why">&ldquo;'+wsEsc(r.delete_reason)+'&rdquo;</div>':'';
      var purge=r.purge_eligible
        ? '<button class="ws-btn pc-danger ws-mp-act" onclick="wsBinPurge(\''+r.kind+'\',\''+r.id+'\')">Permanently delete&hellip;</button>'
        : '<div class="ws-bin-block" title="'+wsEsc(r.purge_reason||'')+'">&#128274; '+wsEsc(wsBinBlockShort(r.purge_code))+'</div>';
      return '<div class="ws-mp-row ws-bin-row">'+
        '<div class="ws-mp-ava r5"><span class="av-in">&#128465;</span></div>'+
        '<div class="ws-mp-main"><div class="ws-mp-top"><span class="ws-orig doc">'+kindLabel+'</span>'+
          '<span class="ws-mp-nm">'+wsEsc(r.label||'Record')+'</span>'+
          (r.detail?'<span class="ws-mp-meta">'+wsEsc(r.detail)+'</span>':'')+'</div>'+
          '<div class="ws-mp-sub">'+sub+'</div>'+why+
          (r.purge_eligible?'':'<div class="ws-bin-reason">'+wsEsc(r.purge_reason||'')+'</div>')+
        '</div>'+
        '<div class="ws-mp-right">'+
          '<button class="ws-btn pc-green ws-mp-act" onclick="wsLcAct(\''+r.kind+'\',\''+r.id+'\',\'restore_delete\')">&#8630; Restore</button>'+
          purge+
        '</div></div>';
    }).join('');
}

// Short label for the lock chip; the full server reason is shown beneath it.
function wsBinBlockShort(code){
  return { retained_clinical_record:'Signed record retained',
           active_clinical_record:'Live Chart still open',
           clinical_dependencies:'Clinical records attached',
           not_authorized:'Administrator action',
           not_deleted:'Not deleted',
           record_not_found:'No longer available' }[code] || 'Cannot be deleted';
}

/* Permanent deletion. The preview is computed by the server from live foreign
   keys, so it describes what will actually happen rather than what the code
   assumed when it was written. Two lists, because they are two fates. */
async function wsBinPurge(kind, id){
  var e=await window.PatientLifecycle.purgeEligibility(kind, id);
  if(!e || e.eligible!==true){
    var f=window.PatientLifecycle.refusal(e, 'This record cannot be permanently deleted.');
    wsToast(f.text); await wsLoadRecycleBin(); return;
  }
  var lines=window.PatientLifecycle.dependencyLines(e.dependencies);
  var destroyed=lines.filter(function(l){ return l.fate==='destroyed'; });
  var detached=lines.filter(function(l){ return l.fate==='detached'; });
  function list(t, arr){
    if(!arr.length) return '';
    return '<div class="ws-confirm-sub">'+t+'</div><ul class="ws-confirm-ul">'+
      arr.map(function(l){ return '<li>'+l.rows+' &times; '+wsEsc(l.table)+'</li>'; }).join('')+'</ul>';
  }
  var preview=(destroyed.length||detached.length)
    ? list('Destroyed with it', destroyed)+list('Left without a patient', detached)
    : '<div class="ws-confirm-sub">Nothing else references this record.</div>';
  wsConfirmDialog({
    title:'Permanently delete this record?',
    body:'<b>This cannot be undone.</b> The record is destroyed, not hidden. '+
         'It will not be in the Recycle Bin afterwards and it cannot be restored.'+preview,
    confirmLabel:'Permanently delete', danger:true,
    confirmWord:window.PatientLifecycle.CONFIRM_WORD,
    onConfirm: async function(v){
      var r=await window.PatientLifecycle.purge(kind, id, v.word);
      if(!r || r.ok!==true){
        var f2=window.PatientLifecycle.refusal(r, 'Permanent deletion was refused.');
        wsToast(f2.text); await wsLoadRecycleBin(); return;
      }
      wsToast('Permanently deleted.');
      await wsLoadRecycleBin(); await wsLoadPatients(); await wsLoadCases();
    }
  });
}
window.wsBinPurge=wsBinPurge;
window.wsRenderMyPatients=wsRenderMyPatients;

// Completed (closed) consultations — read-only record.
var _wsConsultsDone=[];
async function wsLoadConsultsDone(){
  var uid=window.__wsUserId; if(!uid) return;
  try { var r=await window.sb.from('care_requests').select('*').eq('doctor_id',uid).is('deleted_at',null).eq('status','closed');
    // Same parent rule as the active list: a completed consultation whose
    // journey is in the Recycle Bin is not part of the ordinary record either.
    _wsConsultsDone=((r&&r.data)||[])
      .filter(function(c){ return !(c.surgery_id && _wsHiddenSurgIds[c.surgery_id]); })
      .sort(function(a,b){ return new Date(b.responded_at||0)-new Date(a.responded_at||0); }); }
  catch(e){ _wsConsultsDone=[]; }
  wsRenderConsultsDone(); wsUpdateCrTotal();
}
function wsRenderConsultsDone(){
  var box=document.getElementById('ws-consults-done'); if(!box) return;
  var dn=document.getElementById('ws-cdone-n'); if(dn) dn.textContent=_wsConsultsDone.length||0;
  if(!_wsConsultsDone.length){ box.innerHTML='<div class="ws-consult-empty">No completed consultations yet.</div>'; return; }
  box.innerHTML=_wsConsultsDone.map(function(q){
    var when=q.responded_at?new Date(q.responded_at).toLocaleDateString():'';
    return '<div class="ws-consult-row" onclick="wsOpenConsult(\''+q.id+'\')">'+
      '<div class="ws-consult-info"><div class="ws-consult-name">'+wsEsc(q.patient_name||'Patient')+'</div>'+
      (q.message?'<div class="ws-consult-msg">&ldquo;'+wsEsc(q.message.length>72?q.message.slice(0,72)+'…':q.message)+'&rdquo;</div>':'')+
      (when?'<div class="ws-consult-meta">Completed '+when+'</div>':'')+'</div>'+
      '<div class="ws-consult-open">Open record &rarr;</div></div>';
  }).join('');
}
window.wsLoadConsultsDone=wsLoadConsultsDone;

// ── Recommendations widget (shared: consultation AND surgical workspaces) ──
// One system, keyed to surgery_id on the patient record. Each item carries a
// visible_to_patient toggle: false = internal draft, true = published to portal.
async function wsFetchRecs(surgeryId){
  if(!surgeryId) return [];
  try{ var r=await window.sb.from('patient_recommendations').select('*').eq('surgery_id',surgeryId).order('created_at',{ascending:true}); return (r&&r.data)||[]; }catch(e){ return []; }
}
function wsRenderRecs(){
  var host=document.getElementById('ws-recs'); if(!host||!_wsCtx) return;
  var recs=_wsCtx.recs||[];
  var list=recs.length?recs.map(function(r){
    return '<div class="ws-rec" id="ws-rec-'+r.id+'">'+
      '<textarea class="ws-rec-body" id="ws-rec-body-'+r.id+'">'+wsEsc(r.body||'')+'</textarea>'+
      '<div class="ws-rec-foot">'+
        '<label class="ws-rec-vis"><input type="checkbox" '+(r.visible_to_patient?'checked':'')+' onchange="wsRecToggle(\''+r.id+'\',this.checked)"> Visible to patient</label>'+
        '<span class="ws-rec-st'+(r.visible_to_patient?' pub':'')+'">'+(r.visible_to_patient?'Published to patient':'Internal draft')+'</span>'+
        '<span class="ws-rec-acts"><button class="ws-btn" onclick="wsRecSave(\''+r.id+'\')">Save</button>'+
        '<button class="ws-btn" onclick="wsRecDelete(\''+r.id+'\')">Delete</button></span>'+
      '</div></div>';
  }).join(''):'<div class="ws-ap-facts">No recommendations yet.</div>';
  host.innerHTML=list+
    '<div class="ws-rec-add"><input id="ws-rec-new" placeholder="Add a recommendation (e.g. Stop GLP-1 7 days before surgery)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();wsRecAdd();}">'+
    '<button class="ws-btn pc-green" onclick="wsRecAdd()">+ Add</button></div>';
}
async function wsRecAdd(){
  if(!_wsCtx||!_wsCtx.surgeryId) return; var inp=document.getElementById('ws-rec-new'); if(!inp) return;
  var v=(inp.value||'').trim(); if(!v) return;
  var row={ surgery_id:_wsCtx.surgeryId, patient_id:_wsCtx.patientId, doctor_id:(window.__wsUserId||null), body:v, visible_to_patient:false };
  try{ var r=await window.sb.from('patient_recommendations').insert(row).select().maybeSingle(); if(r&&r.error) throw new Error(r.error.message);
    _wsCtx.recs=_wsCtx.recs||[]; _wsCtx.recs.push(r.data||row); inp.value=''; wsRenderRecs(); wsToast('Recommendation added'); }
  catch(e){ wsToast('Add failed: '+(e.message||'error')); }
}
async function wsRecSave(id){
  var ta=document.getElementById('ws-rec-body-'+id); if(!ta) return;
  try{ var r=await window.sb.from('patient_recommendations').update({ body:ta.value, updated_at:new Date().toISOString() }).eq('id',id); if(r&&r.error) throw new Error(r.error.message);
    var row=(_wsCtx.recs||[]).filter(function(x){return x.id===id;})[0]; if(row) row.body=ta.value; wsToast('Recommendation saved'); }
  catch(e){ wsToast('Save failed: '+(e.message||'error')); }
}
async function wsRecToggle(id,checked){
  try{ var r=await window.sb.from('patient_recommendations').update({ visible_to_patient:checked, updated_at:new Date().toISOString() }).eq('id',id); if(r&&r.error) throw new Error(r.error.message);
    var row=(_wsCtx.recs||[]).filter(function(x){return x.id===id;})[0]; if(row) row.visible_to_patient=checked; wsRenderRecs(); wsToast(checked?'Published to patient':'Set to internal'); }
  catch(e){ wsToast('Update failed: '+(e.message||'error')); }
}
async function wsRecDelete(id){
  if(!window.confirm('Delete this recommendation?')) return;
  try{ var r=await window.sb.from('patient_recommendations').delete().eq('id',id); if(r&&r.error) throw new Error(r.error.message);
    _wsCtx.recs=(_wsCtx.recs||[]).filter(function(x){return x.id!==id;}); wsRenderRecs(); wsToast('Recommendation deleted'); }
  catch(e){ wsToast('Delete failed: '+(e.message||'error')); }
}
window.wsRecAdd=wsRecAdd; window.wsRecSave=wsRecSave; window.wsRecToggle=wsRecToggle; window.wsRecDelete=wsRecDelete;

// ── Consultation workspace (reuses the #ws-ws overlay + shared reads) ──
async function wsOpenConsult(id){
  var cr=(_wsConsults||[]).filter(function(x){return x.id===id;})[0];
  if(!cr){ var d=(_wsConsultsDone||[]).filter(function(x){return x.id===id;})[0];
    if(d) cr={ id:d.id, origin:'patient', surgery_id:d.surgery_id, patient_id:d.patient_id,
      patient_name:d.patient_name||'Patient', message:d.message||'', doctor_notes:d.consult_notes||'' }; }
  if(!cr) return;
  var surgeryId=cr.surgery_id, patientId=cr.patient_id;
  var surgery={}, quest={}, docs=[];
  // The consultation list is already parent-filtered, but this read stands on
  // its own too: a consultation whose journey is in the Recycle Bin does not
  // open a journey.
  try{ if(surgeryId){ var s=await window.sb.from('patient_surgeries').select('*').eq('id',surgeryId).is('deleted_at',null).maybeSingle(); surgery=s.data||{}; } }catch(e){}
  // Journey-aware: a patient may hold several journeys, so never .maybeSingle()
  // on patient_id (it throws with >1 row). Prefer this journey's questionnaire.
  try{ if(patientId){ var q=await window.sb.from('preop_questionnaires').select('*').eq('patient_id',patientId).order('updated_at',{ascending:false,nullsFirst:false}).limit(1); quest=(q.data&&q.data[0])||{}; } }catch(e){}
  try{ if(surgeryId){ var dr=await window.sb.from('requirement_documents').select('*').eq('surgery_id',surgeryId).order('uploaded_at',{ascending:true}); docs=(dr&&dr.data)||[]; } }catch(e){}
  var recs=await wsFetchRecs(surgeryId);
  _wsCtx={ mode:'consult', origin:cr.origin, consultId:cr.id,
    careId:(cr.origin==='patient'?cr.id:null), clinicId:(cr.origin==='doctor'?String(cr.id).replace('clinic:',''):null),
    patientId:patientId, surgeryId:surgeryId, name:cr.patient_name||surgery.patient_name||'Patient',
    surgery:surgery, quest:quest, docs:docs, recs:recs, message:cr.message||'',
    consultNotes:(cr.doctor_notes!=null?cr.doctor_notes:(surgery.doctor_notes||''))||'' };
  _wsTab='overview'; wsRenderWorkspaceUnified();
  document.getElementById('ws-ws').classList.add('open');
}

// The opened patient carries the same lifecycle menu as its row, on the same
// {kind,id} ref, so Archive / Delete / Star are one tap away from the record
// itself instead of requiring the doctor to close it and search again.
function wsWsLifecycleCtl(c){
  var ref = c.clinicId ? {kind:'clinic_patient', id:c.clinicId}
                       : {kind:'journey', id:(c.surgeryId||(c.surgery&&c.surgery.id)||null)};
  if(!ref.id) return '';
  var state = c.lifecycle==='archived' ? 'archived' : 'active';
  var starChip = c.starred ? '<span class="wsx-archchip star">&#9733; Important</span>' : '';
  var archChip = '';
  if(state==='archived'){
    var by=(c.surgery&&c.surgery.archived_by===window.__wsUserId)?' by you':'';
    archChip='<span class="wsx-archchip">&#128451; Archived'+by+'</span>';
  }
  return '<div class="wsx-arch">'+starChip+archChip+
    wsLcMenuHtml(ref, state, !!c.starred, {big:true})+'</div>';
}
window.wsWsTab=wsWsTab; window.wsRenderWorkspaceUnified=wsRenderWorkspaceUnified;

/* ══════════ Patient lifecycle UI — ONE menu, every surface ══════════════════
   A card, a list row and the opened patient detail all render the same items
   from PatientLifecycle.menuFor(), and all act through the same functions, so
   the doctor never has to close a patient and find them again to archive them.

   Eligibility is the server's answer, fetched when the menu opens. A refused
   action stays visible but disabled WITH ITS REASON, because "why can't I?" is
   the question a hidden control never answers. The one exception is permanent
   deletion, which is not offered at all until the server says it is eligible —
   an irreversible action should not advertise itself.                        */

var _wsLcSeq = 0;                 // one id per rendered menu
var _wsLcOpen = null;             // the open menu's id

// A menu is a button plus a panel. Both carry the kind and id, so the click
// handler never has to guess which record it belongs to (Task 2's rule).
function wsLcMenuHtml(ref, state, starred, opts){
  opts = opts || {};
  if(!ref || !ref.kind || !ref.id) return '';
  var id = 'wslc' + (++_wsLcSeq);
  return '<div class="ws-lc" id="'+id+'">'+
    '<button class="ws-btn ws-lc-btn'+(opts.big?' big':'')+'" aria-haspopup="menu" aria-expanded="false" '+
      'aria-label="Patient actions" onclick="event.stopPropagation();wsLcToggle(\''+id+'\',\''+ref.kind+'\',\''+ref.id+'\',\''+state+'\','+(starred?'true':'false')+')">&#8942;</button>'+
    '<div class="ws-lc-menu" role="menu"></div></div>';
}

function wsLcCloseAll(){
  document.querySelectorAll('.ws-lc-menu.open').forEach(function(m){ m.classList.remove('open'); });
  document.querySelectorAll('.ws-lc-btn[aria-expanded="true"]').forEach(function(b){ b.setAttribute('aria-expanded','false'); });
  _wsLcOpen = null;
}
document.addEventListener('click', function(){ if(_wsLcOpen) wsLcCloseAll(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && _wsLcOpen) wsLcCloseAll(); });

async function wsLcToggle(domId, kind, id, state, starred){
  var host=document.getElementById(domId); if(!host) return;
  var menu=host.querySelector('.ws-lc-menu'), btn=host.querySelector('.ws-lc-btn');
  if(_wsLcOpen===domId){ wsLcCloseAll(); return; }
  wsLcCloseAll();
  _wsLcOpen=domId; menu.classList.add('open'); btn.setAttribute('aria-expanded','true');

  var items=window.PatientLifecycle.menuFor({state:state, starred:starred, canOpen:!opts_noOpen(host)});
  menu.innerHTML=items.map(function(it){
    return '<button class="ws-lc-item'+(it.danger?' danger':'')+'" role="menuitem" data-key="'+it.key+'"'+
      (it.needsEligibility?' disabled':'')+'>'+it.icon+' '+wsEsc(it.label)+'</button>'+
      (it.needsEligibility?'<div class="ws-lc-hint" data-hint="'+it.key+'">Checking&hellip;</div>':'');
  }).join('');
  menu.querySelectorAll('.ws-lc-item[data-key="open"],.ws-lc-item[data-key="star"]').forEach(function(b){
    b.disabled=false;
    b.onclick=function(ev){ ev.stopPropagation(); wsLcCloseAll();
      if(b.getAttribute('data-key')==='open') window.coOpen(kind,id);
      else wsLcStar(kind,id,!starred);
    };
  });

  // Ask the server about every action this state offers, in one wait.
  var need=window.PatientLifecycle.actionsForState(state);
  var map=await window.PatientLifecycle.eligibilityFor(kind, id, need);
  if(_wsLcOpen!==domId) return;                 // the doctor moved on; do not fight them
  items.forEach(function(it){
    if(!it.needsEligibility) return;
    var b=menu.querySelector('.ws-lc-item[data-key="'+it.key+'"]');
    var h=menu.querySelector('.ws-lc-hint[data-hint="'+it.key+'"]');
    if(!b||!h) return;
    var e=map[it.action]||{code:'rpc_error'};
    if(e.eligible){
      b.disabled=false; h.className='ws-lc-hint';
      h.textContent=e.reason||'';
      var warn=(e.warnings&&e.warnings.length)?e.warnings.join(' '):'';
      if(warn){ h.textContent=(h.textContent?h.textContent+' ':'')+warn; h.className='ws-lc-hint warn'; }
      b.onclick=function(ev){ ev.stopPropagation(); wsLcCloseAll(); wsLcAct(kind,id,it.action,e); };
    } else {
      var r=window.PatientLifecycle.refusal(e);
      b.disabled=true; h.textContent=r.text; h.className='ws-lc-hint tone-'+r.tone;
    }
  });
}
function opts_noOpen(host){ return host.getAttribute('data-noopen')==='1'; }
window.wsLcToggle=wsLcToggle; window.wsLcCloseAll=wsLcCloseAll;

// Star is instant and needs no confirmation: it changes nothing clinical and
// is trivially reversible.
async function wsLcStar(kind, id, starred){
  var r=await window.PatientLifecycle.setStarred(kind, id, starred);
  if(!r || r.ok!==true){
    var f=window.PatientLifecycle.refusal(r, 'Could not change this.');
    wsToast(f.text); return;
  }
  wsToast(starred?'Marked as Important.':'Removed from Important.');
  wsLcApplyLocalStar(kind, id, starred);
  wsRenderMyPatients();
}
window.wsLcStar=wsLcStar;

// Update what is already on screen rather than re-reading everything: the
// doctor's filter, search, scroll and open patient all survive.
function wsLcApplyLocalStar(kind, id, starred){
  (_wsMyPatients||[]).forEach(function(p){
    if(p.openKind===kind && p.openId===id) p.starred=starred;
    if(kind==='journey' && p.surgeryId===id) p.starred=starred;
  });
  if(_wsCtx && _wsCtx.surgeryId===id) _wsCtx.starred=starred;
}

// Archive / restore / delete. Confirmation copy comes from the shared module,
// so the workspace and the list cannot describe the same action differently.
function wsLcAct(kind, id, action, elig){
  var copy=window.PatientLifecycle.confirmCopy(action);
  var warn=(elig&&elig.warnings&&elig.warnings.length)
    ? '<div class="ws-confirm-warn">&#9888; '+elig.warnings.map(wsEsc).join(' ')+'</div>' : '';
  wsConfirmDialog({
    title: copy.title,
    body: copy.body + warn,
    confirmLabel: copy.verb,
    danger: copy.danger,
    reason: (action==='delete' || action==='archive'),
    reasonLabel: (action==='delete'?'Why are you removing this patient? (optional)':'Reason (optional)'),
    onConfirm: async function(v){
      var r=await window.PatientLifecycle.act(kind, id, action, v.reason||null);
      if(!r || r.ok!==true){
        var f=window.PatientLifecycle.refusal(r, 'That action was refused.');
        wsToast(f.text); return;
      }
      wsToast(copy.done);
      // The record has left this view: close the workspace if it was showing
      // this patient, then refresh the lists in place.
      if(_wsCtx && (_wsCtx.surgeryId===id || _wsCtx.clinicId===id)) wsCloseWorkspace();
      wsCloseDetailIfShowing(id);
      await wsLoadPatients(); await wsLoadCases();
      // Any lifecycle action can change what is in the bin — a delete puts a
      // record in, a restore takes one out — so the bin and its badge are
      // refreshed whenever they have been read at all, not only when visible.
      if(_wsRecycleLoaded) await wsLoadRecycleBin();
    }
  });
}
window.wsLcAct=wsLcAct;

/* Confirmation dialog. Accepts an options object; the old positional form is
   still honoured because several call sites predate the lifecycle work.
   Supports an optional reason field and a typed confirmation word. */
function wsConfirmDialog(opts, bodyHtml, confirmLabel, danger, onConfirm){
  if(typeof opts==='string') opts={title:opts, body:bodyHtml, confirmLabel:confirmLabel,
                                   danger:danger, onConfirm:function(){ if(onConfirm) onConfirm(); }};
  var old=document.getElementById('ws-confirm-bg'); if(old) old.remove();
  var bg=document.createElement('div'); bg.className='ws-confirm-bg'; bg.id='ws-confirm-bg';
  var reasonHtml=opts.reason
    ? '<label class="ws-confirm-lbl" for="ws-confirm-reason">'+wsEsc(opts.reasonLabel||'Reason (optional)')+'</label>'+
      '<textarea class="ws-confirm-in" id="ws-confirm-reason" rows="2" placeholder="Recorded with the record."></textarea>' : '';
  var wordHtml=opts.confirmWord
    ? '<label class="ws-confirm-lbl" for="ws-confirm-word">Type <b>'+wsEsc(opts.confirmWord)+'</b> to confirm</label>'+
      '<input class="ws-confirm-in" id="ws-confirm-word" autocomplete="off" spellcheck="false">' : '';
  bg.innerHTML='<div class="ws-confirm"><div class="ws-confirm-t">'+wsEsc(opts.title||'Confirm')+'</div>'+
    '<div class="ws-confirm-b">'+(opts.body||'')+'</div>'+reasonHtml+wordHtml+
    '<div class="ws-confirm-acts">'+
      '<button class="ws-btn" id="ws-confirm-cancel">Cancel</button>'+
      '<button class="ws-btn '+(opts.danger?'pc-danger':'pc-green')+'" id="ws-confirm-ok"'+(opts.confirmWord?' disabled':'')+'>'+
        wsEsc(opts.confirmLabel||'Confirm')+'</button>'+
    '</div></div>';
  document.body.appendChild(bg);
  function close(){ bg.remove(); }
  bg.addEventListener('click', function(e){ if(e.target===bg) close(); });
  document.getElementById('ws-confirm-cancel').onclick=close;
  var ok=document.getElementById('ws-confirm-ok');
  if(opts.confirmWord){
    var w=document.getElementById('ws-confirm-word');
    w.addEventListener('input', function(){ ok.disabled = (w.value.trim()!==opts.confirmWord); });
    setTimeout(function(){ w.focus(); },0);
  }
  ok.onclick=function(){
    var v={ reason:(document.getElementById('ws-confirm-reason')||{}).value||'',
            word:(document.getElementById('ws-confirm-word')||{}).value||'' };
    close(); if(opts.onConfirm) opts.onConfirm(v);
  };
}
window.wsConfirmDialog=wsConfirmDialog;

/* ══════ Canonical opening — everything routes through clinical-open.js ══════
   The dashboard no longer decides WHICH record a click means. It supplies the
   presenters and the account resolver; clinical-open.js validates the kind,
   applies lifecycle visibility, and calls back with a record it has already
   confirmed the doctor may see. */

// A patient account id (auth.users) resolves to a journey through the surgery's
// declared patient_id column. It is never used as a journey id itself.
async function wsResolvePatientAccount(authUserId){
  var info=_wsActiveMap[authUserId];
  if(info && info.surgeryId) return { kind:'journey', id:info.surgeryId };
  try{
    // A patient may have several journeys over time; pick a live one rather
    // than the most recent one, which could be sitting in the Recycle Bin.
    var r=await window.sb.from('patient_surgeries').select('id')
      .eq('patient_id',authUserId).is('deleted_at',null)
      .order('updated_at',{ascending:false,nullsFirst:false}).limit(1);
    var row=(r&&r.data&&r.data[0])||null;
    if(row) return { kind:'journey', id:row.id };
  }catch(e){}
  return null;
}

// A clinic patient may or may not have a journey yet. Both are normal states.
// Having one is a declared parent→child link on patient_surgeries; NOT having
// one does not make the record some other kind — it stays a clinic patient and
// opens as one.
// Deliberately unfiltered by lifecycle: this answers "which journey is declared
// as this patient's child", nothing more. Whether that journey may be shown is
// decided in exactly one place — the canonical opener — so the two rules cannot
// drift apart. (_wsSurgByClinic is the already-filtered fast path.)
async function wsClinicJourneyId(clinicPatientId){
  var sg=_wsSurgByClinic&&_wsSurgByClinic[clinicPatientId];
  if(sg && sg.id) return sg.id;
  try{
    var r=await window.sb.from('patient_surgeries').select('id')
      .eq('clinic_patient_id',clinicPatientId).limit(1);
    var row=(r&&r.data&&r.data[0])||null;
    return row?row.id:null;
  }catch(e){ return null; }
}

window.ClinicalOpen.registerPresenters({
  resolvePatientAccount: wsResolvePatientAccount,
  onFailure: function(o){ wsToast(o.message); },
  journey: function(ctx){ return wsPresentJourney(ctx); },
  clinic_patient: async function(ctx){
    var jid=await wsClinicJourneyId(ctx.id);
    if(jid){
      // Open the child journey by its own explicit kind, so the journey's own
      // lifecycle is checked too rather than inherited from the parent. Silent
      // because a failure here is not the end of the road: the clinic patient
      // record still opens below, and two contradictory messages help nobody.
      var r=await window.ClinicalOpen.openClinicalRecord({kind:'journey', id:jid}, {silent:true});
      if(r.ok) return;
      // The journey is gone or hidden, but the clinic patient itself is not.
      // Show the patient record, and say what happened to the journey.
      wsDetail(ctx.id, ctx.row, ctx.archivedNotice ||
        'The clinical journey for this patient is no longer available. The patient record below is unchanged.');
      return;
    }
    wsDetail(ctx.id, ctx.row, ctx.archivedNotice);
  }
});

async function wsRespondRequest(id, decision, asConsult){
  var reason = null;
  if(decision === 'decline'){ reason = window.prompt('Optional reason for declining (the patient sees this):') || null; }
  try {
    var r = await window.sb.rpc('respond_care_request', { p_request_id: id, p_decision: decision, p_reason: reason });
    if(r && r.error) throw new Error(r.error.message);
    if(decision === 'accept' && asConsult){
      // Set the canonical lane on the record (single source of truth). Keep the
      // legacy is_consultation flag in sync for backward compatibility.
      var cr=(_wsRequests||[]).filter(function(x){return x.id===id;})[0];
      var u = await window.sb.from('care_requests').update({ is_consultation:true }).eq('id', id);
      if(u && u.error) throw new Error(u.error.message);
      if(cr && cr.surgery_id){ try{ await window.sb.from('patient_surgeries').update({ care_state:'consultation' }).eq('id', cr.surgery_id); }catch(e){} }
    }
    wsToast(decision !== 'accept' ? 'Request declined' : (asConsult ? 'Accepted as consultation' : 'Accepted as surgical patient'));
  } catch(e){ wsToast('Failed: ' + (e.message||'error')); }
  wsLoadCases();
  wsLoadPatients();
}
// 💬 Lane switch = ONE write to the canonical record. Origin-independent;
// documents, recommendations and notes (all keyed by surgery_id) stay attached.
async function wsSetCareState(state){
  var c=_wsCtx; if(!c||!c.surgeryId) return;
  var msg=(state==='consultation')
    ? 'Move this patient to Consultations (advice-only, out of the surgical pipeline)? Documents, notes and recommendations stay on the same record.'
    : 'Convert this consultation into a surgical patient? They enter your pre-operative workflow. Documents, notes and recommendations stay on the same record.';
  if(!window.confirm(msg)) return;
  try {
    // Canonical state on the record (when the column exists).
    try{ await window.sb.from('patient_surgeries').update({ care_state:state }).eq('id', c.surgeryId); }catch(e){}
    // Keep the legacy care_requests flag in sync so the patient leaves/enters the
    // consultation queue even pre-migration (single source of truth either way).
    if(c.careId){ try{ await window.sb.from('care_requests').update({ is_consultation:(state==='consultation') }).eq('id', c.careId); }catch(e){} }
    wsToast(state==='consultation'?'Moved to Consultations':'Converted to surgical patient'); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); return; }
  wsCloseWorkspace(); wsLoadCases();
}
async function wsCloseConsult(){

function wsProgressPct(p){
  if(p.questionnaire_status === 'completed'){
    var a = p.questionnaire_answers || {};
    var fields = ['conditions','medications','allergies','previous_anesthesia','osa','smoking','pregnancy','comments'];
    var filled = fields.filter(function(f){ return a[f] && String(a[f]).trim(); }).length;
    return Math.max(1, Math.round((filled/fields.length)*100));
  }
  return {not_sent:0, sent:20, opened:45, in_progress:70}[p.questionnaire_status] || 0;
}
function wsStages(p){
  // [label, reached?]
  var qs = p.questionnaire_status, cs = p.consultation_status, ps = p.patient_status;
  return [
    ['Not sent', true],
    ['Sent', ['sent','opened','in_progress','completed'].indexOf(qs) >= 0],
    ['Opened', ['opened','in_progress','completed'].indexOf(qs) >= 0],
    ['Completed', qs === 'completed'],
    ['Reviewed', cs === 'reviewed'],
    ['Ready', ps === 'ready_for_surgery'],
    ['Arrived', cs === 'arrived' || cs === 'reviewed' || !!p.arrived_at]
  ];
}

async function wsSavePatient(thenSend){

  btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Saving…';

  // definition, so no origin field is needed here.

  try {
    var r = await window.sb.from('clinic_patients').insert(rec).select().maybeSingle();
    if(r.error){
      console.error('Creating the clinic patient failed.');
      // TEMP: surface the real error to the screen (revert to generic before launch)
      wsToast('Insert error: ' + r.error.message + (r.error.details ? ' — ' + r.error.details : ''));
      btn.disabled = false; btn.textContent = orig;
      return;
    }
    // Create the canonical record (patient_surgeries) for this doctor-created
    // patient — auth-optional, back-linked by clinic_patient_id, with the chosen
    // lane. Documents / notes / recommendations attach here from day one.
    if(r.data){

      try{ await window.sb.from('patient_surgeries').insert({

        hospital:rec.hospital||null, contact_email:rec.email||null, care_state:lane }); }catch(e){ console.warn('record create:', e&&e.message); }

    if(thenSend && r.data){ wsSend(r.data.id); }

  btn.disabled = false; btn.textContent = orig;
}

// Send via WhatsApp — only mark 'sent' if the WhatsApp window actually opened.
async function wsSendWhatsApp(id){
  var p = wsFindP(id);
  if(!p){ try { var r=await window.sb.from('clinic_patients').select('*').eq('id',id).maybeSingle(); p=r.data; }catch(e){} }
  if(!p) return;
  if(!p.token){ wsToast('This patient has no questionnaire link yet.'); return; }
  var digits = (p.phone_number || '').replace(/[^0-9]/g, '');
  var wa = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(wsMessage(p));
  var win = window.open(wa, '_blank');
  if(win){
    await wsMarkSent(id);
    wsToast('WhatsApp opened — status set to Sent');
  } else {
    // popup blocked → did NOT launch → do NOT mark sent
    wsToast('Pop-up blocked. Use Copy Link or allow pop-ups, then try again.');
  }
  wsLoadPatients(); wsLoadCases();
}

async function wsActivatePortal(id){
  var p = _wsPatients.find(function(x){ return x.id === id; }); if(!p) return;
  if(!p.token){ wsToast('No questionnaire token for this patient'); return; }
  wsToast('Activating portal...');
  try {
    var r = await window.sb.functions.invoke('convert_clinic_patient', { body: { token: p.token } });
    var d = (r && r.data) || null;
    if(!d) throw new Error((r && r.error && r.error.message) || 'No response');
    if(d.status==='converted' || d.status==='already'){
      wsToast('Patient portal activated');
      if(d.magic_link) wsPortalLinkModal(p, d.magic_link);
      else wsToast('Portal active. Magic link not returned - check Supabase email/SMTP settings.');
      await wsLoadPatients(); wsLoadCases();
    } else if(d.status==='needs_email'){ wsToast('Add an email for this patient first'); }
    else if(d.status==='conflict'){ alert(d.message || 'This email already has an Anestheo patient account. Please verify before linking.'); }
    else if(d.status==='not_ready'){ wsToast('Questionnaire not completed yet'); }
    else { wsToast('Activation failed: ' + (d.message || 'error')); }
  } catch(e){ wsToast('Activation failed: ' + (e.message || 'error')); }
}

function wsRenderAsk(){
  var list = _wsAsk.filter(function(q){
    var st = q.status || 'new';
    if(_wsAskFilter==='pending') return st==='new' || st==='under_review';
    if(_wsAskFilter==='answered') return st==='answered' || st==='closed';
    return true;
  });
  var box = document.getElementById('ws-ask-list');
  if(!list.length){ box.innerHTML = '<div class="ws-empty">No questions in this view.</div>'; return; }
  var bmap = {new:'b-new',under_review:'b-review',answered:'b-answered',closed:'b-closed'};
  var blab = {new:'New',under_review:'Under review',answered:'Answered',closed:'Closed'};
  box.innerHTML = list.map(function(q){
    var st = q.status || 'new';
    var subj = q.subject || q.topic || 'Question';
    var msg = q.message || q.question || '';
    return '<div class="ws-row"><div class="ws-row-top"><div><div class="ws-row-name">'+wsEsc(subj)+'</div>' +
      '<div class="ws-row-meta">'+wsEsc(msg).slice(0,160)+'</div></div><span class="ws-badge '+(bmap[st]||'b-new')+'">'+(blab[st]||'New')+'</span></div>' +
