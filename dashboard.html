<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/v2/supabase.js"></script>
<script src="/v2/auth.js"></script>
<script src="/v2/navbar.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: #0A1A15; color: #fff; min-height: 100vh; -webkit-font-smoothing: antialiased; }

#loader { position: fixed; inset: 0; background: #0A1A15; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
.spin { width: 30px; height: 30px; border: 3px solid rgba(27,107,90,.25); border-top-color: #2A8A74; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-txt { font-size: 13px; color: rgba(255,255,255,.3); }

#app { display: none; }

.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 210px; flex-shrink: 0; position: fixed; top: 56px; left: 0; bottom: 0;
  background: rgba(6,16,11,.98); border-right: 1px solid rgba(27,107,90,.2);
  padding: 16px 0; overflow-y: auto; z-index: 100;
  display: flex; flex-direction: column;
}
.sb-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.25); padding: 10px 16px 4px; }
.sb-link { display: flex; align-items: center; gap: 9px; padding: 9px 16px; font-size: 14px; color: rgba(255,255,255,.5); text-decoration: none; transition: all .18s; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: inherit; border-left: 2px solid transparent; }
.sb-link:hover { color: #fff; background: rgba(27,107,90,.1); }
.sb-link.active { color: #fff; background: rgba(27,107,90,.18); border-left-color: #2A8A74; }
.sb-link.dim { opacity: .35; cursor: default; }
.sb-link.dim:hover { background: none; color: rgba(255,255,255,.5); }
.sb-sep { height: 1px; background: rgba(27,107,90,.15); margin: 8px 12px; }
.sb-bottom { margin-top: auto; }

.main { margin-left: 210px; padding: 36px 36px 60px; flex: 1; max-width: 900px; }

.welcome { margin-bottom: 24px; }
.welcome-label { font-size: 11px; color: rgba(255,255,255,.3); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-bottom: 7px; }
.welcome h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
.welcome-sub { font-size: 14px; color: rgba(255,255,255,.45); }

.session-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(27,107,90,.12); border: 1px solid rgba(27,107,90,.25); border-radius: 20px; padding: 5px 13px; font-size: 12px; color: #7ECFC0; margin-bottom: 28px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: #2A8A74; box-shadow: 0 0 0 3px rgba(42,138,116,.2); animation: pulse 2.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.sec-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.28); margin-bottom: 12px; }

.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 11px; margin-bottom: 28px; }
.info-card { background: rgba(255,255,255,.04); border: 1px solid rgba(27,107,90,.2); border-radius: 10px; padding: 16px; }
.info-card-label { font-size: 10px; color: rgba(255,255,255,.3); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
.info-card-value { font-size: 14px; color: #fff; font-weight: 500; word-break: break-all; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 11px; }
.card { background: rgba(255,255,255,.04); border: 1px solid rgba(27,107,90,.2); border-radius: 10px; padding: 18px 16px; text-decoration: none; color: #fff; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background .2s; }
.card:hover { border-color: rgba(42,138,116,.4); background: rgba(27,107,90,.1); }
.card.disabled { cursor: default; opacity: .5; }
.card.disabled:hover { border-color: rgba(27,107,90,.2); background: rgba(255,255,255,.04); }
.card-ico { font-size: 22px; }
.card-title { font-size: 14px; font-weight: 600; }
.card-desc { font-size: 12px; color: rgba(255,255,255,.45); line-height: 1.5; }
.coming-soon { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(232,168,56,.1); color: #E8A838; border: 1px solid rgba(232,168,56,.2); padding: 2px 7px; border-radius: 4px; display: inline-block; margin-top: 2px; }
.card-flagship { grid-column: 1 / -1; background: linear-gradient(135deg, rgba(27,107,90,.18), rgba(27,107,90,.06)); border-color: rgba(42,138,116,.45); position: relative; }
.card-flagship .card-ico { font-size: 30px; }
.card-flagship .card-title { font-size: 17px; font-family: 'Playfair Display', serif; }
.card-flagship:hover { border-color: rgba(42,138,116,.7); }
.flagship-tag { position: absolute; top: 16px; right: 16px; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(42,138,116,.25); color: #7ECFC0; border: 1px solid rgba(42,138,116,.45); padding: 3px 9px; border-radius: 5px; }

.verify-banner { background: rgba(232,168,56,.07); border: 1px solid rgba(232,168,56,.2); border-radius: 9px; padding: 13px 16px; margin-bottom: 24px; font-size: 13px; color: rgba(255,220,150,.9); line-height: 1.65; }

@media (max-width: 760px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px 16px 48px; }
  .info-grid, .cards { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 460px) {
  .info-grid, .cards { grid-template-columns: 1fr; }
}
/* ── SINGLE-PAGE WORKSPACE ── */
.ws-top{max-width:1180px;margin:0 auto;padding:24px 20px 8px;}
.ws-greet{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;}
.ws-role{font-size:13px;color:var(--muted);margin-top:2px;}
.ws-online{color:#7ECFC0;}
.verify-banner{max-width:1180px;margin:8px auto 0;padding:11px 16px;background:rgba(232,168,56,.08);border:1px solid rgba(232,168,56,.25);border-radius:10px;font-size:13px;color:#E8C16b;}
.ws-shell{max-width:1180px;margin:14px auto 0;padding:0 20px 70px;display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start;}
.ws-rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;}
.ws-tab{display:flex;align-items:center;gap:9px;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:11px 13px;font-size:13.5px;color:var(--muted);cursor:pointer;font-family:inherit;text-decoration:none;transition:all .15s;}
.ws-tab:hover{background:rgba(255,255,255,.04);color:#fff;}
.ws-tab.active{background:rgba(27,107,90,.18);border-color:rgba(42,138,116,.4);color:#fff;font-weight:600;}
.ws-rail-sp{height:14px;}
.ws-body{min-width:0;}
.ws-sec{display:none;animation:wsfade .25s ease;}
.ws-sec.active{display:block;}
@keyframes wsfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ws-sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.ws-sec-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
.ws-sec-sub{font-size:13px;color:var(--muted);margin-top:3px;}
.ws-open{font-size:13px;color:#7ECFC0;text-decoration:none;background:rgba(27,107,90,.12);border:1px solid rgba(42,138,116,.3);border-radius:8px;padding:9px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.ws-open:hover{background:rgba(27,107,90,.2);}
.ws-frame{width:100%;height:78vh;min-height:560px;border:1px solid var(--border);border-radius:14px;background:#0A1A15;}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.ws-tile{display:flex;flex-direction:column;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:13px;padding:22px 14px;text-decoration:none;color:inherit;cursor:pointer;font-family:inherit;transition:all .18s;}
.ws-tile:hover{border-color:rgba(42,138,116,.45);background:rgba(27,107,90,.1);transform:translateY(-2px);}
.ws-tile-ico{font-size:26px;}
.ws-tile-t{font-size:13.5px;font-weight:500;color:#fff;}
.ws-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
.ws-reqs-card{background:linear-gradient(135deg,rgba(42,138,116,.16),rgba(42,138,116,.05));border:1px solid rgba(42,138,116,.4);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
/* active patients */
.ws-ap-h{font-size:13px;font-weight:700;color:#7ECFC0;margin:6px 0 10px;display:flex;align-items:center;gap:8px;}
.ws-ap-h .n{font-size:11px;font-weight:700;background:rgba(42,138,116,.3);color:#fff;border-radius:20px;padding:2px 8px;}
.ws-ap{display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;flex-wrap:wrap;}
.ws-ap-name{font-size:15px;font-weight:600;color:#fff;}
.ws-ap-facts{font-size:12.5px;color:var(--muted);margin-top:3px;}
.ws-ap-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.ws-pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);}
.ws-pill.ok{color:#5ee393;background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3);}
.ws-pill.warn{color:#E8C16b;background:rgba(232,168,56,.12);border-color:rgba(232,168,56,.3);}
.ws-pill.rev{color:#7ECFC0;background:rgba(42,138,116,.14);border-color:rgba(42,138,116,.35);}
/* workspace overlay */
.ws-ws-bg{display:none;position:fixed;inset:0;background:rgba(4,10,8,.82);z-index:6000;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto;}
.ws-ws-bg.open{display:flex;}
.ws-ws-modal{background:#0A1614;border:1px solid rgba(42,138,116,.4);border-radius:16px;max-width:880px;width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.ws-ws-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px 12px;background:rgba(42,138,116,.16);border-bottom:1px solid rgba(42,138,116,.3);}
.ws-ws-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;}
.ws-ws-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.ws-ws-body{padding:18px 20px 26px;overflow-y:auto;}
.ws-sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7ECFC0;margin:18px 0 8px;padding-top:12px;border-top:1px solid rgba(42,138,116,.16);}
.ws-sec-t:first-of-type{margin-top:0;padding-top:0;border-top:none;}
.ws-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.ws-kc{background:rgba(0,0,0,.2);border-radius:9px;padding:9px 11px;}
.ws-kc i{font-style:normal;display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin-bottom:3px;}
.ws-kc b{font-size:14px;color:#fff;font-weight:600;}
.ws-flag{display:inline-block;font-size:12px;font-weight:600;background:rgba(232,168,56,.13);border:1px solid rgba(232,168,56,.3);color:#E8C16b;border-radius:7px;padding:4px 9px;margin:2px 5px 2px 0;}
.ws-flag.hi{background:rgba(192,57,43,.16);border-color:rgba(192,57,43,.4);color:#ff9b86;}
.ws-qrow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.ws-qrow span{color:var(--muted);} .ws-qrow b{color:#fff;font-weight:600;text-align:right;}
.ws-chk{font-size:13px;color:rgba(255,255,255,.85);padding:4px 0 4px 18px;position:relative;}
.ws-chk:before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;}
.ws-chk.done:before{background:#5ee393;} .ws-chk.miss:before{background:rgba(255,255,255,.2);}
.ws-chk.miss{color:var(--hint);}
.ws-plan-sum{background:rgba(42,138,116,.1);border:1px solid rgba(42,138,116,.32);border-radius:11px;padding:11px 13px;margin-bottom:12px;}
.ws-sum-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7ECFC0;margin-bottom:7px;}
.ws-sum-meta{font-size:12px;color:var(--hint);margin-bottom:8px;}
.ws-sum-meta b{color:rgba(255,255,255,.85);font-weight:600;}
.ws-sum-h{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px;}
.ws-sum-row{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#fff;padding:3px 0;}
.ws-sum-ck{color:#5ee393;flex:0 0 auto;}
.ws-sum-lb{font-weight:600;}
.ws-sum-tag{font-size:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px;vertical-align:middle;}
.ws-sum-note{font-size:12px;color:var(--muted);margin-top:2px;}
.ws-save-st{font-size:12px;color:var(--hint);align-self:center;}
.ws-save-st.saving{color:#E8C16b;} .ws-save-st.ok{color:#5ee393;} .ws-save-st.err{color:#ff9b86;}
/* Patient-submitted documents (doctor side) */
.ws-docs-status{font-size:12.5px;margin-bottom:8px;}
.ws-doc-grp{margin-bottom:10px;}
.ws-doc-grp-h{font-size:12px;font-weight:700;color:#7ECFC0;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.ws-doc{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin-bottom:4px;}
.ws-doc-nm{font-size:13px;color:#fff;font-weight:600;word-break:break-all;}
.ws-doc-mt{font-size:11.5px;color:var(--hint);margin-top:2px;}
.ws-doc-acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.ws-doc-btn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:#cfe;font-size:12px;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:inherit;}
.ws-doc-btn:hover{background:rgba(255,255,255,.14);color:#fff;}
.ws-doc-rev{background:rgba(37,211,102,.16);border:1px solid rgba(37,211,102,.4);color:#5ee393;font-size:12px;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:inherit;font-weight:600;}
.ws-doc-rev:hover{background:rgba(37,211,102,.28);color:#fff;}
.ws-doc-ok{font-size:12px;color:#5ee393;font-weight:600;}
.ws-cfm-warn{font-size:12.5px;color:#E8C16b;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.3);border-radius:8px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
/* Approval confirmation modal (sits above the workspace overlay) */
.ws-cfm-bg{display:none;position:fixed;inset:0;background:rgba(4,10,8,.78);z-index:7000;align-items:center;justify-content:center;padding:18px;}
.ws-cfm-bg.open{display:flex;}
.ws-cfm-box{background:#0A1614;border:1px solid rgba(37,211,102,.45);border-radius:15px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.65);}
.ws-cfm-h{font-size:17px;font-weight:700;color:#5ee393;margin-bottom:14px;}
.ws-cfm-kv{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;}
.ws-cfm-kv>div{display:flex;flex-direction:column;gap:2px;}
.ws-cfm-kv i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);}
.ws-cfm-kv b{font-size:14px;color:#fff;font-weight:600;}
.ws-cfm-msg{font-size:13.5px;color:rgba(255,255,255,.88);line-height:1.55;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.28);border-radius:9px;padding:11px 13px;margin-bottom:16px;}
.ws-hist-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.ws-hist-meta b{color:rgba(255,255,255,.9);font-weight:600;}
.ws-hist-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);}
.ws-hist-row:first-child{border-top:none;}
.ws-hist-ic{flex:0 0 auto;font-size:14px;line-height:1.4;}
.ws-hist-top{font-size:13px;color:rgba(255,255,255,.9);}
.ws-hist-v{display:inline-block;font-size:11px;font-weight:700;color:#7ECFC0;background:rgba(42,138,116,.2);border-radius:5px;padding:1px 6px;margin-right:5px;}
.ws-hist-w{font-size:11.5px;color:var(--hint);margin:2px 0 3px;}
.ws-hist-sub{font-size:12.5px;color:rgba(255,255,255,.75);}
.ws-hist-req{font-size:12.5px;color:#fff;margin-top:2px;line-height:1.5;}
.ws-hist-add{font-size:12.5px;color:#5ee393;margin-top:2px;}
.ws-hist-rem{font-size:12.5px;color:#ff9b86;margin-top:2px;}
.ws-hist-msg{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px;}
.ws-reqs{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.ws-req-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:8px 10px;}
.ws-req-item.on{background:rgba(42,138,116,.14);border-color:rgba(42,138,116,.5);}
.ws-req-chk{display:flex;align-items:center;gap:9px;font-size:14px;color:rgba(255,255,255,.9);cursor:pointer;}
.ws-req-chk input{width:16px;height:16px;flex:0 0 auto;accent-color:#2A8A74;cursor:pointer;}
.ws-req-chk span{flex:1 1 auto;}
.ws-req-del{background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;line-height:1;cursor:pointer;padding:0 4px;}
.ws-req-del:hover{color:#ff9b86;}
.ws-req-note{width:100%;margin-top:7px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:#fff;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
.ws-req-note:focus{border-color:#2A8A74;}
.ws-req-add{display:flex;gap:8px;margin-top:8px;}
.ws-req-add input{flex:1 1 auto;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:#fff;font-size:13px;font-family:inherit;outline:none;}
.ws-req-add input:focus{border-color:#2A8A74;}
.ws-notes{width:100%;min-height:90px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:9px;padding:11px;color:#fff;font-size:14px;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box;}
.ws-notes:focus{border-color:#2A8A74;}
.ws-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.ws-act-approve{background:rgba(37,211,102,.18);border:1px solid rgba(37,211,102,.45);color:#5ee393;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.ws-act-approve:hover{background:rgba(37,211,102,.3);color:#fff;}
.ws-act-changes{background:rgba(232,168,56,.15);border:1px solid rgba(232,168,56,.4);color:#E8C16b;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.ws-act-changes:hover{background:rgba(232,168,56,.28);color:#fff;}
.ws-reqs-h{font-size:13px;font-weight:700;color:#7ECFC0;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ws-reqs-n{font-size:11px;font-weight:700;background:rgba(42,138,116,.3);color:#fff;border-radius:20px;padding:2px 8px;}
.ws-req{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(42,138,116,.18);flex-wrap:wrap;}
.ws-req:last-child{border-bottom:none;}
.ws-req-name{font-size:14px;font-weight:600;color:#fff;}
.ws-req-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
.ws-req-msg{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:4px;font-style:italic;}
.ws-req-btns{display:flex;gap:8px;flex-shrink:0;}
.ws-stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:15px 16px;}
.ws-stat-n{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#fff;}

<body>

<div id="loader">
  <div class="spin"></div>
  <div class="loader-txt">Loading dashboard&hellip;</div>
</div>

<div id="nb-placeholder"></div>

<div id="app"></div>

<script>
// ── 10-SECOND SAFETY TIMEOUT ──────────────────────────────────
// If anything stalls, never leave the user on an endless spinner.
var _dashDone = false;
var _dashWatchdog = setTimeout(function(){
  if(_dashDone) return;
  console.error('LOGIN WATCHDOG: exceeded 10s');
  var loader = document.getElementById('loader');
  if(loader){
    loader.innerHTML =
      '<div style="text-align:center;padding:40px;font-family:sans-serif;max-width:340px;">' +
      '<p style="color:#fff;font-size:15px;margin-bottom:10px;">Login is taking longer than expected.</p>' +
      '<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:18px;">Please refresh or try again.</p>' +
      '<button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Refresh</button> ' +
      '<a href="/v2/index.html" style="color:#7ECFC0;font-size:13px;margin-left:10px;">Return home</a>' +
      '</div>';
  }
}, 10000);

function dashFail(msg){
  _dashDone = true; clearTimeout(_dashWatchdog);
  var loader = document.getElementById('loader');
  if(loader){
    loader.innerHTML =
      '<div style="text-align:center;padding:40px;font-family:sans-serif;max-width:340px;">' +
      '<p style="color:rgba(255,160,140,.95);font-size:15px;margin-bottom:10px;">Could not load your dashboard</p>' +
      '<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:18px;">' + (msg || 'Unknown error') + '</p>' +
      '<button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Try again</button> ' +
      '<a href="/v2/index.html" style="color:#7ECFC0;font-size:13px;margin-left:10px;">Return home</a>' +
      '</div>';
  }
}

// ── WORKSPACE MODULES ─────────────────────────────────────────
function wsShow(sec){
  document.querySelectorAll('.ws-sec').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.ws-tab[data-sec]').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-sec')===sec); });
  var el = document.getElementById('sec-'+sec); if(el) el.classList.add('active');
}
function wsToast(msg){
  var t = document.createElement('div'); t.className='ws-toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(function(){t.remove();},400); }, 1600);
}
function wsEsc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// SECTION 2 — Patient management (clinic_patients table)
var _wsPatients = [], _wsPtFilter = 'all', _wsDoctorId = null;

function wsToken(){
  var a = new Uint8Array(18);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}
function wsQStatusLabel(s){
  return {not_sent:'Not sent',sent:'Sent',opened:'Opened',in_progress:'In progress',completed:'Completed'}[s] || 'Not sent';
}
function wsQStatusClass(s){
  return {not_sent:'b-closed',sent:'b-new',opened:'b-new',in_progress:'b-review',completed:'b-answered'}[s] || 'b-closed';
}
function wsVisitLabel(s){
  return {not_arrived:'Not arrived',arrived:'Arrived',reviewed:'Reviewed'}[s] || 'Not arrived';
}
function wsVisitClass(s){
  return {not_arrived:'b-closed',arrived:'b-review',reviewed:'b-approved'}[s] || 'b-closed';
}
function wsStatusLabel(s){ return {awaiting_questionnaire:'Awaiting questionnaire',awaiting_consultation:'Awaiting consultation',ready_for_surgery:'Ready for surgery',completed:'Completed'}[s] || 'Awaiting questionnaire'; }
function wsDeriveStatus(p){
  if(p.patient_status) return wsStatusLabel(p.patient_status);
  if(p.questionnaire_status !== 'completed') return 'Awaiting questionnaire';
  if(p.consultation_status === 'reviewed') return 'Awaiting consultation';
  return 'Awaiting consultation';
}

// ── Patient-initiated review requests (Epic B inbox) ──
async function wsLoadRequests(){
  var box = document.getElementById('ws-reqs'); if(!box) return;
  var uid = window.__wsUserId; if(!uid){ box.innerHTML=''; return; }
  var reqs = [];
  try {
    var r = await window.sb.from('care_requests').select('*')
      .eq('doctor_id', uid).eq('status', 'requested')
      .order('requested_at', { ascending: true });
    reqs = (r && r.data) || [];
  } catch(e){ box.innerHTML=''; return; }
  if(!reqs.length){ box.innerHTML=''; return; }
  box.innerHTML =
    '<div class="ws-reqs-card">' +
      '<div class="ws-reqs-h">&#129658; Review requests <span class="ws-reqs-n">'+reqs.length+'</span></div>' +
      reqs.map(function(q){
        var facts = [q.procedure, q.surgery_date ? new Date(q.surgery_date).toLocaleDateString() : ''].filter(Boolean).join(' · ');
        var via = q.origin_method === 'share_code' ? ' · via code' : '';
        return '<div class="ws-req">' +
          '<div class="ws-req-info"><div class="ws-req-name">'+wsEsc(q.patient_name||'Patient')+'</div>' +
            '<div class="ws-req-meta">'+wsEsc(facts||'Pre-operative review requested')+via+'</div>' +
            (q.message ? '<div class="ws-req-msg">'+wsEsc(q.message)+'</div>' : '') + '</div>' +
          '<div class="ws-req-btns">' +
            '<button class="ws-btn pc-green" onclick="wsRespondRequest(\''+q.id+'\',\'accept\')">Accept</button>' +
            '<button class="ws-btn" onclick="wsRespondRequest(\''+q.id+'\',\'decline\')">Decline</button>' +
          '</div></div>';
      }).join('') +
    '</div>';
}
// ── Patients who submitted for review (review_state = pending) ──
async function wsLoadPendingReviews(){
  var box = document.getElementById('ws-reviews'); if(!box) return;
  var uid = window.__wsUserId; if(!uid){ box.innerHTML=''; return; }
  var names = {};
  try {
    // accepted connections give us patient_id -> name/procedure (RLS: doctor_id = me)
    var cr = await window.sb.from('care_requests').select('patient_id,patient_name,procedure')
      .eq('doctor_id', uid).eq('status','accepted');
    ((cr && cr.data) || []).forEach(function(c){ names[c.patient_id] = { name:c.patient_name, proc:c.procedure }; });
  } catch(e){}
  var rows = [];
  try {
    // assignment-scoped RLS returns only questionnaires for surgeries assigned to me
    var q = await window.sb.from('preop_questionnaires').select('patient_id,review_state,risk_flags,updated_at')
      .eq('review_state','pending').order('updated_at',{ascending:true});
    rows = (q && q.data) || [];
  } catch(e){ box.innerHTML=''; return; }
  if(!rows.length){ box.innerHTML=''; return; }
  box.innerHTML =
    '<div class="ws-reqs-card" style="background:linear-gradient(135deg,rgba(232,168,56,.14),rgba(232,168,56,.04));border-color:rgba(232,168,56,.4);">' +
      '<div class="ws-reqs-h" style="color:#E8C16b;">&#128203; Awaiting your review <span class="ws-reqs-n" style="background:rgba(232,168,56,.3);">'+rows.length+'</span></div>' +
      rows.map(function(r){
        var info = names[r.patient_id] || {};
        var flags = (r.risk_flags && r.risk_flags.length)
          ? '<div class="ws-req-meta">&#9888; '+r.risk_flags.map(wsEsc).join(' &middot; ')+'</div>' : '';
        return '<div class="ws-req"><div class="ws-req-info">' +
          '<div class="ws-req-name">'+wsEsc(info.name||'Patient')+'</div>' +
          '<div class="ws-req-meta">'+wsEsc(info.proc||'Pre-operative questionnaire')+' &middot; submitted '+(r.updated_at?new Date(r.updated_at).toLocaleDateString():'')+'</div>' +
          flags + '</div>' +
          '<div class="ws-req-btns"><span class="ws-btn" style="cursor:default;opacity:.85;">Pending review</span></div></div>';
      }).join('') +
    '</div>';
}

// ── Active Patients + in-page workspace (Epic E) ──
var WS_PREPARE=['Confirm your surgery date, arrival time, and where to check in','Write down a full list of your medications, doses, and supplements','Note any allergies and past reactions to anesthesia','Arrange a responsible adult to take you home and stay with you','Prepare comfortable, loose clothing and flat shoes for the day','Write down questions you want to ask your anesthesiologist'];
var WS_DAYOF=['Follow your fasting times exactly','Shower; remove makeup, nail polish, and jewelry','Take only the medications you were told to take, with a small sip of water','Bring your ID, medication list, and essentials','Bring your CPAP, inhaler, or glasses/hearing aids if you use them','Arrive on time and have your ride home arranged'];
var WS_QLBL={age:'Age',sex:'Sex',height:'Height (cm)',weight:'Weight (kg)',history:'Conditions',medications:'Medications',prev_surgery:'Previous surgery',anes_complication:'Anesthesia complication',difficult_airway:'Difficult airway',ponv:'PONV history',allergy_present:'Allergies',allergy_detail:'Allergy detail',smoking:'Smoking',alcohol:'Alcohol',drugs:'Recreational drugs'};
var _wsActiveMap={}, _wsCtx=null;
function wsReviewLabel(rs){ var m={not_submitted:['Not submitted',''],pending:['Awaiting review','warn'],in_review:['Under review','rev'],changes_requested:['Changes requested','warn'],approved:['Approved','ok']}; var v=m[rs||'not_submitted']||m.not_submitted; return {txt:v[0],cls:v[1]}; }
function wsPrepCount(items){ var p=(items&&items.prepare)||[]; var n=0; for(var i=0;i<6;i++){ if(p[i]) n++; } return n; }

// Standard pre-anesthesia clinical requirements (doctor selects/annotates).
var WS_REQ_CATALOG=[
  {key:'chest_xray',label:'Chest X-ray'},
  {key:'ecg',label:'ECG'},
  {key:'echo',label:'Echocardiography'},
  {key:'ct',label:'CT scan'},
  {key:'mri',label:'MRI'},
  {key:'bloods',label:'Blood tests'},
  {key:'coag',label:'Coagulation profile'},
  {key:'cardiology',label:'Cardiology consultation'},
  {key:'pulmonology',label:'Pulmonology consultation'},
  {key:'endocrinology',label:'Endocrinology consultation'},
  {key:'anticoag',label:'Stop / continue anticoagulants'},
  {key:'glp1',label:'Stop / continue GLP-1'},
  {key:'documents',label:'Bring medical documents'},
  {key:'clarify_meds',label:'Clarify medications'},
  {key:'upload_reports',label:'Upload reports'},
  {key:'delay',label:'Delay surgery pending evaluation'},
  {key:'proceed',label:'Proceed / no additional tests needed'}
];
// saved requirements array -> map keyed by key
function wsNormReqs(arr){
  var out={}; (Array.isArray(arr)?arr:[]).forEach(function(r){ if(r&&r.key) out[r.key]={checked:!!r.checked,note:r.note||'',label:r.label||'',custom:!!r.custom}; });
  return out;
}
function wsReqRow(key,label,r,custom){
  r=r||{}; var checked=r.checked?' checked':'';
  return '<div class="ws-req-item'+(r.checked?' on':'')+'">'+
    '<label class="ws-req-chk"><input type="checkbox" data-req-key="'+key+'" data-req-label="'+wsEsc(label)+'"'+(custom?' data-req-custom="1"':'')+checked+' onchange="wsReqToggle(this)"><span>'+wsEsc(label)+'</span>'+
      (custom?'<button type="button" class="ws-req-del" onclick="wsReqRemove(\''+key+'\')" title="Remove">&times;</button>':'')+'</label>'+
    '<input class="ws-req-note" data-req-note="'+key+'" placeholder="Note / instructions for the patient (optional)" value="'+wsEsc(r.note||'')+'">'+
  '</div>';
}
function wsRequirementsHtml(){
  var reqs=(_wsCtx&&_wsCtx.requirements)||{};
  var catKeys={}; WS_REQ_CATALOG.forEach(function(c){catKeys[c.key]=1;});
  var html=WS_REQ_CATALOG.map(function(c){ return wsReqRow(c.key,c.label,reqs[c.key],false); }).join('');
  Object.keys(reqs).forEach(function(k){ if(!catKeys[k]) html+=wsReqRow(k,reqs[k].label||k,reqs[k],true); });
  html+='<div class="ws-req-add"><input id="ws-req-custom" placeholder="Add a custom requirement..." onkeydown="if(event.key===\'Enter\'){event.preventDefault();wsReqAdd();}"><button type="button" class="ws-btn" onclick="wsReqAdd()">+ Add</button></div>';
  return html;
}
function wsReqToggle(cb){ var row=cb.closest('.ws-req-item'); if(row) row.classList.toggle('on',cb.checked); }
function wsCollectReqs(){
  var map={};
  document.querySelectorAll('#ws-ws-body input[data-req-key]').forEach(function(cb){
    var k=cb.getAttribute('data-req-key');
    var noteEl=document.querySelector('#ws-ws-body [data-req-note="'+k+'"]');
    map[k]={checked:cb.checked, note:noteEl?noteEl.value:'', label:cb.getAttribute('data-req-label')||k, custom:cb.getAttribute('data-req-custom')==='1'};
  });
  if(_wsCtx) _wsCtx.requirements=map;
  return map;
}
function wsCaptureEdits(){
  if(!_wsCtx) return;
  var n=document.getElementById('ws-notes'); if(n) _wsCtx.notes=n.value;
  wsCollectReqs();
}
// Re-render ONLY the requirements list, never the whole body -- so editing
// requirements never destroys the Doctor Notes textarea or its focus/scroll.
function wsRenderReqList(){ var el=document.getElementById('ws-reqs-list'); if(el) el.innerHTML=wsRequirementsHtml(); }
function wsReqAdd(){
  if(!_wsCtx) return; var inp=document.getElementById('ws-req-custom'); if(!inp) return;
  var v=(inp.value||'').trim(); if(!v) return;
  wsCaptureEdits();
  _wsCtx.requirements['custom_'+Date.now()]={checked:true,note:'',label:v,custom:true};
  inp.value=''; wsRenderReqList();
  var ni=document.getElementById('ws-req-custom'); if(ni) ni.focus();   // keep adding
}
function wsReqRemove(key){ if(!_wsCtx) return; wsCaptureEdits(); delete _wsCtx.requirements[key]; wsRenderReqList(); }
function wsPlanPayload(){
  wsCaptureEdits();
  var reqs=[], m=(_wsCtx&&_wsCtx.requirements)||{};
  Object.keys(m).forEach(function(k){ var r=m[k]; reqs.push({key:k,label:r.label,checked:!!r.checked,note:r.note||'',custom:!!r.custom}); });
  return { notes:(_wsCtx&&_wsCtx.notes)||'', requirements:reqs,
    history:(_wsCtx&&_wsCtx.history)||[], modified_by:window.__wsUserName||'Clinician' };
}
function wsFmtTime(t){ if(!t) return 'not saved yet'; try { var d=new Date(t);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } }
// ── Audit trail / modification history ──
// Event shape: { ts, by, version, action, detail?, message?, added?[], removed?[], requested?[] }
function wsLogEvent(ev){
  if(!_wsCtx) return;
  if(!Array.isArray(_wsCtx.history)) _wsCtx.history=[];
  _wsCtx.history.push(Object.assign({ ts:new Date().toISOString(), by:(window.__wsUserName||'Clinician'), version:(_wsCtx.version||0)+1 }, ev));
  if(_wsCtx.history.length>80) _wsCtx.history=_wsCtx.history.slice(-80);
}
// Diff current checked requirements vs the last saved snapshot.
function wsReqDiff(){
  var cur=(_wsCtx&&_wsCtx.requirements)||{}, prev=(_wsCtx&&_wsCtx.savedReqs)||{};
  var added=[], removed=[];
  Object.keys(cur).forEach(function(k){ if(cur[k].checked && !(prev[k]&&prev[k].checked)) added.push(cur[k].label||k); });
  Object.keys(prev).forEach(function(k){ if(prev[k].checked && !(cur[k]&&cur[k].checked)) removed.push(prev[k].label||k); });
  return { added:added, removed:removed };
}
function wsActionGlyph(a){ return ({save:'&#128190;',approve:'&#9989;',reopen:'&#128260;',request_changes:'&#9888;',submit:'&#128203;'})[a]||'&#8226;'; }
function wsActionVerb(a){ return ({save:'updated the plan',approve:'approved the plan',reopen:'reopened the review',request_changes:'requested changes',submit:'submitted the plan'})[a]||'changed the plan'; }
function wsHistEntryHtml(e){
  var lines='';
  if(e.requested&&e.requested.length) lines+='<div class="ws-hist-req">'+e.requested.map(function(x){return '&bull; '+wsEsc(x);}).join('<br>')+'</div>';
  if(e.added&&e.added.length)   lines+='<div class="ws-hist-add">+ '+e.added.map(wsEsc).join(', ')+'</div>';
  if(e.removed&&e.removed.length) lines+='<div class="ws-hist-rem">&minus; '+e.removed.map(wsEsc).join(', ')+'</div>';
  if(e.message)  lines+='<div class="ws-hist-msg">&ldquo;'+wsEsc(e.message)+'&rdquo;</div>';
  if(!lines && e.detail) lines='<div class="ws-hist-sub">'+wsEsc(e.detail)+'</div>';
  return '<div class="ws-hist-row"><span class="ws-hist-ic">'+wsActionGlyph(e.action)+'</span>'+
    '<div class="ws-hist-tx">'+
      '<div class="ws-hist-top"><span class="ws-hist-v">v'+(e.version||'?')+'</span> <b>'+wsEsc(e.by||'Clinician')+'</b> '+wsActionVerb(e.action)+'</div>'+
      '<div class="ws-hist-w">'+wsFmtTime(e.ts)+'</div>'+lines+'</div></div>';
}
function wsRenderHistory(){
  var host=document.getElementById('ws-history'); if(!host||!_wsCtx) return;
  var meta='<div class="ws-hist-meta">Current version <b>v'+(_wsCtx.version||0)+'</b>'+
    ' &middot; last modified <b>'+wsFmtTime(_wsCtx.planSavedAt)+'</b>'+
    (_wsCtx.modifiedBy?(' &middot; by <b>'+wsEsc(_wsCtx.modifiedBy)+'</b>'):'')+'</div>';
  var h=(_wsCtx.history||[]).slice().reverse();
  var rows=h.length? h.map(wsHistEntryHtml).join('') : '<div class="ws-ap-facts">No changes recorded yet.</div>';
  host.innerHTML=meta+rows;
}
// Save-state indicator next to the Save buttons.
function wsSetSaveState(state){
  ['ws-save-plan-st','ws-save-notes-st'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    if(state==='saving'){ el.className='ws-save-st saving'; el.innerHTML='&#8635; Saving...'; }
    else if(state==='saved'){ el.className='ws-save-st ok'; el.innerHTML='&#10003; Saved &middot; v'+(_wsCtx?_wsCtx.version:0)+' &middot; '+wsFmtTime(_wsCtx?_wsCtx.planSavedAt:null); }
    else if(state==='error'){ el.className='ws-save-st err'; el.innerHTML='&#10007; Not saved'; }
    else { el.className='ws-save-st'; el.innerHTML=_wsCtx&&_wsCtx.planSavedAt?('&#10003; Saved &middot; v'+_wsCtx.version+' &middot; '+wsFmtTime(_wsCtx.planSavedAt)):'Not saved yet'; }
  });
}
// "Current doctor plan" = the last PERSISTED snapshot (not the live editor state).
function wsRenderPlanSummary(){
  var host=document.getElementById('ws-plan-summary'); if(!host||!_wsCtx) return;
  var reqs=_wsCtx.savedReqs||{}, keys=Object.keys(reqs).filter(function(k){ return reqs[k].checked; });
  var notes=(_wsCtx.savedNotes||'').trim();
  if(!keys.length && !notes && !_wsCtx.planSavedAt){
    host.innerHTML='<div class="ws-ap-facts">Nothing saved yet. Select requirements and Save plan below.</div>'; return;
  }
  var sel=keys.map(function(k){ var r=reqs[k];
    return '<div class="ws-sum-row"><span class="ws-sum-ck">&#10003;</span><div><span class="ws-sum-lb">'+wsEsc(r.label||k)+'</span>'+
      (r.custom?' <span class="ws-sum-tag">custom</span>':'')+(r.note?'<div class="ws-sum-note">'+wsEsc(r.note)+'</div>':'')+'</div></div>'; }).join('');
  host.innerHTML=
    '<div class="ws-sum-meta">Last saved: <b>'+wsFmtTime(_wsCtx.planSavedAt)+'</b></div>'+
    (keys.length?('<div class="ws-sum-h">Requested ('+keys.length+')</div>'+sel):'<div class="ws-ap-facts">No requirements selected.</div>')+
    (notes?('<div class="ws-sum-h">Internal notes</div><div class="ws-sum-note">'+wsEsc(notes)+'</div>'):'');
}
// Core commit. histEntry optional structured event; otherwise logs the
// requirement/notes diff. Returns true on success. Updates version/timestamp/state.
async function wsSavePlan(silent, histEntry){
  if(!_wsCtx) return false;
  wsCaptureEdits();
  var d=wsReqDiff(); var notesChanged=((_wsCtx.notes||'')!==(_wsCtx.savedNotes||''));
  if(histEntry){
    wsLogEvent(histEntry);
  } else if(d.added.length||d.removed.length){
    wsLogEvent({ action:'save', detail:'Requirements updated', added:d.added, removed:d.removed });
  } else if(notesChanged){
    wsLogEvent({ action:'save', detail:'Doctor notes updated' });
  }
  wsSetSaveState('saving');
  try {
    var payload=wsPlanPayload();
    var r=await window.sb.rpc('save_doctor_plan',{ p_surgery_id:_wsCtx.surgeryId, p_plan:payload });
    if(r&&r.error) throw new Error(r.error.message);
    var meta=(r&&r.data)||{};
    _wsCtx.savedNotes=payload.notes; _wsCtx.savedReqs=wsCloneReqs(_wsCtx.requirements);
    _wsCtx.planSavedAt=meta.updated_at||new Date().toISOString();
    if(meta.version!=null) _wsCtx.version=meta.version;
    _wsCtx.modifiedBy=window.__wsUserName||'Clinician';
    wsRenderPlanSummary(); wsRenderHistory(); wsSetSaveState('saved');
    if(!silent) wsToast('Plan saved (v'+_wsCtx.version+')');
    return true;
  } catch(e){ wsSetSaveState('error'); wsToast('Save failed: '+(e.message||'error')); return false; }
}

async function wsLoadActivePatients(){
  var box=document.getElementById('ws-active'); if(!box) return;
  var uid=window.__wsUserId; if(!uid){ box.innerHTML=''; return; }
  var crs=[];
  try { var r=await window.sb.from('care_requests').select('*').eq('doctor_id',uid).eq('status','accepted'); crs=(r&&r.data)||[]; }
  catch(e){ box.innerHTML=''; return; }
  if(!crs.length){ box.innerHTML=''; _wsActiveMap={}; return; }
  var pids=crs.map(function(c){return c.patient_id;});
  var sids=crs.map(function(c){return c.surgery_id;}).filter(Boolean);
  var surg={},q={},chk={};
  try { var s=await window.sb.from('patient_surgeries').select('*').in('id',sids); ((s&&s.data)||[]).forEach(function(x){surg[x.id]=x;}); }catch(e){}
  try { var qq=await window.sb.from('preop_questionnaires').select('patient_id,status,completion,review_state').in('patient_id',pids); ((qq&&qq.data)||[]).forEach(function(x){q[x.patient_id]=x;}); }catch(e){}
  try { var cc=await window.sb.from('preop_checklist').select('patient_id,items').in('patient_id',pids); ((cc&&cc.data)||[]).forEach(function(x){chk[x.patient_id]=(x.items&&x.items.prep_guide)||{};}); }catch(e){}
  var active=crs.filter(function(c){ var sg=surg[c.surgery_id]; return !(sg&&sg.completed_at); });   // visible until completed
  _wsActiveMap={}; active.forEach(function(c){ _wsActiveMap[c.patient_id]={name:c.patient_name,surgeryId:c.surgery_id}; });
  if(!active.length){ box.innerHTML=''; return; }
  box.innerHTML='<div class="ws-ap-h">&#129694; Active patients <span class="n">'+active.length+'</span></div>'+
    active.map(function(c){
      var sg=surg[c.surgery_id]||{}, qd=q[c.patient_id]||{}, n=wsPrepCount(chk[c.patient_id]);
      var rev=wsReviewLabel(qd.review_state);
      var qst=qd.status==='submitted'?'Questionnaire done':((qd.completion||0)+'% questionnaire');
      var facts=[c.procedure||sg.procedure_type, sg.surgery_date?new Date(sg.surgery_date).toLocaleDateString():''].filter(Boolean).join(' · ');
      return '<div class="ws-ap"><div><div class="ws-ap-name">'+wsEsc(c.patient_name||'Patient')+'</div>'+
        '<div class="ws-ap-facts">'+wsEsc(facts||'Active patient')+'</div>'+
        '<div class="ws-ap-pills"><span class="ws-pill '+rev.cls+'">'+rev.txt+'</span>'+
          '<span class="ws-pill '+(qd.status==='submitted'?'ok':'')+'">'+wsEsc(qst)+'</span>'+
          '<span class="ws-pill '+(n>=6?'ok':(n>0?'warn':''))+'">Prep '+n+'/6</span></div></div>'+
        '<div class="ws-req-btns"><button class="ws-btn pc-green" onclick="wsOpenPatient(\''+c.patient_id+'\')">Open patient</button></div></div>';
    }).join('');
}

async function wsOpenPatient(patientId){
  var info=_wsActiveMap[patientId]; if(!info) return;
  var surgeryId=info.surgeryId;
  try { await window.sb.rpc('start_review', { p_surgery_id: surgeryId }); } catch(e){}   // pending -> in_review
  var surgery={},quest={},items={},plan={},planSavedAt=null;
  try { var s=await window.sb.from('patient_surgeries').select('*').eq('id',surgeryId).maybeSingle(); surgery=s.data||{}; }catch(e){}
  try { var q=await window.sb.from('preop_questionnaires').select('*').eq('patient_id',patientId).maybeSingle(); quest=q.data||{}; }catch(e){}
  try { var c=await window.sb.from('preop_checklist').select('items').eq('patient_id',patientId).maybeSingle(); items=(c.data&&c.data.items&&c.data.items.prep_guide)||{}; }catch(e){}
  // Robust read: never maybeSingle() here -- after an approve+edit cycle there can
  // be both an approved and a draft row, and maybeSingle() throws on >1, which
  // previously swallowed the whole plan. Prefer the draft (editable working copy).
  var planVersion=0;
  try {
    var p=await window.sb.from('preparation_plans').select('plan_content,status,updated_at,version')
      .eq('surgery_id',surgeryId).in('status',['draft','approved'])
      .order('status',{ascending:false}).order('updated_at',{ascending:false}).limit(1);
    var row=(p&&p.data&&p.data[0])||null;
    plan=(row&&row.plan_content)||{}; planSavedAt=row?row.updated_at:null; planVersion=row?(row.version||0):0;
  }catch(e){}
  var docs=[];
  try { var dr=await window.sb.from('requirement_documents').select('*').eq('surgery_id',surgeryId).order('uploaded_at',{ascending:true}); docs=(dr&&dr.data)||[]; }catch(e){}
  var reqMap=wsNormReqs(plan.requirements);
  _wsCtx={ patientId:patientId, surgeryId:surgeryId, name:info.name, surgery:surgery, quest:quest, items:items,
    notes:plan.notes||'', requirements:reqMap, planSavedAt:planSavedAt, version:planVersion,
    history:(Array.isArray(plan.history)?plan.history:[]), modifiedBy:plan.modified_by||'', docs:docs,
    savedNotes:plan.notes||'', savedReqs:wsCloneReqs(reqMap) };
  wsRenderWorkspace();
  document.getElementById('ws-ws').classList.add('open');
}
function wsCloneReqs(m){ var o={}; Object.keys(m||{}).forEach(function(k){ o[k]={checked:!!m[k].checked,note:m[k].note||'',label:m[k].label||'',custom:!!m[k].custom}; }); return o; }
function wsCloseWorkspace(){ document.getElementById('ws-ws').classList.remove('open'); _wsCtx=null; }

function wsRenderWorkspace(){
  var c=_wsCtx; if(!c) return;
  var a=c.quest.answers||{}, s=c.surgery, flags=c.quest.risk_flags||[];
  var bmi=''; var h=parseFloat(a.height), w=parseFloat(a.weight); if(h>0&&w>0) bmi=' · BMI '+(w/Math.pow(h/100,2)).toFixed(1);
  document.getElementById('ws-ws-title').textContent = c.name || 'Patient';
  document.getElementById('ws-ws-sub').textContent = [s.procedure_type, s.surgery_date?new Date(s.surgery_date).toLocaleDateString():''].filter(Boolean).join(' · ');
  function kc(l,v){ return '<div class="ws-kc"><i>'+l+'</i><b>'+wsEsc(v||'—')+'</b></div>'; }
  // A Patient summary
  var meds=(a.medications&&a.medications.length)?a.medications.join(', '):'None reported';
  var allerg=a.allergy_present==='severe'?('Severe'+(a.allergy_detail?' ('+a.allergy_detail+')':'')):(a.allergy_present==='mild'?('Mild'+(a.allergy_detail?' ('+a.allergy_detail+')':'')):'None reported');
  var html='<div class="ws-sec-t">A &middot; Patient summary</div>'+
    '<div class="ws-kv">'+kc('Age',a.age)+kc('Sex',a.sex)+kc('Height',a.height?a.height+' cm':'')+kc('Weight',(a.weight?a.weight+' kg':'')+bmi)+
      kc('Procedure',s.procedure_type)+kc('Surgery date',s.surgery_date?new Date(s.surgery_date).toLocaleDateString():'')+kc('Hospital',s.hospital)+kc('Surgeon',s.surgeon)+'</div>'+
    (flags.length?'<div style="margin-top:10px;">'+flags.map(function(f){return '<span class="ws-flag'+(/severe|difficult|complication|heart|anticoag/i.test(f)?' hi':'')+'">&#9888; '+wsEsc(f)+'</span>';}).join('')+'</div>':'')+
    '<div class="ws-kv" style="margin-top:8px;">'+kc('Medications',meds)+kc('Allergies',allerg)+'</div>';
  // B Questionnaire (read-only)
  html+='<div class="ws-sec-t">B &middot; Questionnaire</div>';
  if(c.quest.status==='submitted' || Object.keys(a).length){
    html+=Object.keys(WS_QLBL).filter(function(k){return a[k]!=null && a[k]!=='';}).map(function(k){
      var v=a[k]; if(Array.isArray(v)) v=v.join(', ');
      return '<div class="ws-qrow"><span>'+WS_QLBL[k]+'</span><b>'+wsEsc(String(v))+'</b></div>';
    }).join('') || '<div class="ws-ap-facts">No answers recorded.</div>';
  } else { html+='<div class="ws-ap-facts">Questionnaire not completed yet.</div>'; }
  // C Preparation review
  var pc=(c.items&&c.items.prepare)||[], nDone=wsPrepCount(c.items);
  html+='<div class="ws-sec-t">C &middot; Preparation review</div>'+
    '<div class="ws-ap-facts" style="margin-bottom:6px;">Preparation checklist: <b style="color:#fff;">'+nDone+' / 6 complete</b> &middot; review status: <b style="color:#7ECFC0;">'+wsReviewLabel(c.quest.review_state).txt+'</b></div>'+
    WS_PREPARE.map(function(lbl,i){ var done=!!pc[i]; return '<div class="ws-chk '+(done?'done':'miss')+'">'+(done?'':'Missing: ')+wsEsc(lbl)+'</div>'; }).join('');
  var rs=c.quest.review_state||'not_submitted';
  var locked=(rs==='approved');   // approved cases are read-only until reopened
  // D Clinical requirements (doctor plan) - shared with the patient
  html+='<div class="ws-sec-t">D &middot; Clinical requirements <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--hint);">(shared with patient)</span></div>'+
    '<div class="ws-plan-sum"><div class="ws-sum-title">&#128203; Current doctor plan</div><div id="ws-plan-summary"></div></div>';
  if(locked){
    html+='<div class="ws-ap-facts">&#128274; This plan is approved and read-only. Use <b>Reopen review</b> below to edit it.</div>';
  } else {
    html+='<div class="ws-reqs" id="ws-reqs-list">'+wsRequirementsHtml()+'</div>'+
      '<div class="ws-acts"><button class="ws-btn pc-green" onclick="wsSavePlan(false)">Save plan</button><span class="ws-save-st" id="ws-save-plan-st"></span></div>';
  }
  // D2 Patient-submitted documents
  html+='<div class="ws-sum-title" style="margin:14px 0 4px;">&#128206; Submitted documents</div><div id="ws-docs"></div>';
  // E Doctor notes (internal - never shown to the patient)
  html+='<div class="ws-sec-t">E &middot; Doctor notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--hint);">(internal)</span></div>'+
    '<textarea class="ws-notes" id="ws-notes" '+(locked?'readonly ':'')+'placeholder="Private notes for this patient (not shown to the patient)">'+wsEsc(c.notes||'')+'</textarea>'+
    (locked?'':'<div class="ws-acts"><button class="ws-btn" onclick="wsSaveDocNotes()">Save notes</button><span class="ws-save-st" id="ws-save-notes-st"></span></div>');
  // F Review actions
  html+='<div class="ws-sec-t">F &middot; Review actions</div><div id="ws-review-actions">'+wsReviewActionsHtml(rs,c)+'</div>';
  // G Modification history / audit trail
  html+='<div class="ws-sec-t">G &middot; Modification history</div><div id="ws-history"></div>';
  document.getElementById('ws-ws-body').innerHTML=html;
  wsRenderPlanSummary(); wsRenderHistory(); wsSetSaveState(); wsRenderDocs();
}
// ── Patient-submitted documents (view / download / mark reviewed) ──
function wsRenderDocs(){
  var host=document.getElementById('ws-docs'); if(!host||!_wsCtx) return;
  var docs=_wsCtx.docs||[];
  if(!docs.length){ host.innerHTML='<div class="ws-ap-facts">No documents uploaded by the patient yet.</div>'; return; }
  var unrev=docs.filter(function(d){ return !d.reviewed_at; }).length;
  var groups={}; docs.forEach(function(d){ (groups[d.requirement_key]=groups[d.requirement_key]||{name:d.requirement_name||d.requirement_key,items:[]}).items.push(d); });
  host.innerHTML='<div class="ws-docs-status">'+(unrev?('<span style="color:#E8C16b;">&#9888; '+unrev+' awaiting your review</span>'):'<span style="color:#5ee393;">&#10003; All documents reviewed</span>')+'</div>'+
    Object.keys(groups).map(function(k){ var g=groups[k];
      return '<div class="ws-doc-grp"><div class="ws-doc-grp-h">'+wsEsc(g.name)+'</div>'+
        g.items.map(function(d){
          var up=d.uploaded_at?new Date(d.uploaded_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
          var rv=d.reviewed_at?new Date(d.reviewed_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
          return '<div class="ws-doc"><div class="ws-doc-tx"><div class="ws-doc-nm">'+wsEsc(d.file_name)+'</div>'+
            '<div class="ws-doc-mt">Uploaded '+up+(rv?(' &middot; <span style="color:#5ee393;">Reviewed '+rv+'</span>'):'')+'</div></div>'+
            '<div class="ws-doc-acts"><button type="button" class="ws-doc-btn" onclick="wsDocOpen(\''+d.id+'\',0)">View</button>'+
            '<button type="button" class="ws-doc-btn" onclick="wsDocOpen(\''+d.id+'\',1)">Download</button>'+
            (d.reviewed_at?'<span class="ws-doc-ok">&#10003; Reviewed</span>':'<button type="button" class="ws-doc-rev" onclick="wsDocReview(\''+d.id+'\')">Mark reviewed</button>')+
            '</div></div>';
        }).join('')+'</div>';
    }).join('');
}
async function wsDocOpen(id, dl){
  var d=(_wsCtx.docs||[]).filter(function(x){ return x.id===id; })[0]; if(!d) return;
  try {
    var opt=dl?{download:d.file_name}:undefined;
    var r=await window.sb.storage.from('patient-documents').createSignedUrl(d.storage_path, 3600, opt);
    if(r&&r.data&&r.data.signedUrl){ window.open(r.data.signedUrl,'_blank'); } else throw new Error('no url');
  } catch(e){ wsToast('Could not open file'); }
}
async function wsDocReview(id){
  var res;
  try { res=await window.sb.rpc('mark_document_reviewed',{p_doc_id:id}); if(res&&res.error) throw new Error(res.error.message); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); return; }
  var d=(_wsCtx.docs||[]).filter(function(x){ return x.id===id; })[0];
  if(d){ d.reviewed_at=(res&&res.data&&res.data.reviewed_at)||new Date().toISOString(); d.reviewed_by=window.__wsUserId; }
  wsToast('Document marked reviewed'); wsRenderDocs();
}
window.wsDocOpen=wsDocOpen; window.wsDocReview=wsDocReview;
function wsReviewActionsHtml(rs,c){
  if(rs==='not_submitted') return '<div class="ws-ap-facts">Patient has not submitted for review yet.</div>';
  if(rs==='approved')
    return '<div class="ws-ap-facts" style="color:#5ee393;margin-bottom:10px;">&#9989; Plan approved'+(c.quest.reviewed_at?(' on '+new Date(c.quest.reviewed_at).toLocaleDateString()):'')+' and sent to the patient.</div>'+
      '<div class="ws-ap-facts" style="margin-bottom:8px;">Reopen if new tests arrive, the patient&rsquo;s condition changes, or the surgery date changes.</div>'+

async function wsRequestChanges(){

function wsPtFilter(f, el){
  _wsPtFilter = f;
  document.querySelectorAll('#sec-patients .ws-subtab').forEach(function(b){ b.classList.remove('active'); });
  if(el) el.classList.add('active');

function wsProgressPct(p){
  if(p.questionnaire_status === 'completed'){
    var a = p.questionnaire_answers || {};
    var fields = ['conditions','medications','allergies','previous_anesthesia','osa','smoking','pregnancy','comments'];
    var filled = fields.filter(function(f){ return a[f] && String(a[f]).trim(); }).length;
    return Math.max(1, Math.round((filled/fields.length)*100));
  }
  return {not_sent:0, sent:20, opened:45, in_progress:70}[p.questionnaire_status] || 0;
}
function wsStages(p){
  // [label, reached?]
  var qs = p.questionnaire_status, cs = p.consultation_status, ps = p.patient_status;
  return [
    ['Not sent', true],
    ['Sent', ['sent','opened','in_progress','completed'].indexOf(qs) >= 0],
    ['Opened', ['opened','in_progress','completed'].indexOf(qs) >= 0],
    ['Completed', qs === 'completed'],
    ['Reviewed', cs === 'reviewed'],
    ['Ready', ps === 'ready_for_surgery'],
    ['Arrived', cs === 'arrived' || cs === 'reviewed' || !!p.arrived_at]
  ];
}
function wsRenderPatients(){
  var list = _wsPatients.filter(function(p){
    if(_wsPtFilter==='questionnaire') return p.questionnaire_status !== 'completed';
    if(_wsPtFilter==='consult') return p.questionnaire_status === 'completed' && p.patient_status !== 'ready_for_surgery';
    if(_wsPtFilter==='ready') return p.patient_status === 'ready_for_surgery';
    return true;
  });
  var box = document.getElementById('ws-pt-list');
  if(!list.length){ box.innerHTML = '<div class="ws-empty">No patients added yet.</div>'; return; }

  box.innerHTML = list.map(function(p){
    var dateFmt = p.surgery_date ? new Date(p.surgery_date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}) : 'Date not set';
    var pct = wsProgressPct(p);

    // Detail line (name + facts)
    var facts = [];
    if(p.phone_number) facts.push('&#128222; ' + wsEsc(p.phone_number));
    if(p.procedure) facts.push('&#129658; ' + wsEsc(p.procedure));
    if(p.hospital) facts.push('&#127973; ' + wsEsc(p.hospital));
    facts.push('&#128197; ' + dateFmt);

    // Progress stepper
    var stages = wsStages(p);
    var stepper = '<div class="pc-track">' + stages.map(function(s, i){
      return '<div class="pc-step'+(s[1]?' on':'')+'">' +
        '<span class="pc-dot">'+(s[1]?'&#10003;':(i+1))+'</span>' +
        '<span class="pc-lbl">'+s[0]+'</span></div>';
    }).join('<span class="pc-line"></span>') + '</div>';

    // Status chips
    var chips =
      '<div class="pc-chips">' +
        '<div class="pc-chip"><span class="pc-chip-l">Questionnaire</span><span class="pc-chip-v">'+wsQStatusLabel(p.questionnaire_status)+' &middot; '+pct+'%</span></div>' +
        '<div class="pc-chip"><span class="pc-chip-l">Consultation</span><span class="pc-chip-v">'+(p.consultation_status==='reviewed'?'Reviewed':(p.patient_status==='ready_for_surgery'?'Ready for surgery':'Pending'))+'</span></div>' +
        '<div class="pc-chip"><span class="pc-chip-l">Arrival</span><span class="pc-chip-v">'+(p.consultation_status==='arrived'||p.consultation_status==='reviewed'||p.arrived_at?'Arrived':'Not arrived')+'</span></div>' +
      '</div>';

    // Progress bar
    var bar = '<div class="pc-bar"><div class="pc-bar-fill" style="width:'+pct+'%"></div></div>';

    // Activity line (incl. submission date)
    var activity = [];
    if(p.completed_at) activity.push('Submitted ' + new Date(p.completed_at).toLocaleDateString());
    if(p.updated_at) activity.push('Last activity ' + new Date(p.updated_at).toLocaleDateString());
    var activityLine = activity.length ? '<div class="pc-activity">'+activity.join(' &middot; ')+'</div>' : '';

    // Clinical summary row (when completed): BMI · STOP-BANG · Pregnancy
    var ans = p.questionnaire_answers || {};
    var sc = ans._scores || {};
    var pregTxt = (ans.pregnant==='Yes') ? 'Pregnant'+(ans.gestation?' '+ans.gestation+'w':'') : (ans.pregnant==='Not sure'?'Possibly pregnant':(ans.sex==='Female'?'Not pregnant':'—'));
    var clinRow = (p.questionnaire_status === 'completed')
      ? '<div class="pc-clin">' +
          '<div class="pc-clin-i"><span>BMI</span><b>'+(sc.bmi!=null?sc.bmi:'—')+'</b></div>' +
          '<div class="pc-clin-i"><span>STOP-BANG</span><b>'+(sc.stopbang!=null?(sc.stopbang+'/8 '+(sc.stopbang_risk||'')):'—')+'</b></div>' +
          '<div class="pc-clin-i"><span>Pregnancy</span><b>'+wsEsc(pregTxt)+'</b></div>' +
          '<div class="pc-clin-i"><span>ASA</span><b>'+(sc.asa_suggestion?('~'+sc.asa_suggestion):'—')+'</b></div>' +
        '</div>'
      : '';

    // Workflow buttons (professional, no URLs)
    var send = '<button class="ws-btn ws-btn-wa" onclick="event.stopPropagation();wsSendWhatsApp(\''+p.id+'\')">'+(p.questionnaire_status==='not_sent'?'Send questionnaire':'Resend questionnaire')+'</button>';
    var preview = '<button class="ws-btn" onclick="event.stopPropagation();wsPreview()">Preview questionnaire</button>';
    var actionsCompleted = (p.questionnaire_status==='completed')
      ? '<button class="ws-btn" onclick="event.stopPropagation();wsDetail(\''+p.id+'\')">View summary</button>' +
        '<button class="ws-btn" onclick="event.stopPropagation();wsDetail(\''+p.id+'\')">View full questionnaire</button>' +
        '<button class="ws-btn" onclick="event.stopPropagation();wsPrint(\''+p.id+'\')">Print PDF</button>'
      : '';

    var workflow = '';
    if(p.consultation_status === 'not_arrived'){
      workflow += '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsAdvance(\''+p.id+'\',\'arrived\')">Patient arrived</button>';
    } else if(p.consultation_status === 'arrived'){
      workflow += '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsAdvance(\''+p.id+'\',\'reviewed\')">Mark reviewed</button>';
    } else if(p.consultation_status === 'reviewed' && p.patient_status !== 'ready_for_surgery'){
      workflow += '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsReady(\''+p.id+'\')">Ready for surgery</button>';
    }

    // Risk flags (from questionnaire scoring) — shown at a glance when completed
    var flags = (p.questionnaire_answers && p.questionnaire_answers._flags) || [];
    var flagRow = (p.questionnaire_status === 'completed' && flags.length)
      ? '<div class="pc-flags">' + flags.map(function(f){ return '<span class="pc-flag">&#9888; '+wsEsc(f)+'</span>'; }).join('') + '</div>'
      : '';

    var actionsRow = (p.questionnaire_status==='completed')
      ? actionsCompleted + workflow + preview
      : send + preview + workflow;

    return '<div class="pc-card" onclick="wsDetail(\''+p.id+'\')">' +
      '<div class="pc-head">' +
        '<div><div class="pc-name">'+wsEsc(p.patient_name)+'</div>' +
          '<div class="pc-facts">'+facts.join('<span class="pc-sep">&middot;</span>')+'</div></div>' +
        '<div class="pc-status">'+wsDeriveStatus(p)+'</div>' +
      '</div>' +
      stepper + bar + chips + clinRow + flagRow + activityLine +
      '<div class="pc-actions">'+actionsRow+'</div>' +
    '</div>';
  }).join('');
}

async function wsSavePatient(thenSend){

  btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Saving…';

  rec.questionnaire_status = 'not_sent';
  rec.consultation_status = 'not_arrived';
  rec.patient_status = 'awaiting_questionnaire';
  // Clinic-created surgery → explicit clinic origin (patient self-service
  // surgeries default to 'patient' in patient-dashboard.html / the DB).
  rec.origin = 'clinic';

  // ── TEMP DEBUG: show the exact payload + Supabase error ──
  console.log('CLINIC INSERT PAYLOAD', rec);
  console.log('CLINIC INSERT doctor_id =', rec.doctor_id, '| auth uid =', (window.__wsUserId || '(none)'));

  try {
    var r = await window.sb.from('clinic_patients').insert(rec).select().maybeSingle();
    console.log('CLINIC INSERT RESULT — data:', r.data, '| error:', r.error);
    if(r.error){
      console.error('CLINIC INSERT ERROR OBJECT:', r.error);
      console.error('  message:', r.error.message);
      console.error('  details:', r.error.details);
      console.error('  hint:', r.error.hint);
      console.error('  code:', r.error.code);
      // TEMP: surface the real error to the screen (revert to generic before launch)
      wsToast('Insert error: ' + r.error.message + (r.error.details ? ' — ' + r.error.details : ''));
      btn.disabled = false; btn.textContent = orig;
      return;
    }
    wsClearForm();
    await wsLoadPatients();
    if(thenSend && r.data){ wsSend(r.data.id); }

  }

}

  if(!p.token){ wsToast('This patient has no questionnaire link yet.'); return; }
  var digits = (p.phone_number || '').replace(/[^0-9]/g, '');
  var wa = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(wsMessage(p));
  var win = window.open(wa, '_blank');
  if(win){
    await wsMarkSent(id);
    wsToast('WhatsApp opened — status set to Sent');
  } else {
    // popup blocked → did NOT launch → do NOT mark sent
    wsToast('Pop-up blocked. Use Copy Link or allow pop-ups, then try again.');
  }
  wsLoadPatients();
}

// Fallback — open the device SMS app. Mark 'sent' after launch.
async function wsSendSms(id){
  var p = wsFindP(id);
  if(!p){ try { var r=await window.sb.from('clinic_patients').select('*').eq('id',id).maybeSingle(); p=r.data; }catch(e){} }
  if(!p) return;
  if(!p.token){ wsToast('This patient has no questionnaire link yet.'); return; }
  var digits = (p.phone_number || '').replace(/[^0-9+]/g, '');
  var sms = 'sms:' + digits + (/(iPhone|iPad|Macintosh)/i.test(navigator.userAgent) ? '&' : '?') + 'body=' + encodeURIComponent(wsMessage(p));
  window.location.href = sms;   // opens the SMS app on a device
  await wsMarkSent(id);
  wsToast('SMS app opened — status set to Sent');
  setTimeout(wsLoadPatients, 800);
}

// Copy / open the exact link so the doctor can verify it.
function wsCopyLink(id){
  var p = wsFindP(id); if(!p) return;
  var url = wsLink(p); if(!url){ wsToast('No link yet'); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ wsToast('Link copied'); }, function(){ wsFallbackCopy(url); }); }
  else { wsFallbackCopy(url); }
}
function wsFallbackCopy(url){
  var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); wsToast('Link copied'); }catch(e){ wsToast('Copy failed'); }
  document.body.removeChild(t);
}
function wsOpenLink(id){

  var list = _wsAsk.filter(function(q){

  var blab = {new:'New',under_review:'Under review',answered:'Answered',closed:'Closed'};
  box.innerHTML = list.map(function(q){
    var st = q.status || 'new';

    return '<div class="ws-row"><div class="ws-row-top"><div><div class="ws-row-name">'+wsEsc(subj)+'</div>' +

        '<div class="ws-grid">' +
          resItems.map(function(r){ return '<button class="ws-tile" onclick="wsToast(\''+r[0]+' — coming soon\')"><span class="ws-tile-ico">'+r[1]+'</span><span class="ws-tile-t">'+r[0]+'</span></button>'; }).join('') +
          '<a class="ws-tile" href="/v2/videos.html"><span class="ws-tile-ico">&#127909;</span><span class="ws-tile-t">Videos</span></a>' +
        '</div>' +
      '</div>';

    // SECTION 5 — Ask Anesthesiologist management (doctor inbox)
    var secAsk =
      '<div class="ws-sec" id="sec-ask">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Questions management</div>' +
          '<div class="ws-sec-sub">Patient questions awaiting your response</div></div></div>' +
        '<div class="ws-subtabs">' +
          '<button class="ws-subtab active" onclick="wsAskFilter(\'pending\',this)">Pending</button>' +
          '<button class="ws-subtab" onclick="wsAskFilter(\'answered\',this)">Answered</button>' +
          '<button class="ws-subtab" onclick="wsAskFilter(\'all\',this)">All</button>' +
        '</div>' +
        '<div id="ws-ask-list" class="ws-list"><div class="ws-empty">Loading questions…</div></div>' +
      '</div>';

    // SECTION 6 — Admin (admin only)
    var secAdmin = '';
    if(isAdminRole){
      secAdmin =
      '<div class="ws-sec" id="sec-admin">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Admin center</div>' +
          '<div class="ws-sec-sub">Approvals, users, and platform</div></div>' +
          '<a class="ws-open" href="/v2/admin.html">Full admin page &#8599;</a></div>' +
        '<div class="ws-stats" id="ws-admin-stats"></div>' +
        '<div class="ws-sec-title" style="font-size:14px;margin:18px 0 10px;">Doctor approvals</div>' +
        '<div id="ws-approvals" class="ws-list"><div class="ws-empty">Loading…</div></div>' +
        '<div class="ws-sec-title" style="font-size:14px;margin:22px 0 10px;">Users</div>' +
        '<div id="ws-users" class="ws-list"><div class="ws-empty">Loading…</div></div>' +
      '</div>';
    }

    var mainHTML =
      '<div class="ws-top">' +
        '<div><div class="ws-greet">' + greeting + '</div>' +
          '<div class="ws-role">' + roleLabel + ' &middot; <span class="ws-online">&#9679; session active</span></div></div>' +
      '</div>' +
      banner +
      '<div class="ws-shell">' +
        '<nav class="ws-rail">' + rail + '</nav>' +
        '<div class="ws-body">' + secPatients + secTools + secRefs + secResources + secAsk + secAdmin + '</div>' +
      '</div>';

    document.getElementById('app').innerHTML = mainHTML;

    // Wire up modules
    window.__wsRole = role;
    window.__wsUserId = user.id;
    window.__wsUserName = ((role === 'doctor' || role === 'admin') ? 'Dr. ' : '') + (profile.full_name || name);
    wsInjectModals();
    wsLoadPatients();
    wsLoadRequests();
    wsLoadPendingReviews();
    wsLoadActivePatients();
    wsLoadAsk();
    if(isAdminRole){ wsLoadAdmin(); }

    _dashDone = true; clearTimeout(_dashWatchdog);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('app').style.display    = 'block';

    var dest = (role === 'admin') ? 'Admin Workspace' : (role === 'doctor' ? 'Doctor Workspace' : 'Workspace');
    console.log('REDIRECT target:', dest, '| REDIRECT executed: rendered in place');
    console.log('DASHBOARD READY - role:', role);

  } catch(err){
    console.error('DASHBOARD ERROR:', err.message, err.stack);
    dashFail(err.message);
  }
});
</script>

<!-- Doctor Active Patient Workspace (in-page overlay; no navigation) -->
<div class="ws-ws-bg" id="ws-ws" onmousedown="window._wsBgDown=(event.target===this)" onclick="if(event.target===this&&window._wsBgDown)wsCloseWorkspace()">
  <div class="ws-ws-modal">
    <div class="ws-ws-head">
      <div><div class="ws-ws-title" id="ws-ws-title">Patient workspace</div>
        <div class="ws-ws-sub" id="ws-ws-sub"></div></div>
      <button class="ws-btn" onclick="wsCloseWorkspace()">&times; Close</button>
    </div>
    <div class="ws-ws-body" id="ws-ws-body"></div>
  </div>
</div>

<!-- Approval confirmation modal (above the workspace) -->
<div class="ws-cfm-bg" id="ws-cfm" onclick="if(event.target===this)wsCfmClose()">
  <div class="ws-cfm-box" id="ws-cfm-box"></div>
</div>
</body>
</html>
