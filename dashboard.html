<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/v2/supabase.js"></script>
<script src="/v2/auth.js"></script>
<script src="/v2/navbar.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: #0A1A15; color: #fff; min-height: 100vh; -webkit-font-smoothing: antialiased; }

#loader { position: fixed; inset: 0; background: #0A1A15; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
.spin { width: 30px; height: 30px; border: 3px solid rgba(27,107,90,.25); border-top-color: #2A8A74; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-txt { font-size: 13px; color: rgba(255,255,255,.3); }

#app { display: none; }

.shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 210px; flex-shrink: 0; position: fixed; top: 56px; left: 0; bottom: 0;
  background: rgba(6,16,11,.98); border-right: 1px solid rgba(27,107,90,.2);
  padding: 16px 0; overflow-y: auto; z-index: 100;
  display: flex; flex-direction: column;
}
.sb-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.25); padding: 10px 16px 4px; }
.sb-link { display: flex; align-items: center; gap: 9px; padding: 9px 16px; font-size: 14px; color: rgba(255,255,255,.5); text-decoration: none; transition: all .18s; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: inherit; border-left: 2px solid transparent; }
.sb-link:hover { color: #fff; background: rgba(27,107,90,.1); }
.sb-link.active { color: #fff; background: rgba(27,107,90,.18); border-left-color: #2A8A74; }
.sb-link.dim { opacity: .35; cursor: default; }
.sb-link.dim:hover { background: none; color: rgba(255,255,255,.5); }
.sb-sep { height: 1px; background: rgba(27,107,90,.15); margin: 8px 12px; }
.sb-bottom { margin-top: auto; }

.main { margin-left: 210px; padding: 36px 36px 60px; flex: 1; max-width: 900px; }

.welcome { margin-bottom: 24px; }
.welcome-label { font-size: 11px; color: rgba(255,255,255,.3); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-bottom: 7px; }
.welcome h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; margin-bottom: 5px; }
.welcome-sub { font-size: 14px; color: rgba(255,255,255,.45); }

.session-badge { display: inline-flex; align-items: center; gap: 7px; background: rgba(27,107,90,.12); border: 1px solid rgba(27,107,90,.25); border-radius: 20px; padding: 5px 13px; font-size: 12px; color: #7ECFC0; margin-bottom: 28px; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: #2A8A74; box-shadow: 0 0 0 3px rgba(42,138,116,.2); animation: pulse 2.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.sec-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.28); margin-bottom: 12px; }

.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 11px; margin-bottom: 28px; }
.info-card { background: rgba(255,255,255,.04); border: 1px solid rgba(27,107,90,.2); border-radius: 10px; padding: 16px; }
.info-card-label { font-size: 10px; color: rgba(255,255,255,.3); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; margin-bottom: 5px; }
.info-card-value { font-size: 14px; color: #fff; font-weight: 500; word-break: break-all; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 11px; }
.card { background: rgba(255,255,255,.04); border: 1px solid rgba(27,107,90,.2); border-radius: 10px; padding: 18px 16px; text-decoration: none; color: #fff; display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, background .2s; }
.card:hover { border-color: rgba(42,138,116,.4); background: rgba(27,107,90,.1); }
.card.disabled { cursor: default; opacity: .5; }
.card.disabled:hover { border-color: rgba(27,107,90,.2); background: rgba(255,255,255,.04); }
.card-ico { font-size: 22px; }
.card-title { font-size: 14px; font-weight: 600; }
.card-desc { font-size: 12px; color: rgba(255,255,255,.45); line-height: 1.5; }
.coming-soon { font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: rgba(232,168,56,.1); color: #E8A838; border: 1px solid rgba(232,168,56,.2); padding: 2px 7px; border-radius: 4px; display: inline-block; margin-top: 2px; }
.card-flagship { grid-column: 1 / -1; background: linear-gradient(135deg, rgba(27,107,90,.18), rgba(27,107,90,.06)); border-color: rgba(42,138,116,.45); position: relative; }
.card-flagship .card-ico { font-size: 30px; }
.card-flagship .card-title { font-size: 17px; font-family: 'Playfair Display', serif; }
.card-flagship:hover { border-color: rgba(42,138,116,.7); }
.flagship-tag { position: absolute; top: 16px; right: 16px; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: rgba(42,138,116,.25); color: #7ECFC0; border: 1px solid rgba(42,138,116,.45); padding: 3px 9px; border-radius: 5px; }

.verify-banner { background: rgba(232,168,56,.07); border: 1px solid rgba(232,168,56,.2); border-radius: 9px; padding: 13px 16px; margin-bottom: 24px; font-size: 13px; color: rgba(255,220,150,.9); line-height: 1.65; }

@media (max-width: 760px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 20px 16px 48px; }
  .info-grid, .cards { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 460px) {
  .info-grid, .cards { grid-template-columns: 1fr; }
}
/* ── SINGLE-PAGE WORKSPACE ── */
.ws-top{max-width:1180px;margin:0 auto;padding:24px 20px 8px;}
.ws-greet{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;}
.ws-role{font-size:13px;color:var(--muted);margin-top:2px;}
.ws-online{color:#7ECFC0;}
.verify-banner{max-width:1180px;margin:8px auto 0;padding:11px 16px;background:rgba(232,168,56,.08);border:1px solid rgba(232,168,56,.25);border-radius:10px;font-size:13px;color:#E8C16b;}
.ws-shell{max-width:1180px;margin:14px auto 0;padding:0 20px 70px;display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start;}
.ws-rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;}
.ws-tab{display:flex;align-items:center;gap:9px;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:11px 13px;font-size:13.5px;color:var(--muted);cursor:pointer;font-family:inherit;text-decoration:none;transition:all .15s;}
.ws-tab:hover{background:rgba(255,255,255,.04);color:#fff;}
.ws-tab.active{background:rgba(27,107,90,.18);border-color:rgba(42,138,116,.4);color:#fff;font-weight:600;}
.ws-rail-sp{height:14px;}
.ws-body{min-width:0;}
.ws-sec{display:none;animation:wsfade .25s ease;}
.ws-sec.active{display:block;}
@keyframes wsfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ws-sec-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.ws-sec-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
.ws-sec-sub{font-size:13px;color:var(--muted);margin-top:3px;}
.ws-open{font-size:13px;color:#7ECFC0;text-decoration:none;background:rgba(27,107,90,.12);border:1px solid rgba(42,138,116,.3);border-radius:8px;padding:9px 14px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.ws-open:hover{background:rgba(27,107,90,.2);}
.ws-frame{width:100%;height:78vh;min-height:560px;border:1px solid var(--border);border-radius:14px;background:#0A1A15;}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.ws-tile{display:flex;flex-direction:column;align-items:center;gap:9px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:13px;padding:22px 14px;text-decoration:none;color:inherit;cursor:pointer;font-family:inherit;transition:all .18s;}
.ws-tile:hover{border-color:rgba(42,138,116,.45);background:rgba(27,107,90,.1);transform:translateY(-2px);}
.ws-tile-ico{font-size:26px;}
.ws-tile-t{font-size:13.5px;font-weight:500;color:#fff;}
.ws-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px;}
.ws-reqs-card{background:linear-gradient(135deg,rgba(42,138,116,.16),rgba(42,138,116,.05));border:1px solid rgba(42,138,116,.4);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
/* active patients */
.ws-ap-h{font-size:13px;font-weight:700;color:#7ECFC0;margin:6px 0 10px;display:flex;align-items:center;gap:8px;}
.ws-ap-h .n{font-size:11px;font-weight:700;background:rgba(42,138,116,.3);color:#fff;border-radius:20px;padding:2px 8px;}
.ws-ap{display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;flex-wrap:wrap;}
.ws-ap-name{font-size:15px;font-weight:600;color:#fff;}
.ws-ap-facts{font-size:12.5px;color:var(--muted);margin-top:3px;}
.ws-ap-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.ws-pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 9px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);}
.ws-pill.ok{color:#5ee393;background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3);}
.ws-pill.warn{color:#E8C16b;background:rgba(232,168,56,.12);border-color:rgba(232,168,56,.3);}
.ws-pill.rev{color:#7ECFC0;background:rgba(42,138,116,.14);border-color:rgba(42,138,116,.35);}
/* workspace overlay */
.ws-ws-bg{display:none;position:fixed;inset:0;background:rgba(4,10,8,.82);z-index:6000;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto;}
.ws-ws-bg.open{display:flex;}
.ws-ws-modal{background:#0A1614;border:1px solid rgba(42,138,116,.4);border-radius:16px;max-width:880px;width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);}
.ws-ws-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px 12px;background:rgba(42,138,116,.16);border-bottom:1px solid rgba(42,138,116,.3);}
.ws-ws-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;}
.ws-ws-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.ws-ws-body{padding:18px 20px 26px;overflow-y:auto;}
.ws-sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#7ECFC0;margin:18px 0 8px;padding-top:12px;border-top:1px solid rgba(42,138,116,.16);}
.ws-sec-t:first-of-type{margin-top:0;padding-top:0;border-top:none;}
.ws-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.ws-kc{background:rgba(0,0,0,.2);border-radius:9px;padding:9px 11px;}
.ws-kc i{font-style:normal;display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin-bottom:3px;}
.ws-kc b{font-size:14px;color:#fff;font-weight:600;}
.ws-flag{display:inline-block;font-size:12px;font-weight:600;background:rgba(232,168,56,.13);border:1px solid rgba(232,168,56,.3);color:#E8C16b;border-radius:7px;padding:4px 9px;margin:2px 5px 2px 0;}
.ws-flag.hi{background:rgba(192,57,43,.16);border-color:rgba(192,57,43,.4);color:#ff9b86;}
.ws-qrow{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.ws-qrow span{color:var(--muted);} .ws-qrow b{color:#fff;font-weight:600;text-align:right;}
.ws-chk{font-size:13px;color:rgba(255,255,255,.85);padding:4px 0 4px 18px;position:relative;}
.ws-chk:before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;}
.ws-chk.done:before{background:#5ee393;} .ws-chk.miss:before{background:rgba(255,255,255,.2);}
.ws-chk.miss{color:var(--hint);}
.ws-plan-sum{background:rgba(42,138,116,.1);border:1px solid rgba(42,138,116,.32);border-radius:11px;padding:11px 13px;margin-bottom:12px;}
.ws-sum-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7ECFC0;margin-bottom:7px;}
.ws-sum-meta{font-size:12px;color:var(--hint);margin-bottom:8px;}
.ws-sum-meta b{color:rgba(255,255,255,.85);font-weight:600;}
.ws-sum-h{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 4px;}
.ws-sum-row{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#fff;padding:3px 0;}
.ws-sum-ck{color:#5ee393;flex:0 0 auto;}
.ws-sum-lb{font-weight:600;}
.ws-sum-tag{font-size:10px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);padding:1px 6px;border-radius:6px;vertical-align:middle;}
.ws-sum-note{font-size:12px;color:var(--muted);margin-top:2px;}
.ws-save-st{font-size:12px;color:var(--hint);align-self:center;}
.ws-save-st.saving{color:#E8C16b;} .ws-save-st.ok{color:#5ee393;} .ws-save-st.err{color:#ff9b86;}
/* Patient-submitted documents (doctor side) */
.ws-docs-status{font-size:12.5px;margin-bottom:8px;}
.ws-doc-grp{margin-bottom:10px;}
.ws-doc-grp-h{font-size:12px;font-weight:700;color:#7ECFC0;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.ws-doc{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:8px 11px;margin-bottom:4px;}
.ws-doc-nm{font-size:13px;color:#fff;font-weight:600;word-break:break-all;}
.ws-doc-mt{font-size:11.5px;color:var(--hint);margin-top:2px;}
.ws-doc-acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.ws-doc-btn{background:rgba(255,255,255,.07);border:1px solid var(--border);color:#cfe;font-size:12px;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:inherit;}
.ws-doc-btn:hover{background:rgba(255,255,255,.14);color:#fff;}
.ws-doc-rev{background:rgba(37,211,102,.16);border:1px solid rgba(37,211,102,.4);color:#5ee393;font-size:12px;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:inherit;font-weight:600;}
.ws-doc-rev:hover{background:rgba(37,211,102,.28);color:#fff;}
.ws-doc-ok{font-size:12px;color:#5ee393;font-weight:600;}
.ws-cfm-warn{font-size:12.5px;color:#E8C16b;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.3);border-radius:8px;padding:9px 11px;margin-bottom:14px;line-height:1.5;}
/* Approval confirmation modal (sits above the workspace overlay) */
.ws-cfm-bg{display:none;position:fixed;inset:0;background:rgba(4,10,8,.78);z-index:7000;align-items:center;justify-content:center;padding:18px;}
.ws-cfm-bg.open{display:flex;}
.ws-cfm-box{background:#0A1614;border:1px solid rgba(37,211,102,.45);border-radius:15px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 24px 60px rgba(0,0,0,.65);}
.ws-cfm-h{font-size:17px;font-weight:700;color:#5ee393;margin-bottom:14px;}
.ws-cfm-kv{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:14px;}
.ws-cfm-kv>div{display:flex;flex-direction:column;gap:2px;}
.ws-cfm-kv i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);}
.ws-cfm-kv b{font-size:14px;color:#fff;font-weight:600;}
.ws-cfm-msg{font-size:13.5px;color:rgba(255,255,255,.88);line-height:1.55;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.28);border-radius:9px;padding:11px 13px;margin-bottom:16px;}
.ws-hist-meta{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.ws-hist-meta b{color:rgba(255,255,255,.9);font-weight:600;}
.ws-hist-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);}
.ws-hist-row:first-child{border-top:none;}
.ws-hist-ic{flex:0 0 auto;font-size:14px;line-height:1.4;}
.ws-hist-top{font-size:13px;color:rgba(255,255,255,.9);}
.ws-hist-v{display:inline-block;font-size:11px;font-weight:700;color:#7ECFC0;background:rgba(42,138,116,.2);border-radius:5px;padding:1px 6px;margin-right:5px;}
.ws-hist-w{font-size:11.5px;color:var(--hint);margin:2px 0 3px;}
.ws-hist-sub{font-size:12.5px;color:rgba(255,255,255,.75);}
.ws-hist-req{font-size:12.5px;color:#fff;margin-top:2px;line-height:1.5;}
.ws-hist-add{font-size:12.5px;color:#5ee393;margin-top:2px;}
.ws-hist-rem{font-size:12.5px;color:#ff9b86;margin-top:2px;}
.ws-hist-msg{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:3px;}
.ws-reqs{display:flex;flex-direction:column;gap:6px;margin-bottom:4px;}
.ws-req-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:8px 10px;}
.ws-req-item.on{background:rgba(42,138,116,.14);border-color:rgba(42,138,116,.5);}
.ws-req-chk{display:flex;align-items:center;gap:9px;font-size:14px;color:rgba(255,255,255,.9);cursor:pointer;}
.ws-req-chk input{width:16px;height:16px;flex:0 0 auto;accent-color:#2A8A74;cursor:pointer;}
.ws-req-chk span{flex:1 1 auto;}
.ws-req-del{background:none;border:none;color:rgba(255,255,255,.4);font-size:18px;line-height:1;cursor:pointer;padding:0 4px;}
.ws-req-del:hover{color:#ff9b86;}
.ws-req-note{width:100%;margin-top:7px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;padding:7px 9px;color:#fff;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
.ws-req-note:focus{border-color:#2A8A74;}
.ws-req-add{display:flex;gap:8px;margin-top:8px;}
.ws-req-add input{flex:1 1 auto;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:#fff;font-size:13px;font-family:inherit;outline:none;}
.ws-req-add input:focus{border-color:#2A8A74;}
.ws-notes{width:100%;min-height:90px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:9px;padding:11px;color:#fff;font-size:14px;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box;}
.ws-notes:focus{border-color:#2A8A74;}
.ws-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.ws-act-approve{background:rgba(37,211,102,.18);border:1px solid rgba(37,211,102,.45);color:#5ee393;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.ws-act-approve:hover{background:rgba(37,211,102,.3);color:#fff;}
.ws-act-changes{background:rgba(232,168,56,.15);border:1px solid rgba(232,168,56,.4);color:#E8C16b;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.ws-act-changes:hover{background:rgba(232,168,56,.28);color:#fff;}
.ws-reqs-h{font-size:13px;font-weight:700;color:#7ECFC0;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.ws-reqs-n{font-size:11px;font-weight:700;background:rgba(42,138,116,.3);color:#fff;border-radius:20px;padding:2px 8px;}
.ws-req{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(42,138,116,.18);flex-wrap:wrap;}
.ws-req:last-child{border-bottom:none;}
.ws-req-name{font-size:14px;font-weight:600;color:#fff;}
.ws-req-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
.ws-req-msg{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:4px;font-style:italic;}
.ws-req-btns{display:flex;gap:8px;flex-shrink:0;}
.ws-stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:15px 16px;}
.ws-stat-n{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#fff;}
.ws-stat-l{font-size:12px;color:var(--muted);margin-top:2px;}
.ws-subtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.ws-subtab{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;font-family:inherit;}
.ws-subtab.active{background:rgba(27,107,90,.18);border-color:rgba(42,138,116,.4);color:#fff;}
.ws-list{display:flex;flex-direction:column;gap:10px;}
.ws-row{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.ws-row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.ws-row-name{font-size:14px;font-weight:600;color:#fff;}
.ws-row-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.ws-row-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
.ws-btn{font-size:12px;padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:rgba(255,255,255,.85);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.ws-btn:hover{border-color:rgba(42,138,116,.45);color:#fff;}
.ws-btn-wa{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3);color:#5ee393;}
.ws-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:5px;white-space:nowrap;}
.b-new{background:rgba(120,150,255,.14);color:#9ab0ff;}
.b-review{background:rgba(232,168,56,.14);color:#E8A838;}
.b-answered{background:rgba(27,107,90,.22);color:#7ECFC0;}
.b-closed{background:rgba(255,255,255,.06);color:var(--hint);}
.b-pending{background:rgba(232,168,56,.14);color:#E8A838;}
.b-approved{background:rgba(27,107,90,.22);color:#7ECFC0;}
.ws-empty{font-size:13px;color:var(--hint);padding:18px;text-align:center;background:rgba(255,255,255,.02);border:1px dashed var(--border);border-radius:12px;}
.ws-linkbox{background:rgba(27,107,90,.1);border:1px solid rgba(42,138,116,.3);border-radius:12px;padding:14px 16px;margin-bottom:16px;}
.ws-linkbox input{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#fff;font-size:13px;font-family:monospace;margin:8px 0;}
.ws-role-sel{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:7px;color:#fff;padding:6px 9px;font-size:12px;font-family:inherit;}
.ws-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0C1F18;border:1px solid rgba(42,138,116,.45);color:#7ECFC0;padding:11px 20px;border-radius:10px;font-size:14px;z-index:3000;box-shadow:0 12px 36px rgba(0,0,0,.5);}
/* patient modals */
/* ── professional patient cards ── */
.pc-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:14px;cursor:pointer;transition:border-color .18s,transform .18s;}
.pc-card:hover{border-color:rgba(42,138,116,.4);transform:translateY(-1px);}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;}
.pc-name{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;}
.pc-facts{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6;}
.pc-sep{margin:0 7px;opacity:.5;}
.pc-status{font-size:12px;font-weight:700;color:#7ECFC0;background:rgba(27,107,90,.16);border:1px solid rgba(42,138,116,.35);border-radius:20px;padding:6px 13px;white-space:nowrap;}
/* stepper */
.pc-track{display:flex;align-items:center;margin:6px 0 16px;overflow-x:auto;padding-bottom:4px;}
.pc-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;}
.pc-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--hint);border:1px solid var(--border);}
.pc-step.on .pc-dot{background:#2A8A74;color:#fff;border-color:#2A8A74;}
.pc-lbl{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.pc-step.on .pc-lbl{color:#fff;}
.pc-line{flex:1;height:2px;min-width:18px;background:rgba(255,255,255,.1);margin:0 4px;align-self:flex-start;margin-top:12px;}
/* progress bar */
.pc-bar{height:7px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden;margin-bottom:14px;}
.pc-bar-fill{height:100%;background:linear-gradient(90deg,#1B6B5A,#2A8A74,#7ECFC0);border-radius:5px;transition:width .5s ease;}
/* chips */
.pc-chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
.pc-chip{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:10px 13px;}
.pc-chip-l{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);margin-bottom:3px;}
.pc-chip-v{font-size:13.5px;font-weight:600;color:#fff;}
.pc-activity{font-size:12px;color:var(--hint);margin-bottom:14px;}
.pc-flags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}
.pc-clin{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:12px;}
.pc-clin-i{background:rgba(27,107,90,.08);border:1px solid rgba(42,138,116,.2);border-radius:9px;padding:9px 11px;}
.pc-clin-i span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin-bottom:2px;}
.pc-clin-i b{font-size:13.5px;color:#fff;font-weight:600;}
.pc-flag{font-size:11.5px;font-weight:600;background:rgba(232,168,56,.12);border:1px solid rgba(232,168,56,.32);color:#E8C16b;border-radius:7px;padding:5px 10px;}
.pc-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.pc-portal{font-size:11.5px;font-weight:600;border-radius:7px;padding:6px 10px;}
.pc-portal.ok{color:#5ee393;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);}
.pc-portal.need{color:#E8C16b;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.3);}
.pc-green{background:rgba(37,211,102,.14)!important;border-color:rgba(37,211,102,.4)!important;color:#5ee393!important;}
.pc-green:hover{background:rgba(37,211,102,.22)!important;}





/* ── Phase 1: Action Center + Active Cases ── */
.ws-need-badge{margin-left:auto;align-self:center;font-size:12px;font-weight:700;color:#ff9b86;background:rgba(192,57,43,.16);border:1px solid rgba(192,57,43,.4);border-radius:20px;padding:4px 12px;}
.ac-head,.acs-head{display:flex;align-items:center;gap:10px;margin:6px 0 10px;}
.ac-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;}
.ac-count{font-size:12px;font-weight:700;color:#fff;background:rgba(192,57,43,.5);border-radius:20px;padding:2px 9px;}
.acs-n{font-size:12px;color:var(--hint);background:rgba(255,255,255,.08);border-radius:20px;padding:2px 9px;}
.ac-empty{font-size:13px;color:var(--muted);padding:14px 4px;}
/* whole-card clickable affordance (tap anywhere to open) */
.ac-card.clickable,.acs-card.clickable{cursor:pointer;transition:border-color .12s ease,box-shadow .12s ease,transform .06s ease;}
.ac-card.clickable:hover,.acs-card.clickable:hover{border-color:rgba(126,207,192,.55);box-shadow:0 6px 18px rgba(0,0,0,.28);}
.ac-card.clickable:active,.acs-card.clickable:active{transform:translateY(1px);}
.ac-card.clickable:focus-visible,.acs-card.clickable:focus-visible{outline:2px solid #7ECFC0;outline-offset:2px;}
.ac-card.clickable .ws-btn{pointer-events:auto;}
/* action cards */
.ac-card{position:relative;display:flex;flex-direction:column;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden;}
.ac-row{display:flex;align-items:stretch;gap:14px;padding:12px 15px 13px 18px;}
.ac-rail{position:absolute;left:0;top:0;bottom:0;width:5px;z-index:1;}
/* source ribbon — primary visual element */
/* source = small secondary chip inside the card body */
.ac-chip{display:inline-block;margin-top:8px;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:2px 9px;border-radius:20px;}
.ac-chip.src-clinic{color:#dcc3f4;background:rgba(150,100,200,.16);border:1px solid rgba(150,100,200,.32);}
.ac-chip.src-patient{color:#a4e6d6;background:rgba(42,138,116,.16);border:1px solid rgba(42,138,116,.32);}
/* source filter tabs */
.ws-src-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px;}
.ws-src-tab{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:#cfe;font-size:13px;font-weight:600;border-radius:10px;padding:9px 15px;cursor:pointer;font-family:inherit;}
.ws-src-tab:hover{background:rgba(255,255,255,.1);}
.ws-src-tab.on{background:#1B6B5A;border-color:#2A8A74;color:#fff;}
.ws-src-n{font-size:11px;font-weight:700;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 8px;}
.rail-red .ac-rail{background:#e0533f;} .rail-blue .ac-rail{background:#3d8bdc;}
.rail-green .ac-rail{background:#37b86a;} .rail-yellow .ac-rail{background:#E8A838;} .rail-urg .ac-rail{background:#E8A838;}
.ac-card.rail-red{background:rgba(224,83,63,.07);border-color:rgba(224,83,63,.32);}
.ac-card.rail-blue{background:rgba(61,139,220,.07);border-color:rgba(61,139,220,.32);}
.ac-card.rail-urg{background:rgba(232,168,56,.09);border-color:rgba(232,168,56,.45);}
.ac-card.is-new{box-shadow:0 0 0 1px rgba(224,83,63,.4),0 4px 18px rgba(224,83,63,.14);}
.ac-body{flex:1 1 auto;min-width:0;}
.ac-top{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.ac-headline{font-size:12.5px;font-weight:800;letter-spacing:.03em;color:#fff;}
.ac-new{font-size:10px;font-weight:800;letter-spacing:.05em;color:#fff;background:#c0392b;border-radius:20px;padding:2px 8px;}
.ac-new.pulse{animation:acpulse 1.6s ease-in-out infinite;}
@keyframes acpulse{0%,100%{box-shadow:0 0 0 0 rgba(224,83,63,.55);}50%{box-shadow:0 0 0 6px rgba(224,83,63,0);}}
.ac-name{font-size:15px;font-weight:700;color:#fff;}
.ac-proc{font-size:13px;color:var(--muted);margin-top:1px;}
.ac-surg{font-size:12.5px;color:#cfe;margin-top:5px;}
.ac-surg.soon{color:#E8C16b;font-weight:600;} .ac-surg.none{color:var(--hint);}
.ac-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.ac-sub.urg{color:#E8C16b;font-weight:600;}
.ac-when{font-size:11.5px;color:var(--hint);margin-top:3px;}
.ac-tag{display:inline-block;font-size:10.5px;font-weight:600;margin-top:7px;padding:2px 9px;border-radius:20px;}
.ac-tag.patient{color:#7ECFC0;background:rgba(42,138,116,.16);border:1px solid rgba(42,138,116,.35);}
.ac-tag.clinic{color:#c9a6e8;background:rgba(150,100,200,.16);border:1px solid rgba(150,100,200,.35);}
.ac-action{display:flex;flex-direction:column;gap:7px;justify-content:center;align-items:flex-end;flex:0 0 auto;}
.ac-reqgroup{margin-top:8px;border-top:1px dashed rgba(255,255,255,.14);padding-top:12px;}
.ac-reqhead{font-size:12.5px;font-weight:700;color:#7ECFC0;margin-bottom:8px;}
.ac-req{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:7px;}
/* active cases grid */
.acs-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;}
.acs-chip{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#cfe;font-size:12px;border-radius:20px;padding:6px 13px;cursor:pointer;font-family:inherit;}
.acs-chip.on{background:#1B6B5A;border-color:#1B6B5A;color:#fff;font-weight:600;}
.acs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;}
.acs-card{position:relative;display:flex;flex-direction:column;background:rgba(255,255,255,.045);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.acs-card .ac-row{flex-direction:column;gap:10px;}
.acs-card .ac-action{flex-direction:row;align-items:stretch;}
.acs-status{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:#fff;}
/* SECTION 1 — My Surgical Patients (primary, dominant) */
.ws-surg-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 14px;}
.ws-surg-t{font-family:'Playfair Display',serif;font-size:23px;font-weight:700;color:#fff;}
.ws-surg-sub{font-size:13px;color:var(--muted);}
/* SECTION 2 — Consultations (secondary). SECTION 3 — Requests (smallest). */
.ws-consult-sec{margin-top:30px;padding:16px 18px;border:1px solid rgba(61,139,220,.28);border-radius:14px;background:rgba(61,139,220,.035);}
.ws-btn-consult{background:rgba(61,139,220,.16)!important;border:1px solid rgba(61,139,220,.45)!important;color:#bcd9f5!important;}
.ws-btn-consult:hover{background:rgba(61,139,220,.28)!important;color:#fff!important;}
/* Requests = smallest, quietest inbox at the very bottom */
.ws-requests-sec{margin-top:18px;padding:12px 14px;border:1px dashed rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.015);}
.ws-requests-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px;}
.ws-requests-t{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--hint);}
.ws-requests-n{font-size:10.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.22);border-radius:20px;padding:1px 7px;min-width:7px;text-align:center;}
.ws-req-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px;}
.ws-req-acts{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;}
.ws-consult-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:11px;}
.ws-consult-t{font-size:14px;font-weight:700;letter-spacing:.02em;color:#9fb8d6;}
.ws-consult-n{font-size:11px;font-weight:700;color:#fff;background:rgba(61,139,220,.45);border-radius:20px;padding:1px 8px;min-width:8px;text-align:center;}
.ws-consult-sub{font-size:12px;color:var(--hint);}
.ws-consult-empty{font-size:12.5px;color:var(--hint);padding:8px 2px;}
.ws-consult-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(61,139,220,.05);border:1px solid rgba(61,139,220,.22);border-radius:10px;padding:11px 14px;margin-bottom:7px;}
.ws-consult-name{font-size:14px;font-weight:600;color:#fff;}
.ws-consult-meta{font-size:12.5px;color:var(--muted);margin-top:1px;}
.ws-consult-msg{font-size:12.5px;color:var(--hint);font-style:italic;margin-top:3px;}
.ws-consult-acts{display:flex;gap:7px;flex-wrap:wrap;flex:0 0 auto;}
/* Phase A - Active Consultations rows open a dedicated workspace */
.ws-consult-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(61,139,220,.05);border:1px solid rgba(61,139,220,.22);border-radius:11px;padding:12px 15px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s;}
.ws-consult-row:hover{border-color:rgba(61,139,220,.5);background:rgba(61,139,220,.09);}
.ws-consult-open{flex:0 0 auto;font-size:12.5px;font-weight:700;color:#7ECFC0;}
.ws-orig{font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px;margin-right:8px;vertical-align:middle;}
.ws-orig.doc{color:#FFE0B0;background:rgba(255,180,84,.14);border:1px solid rgba(255,180,84,.35);}
.ws-orig.pt{color:#CDE7FF;background:rgba(79,168,255,.14);border:1px solid rgba(79,168,255,.4);}
.ws-ws-workflow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-bottom:8px;font-size:12.5px;color:var(--muted);}
/* consultation workspace bits (reuses the surgical #ws-ws overlay) */
.ws-consult-banner{font-size:12px;color:#bcd9f5;background:rgba(61,139,220,.1);border:1px solid rgba(61,139,220,.3);border-radius:9px;padding:9px 13px;margin-bottom:6px;}
.ws-consult-reason{font-size:13.5px;color:#cfe;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-style:italic;}
/* Recommendations widget - shared by consultation AND surgical workspaces */
.ws-rec{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:9px;}
.ws-rec-body{width:100%;min-height:46px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:9px;color:#fff;font-size:13.5px;font-family:inherit;resize:vertical;box-sizing:border-box;}
.ws-rec-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px;}
.ws-rec-vis{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim,#cfe);cursor:pointer;}
.ws-rec-st{font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,.05);}
.ws-rec-st.pub{color:#5ee393;border-color:rgba(37,211,102,.4);background:rgba(37,211,102,.1);}
.ws-rec-acts{margin-left:auto;display:flex;gap:7px;}
.ws-rec-add{display:flex;gap:8px;margin-top:6px;}
.ws-rec-add input{flex:1 1 auto;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:#fff;font-size:13px;font-family:inherit;outline:none;}
.ws-invite-band{margin-top:26px;padding:18px;border:1px solid var(--border);border-radius:16px;background:rgba(255,255,255,.025);}
.ws-invite-head{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#fff;}
.ws-invite-sub{font-size:12.5px;color:var(--muted);margin:3px 0 14px;}
.ws-pt-cols{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start;}
.ws-pt-form{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:18px;position:sticky;top:16px;}
.ws-form-title{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#7ECFC0;margin-bottom:12px;}
.wa-hint{font-size:11px;color:var(--hint);margin:5px 0 2px;line-height:1.45;}
.ws-pt-form label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:11px 0 5px;}
.ws-pt-form input,.ws-pt-form textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#fff;font-size:14px;font-family:inherit;outline:none;min-height:42px;}
.ws-pt-form textarea{min-height:58px;resize:vertical;}

.ws-form-btns .ws-btn{text-align:center;padding:12px;}
.ws-pt-right{min-width:0;}
@media(max-width:760px){.ws-pt-cols{grid-template-columns:1fr;}.ws-pt-form{position:static;}}
.ws-modal-bg{display:none;position:fixed;inset:0;background:rgba(5,12,9,.72);z-index:1200;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.ws-modal-bg.open{display:flex;}
.ws-modal{background:#0C1F18;border:1px solid rgba(27,107,90,.3);border-radius:16px;padding:24px;max-width:440px;width:100%;}
.ws-modal-lg{max-width:560px;}
.ws-modal h3{font-family:'Playfair Display',serif;font-size:21px;margin-bottom:14px;}
.ws-modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:12px 0 5px;}
.ws-modal input,.ws-modal textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:#fff;font-size:14px;font-family:inherit;outline:none;min-height:44px;}
.ws-modal textarea{min-height:64px;resize:vertical;}
.ws-modal input:focus,.ws-modal textarea:focus{border-color:#2A8A74;}

<body>

<div id="loader">
  <div class="spin"></div>
  <div class="loader-txt">Loading dashboard&hellip;</div>
</div>

<div id="nb-placeholder"></div>

<div id="app"></div>

<script>
// ── 10-SECOND SAFETY TIMEOUT ──────────────────────────────────
// If anything stalls, never leave the user on an endless spinner.
var _dashDone = false;
var _dashWatchdog = setTimeout(function(){
  if(_dashDone) return;
  console.error('LOGIN WATCHDOG: exceeded 10s');
  var loader = document.getElementById('loader');
  if(loader){
    loader.innerHTML =
      '<div style="text-align:center;padding:40px;font-family:sans-serif;max-width:340px;">' +
      '<p style="color:#fff;font-size:15px;margin-bottom:10px;">Login is taking longer than expected.</p>' +
      '<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:18px;">Please refresh or try again.</p>' +
      '<button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Refresh</button> ' +
      '<a href="/v2/index.html" style="color:#7ECFC0;font-size:13px;margin-left:10px;">Return home</a>' +
      '</div>';
  }
}, 10000);

function dashFail(msg){
  _dashDone = true; clearTimeout(_dashWatchdog);
  var loader = document.getElementById('loader');
  if(loader){
    loader.innerHTML =
      '<div style="text-align:center;padding:40px;font-family:sans-serif;max-width:340px;">' +
      '<p style="color:rgba(255,160,140,.95);font-size:15px;margin-bottom:10px;">Could not load your dashboard</p>' +
      '<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:18px;">' + (msg || 'Unknown error') + '</p>' +
      '<button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Try again</button> ' +
      '<a href="/v2/index.html" style="color:#7ECFC0;font-size:13px;margin-left:10px;">Return home</a>' +
      '</div>';
  }
}

// ── WORKSPACE MODULES ─────────────────────────────────────────
function wsShow(sec){
  document.querySelectorAll('.ws-sec').forEach(function(s){ s.classList.remove('active'); });
  document.querySelectorAll('.ws-tab[data-sec]').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-sec')===sec); });
  var el = document.getElementById('sec-'+sec); if(el) el.classList.add('active');
}
function wsToast(msg){
  var t = document.createElement('div'); t.className='ws-toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(function(){t.remove();},400); }, 1600);
}
function wsEsc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// SECTION 2 — Patient management (clinic_patients table)
var _wsPatients = [], _wsPtFilter = 'all', _wsDoctorId = null;

function wsToken(){
  var a = new Uint8Array(18);
  (window.crypto || window.msCrypto).getRandomValues(a);
  return Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');
}
function wsQStatusLabel(s){
  return {not_sent:'Not sent',sent:'Sent',opened:'Opened',in_progress:'In progress',completed:'Completed'}[s] || 'Not sent';
}
function wsQStatusClass(s){
  return {not_sent:'b-closed',sent:'b-new',opened:'b-new',in_progress:'b-review',completed:'b-answered'}[s] || 'b-closed';
}
function wsVisitLabel(s){
  return {not_arrived:'Not arrived',arrived:'Arrived',reviewed:'Reviewed'}[s] || 'Not arrived';
}
function wsVisitClass(s){
  return {not_arrived:'b-closed',arrived:'b-review',reviewed:'b-approved'}[s] || 'b-closed';
}
function wsStatusLabel(s){ return {awaiting_questionnaire:'Awaiting questionnaire',awaiting_consultation:'Awaiting consultation',ready_for_surgery:'Ready for surgery',completed:'Completed'}[s] || 'Awaiting questionnaire'; }
function wsDeriveStatus(p){
  if(p.patient_status) return wsStatusLabel(p.patient_status);
  if(p.questionnaire_status !== 'completed') return 'Awaiting questionnaire';
  if(p.consultation_status === 'reviewed') return 'Awaiting consultation';
  return 'Awaiting consultation';
}

// ── Patient-initiated review requests (Epic B inbox) ──
// ============================================================
// PHASE 1 — Unified Action Center + Active Cases (derived, no stored status)
// Supersedes wsLoadRequests / wsLoadPendingReviews / wsLoadActivePatients.
// All action functions (wsOpenPatient, wsDetail, wsRespondRequest, document
// review, approval) are reused unchanged.
// ============================================================
var URGENCY_CRITICAL=2, URGENCY_SOON=7;
var _wsCases=[], _wsRequests=[], _wsConsults=[], _wsCaseFilter='all';
function wsSeenKey(){ return 'anestheo_seen_'+(window.__wsUserId||'x'); }
function wsSeenGet(){ try{ return JSON.parse(localStorage.getItem(wsSeenKey())||'{}'); }catch(e){ return {}; } }
function wsSeenSet(id, ts){ try{ var m=wsSeenGet(); m[id]=ts||Date.now(); localStorage.setItem(wsSeenKey(), JSON.stringify(m)); }catch(e){} }
function wsTimeAgo(ts){
  if(!ts) return '';
  var s=(Date.now()-ts)/1000;
  if(s<60) return 'just now';
  if(s<3600) return Math.max(1,Math.floor(s/60))+' min ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function wsUrgency(date){
  if(!date) return {days:null,label:'',critical:false,soon:false};
  var days=Math.round((new Date(date).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/86400000);
  var label;
  if(days<0) label='Surgery date passed';
  else if(days===0) label='Surgery today';
  else if(days===1) label='Surgery tomorrow';
  else if(days<=2) label='Surgery in 48 hours';
  else if(days<=14) label='Surgery in '+days+' days';
  else if(days<=60) label='Surgery in ~'+Math.round(days/7)+' weeks';
  else label='Surgery in ~'+Math.round(days/30)+' months';
  return {days:days, label:label, critical:(days>=0&&days<=URGENCY_CRITICAL), soon:(days>=0&&days<=URGENCY_SOON)};
}
function wsColorIcon(c){ return {red:'&#128308;',blue:'&#128309;',green:'&#128994;',yellow:'&#128993;'}[c]||'&#9899;'; }
function wsIsNew(o){
  if(!o.eventTs) return false;
  var id=(o.source==='clinic'?'c'+o.clinicId:o.patientId);
  return o.eventTs>(wsSeenGet()[id]||0) && (Date.now()-o.eventTs)<86400000;
}

async function wsLoadCases(){
  var uid=window.__wsUserId; if(!uid) return;
  var crs=[];
  try { var r=await window.sb.from('care_requests').select('*').eq('doctor_id',uid).in('status',['requested','accepted']); crs=(r&&r.data)||[]; }catch(e){}
  var accepted=crs.filter(function(c){return c.status==='accepted';});
  _wsRequests=crs.filter(function(c){return c.status==='requested';})
    .sort(function(a,b){ return new Date(a.requested_at||0)-new Date(b.requested_at||0); });

  // Canonical records owned by this doctor (both origins). patient_surgeries
  // .care_state is the SINGLE source of truth for the consultation/surgical lane.
  var surgById={}, surgByClinic={};
  try { var s=await window.sb.from('patient_surgeries').select('*').eq('assigned_doctor_id',uid);
    ((s&&s.data)||[]).forEach(function(x){ surgById[x.id]=x; if(x.clinic_patient_id) surgByClinic[x.clinic_patient_id]=x; }); }catch(e){}
  var clinics=[];
  try { var cp=await window.sb.from('clinic_patients').select('*').eq('doctor_id',uid); clinics=(cp&&cp.data)||[]; }catch(e){}

  // ── Lane split by care_state (origin-independent) ──
  _wsConsults=[]; var surgicalReqs=[]; var clinicConsult={};
  accepted.forEach(function(c){
    var sg=surgById[c.surgery_id]||{};
    if((sg.care_state||'surgical')==='consultation'){
      _wsConsults.push({ id:c.id, origin:'patient', surgery_id:c.surgery_id, patient_id:c.patient_id,
        patient_name:c.patient_name||sg.patient_name||'Patient', message:c.message||'',
        doctor_notes:(sg.doctor_notes!=null?sg.doctor_notes:c.consult_notes)||'', responded_at:c.responded_at });
    } else { surgicalReqs.push(c); }
  });
  clinics.forEach(function(p){
    var sg=surgByClinic[p.id];
    if(sg && sg.care_state==='consultation'){ clinicConsult[p.id]=1;
      _wsConsults.push({ id:'clinic:'+p.id, origin:'doctor', surgery_id:sg.id, patient_id:null,
        patient_name:p.patient_name||'Patient', message:p.notes||'',
        doctor_notes:(sg.doctor_notes!=null?sg.doctor_notes:p.doctor_notes)||'', responded_at:p.updated_at });
    }
  });
  _wsConsults.sort(function(a,b){ return new Date(b.responded_at||0)-new Date(a.responded_at||0); });

  // ── Surgical pipeline (Action Center / Active Cases) ──
  var pids=surgicalReqs.map(function(c){return c.patient_id;}).filter(Boolean);
  var sids=surgicalReqs.map(function(c){return c.surgery_id;}).filter(Boolean);
  var q={},chk={},docInfo={};
  if(pids.length){ try{ var qq=await window.sb.from('preop_questionnaires').select('patient_id,status,completion,review_state,updated_at').in('patient_id',pids); ((qq&&qq.data)||[]).forEach(function(x){q[x.patient_id]=x;}); }catch(e){} }
  if(pids.length){ try{ var cc=await window.sb.from('preop_checklist').select('patient_id,items').in('patient_id',pids); ((cc&&cc.data)||[]).forEach(function(x){chk[x.patient_id]=(x.items&&x.items.prep_guide)||{};}); }catch(e){} }
  if(sids.length){ try{ var dd=await window.sb.from('requirement_documents').select('surgery_id,requirement_name,uploaded_at,reviewed_at').in('surgery_id',sids);
    ((dd&&dd.data)||[]).forEach(function(d){ if(d.reviewed_at) return; var g=docInfo[d.surgery_id]=docInfo[d.surgery_id]||{count:0,names:[],ts:0}; g.count++; if(d.requirement_name) g.names.push(d.requirement_name); var t=d.uploaded_at?new Date(d.uploaded_at).getTime():0; if(t>g.ts) g.ts=t; }); }catch(e){} }

  var cases=[]; _wsActiveMap={};
  surgicalReqs.forEach(function(c){
    var sg=surgById[c.surgery_id]||{};
    if(sg.completed_at) return;                 // completed -> Archive (Phase 5), excluded
    _wsActiveMap[c.patient_id]={name:c.patient_name,surgeryId:c.surgery_id};
    cases.push(wsDeriveBridge(c, sg, q[c.patient_id]||{}, wsPrepCount(chk[c.patient_id]), docInfo[c.surgery_id]||{count:0,names:[],ts:0}));
  });
  clinics.forEach(function(p){ if(clinicConsult[p.id]) return;   // consultation clinic patients are not in the surgical lane
    var d=wsDeriveClinic(p); if(d) cases.push(d); });
  _wsCases=cases;
  wsRenderActionCenter();
  wsRenderActiveCases();
  wsRenderConsultations();
  wsRenderRequests();
}
function wsDeriveBridge(c, sg, qd, prepN, docG){
  var rs=qd.review_state||'not_submitted', urg=wsUrgency(sg.surgery_date);
  // source = routing (bridge -> full workspace);  origin = display/filter
  // (clinic-invited converted patients carry origin='clinic' on the surgery).
  var origin=(sg.origin==='clinic')?'clinic':'patient';
  var o={source:'bridge', origin:origin, patientId:c.patient_id, surgeryId:c.surgery_id, name:c.patient_name||'Patient',
    procedure:c.procedure||sg.procedure_type||'Procedure', hospital:sg.hospital||'', surgeryDate:sg.surgery_date||null, urgency:urg,
    prepN:prepN, reviewState:rs, sourceTag:(origin==='clinic'?'Clinic invited':'Patient requested'), unreviewedDocs:docG.names||[],
    openFn:"wsOpenCase('"+c.patient_id+"')"};
  if(rs==='pending'){ o.color='red'; o.bucket='action'; o.headline='New questionnaire submitted'; o.actionLabel='Review Now'; o.priority=1; o.eventTs=qd.updated_at?new Date(qd.updated_at).getTime():null; o.eventLine='Submitted '+wsTimeAgo(o.eventTs); }
  else if(docG.count>0){ o.color='blue'; o.bucket='action'; o.headline=docG.count+' document'+(docG.count>1?'s':'')+' received'; o.actionLabel='Review Documents'; o.priority=2; o.eventTs=docG.ts||null; o.eventLine=(o.unreviewedDocs.slice(0,4).join(' + ')||'Documents')+' uploaded '+wsTimeAgo(o.eventTs); }
  else if(rs==='in_review'){ o.color='green'; o.bucket='action'; o.headline='Ready to approve'; o.actionLabel='Review / Approve'; o.priority=3; o.eventTs=qd.updated_at?new Date(qd.updated_at).getTime():null; o.eventLine='In review · awaiting your approval'; }
  else if(rs==='changes_requested'){ o.color='yellow'; o.bucket='active'; o.headline='Waiting on patient'; o.actionLabel='Open Case'; }
  else if(rs==='approved'){ o.color='green'; o.bucket='active'; o.headline='Approved'; o.actionLabel='Open Case'; }
  else { o.color='yellow'; o.bucket='active'; o.headline='Awaiting questionnaire'; o.actionLabel='Open Case'; }
  if(urg.critical){ o.bucket='action'; o.priority=0;
    o.urgentSub=(rs==='pending'?'Patient not reviewed':rs==='in_review'?'Patient waiting for approval':rs==='changes_requested'?'Waiting on patient documents':rs==='approved'?'Approved · confirm readiness':'Questionnaire not completed'); }
  o.isNew=wsIsNew(o);
  return o;
}
function wsDeriveClinic(p){
  // Converted clinic patients are represented by their bridge case (care_requests);
  // skip the legacy derivation so they appear ONCE, not twice.
  if(p.auth_user_id) return null;
  if(!(p.questionnaire_status==='completed' && p.consultation_status!=='reviewed' && p.patient_status!=='completed')) return null;
  var urg=wsUrgency(p.surgery_date);
  var o={source:'clinic', origin:'clinic', clinicId:p.id, name:p.patient_name||'Patient', procedure:p.procedure||'Procedure',
    hospital:p.hospital||'', surgeryDate:p.surgery_date||null, urgency:urg, sourceTag:'Clinic invited', unreviewedDocs:[],
    color:'red', bucket:'action', headline:'New questionnaire submitted', actionLabel:'Review Now', priority:1,
    openFn:"wsOpenClinic('"+p.id+"')",
    eventTs:p.completed_at?new Date(p.completed_at).getTime():(p.updated_at?new Date(p.updated_at).getTime():null)};
  o.eventLine='Submitted '+wsTimeAgo(o.eventTs);
  if(urg.critical){ o.priority=0; o.urgentSub='Patient not reviewed'; }
  o.isNew=wsIsNew(o);
  return o;
}
function wsBadge(n){ var el=document.getElementById('ws-need-badge'); if(!el) return; el.textContent=n?('▢ '+n+' need you'):''; el.style.display=n?'inline-block':'none'; }
// Source is now a PRIMARY visual element: a coloured ribbon at the top of every card.
// Source is secondary now: a small chip inside the card, not a full ribbon.
function wsSrcChip(origin){
  var clinic=(origin==='clinic');
  return '<span class="ac-chip '+(clinic?'src-clinic':'src-patient')+'">'+
    (clinic?'&#128104;&#8205;&#9877;&#65039; Invited by me':'&#128233; Requested me')+'</span>';
}
function wsCaseLine(c){ return [c.procedure, c.hospital].filter(Boolean).map(wsEsc).join(' &middot; '); }
var _wsSrcFilter='all';
function wsSrcMatch(c){ return _wsSrcFilter==='all' || (_wsSrcFilter==='mine'&&c.origin==='clinic') || (_wsSrcFilter==='requests'&&c.origin==='patient'); }
// Whole-card click target: same routing as the CTA (wsOpenCase / wsOpenClinic).
function wsCardAttrs(c){
  var open=(c.source==='clinic') ? ('data-open="clinic" data-cid="'+c.clinicId+'"') : ('data-open="case" data-pid="'+c.patientId+'"');
  return 'tabindex="0" role="button" aria-label="Open '+wsEsc(c.name||'case')+'" '+open;
}
function wsCardDispatch(card){
  if(!card) return;
  var k=card.getAttribute('data-open');
  if(k==='case') wsOpenCase(card.getAttribute('data-pid'));
  else if(k==='clinic') wsOpenClinic(card.getAttribute('data-cid'));
}
// Bulletproof card activation: ONE document-level delegated listener, attached
// once at script load. document always exists and is never re-created, so this
// survives every innerHTML re-render and any async timing. Real controls
// (CTA / Accept / Decline) are excluded, so nothing double-fires. Routing
// unchanged: data-open=case -> wsOpenCase; data-open=clinic -> wsOpenClinic.
document.addEventListener('click', function(e){
  if(e.target.closest('button,a,input,select,textarea,label')) return;
  var c=e.target.closest('.ac-card.clickable, .acs-card.clickable');
  if(c) wsCardDispatch(c);
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
  var el=document.activeElement; if(!el || !el.closest) return;
  var c=el.closest('.ac-card.clickable, .acs-card.clickable');
  if(c){ e.preventDefault(); wsCardDispatch(c); }
});
function wsActionCardHtml(c){
  var urgent=c.urgency&&c.urgency.critical;
  var rail=urgent?'urg':c.color;
  var head=urgent?('&#9888; '+(c.urgency.label||'Surgery approaching').toUpperCase()):(wsColorIcon(c.color)+' '+c.headline.toUpperCase());
  var newBadge=c.isNew?'<span class="ac-new pulse">&#9679; NEW</span>':'';
  var surg=c.surgeryDate?('<div class="ac-surg'+(c.urgency.soon?' soon':'')+'">&#128197; '+wsEsc(c.urgency.label)+'</div>'):'<div class="ac-surg none">No surgery date set</div>';
  var subUrg=urgent&&c.urgentSub?'<div class="ac-sub urg">'+wsEsc(c.urgentSub)+'</div>':'';
  var when=c.eventLine?'<div class="ac-when">'+wsEsc(c.eventLine)+'</div>':'';
  return '<div class="ac-card clickable rail-'+rail+(c.isNew?' is-new':'')+'" '+wsCardAttrs(c)+'>'+
    '<div class="ac-row"><span class="ac-rail"></span>'+
      '<div class="ac-body">'+
        '<div class="ac-top"><span class="ac-headline">'+head+'</span>'+newBadge+'</div>'+
        '<div class="ac-name">'+wsEsc(c.name)+'</div>'+
        '<div class="ac-proc">'+wsCaseLine(c)+'</div>'+
        surg+subUrg+when+
        wsSrcChip(c.origin)+
      '</div>'+
      '<div class="ac-action"><button class="ws-btn pc-green" onclick="event.stopPropagation();'+c.openFn+'">'+wsEsc(c.actionLabel)+' &rarr;</button></div>'+
    '</div>'+
  '</div>';
}
// SECTION 2 (secondary): consultation requests render into their own block,
// NEVER inside the surgical Action Center. Not card-clickable; only the
// Accept/Decline buttons act. _wsRequests = care_requests status='requested'.
// 💬 Consultations = accepted advice-only patients (is_consultation=true).
// They never appear in the Action Center / Active Cases / pre-op pipeline.
function wsRenderConsultations(){
  var box=document.getElementById('ws-consultations'); if(!box) return;
  var hn=document.getElementById('ws-consult-n'); if(hn) hn.textContent=_wsConsults.length||'';
  if(!_wsConsults.length){ box.innerHTML='<div class="ws-consult-empty">No active consultations.</div>'; return; }
  // Each consultation is a row that opens the dedicated consultation workspace
  // (same #ws-ws overlay + same patient record/documents as the surgical side).
  box.innerHTML=_wsConsults.map(function(q){
    var snip=q.message?('&ldquo;'+wsEsc(q.message.length>72?q.message.slice(0,72)+'…':q.message)+'&rdquo;'):'Consultation / advice';
    var when=q.responded_at?new Date(q.responded_at).toLocaleDateString():(q.requested_at?new Date(q.requested_at).toLocaleDateString():'');
    var orig=q.origin==='doctor'?'<span class="ws-orig doc">Doctor-created</span>':'<span class="ws-orig pt">Patient-requested</span>';
    return '<div class="ws-consult-row" onclick="wsOpenConsult(\''+q.id+'\')">'+
      '<div class="ws-consult-info"><div class="ws-consult-name">'+orig+wsEsc(q.patient_name||'Patient')+'</div>'+
      '<div class="ws-consult-msg">'+snip+'</div>'+
      (when?'<div class="ws-consult-meta">Started '+when+'</div>':'')+'</div>'+
      '<div class="ws-consult-open">Open workspace &rarr;</div></div>';
  }).join('');
}

// ── Recommendations widget (shared: consultation AND surgical workspaces) ──
// One system, keyed to surgery_id on the patient record. Each item carries a
// visible_to_patient toggle: false = internal draft, true = published to portal.
async function wsFetchRecs(surgeryId){
  if(!surgeryId) return [];
  try{ var r=await window.sb.from('patient_recommendations').select('*').eq('surgery_id',surgeryId).order('created_at',{ascending:true}); return (r&&r.data)||[]; }catch(e){ return []; }
}
function wsRenderRecs(){
  var host=document.getElementById('ws-recs'); if(!host||!_wsCtx) return;
  var recs=_wsCtx.recs||[];
  var list=recs.length?recs.map(function(r){
    return '<div class="ws-rec" id="ws-rec-'+r.id+'">'+
      '<textarea class="ws-rec-body" id="ws-rec-body-'+r.id+'">'+wsEsc(r.body||'')+'</textarea>'+
      '<div class="ws-rec-foot">'+
        '<label class="ws-rec-vis"><input type="checkbox" '+(r.visible_to_patient?'checked':'')+' onchange="wsRecToggle(\''+r.id+'\',this.checked)"> Visible to patient</label>'+
        '<span class="ws-rec-st'+(r.visible_to_patient?' pub':'')+'">'+(r.visible_to_patient?'Published to patient':'Internal draft')+'</span>'+
        '<span class="ws-rec-acts"><button class="ws-btn" onclick="wsRecSave(\''+r.id+'\')">Save</button>'+
        '<button class="ws-btn" onclick="wsRecDelete(\''+r.id+'\')">Delete</button></span>'+
      '</div></div>';
  }).join(''):'<div class="ws-ap-facts">No recommendations yet.</div>';
  host.innerHTML=list+
    '<div class="ws-rec-add"><input id="ws-rec-new" placeholder="Add a recommendation (e.g. Stop GLP-1 7 days before surgery)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();wsRecAdd();}">'+

function wsRenderPlanSummary(){
  var host=document.getElementById('ws-plan-summary'); if(!host||!_wsCtx) return;
  var reqs=_wsCtx.savedReqs||{}, keys=Object.keys(reqs).filter(function(k){ return reqs[k].checked; });
  var notes=(_wsCtx.savedNotes||'').trim();
  if(!keys.length && !notes && !_wsCtx.planSavedAt){
    host.innerHTML='<div class="ws-ap-facts">Nothing saved yet. Select requirements and Save plan below.</div>'; return;
  }
  var sel=keys.map(function(k){ var r=reqs[k];
    return '<div class="ws-sum-row"><span class="ws-sum-ck">&#10003;</span><div><span class="ws-sum-lb">'+wsEsc(r.label||k)+'</span>'+
      (r.custom?' <span class="ws-sum-tag">custom</span>':'')+(r.note?'<div class="ws-sum-note">'+wsEsc(r.note)+'</div>':'')+'</div></div>'; }).join('');
  host.innerHTML=
    '<div class="ws-sum-meta">Last saved: <b>'+wsFmtTime(_wsCtx.planSavedAt)+'</b></div>'+
    (keys.length?('<div class="ws-sum-h">Requested ('+keys.length+')</div>'+sel):'<div class="ws-ap-facts">No requirements selected.</div>')+
    (notes?('<div class="ws-sum-h">Internal notes</div><div class="ws-sum-note">'+wsEsc(notes)+'</div>'):'');
}
// Core commit. histEntry optional structured event; otherwise logs the
// requirement/notes diff. Returns true on success. Updates version/timestamp/state.
async function wsSavePlan(silent, histEntry){
  if(!_wsCtx) return false;
  wsCaptureEdits();
  var d=wsReqDiff(); var notesChanged=((_wsCtx.notes||'')!==(_wsCtx.savedNotes||''));
  if(histEntry){
    wsLogEvent(histEntry);
  } else if(d.added.length||d.removed.length){
    wsLogEvent({ action:'save', detail:'Requirements updated', added:d.added, removed:d.removed });
  } else if(notesChanged){
    wsLogEvent({ action:'save', detail:'Doctor notes updated' });
  }
  wsSetSaveState('saving');
  try {
    var payload=wsPlanPayload();
    var r=await window.sb.rpc('save_doctor_plan',{ p_surgery_id:_wsCtx.surgeryId, p_plan:payload });
    if(r&&r.error) throw new Error(r.error.message);
    var meta=(r&&r.data)||{};
    _wsCtx.savedNotes=payload.notes; _wsCtx.savedReqs=wsCloneReqs(_wsCtx.requirements);
    _wsCtx.planSavedAt=meta.updated_at||new Date().toISOString();
    if(meta.version!=null) _wsCtx.version=meta.version;
    _wsCtx.modifiedBy=window.__wsUserName||'Clinician';
    wsRenderPlanSummary(); wsRenderHistory(); wsSetSaveState('saved');
    if(!silent) wsToast('Plan saved (v'+_wsCtx.version+')');
    return true;
  } catch(e){ wsSetSaveState('error'); wsToast('Save failed: '+(e.message||'error')); return false; }
}

async function wsOpenPatient(patientId){
  var info=_wsActiveMap[patientId]; if(!info) return;
  var surgeryId=info.surgeryId;
  try { await window.sb.rpc('start_review', { p_surgery_id: surgeryId }); } catch(e){}   // pending -> in_review
  var surgery={},quest={},items={},plan={},planSavedAt=null;
  try { var s=await window.sb.from('patient_surgeries').select('*').eq('id',surgeryId).maybeSingle(); surgery=s.data||{}; }catch(e){}
  try { var q=await window.sb.from('preop_questionnaires').select('*').eq('patient_id',patientId).maybeSingle(); quest=q.data||{}; }catch(e){}
  try { var c=await window.sb.from('preop_checklist').select('items').eq('patient_id',patientId).maybeSingle(); items=(c.data&&c.data.items&&c.data.items.prep_guide)||{}; }catch(e){}
  // Robust read: never maybeSingle() here -- after an approve+edit cycle there can
  // be both an approved and a draft row, and maybeSingle() throws on >1, which
  // previously swallowed the whole plan. Prefer the draft (editable working copy).
  var planVersion=0;
  try {
    var p=await window.sb.from('preparation_plans').select('plan_content,status,updated_at,version')
      .eq('surgery_id',surgeryId).in('status',['draft','approved'])
      .order('status',{ascending:false}).order('updated_at',{ascending:false}).limit(1);
    var row=(p&&p.data&&p.data[0])||null;
    plan=(row&&row.plan_content)||{}; planSavedAt=row?row.updated_at:null; planVersion=row?(row.version||0):0;
  }catch(e){}
  var docs=[];
  try { var dr=await window.sb.from('requirement_documents').select('*').eq('surgery_id',surgeryId).order('uploaded_at',{ascending:true}); docs=(dr&&dr.data)||[]; }catch(e){}
  var recs=await wsFetchRecs(surgeryId);          // same recommendations system as the consultation workspace
  var reqMap=wsNormReqs(plan.requirements);
  _wsCtx={ mode:'surgical', patientId:patientId, surgeryId:surgeryId, name:info.name, surgery:surgery, quest:quest, items:items,
    notes:plan.notes||'', requirements:reqMap, planSavedAt:planSavedAt, version:planVersion,
    history:(Array.isArray(plan.history)?plan.history:[]), modifiedBy:plan.modified_by||'', docs:docs, recs:recs,
    savedNotes:plan.notes||'', savedReqs:wsCloneReqs(reqMap) };
  wsRenderWorkspace();
  document.getElementById('ws-ws').classList.add('open');
}
function wsCloneReqs(m){ var o={}; Object.keys(m||{}).forEach(function(k){ o[k]={checked:!!m[k].checked,note:m[k].note||'',label:m[k].label||'',custom:!!m[k].custom}; }); return o; }
function wsCloseWorkspace(){ document.getElementById('ws-ws').classList.remove('open'); _wsCtx=null; }

function wsRenderWorkspace(){
  var c=_wsCtx; if(!c) return;
  var a=c.quest.answers||{}, s=c.surgery, flags=c.quest.risk_flags||[];
  var bmi=''; var h=parseFloat(a.height), w=parseFloat(a.weight); if(h>0&&w>0) bmi=' · BMI '+(w/Math.pow(h/100,2)).toFixed(1);
  document.getElementById('ws-ws-title').textContent = c.name || 'Patient';
  document.getElementById('ws-ws-sub').textContent = [s.procedure_type, s.surgery_date?new Date(s.surgery_date).toLocaleDateString():''].filter(Boolean).join(' · ');
  function kc(l,v){ return '<div class="ws-kc"><i>'+l+'</i><b>'+wsEsc(v||'—')+'</b></div>'; }
  // A Patient summary
  var meds=(a.medications&&a.medications.length)?a.medications.join(', '):'None reported';
  var allerg=a.allergy_present==='severe'?('Severe'+(a.allergy_detail?' ('+a.allergy_detail+')':'')):(a.allergy_present==='mild'?('Mild'+(a.allergy_detail?' ('+a.allergy_detail+')':'')):'None reported');
  var html='<div class="ws-ws-workflow"><span>Surgical patient</span><button class="ws-btn" onclick="wsSetCareState(\'consultation\')">Move to Consultations</button></div>'+
    '<div class="ws-sec-t">A &middot; Patient summary</div>'+
    '<div class="ws-kv">'+kc('Age',a.age)+kc('Sex',a.sex)+kc('Height',a.height?a.height+' cm':'')+kc('Weight',(a.weight?a.weight+' kg':'')+bmi)+
      kc('Procedure',s.procedure_type)+kc('Surgery date',s.surgery_date?new Date(s.surgery_date).toLocaleDateString():'')+kc('Hospital',s.hospital)+kc('Surgeon',s.surgeon)+'</div>'+
    (flags.length?'<div style="margin-top:10px;">'+flags.map(function(f){return '<span class="ws-flag'+(/severe|difficult|complication|heart|anticoag/i.test(f)?' hi':'')+'">&#9888; '+wsEsc(f)+'</span>';}).join('')+'</div>':'')+
    '<div class="ws-kv" style="margin-top:8px;">'+kc('Medications',meds)+kc('Allergies',allerg)+'</div>';
  // B Questionnaire (read-only)
  html+='<div class="ws-sec-t">B &middot; Questionnaire</div>';
  if(c.quest.status==='submitted' || Object.keys(a).length){
    html+=Object.keys(WS_QLBL).filter(function(k){return a[k]!=null && a[k]!=='';}).map(function(k){
      var v=a[k]; if(Array.isArray(v)) v=v.join(', ');
      return '<div class="ws-qrow"><span>'+WS_QLBL[k]+'</span><b>'+wsEsc(String(v))+'</b></div>';
    }).join('') || '<div class="ws-ap-facts">No answers recorded.</div>';
  } else { html+='<div class="ws-ap-facts">Questionnaire not completed yet.</div>'; }
  // C Preparation review
  var pc=(c.items&&c.items.prepare)||[], nDone=wsPrepCount(c.items);
  html+='<div class="ws-sec-t">C &middot; Preparation review</div>'+
    '<div class="ws-ap-facts" style="margin-bottom:6px;">Preparation checklist: <b style="color:#fff;">'+nDone+' / 6 complete</b> &middot; review status: <b style="color:#7ECFC0;">'+wsReviewLabel(c.quest.review_state).txt+'</b></div>'+
    WS_PREPARE.map(function(lbl,i){ var done=!!pc[i]; return '<div class="ws-chk '+(done?'done':'miss')+'">'+(done?'':'Missing: ')+wsEsc(lbl)+'</div>'; }).join('');
  var rs=c.quest.review_state||'not_submitted';
  var locked=(rs==='approved');   // approved cases are read-only until reopened
  // D Clinical requirements (doctor plan) - shared with the patient
  html+='<div class="ws-sec-t">D &middot; Clinical requirements <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--hint);">(shared with patient)</span></div>'+
    '<div class="ws-plan-sum"><div class="ws-sum-title">&#128203; Current doctor plan</div><div id="ws-plan-summary"></div></div>';
  if(locked){
    html+='<div class="ws-ap-facts">&#128274; This plan is approved and read-only. Use <b>Reopen review</b> below to edit it.</div>';
  } else {
    html+='<div class="ws-reqs" id="ws-reqs-list">'+wsRequirementsHtml()+'</div>'+
      '<div class="ws-acts"><button class="ws-btn pc-green" onclick="wsSavePlan(false)">Save plan</button><span class="ws-save-st" id="ws-save-plan-st"></span></div>';
  }
  // D2 Patient-submitted documents
  html+='<div class="ws-sum-title" style="margin:14px 0 4px;">&#128206; Submitted documents</div><div id="ws-docs"></div>';
  // D3 Recommendations (same shared system as the consultation workspace)
  html+='<div class="ws-sec-t">E &middot; Recommendations <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--hint);">(toggle to publish to the patient)</span></div><div id="ws-recs"></div>';
  // E Doctor notes (internal - never shown to the patient)
  html+='<div class="ws-sec-t">F &middot; Doctor notes <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--hint);">(internal)</span></div>'+
    '<textarea class="ws-notes" id="ws-notes" '+(locked?'readonly ':'')+'placeholder="Private notes for this patient (not shown to the patient)">'+wsEsc(c.notes||'')+'</textarea>'+
    (locked?'':'<div class="ws-acts"><button class="ws-btn" onclick="wsSaveDocNotes()">Save notes</button><span class="ws-save-st" id="ws-save-notes-st"></span></div>');
  // F Review actions
  html+='<div class="ws-sec-t">G &middot; Review actions</div><div id="ws-review-actions">'+wsReviewActionsHtml(rs,c)+'</div>';
  // G Modification history / audit trail
  html+='<div class="ws-sec-t">H &middot; Modification history</div><div id="ws-history"></div>';
  document.getElementById('ws-ws-body').innerHTML=html;
  wsRenderPlanSummary(); wsRenderHistory(); wsSetSaveState(); wsRenderDocs(); wsRenderRecs();
}
// ── Patient-submitted documents (view / download / mark reviewed) ──
function wsRenderDocs(){
  var host=document.getElementById('ws-docs'); if(!host||!_wsCtx) return;
  var docs=_wsCtx.docs||[];
  if(!docs.length){ host.innerHTML='<div class="ws-ap-facts">No documents uploaded by the patient yet.</div>'; return; }
  var unrev=docs.filter(function(d){ return !d.reviewed_at; }).length;
  var groups={}; docs.forEach(function(d){ (groups[d.requirement_key]=groups[d.requirement_key]||{name:d.requirement_name||d.requirement_key,items:[]}).items.push(d); });
  host.innerHTML='<div class="ws-docs-status">'+(unrev?('<span style="color:#E8C16b;">&#9888; '+unrev+' awaiting your review</span>'):'<span style="color:#5ee393;">&#10003; All documents reviewed</span>')+'</div>'+
    Object.keys(groups).map(function(k){ var g=groups[k];
      return '<div class="ws-doc-grp"><div class="ws-doc-grp-h">'+wsEsc(g.name)+'</div>'+
        g.items.map(function(d){
          var up=d.uploaded_at?new Date(d.uploaded_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
          var rv=d.reviewed_at?new Date(d.reviewed_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
          return '<div class="ws-doc"><div class="ws-doc-tx"><div class="ws-doc-nm">'+wsEsc(d.file_name)+'</div>'+
            '<div class="ws-doc-mt">Uploaded '+up+(rv?(' &middot; <span style="color:#5ee393;">Reviewed '+rv+'</span>'):'')+'</div></div>'+
            '<div class="ws-doc-acts"><button type="button" class="ws-doc-btn" onclick="wsDocOpen(\''+d.id+'\',0)">View</button>'+
            '<button type="button" class="ws-doc-btn" onclick="wsDocOpen(\''+d.id+'\',1)">Download</button>'+
            (d.reviewed_at?'<span class="ws-doc-ok">&#10003; Reviewed</span>':'<button type="button" class="ws-doc-rev" onclick="wsDocReview(\''+d.id+'\')">Mark reviewed</button>')+
            '</div></div>';
        }).join('')+'</div>';
    }).join('');
}
async function wsDocOpen(id, dl){
  var d=(_wsCtx.docs||[]).filter(function(x){ return x.id===id; })[0]; if(!d) return;
  try {
    var opt=dl?{download:d.file_name}:undefined;
    var r=await window.sb.storage.from('patient-documents').createSignedUrl(d.storage_path, 3600, opt);
    if(r&&r.data&&r.data.signedUrl){ window.open(r.data.signedUrl,'_blank'); } else throw new Error('no url');
  } catch(e){ wsToast('Could not open file'); }
}
async function wsDocReview(id){
  var res;
  try { res=await window.sb.rpc('mark_document_reviewed',{p_doc_id:id}); if(res&&res.error) throw new Error(res.error.message); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); return; }
  var d=(_wsCtx.docs||[]).filter(function(x){ return x.id===id; })[0];
  if(d){ d.reviewed_at=(res&&res.data&&res.data.reviewed_at)||new Date().toISOString(); d.reviewed_by=window.__wsUserId; }
  wsToast('Document marked reviewed'); wsRenderDocs();
}
window.wsDocOpen=wsDocOpen; window.wsDocReview=wsDocReview;

    return '<div class="ws-ap-facts" style="color:#5ee393;margin-bottom:10px;">&#9989; Plan approved'+(c.quest.reviewed_at?(' on '+new Date(c.quest.reviewed_at).toLocaleDateString()):'')+' and sent to the patient.</div>'+
      '<div class="ws-ap-facts" style="margin-bottom:8px;">Reopen if new tests arrive, the patient&rsquo;s condition changes, or the surgery date changes.</div>'+
      '<div class="ws-acts"><button class="ws-act-changes" onclick="wsReopenReview()">&#128260; Reopen review</button></div>';
  return (c.quest.reviewer_notes&&rs==='changes_requested'?'<div class="ws-ap-facts" style="margin-bottom:8px;">Last note to patient: <i>'+wsEsc(c.quest.reviewer_notes)+'</i></div>':'')+
    '<div class="ws-ap-facts" style="margin-bottom:8px;">Save the plan, then choose an action. Approval sends the plan to the patient and requires confirmation.</div>'+

async function wsRequestChanges(){
  if(!_wsCtx) return;
  var notes=window.prompt('Message to the patient (what they need to do):', _wsCtx.quest.reviewer_notes||'');
  if(notes===null) return;
  wsCaptureEdits();
  var requested=Object.keys(_wsCtx.requirements||{}).filter(function(k){ return _wsCtx.requirements[k].checked; })
    .map(function(k){ return _wsCtx.requirements[k].label||k; });
  // One structured history event: who, message, the requested investigations.
  if(!(await wsSavePlan(true,{ action:'request_changes', message:notes||'', requested:requested }))) return;
  try { var r=await window.sb.rpc('request_changes',{p_surgery_id:_wsCtx.surgeryId, p_notes:notes}); if(r&&r.error) throw new Error(r.error.message); wsToast('Requirements sent to patient'); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); return; }
  wsCloseWorkspace(); wsLoadCases();
}
// Approval is two-step: a confirmation MODAL (patient, procedure, surgery date,
// current status + explicit message), then confirm -> approve_plan().

  if(!_wsCtx) return;

  var sdate=s.surgery_date?new Date(s.surgery_date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'Not set';

      '<div><i>Patient</i><b>'+wsEsc(c.name||'-')+'</b></div>'+
      '<div><i>Procedure</i><b>'+wsEsc(proc)+'</b></div>'+
      '<div><i>Surgery date</i><b>'+wsEsc(sdate)+'</b></div>'+
      '<div><i>Current review state</i><b>'+wsEsc(status)+'</b></div></div>'+

    (unrev? '<div class="ws-cfm-warn">&#9888; '+unrev+' submitted document'+(unrev>1?'s':'')+' still '+(unrev>1?'need':'needs')+' review. Review all submitted documents before approving.</div>':'')+
    '<div class="ws-acts" style="justify-content:flex-end;"><button class="ws-btn" onclick="wsCfmClose()">Cancel</button>'+

function wsCfmClose(){ var m=document.getElementById('ws-cfm'); if(m) m.classList.remove('open'); }
async function wsApproveConfirm(btn){
  if(!_wsCtx) return; if(btn){ btn.disabled=true; btn.textContent='Approving...'; }
  if(!(await wsSavePlan(true,{action:'approve',detail:'Plan approved and sent to patient'}))){ if(btn){btn.disabled=false;btn.textContent='Confirm approval';} return; }
  try { var r=await window.sb.rpc('approve_plan',{p_surgery_id:_wsCtx.surgeryId}); if(r&&r.error) throw new Error(r.error.message); wsToast('Plan approved'); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); if(btn){btn.disabled=false;btn.textContent='Confirm approval';} return; }
  wsCfmClose(); wsCloseWorkspace(); wsLoadCases();
}
async function wsReopenReview(){
  if(!_wsCtx) return;
  if(!window.confirm('Reopen this approved case? It returns to "under review" and the plan becomes editable again. The patient will no longer see it as approved until you approve it again.')) return;
  try { var r=await window.sb.rpc('reopen_review',{p_surgery_id:_wsCtx.surgeryId}); if(r&&r.error) throw new Error(r.error.message); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); return; }
  await wsSavePlan(true,{action:'reopen',detail:'Review reopened for editing'});  // logs + persists history onto the now-draft plan
  wsToast('Review reopened');
  await wsOpenPatient(_wsCtx.patientId);   // reload fresh in-review (editable) state
}
