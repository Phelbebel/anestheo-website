      ['LAST','/last.html','&#9888;'],['Anaphylaxis','/anaphylaxis.html','&#128137;']
    ];
    var secRefs =
      '<div class="ws-sec" id="sec-refs">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Clinical references</div>' +
          '<div class="ws-sec-sub">Evidence-based bedside references</div></div></div>' +
        '<div class="ws-grid">' +
          refItems.map(function(r){ return '<a class="ws-tile" href="'+r[1]+'"><span class="ws-tile-ico">'+r[2]+'</span><span class="ws-tile-t">'+r[0]+'</span></a>'; }).join('') +
        '</div>' +
      '</div>';

    // SECTION 4 — Resources
    var resItems = [['Books','&#128218;'],['PDFs','&#128196;'],['Guides','&#128214;'],['Checklists','&#9989;'],['Downloads','&#11015;']];
    var secResources =
      '<div class="ws-sec" id="sec-resources">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Resources</div>' +
          '<div class="ws-sec-sub">Reference library and downloads</div></div></div>' +
        '<div class="ws-grid">' +
          resItems.map(function(r){ return '<button class="ws-tile" onclick="wsToast(\''+r[0]+' — coming soon\')"><span class="ws-tile-ico">'+r[1]+'</span><span class="ws-tile-t">'+r[0]+'</span></button>'; }).join('') +
          '<a class="ws-tile" href="/videos.html"><span class="ws-tile-ico">&#127909;</span><span class="ws-tile-t">Videos</span></a>' +
        '</div>' +
      '</div>';

    // SECTION 5 — Ask Anesthesiologist management (doctor inbox)
    var secAsk =
      '<div class="ws-sec" id="sec-ask">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Questions management</div>' +
          '<div class="ws-sec-sub">Patient questions awaiting your response</div></div></div>' +
        '<div class="ws-subtabs">' +
          '<button class="ws-subtab active" onclick="wsAskFilter(\'pending\',this)">Pending</button>' +
          '<button class="ws-subtab" onclick="wsAskFilter(\'answered\',this)">Answered</button>' +
          '<button class="ws-subtab" onclick="wsAskFilter(\'all\',this)">All</button>' +
        '</div>' +
        '<div id="ws-ask-list" class="ws-list"><div class="ws-empty">Loading questions…</div></div>' +
      '</div>';

    // SECTION 6 — Admin (admin only)
    var secAdmin = '';
    if(isAdminRole){
      secAdmin =
      '<div class="ws-sec" id="sec-admin">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Admin center</div>' +
          '<div class="ws-sec-sub">Approvals, users, and platform</div></div>' +
          '<a class="ws-open" href="/admin.html">Full admin page &#8599;</a></div>' +
        '<div class="ws-stats" id="ws-admin-stats"></div>' +
        '<div class="ws-sec-title" style="font-size:14px;margin:18px 0 10px;">Doctor approvals</div>' +
        '<div id="ws-approvals" class="ws-list"><div class="ws-empty">Loading…</div></div>' +
        '<div class="ws-sec-title" style="font-size:14px;margin:22px 0 10px;">Users</div>' +
        '<div id="ws-users" class="ws-list"><div class="ws-empty">Loading…</div></div>' +
      '</div>';
    }

    var mainHTML =
      '<div class="ws-top">' +
        '<div><div class="ws-greet">' + greeting + '</div>' +
          '<div class="ws-role">' + roleLabel + ' &middot; <span class="ws-online">&#9679; session active</span></div></div>' +
      '</div>' +
      banner +
      '<div class="ws-shell">' +
        '<nav class="ws-rail">' + rail + '</nav>' +
        '<div class="ws-body">' + secOpList + secPatients + secTools + secRefs + secResources + secAsk + secAdmin + '</div>' +
      '</div>';

    document.getElementById('app').innerHTML = mainHTML;

    // Wire up modules
    window.__wsRole = role;
    window.__wsUserId = user.id;
    window.__wsUserName = ((role === 'doctor' || role === 'admin') ? 'Dr. ' : '') + (profile.full_name || name);
    wsInjectModals();
    wsMpRestoreState();
    wsLoadPatients();
    wsLoadCases();
    wsLoadAsk();
    // The bin badge has to be right before the tab is opened, or a count of 0
    // over a bin that is not empty is worse than no badge at all.
    wsLoadRecycleBin();
    if(isAdminRole){ wsLoadAdmin(); }

    _dashDone = true; clearTimeout(_dashWatchdog);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('app').style.display    = 'block';

    var dest = (role === 'admin') ? 'Admin Workspace' : (role === 'doctor' ? 'Doctor Workspace' : 'Workspace');

  } catch(err){
    console.error('DASHBOARD ERROR:', err.message);
    dashFail(err.message);
  }
});
</script>

<!-- Doctor Active Patient Workspace (in-page overlay; no navigation) -->
<div class="ws-ws-bg" id="ws-ws" onmousedown="window._wsBgDown=(event.target===this)" onclick="if(event.target===this&&window._wsBgDown)wsCloseWorkspace()">
  <div class="ws-ws-modal">
    <div class="ws-ws-head">
      <div><div class="ws-ws-title" id="ws-ws-title">Patient workspace</div>
        <div class="ws-ws-sub" id="ws-ws-sub"></div></div>
      <button class="ws-btn" onclick="wsCloseWorkspace()">&times; Close</button>
    </div>
    <div class="ws-ws-body" id="ws-ws-body"></div>
  </div>
</div>

<!-- New Patient modal (surgical; no workflow selector) -->
<div class="ws-modal-bg" id="ws-add-modal" onmousedown="window._waBgDown=(event.target===this)" onclick="if(event.target===this&&window._waBgDown)wsCloseAddModal()">
  <div class="ws-modal">
    <div class="ws-modal-head"><div class="ws-modal-title">&#10133; New Patient</div>
      <button class="ws-btn" onclick="wsCloseAddModal()">&times;</button></div>
    <div class="ws-modal-body">
      <label>Patient name</label><input id="wa-name" type="text" placeholder="Full name">
      <label>Phone number</label><input id="wa-phone" type="tel" placeholder="e.g. +972 50 123 4567">
      <label>Email</label><input id="wa-email" type="email" placeholder="patient@email.com">
      <div class="wa-hint">Email enables the full patient portal (documents + plan). Optional.</div>
      <label>Procedure</label><input id="wa-proc" type="text" placeholder="e.g. Knee arthroscopy">
      <label>Hospital</label><input id="wa-hospital" type="text" placeholder="Hospital / clinic">
      <label>Surgery date</label><input id="wa-date" type="date">
      <label>Notes</label><textarea id="wa-notes" placeholder="Optional"></textarea>
    </div>
    <div class="ws-modal-foot">
      <button class="ws-btn" onclick="wsCloseAddModal()">Cancel</button>
      <button class="ws-btn" id="wa-save" onclick="wsSavePatient(false)">Save</button>
      <button class="ws-btn ws-btn-wa" id="wa-send" onclick="wsSavePatient(true)">&#128241; Save &amp; Send WhatsApp</button>
    </div>
  </div>
</div>

<!-- Approval confirmation modal (above the workspace) -->
<div class="ws-cfm-bg" id="ws-cfm" onclick="if(event.target===this)wsCfmClose()">
  <div class="ws-cfm-box" id="ws-cfm-box"></div>
</div>
</body>
</html>
