async function wsRespondRequest(id, decision, asConsult){
  var reason = null;
  if(decision === 'decline'){ reason = window.prompt('Optional reason for declining (the patient sees this):') || null; }
  try {
    var r = await window.sb.rpc('respond_care_request', { p_request_id: id, p_decision: decision, p_reason: reason });
    if(r && r.error) throw new Error(r.error.message);
    if(decision === 'accept' && asConsult){
      // Set the canonical lane on the record (single source of truth). Keep the
      // legacy is_consultation flag in sync for backward compatibility.
      var cr=(_wsRequests||[]).filter(function(x){return x.id===id;})[0];
      var u = await window.sb.from('care_requests').update({ is_consultation:true }).eq('id', id);
      if(u && u.error) throw new Error(u.error.message);
      if(cr && cr.surgery_id){ try{ await window.sb.from('patient_surgeries').update({ care_state:'consultation' }).eq('id', cr.surgery_id); }catch(e){} }
    }
    wsToast(decision !== 'accept' ? 'Request declined' : (asConsult ? 'Accepted as consultation' : 'Accepted as surgical patient'));
  } catch(e){ wsToast('Failed: ' + (e.message||'error')); }
  wsLoadCases();
  wsLoadPatients();
}
// 💬 Lane switch = ONE write to the canonical record. Origin-independent;
// documents, recommendations and notes (all keyed by surgery_id) stay attached.
async function wsSetCareState(state){
  var c=_wsCtx; if(!c||!c.surgeryId) return;
  var msg=(state==='consultation')
    ? 'Move this patient to Consultations (advice-only, out of the surgical pipeline)? Documents, notes and recommendations stay on the same record.'
    : 'Convert this consultation into a surgical patient? They enter your pre-operative workflow. Documents, notes and recommendations stay on the same record.';
  if(!window.confirm(msg)) return;
  try { var u=await window.sb.from('patient_surgeries').update({ care_state:state }).eq('id', c.surgeryId); if(u&&u.error) throw new Error(u.error.message);
    wsToast(state==='consultation'?'Moved to Consultations':'Converted to surgical patient'); }
  catch(e){ wsToast('Failed: '+(e.message||'error')); return; }
  wsCloseWorkspace(); wsLoadCases();
}
async function wsCloseConsult(){
  var c=_wsCtx; if(!c) return;
  if(!window.confirm('Close this consultation? It will be removed from your active list.')) return;
  try {
    if(c.origin==='patient' && c.careId){ var u=await window.sb.from('care_requests').update({ status:'closed', responded_at:new Date().toISOString() }).eq('id', c.careId); if(u&&u.error) throw new Error(u.error.message); }
    else if(c.origin==='doctor' && c.clinicId){ var u2=await window.sb.from('clinic_patients').update({ patient_status:'completed' }).eq('id', c.clinicId); if(u2&&u2.error) throw new Error(u2.error.message); }
    wsToast('Consultation closed'); }
  catch(e){ wsToast('Close failed: '+(e.message||'error')); return; }
  wsCloseWorkspace(); wsLoadCases();
}
window.wsSetCareState=wsSetCareState; window.wsCloseConsult=wsCloseConsult;

async function wsLoadPatients(){
  _wsDoctorId = window.__wsUserId || null;
  try {
    var r = await window.sb.from('clinic_patients').select('*').order('created_at',{ascending:false});
    if(r.error) throw new Error(r.error.message);
    _wsPatients = r.data || [];
    var awaitingQ = _wsPatients.filter(function(p){ return p.questionnaire_status !== 'completed'; }).length;
    var completedQ = _wsPatients.filter(function(p){ return p.questionnaire_status === 'completed'; }).length;
    var ready = _wsPatients.filter(function(p){ return p.patient_status === 'ready_for_surgery'; }).length;
    document.getElementById('ws-pt-stats').innerHTML =
      '<div class="ws-stat"><div class="ws-stat-n">'+_wsPatients.length+'</div><div class="ws-stat-l">Patients</div></div>' +
      '<div class="ws-stat"><div class="ws-stat-n">'+awaitingQ+'</div><div class="ws-stat-l">Awaiting questionnaire</div></div>' +
      '<div class="ws-stat"><div class="ws-stat-n">'+completedQ+'</div><div class="ws-stat-l">Questionnaire done</div></div>' +
      '<div class="ws-stat"><div class="ws-stat-n">'+ready+'</div><div class="ws-stat-l">Ready for surgery</div></div>';
    wsRenderPatients();
  } catch(e){
    _wsPatients = [];
    document.getElementById('ws-pt-stats').innerHTML =
      '<div class="ws-stat"><div class="ws-stat-n">0</div><div class="ws-stat-l">Patients</div></div>';
    document.getElementById('ws-pt-list').innerHTML = '<div class="ws-empty">No patients added yet.</div>';
  }
}
function wsPtFilter(f, el){
  _wsPtFilter = f;
  document.querySelectorAll('#sec-patients .ws-subtab').forEach(function(b){ b.classList.remove('active'); });
  if(el) el.classList.add('active');
  wsRenderPatients();
}
function wsProgressPct(p){
  if(p.questionnaire_status === 'completed'){
    var a = p.questionnaire_answers || {};
    var fields = ['conditions','medications','allergies','previous_anesthesia','osa','smoking','pregnancy','comments'];
    var filled = fields.filter(function(f){ return a[f] && String(a[f]).trim(); }).length;
    return Math.max(1, Math.round((filled/fields.length)*100));
  }
  return {not_sent:0, sent:20, opened:45, in_progress:70}[p.questionnaire_status] || 0;
}
function wsStages(p){
  // [label, reached?]
  var qs = p.questionnaire_status, cs = p.consultation_status, ps = p.patient_status;
  return [
    ['Not sent', true],
    ['Sent', ['sent','opened','in_progress','completed'].indexOf(qs) >= 0],
    ['Opened', ['opened','in_progress','completed'].indexOf(qs) >= 0],
    ['Completed', qs === 'completed'],
    ['Reviewed', cs === 'reviewed'],
    ['Ready', ps === 'ready_for_surgery'],
    ['Arrived', cs === 'arrived' || cs === 'reviewed' || !!p.arrived_at]
  ];
}
function wsRenderPatients(){
  var list = _wsPatients.filter(function(p){
    if(_wsPtFilter==='questionnaire') return p.questionnaire_status !== 'completed';
    if(_wsPtFilter==='consult') return p.questionnaire_status === 'completed' && p.patient_status !== 'ready_for_surgery';
    if(_wsPtFilter==='ready') return p.patient_status === 'ready_for_surgery';
    return true;
  });
  var box = document.getElementById('ws-pt-list');
  if(!list.length){ box.innerHTML = '<div class="ws-empty">No patients added yet.</div>'; return; }

  box.innerHTML = list.map(function(p){
    var dateFmt = p.surgery_date ? new Date(p.surgery_date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}) : 'Date not set';
    var pct = wsProgressPct(p);

    // Detail line (name + facts)
    var facts = [];
    if(p.phone_number) facts.push('&#128222; ' + wsEsc(p.phone_number));
    if(p.procedure) facts.push('&#129658; ' + wsEsc(p.procedure));
    if(p.hospital) facts.push('&#127973; ' + wsEsc(p.hospital));
    facts.push('&#128197; ' + dateFmt);

    // Progress stepper
    var stages = wsStages(p);
    var stepper = '<div class="pc-track">' + stages.map(function(s, i){
      return '<div class="pc-step'+(s[1]?' on':'')+'">' +
        '<span class="pc-dot">'+(s[1]?'&#10003;':(i+1))+'</span>' +
        '<span class="pc-lbl">'+s[0]+'</span></div>';
    }).join('<span class="pc-line"></span>') + '</div>';

    // Status chips
    var chips =
      '<div class="pc-chips">' +
        '<div class="pc-chip"><span class="pc-chip-l">Questionnaire</span><span class="pc-chip-v">'+wsQStatusLabel(p.questionnaire_status)+' &middot; '+pct+'%</span></div>' +
        '<div class="pc-chip"><span class="pc-chip-l">Consultation</span><span class="pc-chip-v">'+(p.consultation_status==='reviewed'?'Reviewed':(p.patient_status==='ready_for_surgery'?'Ready for surgery':'Pending'))+'</span></div>' +
        '<div class="pc-chip"><span class="pc-chip-l">Arrival</span><span class="pc-chip-v">'+(p.consultation_status==='arrived'||p.consultation_status==='reviewed'||p.arrived_at?'Arrived':'Not arrived')+'</span></div>' +
      '</div>';

    // Progress bar
    var bar = '<div class="pc-bar"><div class="pc-bar-fill" style="width:'+pct+'%"></div></div>';

    // Activity line (incl. submission date)
    var activity = [];
    if(p.completed_at) activity.push('Submitted ' + new Date(p.completed_at).toLocaleDateString());
    if(p.updated_at) activity.push('Last activity ' + new Date(p.updated_at).toLocaleDateString());
    var activityLine = activity.length ? '<div class="pc-activity">'+activity.join(' &middot; ')+'</div>' : '';

    // Clinical summary row (when completed): BMI · STOP-BANG · Pregnancy
    var ans = p.questionnaire_answers || {};
    var sc = ans._scores || {};
    var pregTxt = (ans.pregnant==='Yes') ? 'Pregnant'+(ans.gestation?' '+ans.gestation+'w':'') : (ans.pregnant==='Not sure'?'Possibly pregnant':(ans.sex==='Female'?'Not pregnant':'—'));
    var clinRow = (p.questionnaire_status === 'completed')
      ? '<div class="pc-clin">' +
          '<div class="pc-clin-i"><span>BMI</span><b>'+(sc.bmi!=null?sc.bmi:'—')+'</b></div>' +
          '<div class="pc-clin-i"><span>STOP-BANG</span><b>'+(sc.stopbang!=null?(sc.stopbang+'/8 '+(sc.stopbang_risk||'')):'—')+'</b></div>' +
          '<div class="pc-clin-i"><span>Pregnancy</span><b>'+wsEsc(pregTxt)+'</b></div>' +
          '<div class="pc-clin-i"><span>ASA</span><b>'+(sc.asa_suggestion?('~'+sc.asa_suggestion):'—')+'</b></div>' +
        '</div>'
      : '';

    // Workflow buttons (professional, no URLs)
    var send = '<button class="ws-btn ws-btn-wa" onclick="event.stopPropagation();wsSendWhatsApp(\''+p.id+'\')">'+(p.questionnaire_status==='not_sent'?'Send questionnaire':'Resend questionnaire')+'</button>';
    var preview = '<button class="ws-btn" onclick="event.stopPropagation();wsPreview()">Preview questionnaire</button>';
    var actionsCompleted = (p.questionnaire_status==='completed')
      ? '<button class="ws-btn" onclick="event.stopPropagation();wsDetail(\''+p.id+'\')">View summary</button>' +
        '<button class="ws-btn" onclick="event.stopPropagation();wsDetail(\''+p.id+'\')">View full questionnaire</button>' +
        '<button class="ws-btn" onclick="event.stopPropagation();wsPrint(\''+p.id+'\')">Print PDF</button>'
      : '';

    var workflow = '';
    if(p.consultation_status === 'not_arrived'){
      workflow += '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsAdvance(\''+p.id+'\',\'arrived\')">Patient arrived</button>';
    } else if(p.consultation_status === 'arrived'){
      workflow += '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsAdvance(\''+p.id+'\',\'reviewed\')">Mark reviewed</button>';
    } else if(p.consultation_status === 'reviewed' && p.patient_status !== 'ready_for_surgery'){
      workflow += '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsReady(\''+p.id+'\')">Ready for surgery</button>';
    }

    // Risk flags (from questionnaire scoring) — shown at a glance when completed
    var flags = (p.questionnaire_answers && p.questionnaire_answers._flags) || [];
    var flagRow = (p.questionnaire_status === 'completed' && flags.length)
      ? '<div class="pc-flags">' + flags.map(function(f){ return '<span class="pc-flag">&#9888; '+wsEsc(f)+'</span>'; }).join('') + '</div>'
      : '';

    // Account-linked convergence: fallback "Activate Patient Portal" (only when
    // completed + email present + not yet converted). Otherwise show why it's off.
    var portalRow = '';
    if(p.questionnaire_status==='completed'){
      if(p.auth_user_id) portalRow = '<span class="pc-portal ok">&#10003; Portal active &middot; bridge patient</span>';
      else if(p.email) portalRow = '<button class="ws-btn pc-green" onclick="event.stopPropagation();wsActivatePortal(\''+p.id+'\')">&#128274; Activate Patient Portal</button>';
      else portalRow = '<span class="pc-portal need">&#9888; Email required to enable full patient portal</span>';
    }
    var actionsRow = (p.questionnaire_status==='completed')
      ? portalRow + actionsCompleted + workflow + preview
      : send + preview + workflow;

    return '<div class="pc-card" onclick="wsDetail(\''+p.id+'\')">' +
      '<div class="pc-head">' +
        '<div><div class="pc-name">'+wsEsc(p.patient_name)+'</div>' +
          '<div class="pc-facts">'+facts.join('<span class="pc-sep">&middot;</span>')+'</div></div>' +
        '<div class="pc-status">'+wsDeriveStatus(p)+'</div>' +
      '</div>' +
      stepper + bar + chips + clinRow + flagRow + activityLine +
      '<div class="pc-actions">'+actionsRow+'</div>' +
    '</div>';
  }).join('');
}

function wsCollectAdd(){

  if(!name){ wsToast('Patient name is required'); return null; }
  return {
    doctor_id: window.__wsUserId,
    patient_name: name,

  };
}
function wsClearForm(){
  ['name','phone','email','proc','hospital','date','notes'].forEach(function(f){ var el=document.getElementById('wa-'+f); if(el) el.value=''; });
}
async function wsSavePatient(thenSend){
  var rec = wsCollectAdd(); if(!rec) return;
  var btn = document.getElementById(thenSend ? 'wa-send' : 'wa-save');
  btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Saving…';
  rec.token = wsToken();
  rec.questionnaire_status = 'not_sent';
  rec.consultation_status = 'not_arrived';
  rec.patient_status = 'awaiting_questionnaire';
  // NOTE: clinic_patients has no 'origin' column (origin lives on the bridge
  // table patient_surgeries). Every clinic_patients row is clinic-created by
  // definition, so no origin field is needed here.

  try {
    var r = await window.sb.from('clinic_patients').insert(rec).select().maybeSingle();
    console.log('CLINIC INSERT RESULT — data:', r.data, '| error:', r.error);
    if(r.error){
      console.error('CLINIC INSERT ERROR OBJECT:', r.error);
      console.error('  message:', r.error.message);
      console.error('  details:', r.error.details);
      console.error('  hint:', r.error.hint);
      console.error('  code:', r.error.code);
      // TEMP: surface the real error to the screen (revert to generic before launch)
      wsToast('Insert error: ' + r.error.message + (r.error.details ? ' — ' + r.error.details : ''));
      btn.disabled = false; btn.textContent = orig;
      return;
    }
    // Create the canonical record (patient_surgeries) for this doctor-created
    // patient — auth-optional, back-linked by clinic_patient_id, with the chosen
    // lane. Documents / notes / recommendations attach here from day one.
    if(r.data){
      var laneEl=document.getElementById('wa-lane');
      var lane=(laneEl&&laneEl.value==='consultation')?'consultation':'surgical';
      try{ await window.sb.from('patient_surgeries').insert({
        patient_id:null, assigned_doctor_id:(window.__wsUserId||null), clinic_patient_id:r.data.id,
        patient_name:rec.patient_name, procedure_type:rec.procedure||null, surgery_date:rec.surgery_date||null,
        hospital:rec.hospital||null, contact_email:rec.email||null, care_state:lane }); }catch(e){ console.warn('record create:', e&&e.message); }
    }
    wsClearForm();
    await wsLoadPatients(); await wsLoadCases();
    if(thenSend && r.data){ wsSend(r.data.id); }
    else { wsToast('Patient saved'); }
  } catch(e){
    console.error('CLINIC INSERT EXCEPTION:', e);
    wsToast('Insert exception: ' + (e && e.message ? e.message : e));
  }
  btn.disabled = false; btn.textContent = orig;
}

// ── DELIVERY ─────────────────────────────────────────────────
// "sent" is recorded ONLY after a real delivery action launches
// (WhatsApp or the device SMS app). Creating a patient never sets "sent".
function wsLink(p){ return p && p.token ? (location.origin + '/v2/q.html?t=' + p.token) : ''; }
function wsMessage(p){
  var first = p.patient_name ? p.patient_name.split(' ')[0] : '';
  return 'Hello ' + first + ',\n\n' +
         'Please complete your pre-operative anesthesia questionnaire before your surgery.\n\n' +
         wsLink(p) + '\n\nThank you.';
}
async function wsMarkSent(id){
  try {
    await window.sb.from('clinic_patients').update({ questionnaire_status: 'sent', sent_at: new Date().toISOString() }).eq('id', id);
  } catch(e){ console.warn('mark sent failed:', e.message); }
}
function wsFindP(id){ return _wsPatients.find(function(x){ return x.id === id; }); }

// Send via WhatsApp — only mark 'sent' if the WhatsApp window actually opened.
async function wsSendWhatsApp(id){
  var p = wsFindP(id);
  if(!p){ try { var r=await window.sb.from('clinic_patients').select('*').eq('id',id).maybeSingle(); p=r.data; }catch(e){} }
  if(!p) return;
  if(!p.token){ wsToast('This patient has no questionnaire link yet.'); return; }
  var digits = (p.phone_number || '').replace(/[^0-9]/g, '');
  var wa = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(wsMessage(p));
  var win = window.open(wa, '_blank');
  if(win){
    await wsMarkSent(id);
    wsToast('WhatsApp opened — status set to Sent');
  } else {
    // popup blocked → did NOT launch → do NOT mark sent
    wsToast('Pop-up blocked. Use Copy Link or allow pop-ups, then try again.');
  }
  wsLoadPatients();
}

// Fallback — open the device SMS app. Mark 'sent' after launch.
async function wsSendSms(id){
  var p = wsFindP(id);
  if(!p){ try { var r=await window.sb.from('clinic_patients').select('*').eq('id',id).maybeSingle(); p=r.data; }catch(e){} }
  if(!p) return;
  if(!p.token){ wsToast('This patient has no questionnaire link yet.'); return; }
  var digits = (p.phone_number || '').replace(/[^0-9+]/g, '');
  var sms = 'sms:' + digits + (/(iPhone|iPad|Macintosh)/i.test(navigator.userAgent) ? '&' : '?') + 'body=' + encodeURIComponent(wsMessage(p));
  window.location.href = sms;   // opens the SMS app on a device
  await wsMarkSent(id);
  wsToast('SMS app opened — status set to Sent');
  setTimeout(wsLoadPatients, 800);
}

// Copy / open the exact link so the doctor can verify it.
function wsCopyLink(id){
  var p = wsFindP(id); if(!p) return;
  var url = wsLink(p); if(!url){ wsToast('No link yet'); return; }
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ wsToast('Link copied'); }, function(){ wsFallbackCopy(url); }); }
  else { wsFallbackCopy(url); }
}
function wsFallbackCopy(url){
  var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select();
  try{ document.execCommand('copy'); wsToast('Link copied'); }catch(e){ wsToast('Copy failed'); }
  document.body.removeChild(t);
}
function wsOpenLink(id){
  var p = wsFindP(id); if(!p) return;
  var url = wsLink(p); if(!url){ wsToast('No link yet'); return; }
  window.open(url, '_blank');
}

// ── WORKFLOW ADVANCE ──
async function wsAdvance(id, to){
  var patch = { consultation_status: to };
  var now = new Date().toISOString();
  if(to === 'arrived') patch.arrived_at = now;
  if(to === 'reviewed'){ patch.reviewed_at = now; patch.patient_status = 'awaiting_consultation'; }
  try {
    await window.sb.from('clinic_patients').update(patch).eq('id', id);
    wsToast(to === 'arrived' ? 'Patient marked arrived' : 'Consultation complete');
    wsLoadPatients();
  } catch(e){ wsToast('Update failed'); }
}
async function wsReady(id){
  try {
    await window.sb.from('clinic_patients').update({ patient_status: 'ready_for_surgery', ready_at: new Date().toISOString() }).eq('id', id);
    wsToast('Ready for surgery');
    wsLoadPatients();
  } catch(e){ wsToast('Update failed'); }
}

// ── ACCOUNT-LINKED CONVERGENCE: Activate Patient Portal (fallback) ──
async function wsActivatePortal(id){
  var p = _wsPatients.find(function(x){ return x.id === id; }); if(!p) return;
  if(!p.token){ wsToast('No questionnaire token for this patient'); return; }
  wsToast('Activating portal...');
  try {
    var r = await window.sb.functions.invoke('convert_clinic_patient', { body: { token: p.token } });
    var d = (r && r.data) || null;
    if(!d) throw new Error((r && r.error && r.error.message) || 'No response');
    if(d.status==='converted' || d.status==='already'){
      wsToast('Patient portal activated');
      if(d.magic_link) wsPortalLinkModal(p, d.magic_link);
      else wsToast('Portal active. Magic link not returned - check Supabase email/SMTP settings.');
      await wsLoadPatients(); wsLoadCases();
    } else if(d.status==='needs_email'){ wsToast('Add an email for this patient first'); }
    else if(d.status==='conflict'){ alert(d.message || 'This email already has an Anestheo patient account. Please verify before linking.'); }
    else if(d.status==='not_ready'){ wsToast('Questionnaire not completed yet'); }
    else { wsToast('Activation failed: ' + (d.message || 'error')); }
  } catch(e){ wsToast('Activation failed: ' + (e.message || 'error')); }
}

function wsDetail(id){

  // Human labels for the dynamic answer keys
  var LABELS = {
    age:'Age', sex:'Sex', height:'Height (cm)', weight:'Weight (kg)',
    pregnant:'Could be pregnant', gestation:'Weeks pregnant', preg_complications:'Pregnancy complications',
    prev_cesarean:'Previous cesarean', back_problems:'Back / spinal problems',
    guardian:'Guardian', birth_issues:'Birth / development issues', recent_cold:'Recent cold/fever',
    snore:'Snores loudly', tired:'Daytime tiredness', apnea:'Observed apnea', neck:'Neck ≥40cm',
    hypertension:'High blood pressure', cardiac:'Heart disease', cardiac_detail:'Heart detail', exercise:'Climbs 2 flights',
    lung:'Lung disease', lung_detail:'Lung detail', cpap:'Uses CPAP',
    diabetes:'Diabetes', diabetes_control:'Diabetes managed by',
    anticoag:'Blood thinners', anticoag_which:'Which / last dose',
    medications:'Medications', allergies:'Allergies',
    loose_teeth:'Loose/capped teeth', mouth_open:'Mouth/neck limitation',
    prev_anes:'Prior anesthesia', prev_problems:'Prior anesthesia problem', prev_problems_detail:'Problem detail',
    ponv_history:'PONV / motion sickness', smoking:'Smoking', comments:'Comments'
  };

  var riskBlock, scoreBlock, answersBlock;
  if(p.questionnaire_status === 'completed'){
    // Risk flags
    riskBlock = flags.length
      ? '<div class="pc-actions" style="margin-bottom:4px;">' + flags.map(function(f){ return '<span class="ws-badge b-review">&#9888; '+wsEsc(f)+'</span>'; }).join('') + '</div>'
      : '<div class="ws-empty">No high-risk flags identified.</div>';
    // Scores
    scoreBlock = '<div class="ws-d-grid">' +
      srow('BMI', scores.bmi != null ? scores.bmi + ' kg/m²' : null) +

    '</div>';
    // Full answers
    var rows = Object.keys(a).filter(function(k){ return k.charAt(0) !== '_'; }).map(function(k){
      return srow(LABELS[k] || k, a[k]);

    answersBlock = '<div class="ws-d-grid">' + (rows || '<div class="ws-empty">No answers recorded.</div>') + '</div>';
  } else {
    riskBlock = '<div class="ws-empty">Questionnaire not completed yet (status: '+wsQStatusLabel(p.questionnaire_status)+').</div>';

    '<div class="ws-d-head"><div><div class="ws-d-name">'+wsEsc(p.patient_name)+'</div>' +

    '</div>' +
    '<div class="ws-d-section">Risk summary</div>' + riskBlock +
    (scoreBlock ? '<div class="ws-d-section">Scores</div>' + scoreBlock : '') +
    (answersBlock ? '<div class="ws-d-section">Questionnaire answers</div>' + answersBlock : '') +
    '<div class="ws-d-section">Doctor notes <span style="font-weight:400;color:var(--hint);font-size:11px;">(private)</span></div>' +

function wsAskFilter(f, el){
  _wsAskFilter = f;

function wsRenderAsk(){
  var list = _wsAsk.filter(function(q){
    var st = q.status || 'new';
    if(_wsAskFilter==='pending') return st==='new' || st==='under_review';
    if(_wsAskFilter==='answered') return st==='answered' || st==='closed';
    return true;
  });
  var box = document.getElementById('ws-ask-list');
  if(!list.length){ box.innerHTML = '<div class="ws-empty">No questions in this view.</div>'; return; }
  var bmap = {new:'b-new',under_review:'b-review',answered:'b-answered',closed:'b-closed'};
  var blab = {new:'New',under_review:'Under review',answered:'Answered',closed:'Closed'};
  box.innerHTML = list.map(function(q){
    var st = q.status || 'new';
    var subj = q.subject || q.topic || 'Question';
    var msg = q.message || q.question || '';
    return '<div class="ws-row"><div class="ws-row-top"><div><div class="ws-row-name">'+wsEsc(subj)+'</div>' +
      '<div class="ws-row-meta">'+wsEsc(msg).slice(0,160)+'</div></div><span class="ws-badge '+(bmap[st]||'b-new')+'">'+(blab[st]||'New')+'</span></div>' +
      '<div class="ws-row-actions"><a class="ws-btn" href="/v2/ask.html">Open &amp; reply</a></div></div>';
  }).join('');
}

        '<div class="ws-grid">' +
          resItems.map(function(r){ return '<button class="ws-tile" onclick="wsToast(\''+r[0]+' — coming soon\')"><span class="ws-tile-ico">'+r[1]+'</span><span class="ws-tile-t">'+r[0]+'</span></button>'; }).join('') +
          '<a class="ws-tile" href="/v2/videos.html"><span class="ws-tile-ico">&#127909;</span><span class="ws-tile-t">Videos</span></a>' +
        '</div>' +
      '</div>';

    // SECTION 5 — Ask Anesthesiologist management (doctor inbox)
    var secAsk =
      '<div class="ws-sec" id="sec-ask">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Questions management</div>' +
          '<div class="ws-sec-sub">Patient questions awaiting your response</div></div></div>' +
        '<div class="ws-subtabs">' +
          '<button class="ws-subtab active" onclick="wsAskFilter(\'pending\',this)">Pending</button>' +
          '<button class="ws-subtab" onclick="wsAskFilter(\'answered\',this)">Answered</button>' +
          '<button class="ws-subtab" onclick="wsAskFilter(\'all\',this)">All</button>' +
        '</div>' +
        '<div id="ws-ask-list" class="ws-list"><div class="ws-empty">Loading questions…</div></div>' +
      '</div>';

    // SECTION 6 — Admin (admin only)
    var secAdmin = '';
    if(isAdminRole){
      secAdmin =
      '<div class="ws-sec" id="sec-admin">' +
        '<div class="ws-sec-head"><div><div class="ws-sec-title">Admin center</div>' +
          '<div class="ws-sec-sub">Approvals, users, and platform</div></div>' +
          '<a class="ws-open" href="/v2/admin.html">Full admin page &#8599;</a></div>' +
        '<div class="ws-stats" id="ws-admin-stats"></div>' +
        '<div class="ws-sec-title" style="font-size:14px;margin:18px 0 10px;">Doctor approvals</div>' +
        '<div id="ws-approvals" class="ws-list"><div class="ws-empty">Loading…</div></div>' +
        '<div class="ws-sec-title" style="font-size:14px;margin:22px 0 10px;">Users</div>' +
        '<div id="ws-users" class="ws-list"><div class="ws-empty">Loading…</div></div>' +
      '</div>';
    }

    var mainHTML =
      '<div class="ws-top">' +
        '<div><div class="ws-greet">' + greeting + '</div>' +
          '<div class="ws-role">' + roleLabel + ' &middot; <span class="ws-online">&#9679; session active</span></div></div>' +
      '</div>' +
      banner +
      '<div class="ws-shell">' +
        '<nav class="ws-rail">' + rail + '</nav>' +
        '<div class="ws-body">' + secPatients + secTools + secRefs + secResources + secAsk + secAdmin + '</div>' +
      '</div>';

    document.getElementById('app').innerHTML = mainHTML;

    // Wire up modules
    window.__wsRole = role;
    window.__wsUserId = user.id;
    window.__wsUserName = ((role === 'doctor' || role === 'admin') ? 'Dr. ' : '') + (profile.full_name || name);
    wsInjectModals();
    wsLoadPatients();
    wsLoadCases();
    wsLoadAsk();
    if(isAdminRole){ wsLoadAdmin(); }

    _dashDone = true; clearTimeout(_dashWatchdog);
    document.getElementById('loader').style.display = 'none';
    document.getElementById('app').style.display    = 'block';

    var dest = (role === 'admin') ? 'Admin Workspace' : (role === 'doctor' ? 'Doctor Workspace' : 'Workspace');
    console.log('REDIRECT target:', dest, '| REDIRECT executed: rendered in place');
    console.log('DASHBOARD READY - role:', role);

  } catch(err){
    console.error('DASHBOARD ERROR:', err.message, err.stack);
    dashFail(err.message);
  }
});
</script>

<!-- Doctor Active Patient Workspace (in-page overlay; no navigation) -->
<div class="ws-ws-bg" id="ws-ws" onmousedown="window._wsBgDown=(event.target===this)" onclick="if(event.target===this&&window._wsBgDown)wsCloseWorkspace()">
  <div class="ws-ws-modal">
    <div class="ws-ws-head">
      <div><div class="ws-ws-title" id="ws-ws-title">Patient workspace</div>
        <div class="ws-ws-sub" id="ws-ws-sub"></div></div>
      <button class="ws-btn" onclick="wsCloseWorkspace()">&times; Close</button>
    </div>
    <div class="ws-ws-body" id="ws-ws-body"></div>
  </div>
</div>

<!-- Approval confirmation modal (above the workspace) -->
<div class="ws-cfm-bg" id="ws-cfm" onclick="if(event.target===this)wsCfmClose()">
  <div class="ws-cfm-box" id="ws-cfm-box"></div>
</div>
</body>
</html>
