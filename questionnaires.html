<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaires — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/v2/supabase.js?v=2026.08.07-17"></script>
<script src="/v2/auth.js?v=2026.08.07-17"></script>
<script src="/v2/clinical-index.js?v=2026.08.07-17"></script>
<script src="/v2/clinical-search.js?v=2026.08.07-17"></script>
<script src="/v2/navbar.js?v=2026.08.07-17"></script>
<link rel="stylesheet" href="/v2/styles.css?v=2026.08.07-17">
<style>
#loader{position:fixed;inset:0;background:#0A1A15;z-index:9999;display:flex;align-items:center;justify-content:center;}
.spin{width:30px;height:30px;border:3px solid rgba(27,107,90,.25);border-top-color:#2A8A74;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;}
.crumb{font-size:12px;color:var(--hint);margin-bottom:14px;}
.crumb a{color:var(--accent);text-decoration:none;}
.q-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.q-tab{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);
  padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;}
.q-tab.on{background:rgba(27,107,90,.2);border-color:rgba(42,138,116,.4);color:#fff;}
.q-search{width:100%;max-width:340px;background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:8px;padding:10px 13px;color:#fff;font-size:14px;font-family:inherit;outline:none;margin-bottom:18px;min-height:42px;}
.q-search:focus{border-color:#2A8A74;}
.q-list{display:flex;flex-direction:column;gap:10px;}
.q-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;
  padding:15px 18px;display:flex;align-items:center;gap:14px;}
.q-item-main{flex:1;min-width:0;}
.q-item-name{font-size:14px;font-weight:600;color:#fff;}
.q-item-meta{font-size:12px;color:var(--hint);margin-top:3px;}
.q-flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.q-flag{font-size:10px;background:rgba(232,168,56,.12);color:#E8A838;border:1px solid rgba(232,168,56,.28);padding:2px 8px;border-radius:5px;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;white-space:nowrap;}
.b-submitted{background:rgba(27,107,90,.22);color:#7ECFC0;border:1px solid rgba(42,138,116,.35);}
.b-progress{background:rgba(232,168,56,.13);color:#E8A838;border:1px solid rgba(232,168,56,.3);}
.empty{text-align:center;color:var(--hint);padding:40px;font-size:14px;}
.note{font-size:11px;color:var(--hint);margin-bottom:18px;background:rgba(27,107,90,.06);border:1px solid rgba(27,107,90,.15);border-radius:8px;padding:9px 13px;}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="nb-placeholder"></div>
<div id="app">
  <div class="page-wrap">
    <div class="crumb"><a href="/v2/dashboard.html">Dashboard</a> &rsaquo; Questionnaires</div>
    <div class="section">
      <div class="section-tag">Patient forms</div>
      <h2 class="section-title">Questionnaires</h2>
      <p class="section-sub">Review patient pre-operative questionnaires.</p>

      <div class="q-tabs">
        <button class="q-tab on" id="tab-pending"   onclick="showTab('pending',this)">Pending review</button>
        <button class="q-tab"    id="tab-completed" onclick="showTab('completed',this)">Completed</button>
      </div>
      <input class="q-search" id="search" placeholder="Search by patient ID…" oninput="render()">
      <div id="list" class="q-list"></div>
    </div>
  </div>
</div>
<script>
var _all = [], _tab = 'pending';
function ge(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function showTab(t, btn){
  _tab = t;
  document.querySelectorAll('.q-tab').forEach(function(x){ x.classList.remove('on'); });
  btn.classList.add('on');
  render();
}

function render(){
  var q = (ge('search').value || '').trim().toLowerCase();
  var items = _all.filter(function(x){
    var isCompleted = x.status === 'submitted';
    if(_tab === 'pending'  && isCompleted) return false;
    if(_tab === 'completed' && !isCompleted) return false;
    if(q){
      var hay = (x.patient_id || '').toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });

  if(!items.length){
    ge('list').innerHTML = '<div class="empty">No ' + _tab + ' questionnaires.</div>';
    return;
  }

  ge('list').innerHTML = items.map(function(x){
    var badge = x.status === 'submitted'
      ? '<span class="badge b-submitted">Completed</span>'
      : '<span class="badge b-progress">In progress</span>';
    var when = x.updated_at ? new Date(x.updated_at).toLocaleDateString() : '';
    var flags = (x.risk_flags && x.risk_flags.length)
      ? '<div class="q-flags">' + x.risk_flags.map(function(f){ return '<span class="q-flag">&#9888; ' + esc(f) + '</span>'; }).join('') + '</div>'
      : '';
    var pct = x.completion != null ? x.completion : (x.status === 'submitted' ? 100 : 0);
    return '<div class="q-item"><div class="q-item-main">' +
      '<div class="q-item-name">Patient ' + esc((x.patient_id||'').slice(0,8)) + '</div>' +
      '<div class="q-item-meta">' + pct + '% complete &middot; updated ' + when + '</div>' +
      flags +
      '</div>' + badge + '</div>';
  }).join('');
}

async function guard(){
  var auth = await window.requireRole('staff');
  if(!auth) return null;
  return auth;
}

document.addEventListener('DOMContentLoaded', async function(){
  var safety = setTimeout(function(){
    var l = ge('loader');
    if(l && l.style.display !== 'none'){
      l.innerHTML = '<div style="text-align:center;padding:30px;font-family:sans-serif;"><p style="color:rgba(255,160,140,.9);font-size:14px;">Taking longer than expected.</p><p style="margin-top:12px;"><a href="/v2/dashboard.html" style="color:#7ECFC0;font-size:13px;">Back to dashboard</a></p></div>';
    }
  }, 8000);
  try {
    var auth = await guard();
    if(!auth){ clearTimeout(safety); return; }
    try {
      _all = await window.getAllQuestionnaires();
    } catch(e){ _all = []; }
    render();
    clearTimeout(safety);
    ge('loader').style.display = 'none';
    ge('app').style.display = 'block';
  } catch(e){
    clearTimeout(safety);
    console.error('QUESTIONNAIRES ERROR:', e.message);
    ge('loader').innerHTML = '<div style="text-align:center;padding:30px;font-family:sans-serif;"><p style="color:rgba(255,160,140,.9);font-size:14px;">Could not load questionnaires.</p><p style="color:rgba(255,255,255,.4);font-size:12px;margin-top:6px;">' + e.message + '</p><p style="margin-top:14px;"><a href="/v2/dashboard.html" style="color:#7ECFC0;font-size:13px;">Back to dashboard</a></p></div>';
  }
});
</script>
</body>
</html>
