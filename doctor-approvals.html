<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Approvals — Anestheo Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js?v=2026.08.16-01"></script>
<script src="/auth.js?v=2026.08.16-01"></script>
<script src="/clinical-index.js?v=2026.08.16-01"></script>
<script src="/clinical-search.js?v=2026.08.16-01"></script>
<script src="/navbar.js?v=2026.08.16-01"></script>
<link rel="stylesheet" href="/styles.css?v=2026.08.16-01">
<style>
#loader{position:fixed;inset:0;background:#0A1A15;z-index:9999;display:flex;align-items:center;justify-content:center;}
.spin{width:30px;height:30px;border:3px solid rgba(27,107,90,.25);border-top-color:#2A8A74;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;}
.crumb{font-size:12px;color:var(--hint);margin-bottom:14px;}
.crumb a{color:var(--accent);text-decoration:none;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;padding:10px 12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);border-bottom:1px solid var(--border);font-weight:600;}
.tbl td{padding:11px 12px;border-bottom:1px solid rgba(27,107,90,.1);color:var(--muted);}
.tbl tr:hover td{background:rgba(27,107,90,.05);}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;}
.b-approved{background:rgba(27,107,90,.22);color:#7ECFC0;border:1px solid rgba(42,138,116,.35);}
.b-pending{background:rgba(232,168,56,.13);color:#E8A838;border:1px solid rgba(232,168,56,.3);}
.b-rejected{background:rgba(192,57,43,.13);color:rgba(255,140,120,.9);border:1px solid rgba(192,57,43,.3);}
.act{font-size:11px;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit;margin-right:5px;}
.act-approve{background:rgba(27,107,90,.2);color:#7ECFC0;border:1px solid rgba(42,138,116,.35);}
.act-approve:hover{background:rgba(27,107,90,.38);}
.act-reject{background:transparent;color:rgba(255,120,100,.7);border:1px solid rgba(192,57,43,.3);}
.act-reject:hover{background:rgba(192,57,43,.12);}
.empty{text-align:center;color:var(--hint);padding:30px;}
.tbl-wrap{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;padding:6px 18px 12px;overflow-x:auto;}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="nb-placeholder"></div>
<div id="app">
  <div class="page-wrap">
    <div class="crumb"><a href="/dashboard.html">Dashboard</a> &rsaquo; <a href="/admin.html">Admin</a> &rsaquo; Doctor Approvals</div>
    <div class="section">
      <div class="section-tag">Admin</div>
      <h2 class="section-title">Doctor Approvals</h2>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Hospital</th><th>Specialty</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
  </div>
</div>
<script>
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
async function guard(){
  var auth = await window.requireRole('admin');
  if(!auth) return null;
  return auth;
}
async function setStatus(id,status){ await window.sb.from("profiles").update({verification_status:status}).eq("id",id); load(); }
window.setStatus=setStatus;
async function load(){
  try {
  var r=await window.sb.from("profiles").select("*").eq("role","doctor").order("created_at",{ascending:false});
  var docs=r.data||[];
  var pending=docs.filter(function(d){return d.verification_status==="pending";});
  var rows=pending.length?pending.map(function(p){
    return "<tr><td><strong style=\"color:#fff\">"+esc(p.full_name)+"</strong></td><td>"+esc(p.email)+"</td><td>"+esc(p.hospital)+"</td><td>"+esc(p.specialty)+"</td><td><span class=\"badge b-pending\">Pending</span></td><td><button class=\"act act-approve\" onclick=\"setStatus(\x27"+p.id+"\x27,\x27approved\x27)\">Approve</button><button class=\"act act-reject\" onclick=\"setStatus(\x27"+p.id+"\x27,\x27rejected\x27)\">Reject</button></td></tr>";
  }).join(""):"<tr><td colspan=\"6\" class=\"empty\">No pending approvals</td></tr>";
  document.getElementById("tb").innerHTML=rows;
  } catch(e){ document.getElementById("tb").innerHTML='<tr><td colspan="6" class="empty">Could not load data: '+e.message+'</td></tr>'; }
}
document.addEventListener("DOMContentLoaded",async function(){
  // Safety: never let the spinner persist beyond 8s
  var safety=setTimeout(function(){
    var l=document.getElementById("loader");
    if(l&&l.style.display!=="none"){
      l.innerHTML='<div style="text-align:center;padding:30px;font-family:sans-serif;"><p style="color:rgba(255,160,140,.9);font-size:14px;">Taking longer than expected.</p><p style="margin-top:12px;"><a href="/dashboard.html" style="color:#7ECFC0;font-size:13px;">Back to dashboard</a></p></div>';
    }
  },8000);
  try {
    var auth=await guard();
    if(!auth){ clearTimeout(safety); return; } // redirected
    await load();
    clearTimeout(safety);
    document.getElementById("loader").style.display="none";
    document.getElementById("app").style.display="block";
  } catch(e){
    clearTimeout(safety);
    console.error("PAGE ERROR:",e.message);
    document.getElementById("loader").innerHTML='<div style="text-align:center;padding:30px;font-family:sans-serif;"><p style="color:rgba(255,160,140,.9);font-size:14px;">Could not load this page.</p><p style="color:rgba(255,255,255,.4);font-size:12px;margin-top:6px;">'+e.message+'</p><p style="margin-top:14px;"><a href="/dashboard.html" style="color:#7ECFC0;font-size:13px;">Back to dashboard</a></p></div>';
  }
});
</script>
</body>
</html>
