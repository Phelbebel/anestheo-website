<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Never indexed. A passport URL is a key; a search engine holding a list of
     keys would defeat the entire design. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Health Passport — Anestheo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js?v=2026.08.16-01"></script>
<script src="/passport.js?v=2026.08.16-01"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--teal:#1B6B5A;--teal2:#2A8A74;--accent:#7ECFC0;--dark:#0A1A15;
  --border:rgba(27,107,90,.22);--muted:rgba(255,255,255,.5);--red:#C0392B;}
body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--dark);
  color:#fff;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.5;}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px;}
.brand{display:flex;align-items:center;gap:9px;padding:6px 0 14px;}
.brand b{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);}
h1{font-size:24px;font-weight:700;line-height:1.25;}
.who{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;
  padding:15px 16px;margin-bottom:14px;}
.who .lab{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}

/* The banner is not decoration. Everything under it may be self-reported, and
   a clinician arriving at speed has to be told that before they read a word. */
.warn{background:rgba(232,168,56,.12);border:1px solid rgba(232,168,56,.4);
  border-radius:12px;padding:13px 15px;font-size:13.5px;color:#FFE0AE;margin-bottom:16px;}
.warn b{color:#FFD9A0;}

h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 9px;font-weight:700;}
.card{background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:12px;padding:13px 15px;margin-bottom:9px;}
.card.crit{background:rgba(192,57,43,.15);border-color:rgba(192,57,43,.55);}
.card .t{font-size:16px;font-weight:700;line-height:1.3;}
.card.crit .t{color:#FFC9C0;}
.card .v{font-size:14px;color:rgba(255,255,255,.82);margin-top:3px;}
.card .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:9px;}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  border-radius:5px;padding:3px 7px;white-space:nowrap;}
.tag.cat{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);}
.tag.sev{background:rgba(192,57,43,.28);color:#FFC9C0;}
/* Provenance is never hidden and never abbreviated away. */
.pv-pat{background:rgba(255,255,255,.09);color:rgba(255,255,255,.72);}
.pv-doc{background:rgba(130,177,255,.18);color:#B9D3FF;}
.pv-ver{background:rgba(27,107,90,.35);color:var(--accent);}
.pv-sys{background:rgba(206,147,216,.2);color:#E6C6EC;}

.contact{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:9px;}
.contact .n{flex:1;min-width:0;}
.contact a{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;
  border-radius:9px;background:var(--teal);color:#fff;text-decoration:none;
  font-weight:600;font-size:14px;white-space:nowrap;}
.foot{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.65;}
.gone{text-align:center;padding:56px 20px;}
.gone h1{font-size:20px;margin-bottom:10px;}
.gone p{color:var(--muted);font-size:14.5px;max-width:400px;margin:0 auto;}
#load{text-align:center;padding:60px 20px;color:var(--muted);}
@media print{
  body{background:#fff;color:#000;}
  .card,.who,.contact{border-color:#999;background:#fff;}
  .card.crit{background:#fff;border-color:#000;border-width:2px;}
  .card .t,.card.crit .t{color:#000;}
  .tag{border:1px solid #666;color:#000 !important;background:#fff !important;}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="load">Opening Health Passport…</div>
  <div id="app" style="display:none"></div>
</div>

<script>
/* The public face of a Health Passport.
 *
 * This page holds no privilege of any kind. It calls one function —
 * hp_resolve_passport — and renders whatever projection comes back. It cannot
 * query a table, cannot list anything, and cannot tell the difference between
 * a token that was revoked, a passport that was switched off and a token that
 * never existed, because the server deliberately gives all three the same
 * answer.
 */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* THE TOKEN COMES FROM THE FRAGMENT AND NOWHERE ELSE.
--
   A fragment is never transmitted: it is not in the request line, so it cannot
   land in a Hostinger or LiteSpeed access log, a proxy log, a CDN log, or a
   Referer header. The server serving this page sees only "GET /p.html".
--
   A path or query form is deliberately NOT accepted, even as a fallback. A
   fallback that works is a fallback someone will link to, and the moment they
   do, the credential is in a log file. /p.html is a real file, so this also
   needs no rewrite rule — there is nothing an .htaccess can lose. */
function tokenFromUrl(){
  var h = String(location.hash || '').replace(/^#/, '');
  return /^[A-Za-z0-9_-]{43}$/.test(h) ? h : null;
}

/* Take it out of the address bar once it has been read. It never reached the
   server, but it is still a credential sitting in plain sight on a phone held
   up in a corridor, and in that browser's history afterwards. */
function scrubHash(){
  try {
    if(location.hash) history.replaceState(null, '', location.pathname);
  } catch(e){}
}

function unavailable(){
  el('load').style.display = 'none';
  el('app').style.display = 'block';
  el('app').innerHTML =
    '<div class="gone"><div class="brand"><b>Anestheo Health Passport</b></div>' +
    '<h1>This Health Passport is not available</h1>' +
    '<p>This link is no longer active. If you were given it on a card, ask the ' +
    'person it belongs to for an up-to-date one.</p></div>';
}

function render(d){
  var items = d.items || [], contacts = d.contacts || [];
  var crit = items.filter(function(i){ return isCrit(i); });
  var rest = items.filter(function(i){ return !isCrit(i); });

  var h = '<div class="brand"><b>Anestheo Health Passport</b></div>';

  /* A missing name is a choice the patient made, not a gap in the record, and
     saying "not recorded" would imply otherwise to a clinician. */
  h += '<div class="who"><div class="lab">Patient</div>' +
       '<h1>' + (d.patient_name ? esc(d.patient_name)
                                : 'Name not shared') + '</h1></div>';

  h += '<div class="warn"><b>This Health Passport may contain patient-reported ' +
       'information.</b> Verify clinically before making treatment decisions.</div>';

  if(crit.length){
    h += '<h2>Critical alerts</h2>' + crit.map(function(i){ return card(i, true); }).join('');
  }
  if(contacts.length){
    h += '<h2>Emergency contact</h2>' + contacts.map(function(c){
      return '<div class="contact"><div class="n"><div class="t" style="font-size:15px;font-weight:700">' +
        esc(c.name) + '</div>' +
        (c.relationship ? '<div class="v" style="font-size:13px">' + esc(c.relationship) + '</div>' : '') +
        '</div>' +
        (c.phone ? '<a href="tel:' + esc(String(c.phone).replace(/[^\d+]/g,'')) + '">Call</a>' : '') +
        '</div>';
    }).join('');
  }
  if(rest.length){
    h += '<h2>Other health information</h2>' + rest.map(function(i){ return card(i, false); }).join('');
  }
  if(!items.length && !contacts.length){
    h += '<div class="card"><div class="v">Nothing has been shared on this Health Passport yet.</div></div>';
  }

  h += '<div class="foot">Shown from an Anestheo Health Passport, which the patient ' +
       'maintains themselves. Entries are labelled with where they came from. ' +
       'Nothing here is a prescription, a diagnosis or a substitute for clinical ' +
       'assessment.</div>';

  el('load').style.display = 'none';
  el('app').style.display = 'block';
  el('app').innerHTML = h;
}

function isCrit(i){
  return HP.isCritical(i.category) || i.severity === 'critical' || i.severity === 'high';
}
function card(i, critical){
  var pv = HP.provenance(i.source_type);
  return '<div class="card' + (critical ? ' crit' : '') + '">' +
    '<div class="t">' + esc(i.label) + '</div>' +
    (i.value_text ? '<div class="v">' + esc(i.value_text) + '</div>' : '') +
    '<div class="m">' +
      '<span class="tag cat">' + esc(HP.catLabel(i.category)) + '</span>' +
      (i.severity ? '<span class="tag sev">' + esc(i.severity) + '</span>' : '') +
      '<span class="tag ' + pv.cls + '">' + esc(pv.label) + '</span>' +
    '</div></div>';
}

(async function(){
  var token = tokenFromUrl();
  scrubHash();
  if(!token) return unavailable();
  var r;
  try { r = await HP.resolve(token); }
  catch(e){ r = { error:{ message:e.message } }; }
  // A server error and a bad token are shown identically on purpose: a scanner
  // must not be able to tell a revoked passport from one that never existed.
  if(!r || r.error || !r.data || !r.data.found) return unavailable();
  render(r.data);
})();
</script>
</body>
</html>
