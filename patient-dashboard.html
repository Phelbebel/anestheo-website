<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Surgery Journey — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/v2/supabase.js"></script>
<script src="/v2/auth.js"></script>
<script src="/v2/navbar.js"></script>
<link rel="stylesheet" href="/v2/styles.css">
<style>
#loader{position:fixed;inset:0;background:#0A1A15;z-index:9999;display:flex;align-items:center;justify-content:center;}
.spin{width:30px;height:30px;border:3px solid rgba(27,107,90,.25);border-top-color:#2A8A74;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;}
.sj-wrap{max-width:880px;margin:0 auto;padding:26px 18px 90px;}
.sj-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.sj-hi{font-family:'Playfair Display',serif;font-size:27px;font-weight:700;}
.sj-sub{font-size:14px;color:var(--muted);margin-bottom:20px;}
.sj-add{background:#1B6B5A;color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.sj-add:hover{background:#2A8A74;}
/* reserved alert banner slot (future Critical Anesthesia Alerts) */
#alert-slot{margin-bottom:18px;}
.sj-sec-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hint);margin:24px 0 10px;}
.sj-empty{font-size:13.5px;color:var(--hint);padding:22px;text-align:center;background:rgba(255,255,255,.02);border:1px dashed var(--border);border-radius:14px;}
/* surgery journey card */
.sc{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:14px;}
.sc.past{opacity:.85;}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px;}
.sc-name{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#fff;}
.sc-facts{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.6;}
.sc-sep{margin:0 7px;opacity:.5;}
.sc-status{font-size:11px;font-weight:700;border-radius:20px;padding:6px 13px;white-space:nowrap;}
.st-planning{background:rgba(120,150,255,.14);color:#9ab0ff;}
.st-qp{background:rgba(232,168,56,.14);color:#E8A838;}
.st-qc{background:rgba(126,207,192,.16);color:#7ECFC0;}
.st-ready{background:rgba(37,211,102,.16);color:#5ee393;}
.st-completed{background:rgba(255,255,255,.08);color:var(--muted);}
.st-cancelled{background:rgba(192,57,43,.14);color:rgba(255,140,120,.92);}
/* stepper */
.sc-track{display:flex;align-items:flex-start;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
.sc-step{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;min-width:74px;}
.sc-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--hint);border:1px solid var(--border);}
.sc-step.done .sc-dot{background:#2A8A74;color:#fff;border-color:#2A8A74;}
.sc-step.now .sc-dot{border-color:#7ECFC0;color:#7ECFC0;}
.sc-lbl{font-size:10px;color:var(--muted);white-space:nowrap;text-align:center;}
.sc-step.done .sc-lbl,.sc-step.now .sc-lbl{color:#fff;}
.sc-line{flex:1;height:2px;min-width:14px;background:rgba(255,255,255,.1);margin-top:12px;}
/* next-step banner */
.sc-next{display:flex;align-items:center;gap:10px;background:rgba(27,107,90,.1);border:1px solid rgba(42,138,116,.28);border-radius:11px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;color:#fff;}
.sc-next b{color:#7ECFC0;font-weight:600;}
.sc-actions{display:flex;gap:8px;flex-wrap:wrap;}
.sc-btn{font-size:13px;padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:rgba(255,255,255,.88);cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.sc-btn:hover{border-color:rgba(42,138,116,.45);color:#fff;}
.sc-btn-green{background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3);color:#5ee393;}
.sc-btn-danger{color:rgba(255,130,110,.8);}
.sc-btn-danger:hover{border-color:rgba(192,57,43,.4);background:rgba(192,57,43,.08);color:rgba(255,150,130,.95);}
.sj-pdis{font-size:11px;color:var(--hint);margin-top:8px;}
/* support row */
.sj-support{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--border);}
.sj-support a{font-size:13px;color:#7ECFC0;text-decoration:none;background:rgba(27,107,90,.1);border:1px solid rgba(42,138,116,.28);border-radius:9px;padding:10px 15px;}
.sj-support a:hover{background:rgba(27,107,90,.2);}
.sj-arch-toggle{background:none;border:none;color:#7ECFC0;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline;}
/* modal */
.sj-modal-bg{display:none;position:fixed;inset:0;background:rgba(5,12,9,.72);z-index:1200;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.sj-modal-bg.open{display:flex;}
.sj-modal{background:#0C1F18;border:1px solid rgba(27,107,90,.3);border-radius:16px;padding:24px;max-width:440px;width:100%;}
.sj-modal h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:14px;}
.sj-modal label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin:12px 0 5px;}
.sj-modal input,.sj-modal select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:#fff;font-size:14px;font-family:inherit;outline:none;min-height:44px;-webkit-appearance:none;appearance:none;}
.sj-modal input:focus,.sj-modal select:focus{border-color:#2A8A74;}
.sj-modal select option{background:#132218;}
.sj-modal-btns{display:flex;gap:10px;margin-top:20px;}
.sj-modal-btns button{flex:1;padding:12px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;border:none;}
.sj-cancel{background:transparent;border:1px solid rgba(255,255,255,.15)!important;color:var(--muted);}
.sj-save{background:#1B6B5A;color:#fff;}
.sj-toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#0C1F18;border:1px solid rgba(42,138,116,.45);color:#7ECFC0;padding:11px 20px;border-radius:10px;font-size:14px;z-index:3000;box-shadow:0 12px 36px rgba(0,0,0,.5);}
@media(min-width:680px){.sc-actions .sc-btn{min-width:auto;}}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="nb-placeholder"></div>

<div id="app">
  <div class="sj-wrap">
    <div class="sj-head">
      <div>
        <div class="sj-hi" id="sj-hi">My Surgery Journey</div>
        <div class="sj-sub">Track every surgery from planning to recovery, in one place.</div>
      </div>
      <button class="sj-add" onclick="sjOpenAdd()">+ Add surgery</button>
    </div>

    <!-- Reserved for future Critical Anesthesia Alerts (red safety banner). Empty for now. -->
    <div id="alert-slot"></div>

    <div class="sj-sec-label">Upcoming surgeries</div>
    <div id="upcoming-list"></div>

    <div class="sj-sec-label" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Past surgeries &middot; completed cases</span>
      <button class="sj-arch-toggle" id="arch-toggle" style="display:none;" onclick="sjToggleArchived()">Show archived</button>
    </div>
    <div id="past-list"></div>

    <div class="sj-support">
      <a href="/v2/ask.html">&#128172; Ask the anesthesiologist</a>
      <a href="/v2/videos.html">&#127909; Educational videos</a>
      <a href="/v2/recovery.html">&#128147; Recovery information</a>
    </div>
  </div>
</div>

<!-- Add / Edit surgery modal -->
<div class="sj-modal-bg" id="sj-modal" onclick="if(event.target===this)sjCloseModal()">
  <div class="sj-modal">
    <h3 id="sj-modal-title">Add surgery</h3>
    <label>Procedure type</label>
    <select id="m-proc">
      <option value="">Select…</option>
      <option>C-Section / Childbirth</option><option>Orthopedic Surgery</option>
      <option>Dental &amp; Oral Surgery</option><option>ENT Surgery</option>
      <option>Plastic Surgery</option><option>Oncogynecology</option>
      <option>Urology</option><option>General / Other Surgery</option>
    </select>
    <label>Surgery date</label><input type="date" id="m-date">
    <label>Hospital</label><input type="text" id="m-hospital" placeholder="Hospital name">
    <label>Surgeon</label><input type="text" id="m-surgeon" placeholder="Surgeon name">
    <label>Anesthesia type (if known)</label>
    <select id="m-anes"><option value="">Not sure yet</option><option>General</option><option>Spinal</option><option>Epidural</option><option>Regional block</option><option>Sedation</option><option>Local</option></select>
    <div class="sj-modal-btns">
      <button class="sj-cancel" onclick="sjCloseModal()">Cancel</button>
      <button class="sj-save" id="m-save" onclick="sjSave()">Save</button>
    </div>
  </div>
</div>

<script>
function ge(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var _uid = null, _surgeries = [], _editId = null, _showArchived = false;

function sjToast(msg){
  var t = document.createElement('div'); t.className='sj-toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(function(){t.remove();},400); }, 1600);
}

// ── STATUS / STEPPER MODEL ────────────────────────────────────
// status: planning | questionnaire_pending | questionnaire_complete | ready | completed | cancelled
var STATUS_LABEL = {
  planning:'Planning', questionnaire_pending:'Questionnaire pending',
  questionnaire_complete:'Questionnaire complete', ready:'Ready for surgery',
  completed:'Completed', cancelled:'Cancelled'
};
var STATUS_CLASS = {
  planning:'st-planning', questionnaire_pending:'st-qp', questionnaire_complete:'st-qc',
  ready:'st-ready', completed:'st-completed', cancelled:'st-cancelled'
};
// 6 journey stages; index reached per status
var STAGES = ['Added','Questionnaire','Prep plan','Ready','Surgery','Recovery'];
function reachedStage(status){
  return ({ planning:1, questionnaire_pending:1, questionnaire_complete:2, ready:4, completed:5, cancelled:5 })[status] || 1;
}
function nextStep(s){
  switch(s.status){
    case 'planning': return 'Complete your pre-operative questionnaire when your clinic sends it.';
    case 'questionnaire_pending': return 'Complete your pre-operative questionnaire.';
    case 'questionnaire_complete': return 'Your anesthesia team is preparing your surgery plan.';
    case 'ready': return 'You are ready — review your day-of checklist.';
    case 'completed': return 'Surgery completed. See your recovery information.';
    case 'cancelled': return 'This surgery was cancelled.';
    default: return 'Add your surgery details to begin.';
  }
}

function fmtDate(d){ return d ? new Date(d).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}) : ''; }
function daysUntil(d){ try{ var x=new Date(d);x.setHours(0,0,0,0);var t=new Date();t.setHours(0,0,0,0);return Math.round((x-t)/86400000);}catch(e){return null;} }
function countdown(d){
  var dd = d ? daysUntil(d) : null; if(dd===null) return '';
  if(dd>1) return 'in '+dd+' days'; if(dd===1) return 'tomorrow'; if(dd===0) return 'today'; return Math.abs(dd)+' days ago';
}

function stepperHtml(status){
  var reached = reachedStage(status);
  return '<div class="sc-track">' + STAGES.map(function(st,i){
    var cls = (i < reached) ? 'done' : (i === reached ? 'now' : '');
    return '<div class="sc-step '+cls+'"><span class="sc-dot">'+(i<reached?'&#10003;':(i+1))+'</span><span class="sc-lbl">'+st+'</span></div>';
  }).join('<span class="sc-line"></span>') + '</div>';
}

function cardHtml(s){
  var isPast = (s.status==='completed' || s.status==='cancelled');
  var facts = [];
  if(s.hospital) facts.push('&#127973; '+esc(s.hospital));
  if(s.surgeon) facts.push('&#129658; '+esc(s.surgeon));
  if(s.anesthesia_type) facts.push('&#128137; '+esc(s.anesthesia_type));
  if(s.surgery_date){ var cd = countdown(s.surgery_date); facts.push('&#128197; '+fmtDate(s.surgery_date)+(cd && !isPast?' · <b style="color:#7ECFC0;">'+cd+'</b>':'')); }

  var actions = '';
  if(isPast){
    if(s.status==='completed') actions += '<a class="sc-btn" href="/v2/recovery.html">Recovery info</a>';
    actions += '<button class="sc-btn sc-btn-danger" onclick="sjDelete(\''+s.id+'\')">Delete</button>';
  } else {
    actions += '<button class="sc-btn" onclick="sjOpenEdit(\''+s.id+'\')">Edit</button>';
    actions += '<button class="sc-btn sc-btn-green" onclick="sjComplete(\''+s.id+'\')">Mark completed</button>';
    actions += '<button class="sc-btn" onclick="sjCancel(\''+s.id+'\')">Cancel surgery</button>';
    actions += '<button class="sc-btn sc-btn-danger" onclick="sjDelete(\''+s.id+'\')">Delete</button>';
  }

  return '<div class="sc'+(isPast?' past':'')+'">' +
    '<div class="sc-head"><div>' +
      '<div class="sc-name">'+esc(s.procedure_type||'Surgery')+'</div>' +
      (facts.length?'<div class="sc-facts">'+facts.join('<span class="sc-sep">&middot;</span>')+'</div>':'') +
    '</div><div class="sc-status '+(STATUS_CLASS[s.status]||'st-planning')+'">'+(STATUS_LABEL[s.status]||'Planning')+'</div></div>' +
    stepperHtml(s.status) +
    '<div class="sc-next">&#10148; <span>Next: <b>'+esc(nextStep(s))+'</b></span></div>' +
    '<div class="sc-actions">'+actions+'</div>' +
    (!isPast ? '<div class="sj-pdis">Questionnaire &amp; preparation plan stages activate once your clinic links this surgery.</div>' : '') +
  '</div>';
}

function render(){
  var active = _surgeries.filter(function(s){ return s.status!=='completed' && s.status!=='cancelled'; });
  var past   = _surgeries.filter(function(s){ return s.status==='completed' || s.status==='cancelled'; });

  ge('upcoming-list').innerHTML = active.length
    ? active.map(cardHtml).join('')
    : '<div class="sj-empty">No upcoming surgeries. Click <b>+ Add surgery</b> to start your journey.</div>';

  ge('past-list').innerHTML = past.length
    ? past.map(cardHtml).join('')
    : '<div class="sj-empty">No past surgeries yet.</div>';
}

// ── CRUD ──────────────────────────────────────────────────────
function sjOpenAdd(){
  _editId = null;
  ge('sj-modal-title').textContent = 'Add surgery';
  ge('m-proc').value=''; ge('m-date').value=''; ge('m-hospital').value=''; ge('m-surgeon').value=''; ge('m-anes').value='';
  ge('sj-modal').classList.add('open'); document.body.style.overflow='hidden';
}
function sjOpenEdit(id){
  var s = _surgeries.find(function(x){ return x.id===id; }); if(!s) return;
  _editId = id;
  ge('sj-modal-title').textContent = 'Edit surgery';
  ge('m-proc').value = s.procedure_type||''; ge('m-date').value = s.surgery_date||'';
  ge('m-hospital').value = s.hospital||''; ge('m-surgeon').value = s.surgeon||''; ge('m-anes').value = s.anesthesia_type||'';
  ge('sj-modal').classList.add('open'); document.body.style.overflow='hidden';
}
function sjCloseModal(){ ge('sj-modal').classList.remove('open'); document.body.style.overflow=''; }

async function sjSave(){
  var proc = ge('m-proc').value;
  if(!proc){ sjToast('Please choose a procedure type'); return; }
  ge('m-save').disabled = true; ge('m-save').textContent = 'Saving…';
  var rec = {
    patient_id: _uid,
    procedure_type: proc,
    surgery_date: ge('m-date').value || null,
    hospital: ge('m-hospital').value.trim() || null,
    surgeon: ge('m-surgeon').value.trim() || null,
    anesthesia_type: ge('m-anes').value || null
  };
  try {
    if(_editId){
      await window.sb.from('patient_surgeries').update(rec).eq('id', _editId);
    } else {
      rec.status = 'planning';
      await window.sb.from('patient_surgeries').insert(rec);
    }
    await sjLoad();
    sjToast(_editId ? 'Surgery updated' : 'Surgery added');
    sjCloseModal();
  } catch(e){
    console.error('save surgery:', e.message);
    sjToast('Could not save. Please try again.');
  }
  ge('m-save').disabled = false; ge('m-save').textContent = 'Save';
}

async function sjComplete(id){
  try { await window.sb.from('patient_surgeries').update({ status:'completed', completed_at:new Date().toISOString() }).eq('id', id);
    await sjLoad(); sjToast('Marked completed — moved to history'); }
  catch(e){ sjToast('Update failed'); }
}
async function sjCancel(id){
  try { await window.sb.from('patient_surgeries').update({ status:'cancelled', cancelled_at:new Date().toISOString() }).eq('id', id);
    await sjLoad(); sjToast('Surgery cancelled'); }
  catch(e){ sjToast('Update failed'); }
}
async function sjDelete(id){
  try { await window.sb.from('patient_surgeries').update({ deleted_at:new Date().toISOString() }).eq('id', id);
    await sjLoad(); sjToast('Surgery deleted'); }
  catch(e){ sjToast('Delete failed'); }
}
function sjToggleArchived(){ _showArchived = !_showArchived; ge('arch-toggle').textContent = _showArchived?'Hide archived':'Show archived'; sjLoad(); }

window.sjOpenAdd=sjOpenAdd; window.sjOpenEdit=sjOpenEdit; window.sjCloseModal=sjCloseModal; window.sjSave=sjSave;
window.sjComplete=sjComplete; window.sjCancel=sjCancel; window.sjDelete=sjDelete; window.sjToggleArchived=sjToggleArchived;

// ── LOAD ──────────────────────────────────────────────────────
async function sjLoad(){
  try {
    var q = window.sb.from('patient_surgeries').select('*').eq('patient_id', _uid).is('deleted_at', null);
    var r = await q.order('surgery_date', { ascending: true, nullsFirst: false });
    _surgeries = (r.data || []).filter(function(s){ return _showArchived || !s.archived_at; });
    render();
  } catch(e){
    console.error('load surgeries:', e.message);
    ge('upcoming-list').innerHTML = '<div class="sj-empty">Could not load your surgeries. Please refresh.</div>';
  }
}

// ── INIT ──────────────────────────────────────────────────────
var _done = false;
var _watchdog = setTimeout(function(){
  if(_done) return;
  ge('loader').innerHTML = '<div style="text-align:center;padding:40px;font-family:sans-serif;max-width:340px;">' +
    '<p style="color:#fff;font-size:15px;margin-bottom:10px;">This is taking longer than expected.</p>' +
    '<button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Refresh</button></div>';
}, 10000);

document.addEventListener('DOMContentLoaded', async function(){
  try {
    var auth = await window.requireAuth();
    if(!auth){ _done=true; clearTimeout(_watchdog); return; }   // requireAuth redirects guests
    _uid = auth.user.id;
    var first = (auth.profile && auth.profile.full_name) ? auth.profile.full_name.split(' ')[0] : auth.user.email.split('@')[0];
    first = first.charAt(0).toUpperCase() + first.slice(1);
    ge('sj-hi').textContent = first + '’s Surgery Journey';
    await sjLoad();
    _done = true; clearTimeout(_watchdog);
    ge('loader').style.display='none'; ge('app').style.display='block';
    console.log('SURGERY JOURNEY READY');
  } catch(e){
    console.error('SURGERY JOURNEY ERROR:', e.message);
    ge('loader').innerHTML = '<p style="color:rgba(255,160,140,.9);padding:24px;font-family:sans-serif;">Error: '+esc(e.message)+'</p>';
  }
});
</script>
</body>
</html>
