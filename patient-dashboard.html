<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/v2/supabase.js"></script>
<script src="/v2/auth.js"></script>
<script src="/v2/navbar.js"></script>
<script src="/v2/journey.js"></script>
<link rel="stylesheet" href="/v2/styles.css">
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<style>
#loader{position:fixed;inset:0;background:#0A1A15;z-index:9999;display:flex;align-items:center;justify-content:center;}
.spin{width:30px;height:30px;border:3px solid rgba(27,107,90,.25);border-top-color:#2A8A74;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;}
.pd-wrap{max-width:880px;margin:0 auto;padding:26px 18px 80px;}
.pd-hi{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin-bottom:3px;}
.pd-hi-sub{font-size:14px;color:var(--muted);margin-bottom:22px;}
.pd-grid{display:grid;grid-template-columns:1fr;gap:14px;}
.pd-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:15px;padding:20px 22px;}
.pd-card-title{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7ECFC0;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
.pd-card-title .edit{font-size:11px;color:var(--accent);cursor:pointer;letter-spacing:0;text-transform:none;font-weight:500;background:none;border:none;font-family:inherit;}
/* surgery rows */
.srow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(27,107,90,.1);font-size:14px;gap:12px;}
.srow:last-child{border-bottom:none;}
.srow-l{color:var(--muted);}
.srow-v{color:#fff;font-weight:500;text-align:right;}
.srow-v.empty{color:var(--hint);font-weight:400;font-style:italic;}
/* progress */
.prog-pct{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;line-height:1;}
.prog-bar{height:10px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin:14px 0 16px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#1B6B5A,#2A8A74,#7ECFC0);border-radius:6px;transition:width .6s ease;}
.prog-items{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.prog-item{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
.prog-item .dot{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--hint);}
.prog-item.done{color:#fff;}
.prog-item.done .dot{background:#2A8A74;color:#fff;}
/* checklist */
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid rgba(27,107,90,.1);cursor:pointer;}
.chk:last-child{border-bottom:none;}
.chk input{margin-top:1px;width:18px;height:18px;accent-color:#2A8A74;flex-shrink:0;}
.chk span{font-size:14px;color:rgba(255,255,255,.82);line-height:1.5;}
.chk input:checked + span{color:var(--hint);text-decoration:line-through;}
.chk-meta{font-size:12px;color:var(--hint);margin-top:12px;}
/* questions */
.q-item{padding:13px 0;border-bottom:1px solid rgba(27,107,90,.1);}
.q-item:last-child{border-bottom:none;}
.q-subj{font-size:14px;font-weight:600;color:#fff;}
.q-msg{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5;}
.q-reply{font-size:13px;color:rgba(126,207,192,.9);margin-top:8px;padding:9px 12px;background:rgba(27,107,90,.1);border-radius:8px;border-left:2px solid #2A8A74;}
.q-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em;}
.st-new{background:rgba(120,150,255,.14);color:#9ab0ff;border:1px solid rgba(120,150,255,.3);}
.st-review{background:rgba(232,168,56,.13);color:#E8A838;border:1px solid rgba(232,168,56,.3);}
.st-answered{background:rgba(27,107,90,.22);color:#7ECFC0;border:1px solid rgba(42,138,116,.35);}
.st-closed{background:rgba(255,255,255,.06);color:var(--hint);border:1px solid var(--border);}
/* education */
.edu-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(27,107,90,.1);}
.edu-item:last-child{border-bottom:none;}
.edu-ico{font-size:18px;}
.edu-main{flex:1;}
.edu-title{font-size:14px;color:#fff;}
.edu-meta{font-size:12px;color:var(--hint);}
/* timeline */
.tl-stage{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(27,107,90,.1);}
.tl-stage:last-child{border-bottom:none;}
.tl-when{flex-shrink:0;width:108px;font-size:12px;font-weight:700;color:#7ECFC0;}
.tl-tasks{flex:1;}
.tl-task{font-size:13px;color:rgba(255,255,255,.78);line-height:1.6;padding:2px 0 2px 16px;position:relative;}
.tl-task:before{content:'';position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:#2A8A74;}
.empty{font-size:13px;color:var(--hint);padding:8px 0;}
.btn-sm{font-size:13px;padding:9px 16px;border-radius:8px;background:#1B6B5A;color:#fff;border:none;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.pdq-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.pdq-btns .btn-sm{background:rgba(27,107,90,.16);border:1px solid rgba(42,138,116,.35);color:#cfe;}
.pdq-btns .btn-sm:hover{background:rgba(27,107,90,.28);color:#fff;}
.pdq-flags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
.pdq-flag{font-size:11.5px;font-weight:600;background:rgba(232,168,56,.12);border:1px solid rgba(232,168,56,.32);color:#E8C16b;border-radius:7px;padding:5px 10px;}
.pd-modal-bg{display:none;position:fixed;inset:0;background:rgba(5,12,9,.72);z-index:1200;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.pd-modal-bg.open{display:flex;}
.pd-modal{background:#0C1F18;border:1px solid rgba(27,107,90,.3);border-radius:16px;padding:22px;max-width:560px;width:100%;}
.pd-m-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pd-m-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
.pd-table{width:100%;border-collapse:collapse;font-size:13px;}
.pd-table td{padding:7px 8px;border-bottom:1px solid rgba(27,107,90,.12);vertical-align:top;}
.pd-table td:first-child{color:var(--muted);width:42%;}
.btn-sm:hover{background:#2A8A74;}
/* edit modal */
.pd-modal-bg{display:none;position:fixed;inset:0;background:rgba(5,12,9,.7);z-index:1100;align-items:center;justify-content:center;padding:18px;}
.pd-modal-bg.open{display:flex;}
.pd-modal{background:#0C1F18;border:1px solid rgba(27,107,90,.3);border-radius:16px;padding:24px;max-width:420px;width:100%;}
.pd-modal h3{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:16px;}
.pd-modal label{display:block;font-size:12px;color:var(--hint);margin:11px 0 5px;text-transform:uppercase;letter-spacing:.04em;}
.pd-modal input,.pd-modal select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:#fff;font-size:14px;font-family:inherit;outline:none;min-height:44px;-webkit-appearance:none;}
.pd-modal input:focus,.pd-modal select:focus{border-color:#2A8A74;}
.pd-modal select option{background:#132218;}
.pd-modal-btns{display:flex;gap:10px;margin-top:20px;}
.pd-modal-btns button{flex:1;padding:12px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;border:none;}
.pd-cancel{background:transparent;border:1px solid rgba(255,255,255,.15)!important;color:var(--muted);}
.pd-save{background:#1B6B5A;color:#fff;}
@media(min-width:680px){.pd-grid{grid-template-columns:1fr 1fr;}.pd-card.full{grid-column:1/-1;}}
/* preparation plan / guide */
.prep-note{font-size:12px;color:#E8C16b;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.28);border-radius:9px;padding:10px 12px;margin-bottom:16px;line-height:1.5;}
.prep-clinic{font-size:14px;color:rgba(255,255,255,.85);line-height:1.6;padding:6px 0;}
.prep-sec{margin-top:18px;}
.prep-sec:first-child{margin-top:0;}
.prep-sec-title{font-size:13px;font-weight:700;color:#7ECFC0;margin-bottom:9px;display:flex;align-items:center;gap:7px;}
.prep-li{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.55;padding:5px 0 5px 16px;position:relative;}
.prep-li:before{content:'';position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:#2A8A74;}
.prep-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.prep-tbl td{padding:8px 9px;border-bottom:1px solid rgba(27,107,90,.12);vertical-align:top;color:rgba(255,255,255,.85);}
.prep-tbl td:first-child{color:var(--muted);width:42%;}
.prep-tbl tr:last-child td{border-bottom:none;}
.prep-med{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid var(--border);margin-bottom:8px;}
.prep-med-name{font-size:13.5px;color:#fff;font-weight:500;}
.prep-med-note{font-size:12px;color:var(--muted);}
.prep-med.hr{background:rgba(232,168,56,.1);border-color:rgba(232,168,56,.32);}
.prep-med-tag{font-size:11.5px;font-weight:700;color:#E8C16b;}
.prep-chk{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px solid rgba(27,107,90,.1);cursor:pointer;}
.prep-chk:last-child{border-bottom:none;}
.prep-chk input{margin-top:1px;width:18px;height:18px;accent-color:#2A8A74;flex-shrink:0;}
.prep-chk span{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.5;}
.prep-chk input:checked + span{color:var(--hint);text-decoration:line-through;}
.prep-special{font-size:13.5px;color:rgba(255,255,255,.85);line-height:1.55;padding:9px 11px;border-radius:9px;background:rgba(27,107,90,.1);border:1px solid rgba(42,138,116,.28);margin-bottom:8px;}
.prep-foot{font-size:12px;color:var(--hint);margin-top:18px;line-height:1.55;border-top:1px solid rgba(27,107,90,.12);padding-top:12px;}
/* always-on status panel (journey spine) */
.sp-card{background:linear-gradient(135deg,rgba(27,107,90,.18),rgba(27,107,90,.05));border:1px solid rgba(42,138,116,.42);border-radius:15px;padding:18px 22px;margin-bottom:16px;}
.sp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
.sp-stage{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#7ECFC0;}
.sp-header{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:#fff;margin-top:3px;}
.sp-pill{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;white-space:nowrap;background:rgba(255,255,255,.06);border:1px solid var(--border);color:#fff;}
.sp-conn{font-size:13px;color:var(--muted);margin-top:11px;}
.sp-action{margin-top:12px;}
.sp-btn{font-size:13px;font-weight:600;padding:10px 16px;border-radius:9px;background:#1B6B5A;color:#fff;border:none;cursor:pointer;font-family:inherit;}
.sp-btn:hover{background:#2A8A74;}
.sp-btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#cfe;}
.sp-btn.ghost:hover{background:rgba(255,255,255,.12);color:#fff;}
.sp-btn[disabled]{pointer-events:none;}
.sp-hint{font-size:12px;color:var(--hint);margin-top:7px;}
.sp-pending{display:inline-block;font-size:13.5px;font-weight:600;color:#E8C16b;background:rgba(232,168,56,.12);border:1px solid rgba(232,168,56,.3);border-radius:9px;padding:9px 14px;}
.sp-pending.ok{color:#5ee393;background:rgba(37,211,102,.12);border-color:rgba(37,211,102,.3);}
.sp-pending.warn{color:#ff9b86;background:rgba(192,57,43,.14);border-color:rgba(192,57,43,.35);margin-bottom:8px;}
.req-card{margin-top:14px;border-radius:11px;padding:13px 14px;border:1px solid rgba(232,168,56,.4);background:rgba(232,168,56,.08);}
.req-card.ok{border-color:rgba(37,211,102,.4);background:rgba(37,211,102,.08);}
.req-h{font-size:14px;font-weight:700;color:#E8C16b;margin-bottom:9px;}
.req-card.ok .req-h{color:#5ee393;}
.req-item{padding:7px 0;border-top:1px solid rgba(255,255,255,.08);}
.req-item:first-of-type{border-top:none;}
.req-label{font-size:13.5px;color:#fff;font-weight:600;}
.req-note{font-size:12.5px;color:var(--muted);margin-top:2px;}
.req-foot{font-size:12px;color:var(--hint);margin-top:10px;}
.dir-search{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:#fff;font-size:14px;font-family:inherit;outline:none;margin:6px 0 12px;box-sizing:border-box;min-height:44px;}
.dir-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(27,107,90,.12);}
.dir-row:last-child{border-bottom:none;}
.dir-name{font-size:14px;font-weight:600;color:#fff;}
.dir-meta{font-size:12.5px;color:var(--muted);margin-top:2px;}
.dir-empty{font-size:13px;color:var(--hint);padding:14px 0;text-align:center;}
.sp-next{font-size:14px;color:#fff;margin-top:11px;padding:11px 14px;background:rgba(255,255,255,.05);border-left:3px solid #2A8A74;border-radius:8px;line-height:1.5;}
.sp-track{display:flex;gap:4px;margin-top:14px;}
.sp-seg{height:5px;flex:1;border-radius:3px;background:rgba(255,255,255,.1);}
.sp-seg.on{background:linear-gradient(90deg,#1B6B5A,#2A8A74,#7ECFC0);}
/* surgery journey cards (UX shell; stepper driven by deriveJourney) */
.sj-sec-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hint);margin:4px 0 10px;}
.sjc{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
.sjc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.sjc-name{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#fff;}
.sjc-facts{font-size:13px;color:var(--muted);margin-top:4px;}
.sjc-pill{font-size:11px;font-weight:700;border-radius:20px;padding:5px 11px;white-space:nowrap;background:rgba(255,255,255,.06);border:1px solid var(--border);color:#fff;}
.sjc-track{display:flex;align-items:flex-start;margin:14px 0 8px;overflow-x:auto;padding-bottom:4px;}
.sjc-step{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;min-width:70px;}
.sjc-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:rgba(255,255,255,.07);color:var(--hint);border:1px solid var(--border);}
.sjc-step.done .sjc-dot{background:#2A8A74;color:#fff;border-color:#2A8A74;}
.sjc-step.now .sjc-dot{border-color:#7ECFC0;color:#7ECFC0;}
.sjc-lbl{font-size:10px;color:var(--muted);white-space:nowrap;}
.sjc-step.done .sjc-lbl,.sjc-step.now .sjc-lbl{color:#fff;}
.sjc-line{flex:1;height:2px;min-width:12px;background:rgba(255,255,255,.12);margin-top:11px;}
.sjc-next{font-size:13.5px;color:#fff;margin:6px 0 12px;}
.sjc-next b{color:#7ECFC0;}
.sjc-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.sjc-cta{background:#1B6B5A;color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.sjc-cta:hover{background:#2A8A74;}
.sjc-edit{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:10px 14px;font-size:13px;cursor:pointer;font-family:inherit;}
.sjc.past{opacity:.72;}
/* full preparation-plan modal */
.ppm-bg{display:none;position:fixed;inset:0;background:rgba(5,12,9,.74);z-index:1300;align-items:flex-start;justify-content:center;padding:28px 16px;overflow-y:auto;}
.ppm-bg.open{display:flex;}
.ppm{background:#0C1F18;border:1px solid rgba(27,107,90,.3);border-radius:16px;padding:22px;max-width:620px;width:100%;}
.ppm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.ppm-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="nb-placeholder"></div>

<div id="app">
  <div class="pd-wrap">
    <div class="pd-hi" id="pd-hi">My dashboard</div>
    <div class="pd-hi-sub" id="pd-hi-sub">Your surgery journey.</div>

    <!-- ALWAYS-ON STATUS PANEL (journey spine) -->
    <div class="sp-card" id="status-panel"></div>

    <div class="pd-grid">

      <!-- MY SURGERY JOURNEY (multi-surgery shell; status derived from journey.js) -->
      <div class="pd-card full" id="journey-card">
        <div class="pd-card-title">&#129658; My surgeries
          <button class="edit" onclick="openSurgery(null)">+ Add surgery</button></div>
        <div class="sj-sec-label" id="upcoming-label" style="display:none;">Upcoming</div>
        <div id="journey-upcoming"></div>
        <div class="sj-sec-label" id="past-label" style="display:none;">Past surgeries</div>
        <div id="journey-past"></div>
      </div>

      <!-- QUESTIONNAIRE STATUS -->
      <div class="pd-card">
        <div class="pd-card-title">&#128203; Questionnaire</div>
        <div id="quest-body"></div>
      </div>

      <!-- QUESTION STATUS -->
      <div class="pd-card">
        <div class="pd-card-title">&#128172; My questions <a href="/v2/ask.html" class="edit" style="text-decoration:none;">Ask</a></div>
        <div id="q-body"></div>
      </div>

      <!-- EDUCATION PROGRESS -->
      <div class="pd-card">
        <div class="pd-card-title">&#127979; Education <a href="/v2/videos.html" class="edit" style="text-decoration:none;">Browse</a></div>
        <div id="edu-body"></div>
      </div>

      <!-- RECENT ACTIVITY -->
      <div class="pd-card full">
        <div class="pd-card-title">&#128340; Recent activity</div>
        <div id="activity-body"></div>
      </div>

    </div>
  </div>
</div>

<!-- Surgery edit modal -->
<div class="pd-modal-bg" id="surgery-modal" onclick="if(event.target===this)closeSurgery()">
  <div class="pd-modal">
    <h3>My surgery details</h3>
    <label>Procedure type</label>
    <select id="m-proc">
      <option value="">Select…</option>
      <option>C-Section / Childbirth</option><option>Orthopedic Surgery</option>
      <option>Dental & Oral Surgery</option><option>ENT Surgery</option>
      <option>Plastic Surgery</option><option>Oncogynecology</option>
      <option>Urology</option><option>General / Other Surgery</option>
    </select>
    <label>Surgery date</label><input type="date" id="m-date">
    <label>Hospital</label><input type="text" id="m-hospital" placeholder="Hospital name">
    <label>Surgeon</label><input type="text" id="m-surgeon" placeholder="Surgeon name">
    <label>Anesthesia type (if known)</label>
    <select id="m-anes"><option value="">Not sure yet</option><option>General</option><option>Spinal</option><option>Epidural</option><option>Regional block</option><option>Sedation</option><option>Local</option></select>
    <div class="pd-modal-btns">
      <button class="pd-cancel" onclick="closeSurgery()">Cancel</button>
      <button class="pd-save" id="m-save" onclick="saveSurgery()">Save</button>
    </div>
  </div>
</div>

<!-- Preparation Plan modal (origin-aware: educational guide for patient origin) -->
<div class="ppm-bg" id="prep-modal" onclick="if(event.target===this)closePrep()">
  <div class="ppm">
    <div class="ppm-head"><div class="ppm-title">&#128203; Preparation plan</div>
      <button class="btn-sm" onclick="closePrep()">Close</button></div>
    <div id="prep-modal-body"></div>
  </div>
</div>

<!-- Clinician directory modal (connect to a clinician for review) -->
<div class="pd-modal-bg" id="dir-modal" onclick="if(event.target===this)closeDirectory()">
  <div class="pd-modal">
    <div class="pd-m-head"><div class="pd-m-title">Connect a clinician</div>
      <button class="btn-sm" onclick="closeDirectory()">Close</button></div>
    <div style="font-size:12.5px;color:var(--muted);margin:2px 0 4px;">Choose an anesthesiologist to review your questionnaire and prepare your plan.</div>
    <input id="dir-search" class="dir-search" placeholder="Search name, specialty, or clinic…" oninput="renderDirectory()">
    <div id="dir-list"></div>
  </div>
</div>

<script>
function ge(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var _uid = null, _surgery = null, _activity = [];
var _quest = null, _prepChecklist = {}, _careRequest = null, _docPlan = null;
var _surgeries = [], _editId = null;

// ── ALWAYS-ON STATUS PANEL (derived from the single source of truth) ──
function renderStatusPanel(){
  var panel = ge('status-panel'); if(!panel || !window.deriveJourney) return;
  var d = window.deriveJourney({
    hasSurgery: !!(_surgery && _surgery.procedure_type),
    questionnaireStatus: _quest ? (_quest.status === 'submitted' ? 'submitted' : 'in_progress') : 'none',
    careRequestStatus: _careRequest ? _careRequest.status : 'none',
    doctorName: (_careRequest && _careRequest.doctor_name) ? _careRequest.doctor_name : 'your clinician',
    reviewState: _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted',
    readyAt: _surgery && _surgery.ready_at,
    completedAt: _surgery && _surgery.completed_at,
    recoveryStartedAt: _surgery && _surgery.recovery_started_at,
    archivedAt: _surgery && _surgery.archived_at,
    reviewerNotes: _quest ? _quest.reviewer_notes : ''
  });
  var total = window.JOURNEY_TOTAL_STAGES || 10;
  var segs = '';
  for(var i=1;i<=total;i++){ segs += '<div class="sp-seg'+(i<=d.stage?' on':'')+'"></div>'; }
  panel.innerHTML =
    '<div class="sp-top">' +
      '<div><div class="sp-stage">Stage '+d.stage+' of '+total+'</div>' +
        '<div class="sp-header">'+esc(d.header)+'</div></div>' +
      '<div class="sp-pill">'+d.pill+' '+esc(d.pillLabel)+'</div>' +
    '</div>' +
    '<div class="sp-conn">'+esc(d.connectionLine)+'</div>' +
    '<div class="sp-next">'+esc(d.nextStep)+'</div>' +
    spConnectAction() +
    requirementsHtml() +
    '<div class="sp-track">'+segs+'</div>';
}
// Doctor-requested clinical requirements (read-only; never includes internal notes).
function requirementsHtml(){
  if(!_docPlan) return '';
  var reqs = (_docPlan.requirements || []).filter(function(r){ return r && r.checked; });
  if(!reqs.length) return '';
  var rs = _docPlan.review_state || 'not_submitted';
  var approved = rs === 'approved';
  var head = approved ? '&#9989; Your reviewed preparation plan'
                      : '&#9888; Your anesthesiologist requested additional preparation';
  return '<div class="req-card'+(approved?' ok':'')+'"><div class="req-h">'+head+'</div>' +
    reqs.map(function(r){
      return '<div class="req-item"><div class="req-label">'+esc(r.label||'')+'</div>' +
        (r.note ? '<div class="req-note">'+esc(r.note)+'</div>' : '') + '</div>';
    }).join('') +
    (approved ? '' : '<div class="req-foot">Complete these, then resubmit for review.</div>') +
    '</div>';
}
async function reloadDoctorPlan(){
  _docPlan = null;
  if(!_surgery || !_surgery.id) return;
  var rs = _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted';
  if(rs !== 'changes_requested' && rs !== 'approved') return;   // nothing shared yet
  try {
    var r = await window.sb.rpc('get_patient_plan', { p_surgery_id: _surgery.id });
    if(r && !r.error) _docPlan = r.data || null;
  } catch(e){ /* graceful */ }
}
// Contextual attachment action (Epic B): connect / cancel pending / switch.
function spConnectAction(){
  var crs = _careRequest ? _careRequest.status : 'none';
  var rs  = _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted';
  var dn  = (_careRequest && _careRequest.doctor_name) ? esc(_careRequest.doctor_name) : 'your clinician';
  // ── Connection layer ──
  if(crs !== 'accepted'){
    if(crs === 'requested') return '<div class="sp-action"><button class="sp-btn ghost" onclick="cancelRequest()">Cancel request</button></div>';
    return '<div class="sp-action"><button class="sp-btn" onclick="openDirectory()">&#129658; Request Review</button></div>';
  }
  // ── Connected: review-submission layer (review_state) ──
  if(rs === 'pending')   return '<div class="sp-action"><div class="sp-pending">&#9203; Awaiting clinician review</div></div>';
  if(rs === 'in_review') return '<div class="sp-action"><div class="sp-pending">&#128994; Under review by '+dn+'</div></div>';
  if(rs === 'approved')  return '<div class="sp-action"><div class="sp-pending ok">&#9989; Reviewed by '+dn+'</div></div>';
  if(rs === 'changes_requested')
    return '<div class="sp-action"><div class="sp-pending warn">&#9888; Doctor requested additional preparation — see the requirements below, then resubmit</div>' +
           '<button class="sp-btn" onclick="submitForReview()">Resubmit for Review</button></div>';
  // not_submitted (connected): gated Submit for Review
  var qDone = !!(_quest && _quest.status === 'submitted');
  var cDone = prepChecklistComplete();
  var out;
  if(qDone && cDone){
    out = '<button class="sp-btn" onclick="submitForReview()">&#9989; Submit for Review</button>';
  } else {
    var miss = !qDone ? 'Complete your questionnaire' : 'Finish the preparation checklist';
    out = '<button class="sp-btn" disabled style="opacity:.5;cursor:default;">Submit for Review</button>' +
          '<div class="sp-hint">'+miss+' to enable.</div>';
  }
  out += '<button class="sp-btn ghost" style="margin-left:8px;" onclick="switchClinician()">Change clinician</button>';
  return '<div class="sp-action">'+out+'</div>';
}
async function submitForReview(){
  if(!_surgery || !_surgery.id) return;
  try {
    var r = await window.sb.rpc('submit_for_review', { p_surgery_id: _surgery.id });
    if(r && r.error) throw new Error(r.error.message);
  } catch(e){
    var sp = document.querySelector('.sp-action');
    if(sp) sp.insertAdjacentHTML('beforeend','<div class="sp-hint" style="color:#ff9b86;">'+esc(e.message||'Could not submit.')+'</div>');
    return;
  }
  try { _quest = await window.getQuestionnaire(_uid); } catch(e){}
  await reloadDoctorPlan();
  renderStatusPanel(); renderJourney(); scheduleSync();
  // lock the open guide if visible
  if(ge('prep-modal') && ge('prep-modal').classList.contains('open')){ ge('prep-modal-body').innerHTML = prepContentHtml(); }
  addActivity('Submitted for clinician review', Date.now()); renderActivity();
}
window.submitForReview = submitForReview;

// ── CLINICIAN CONNECTION (Epic B — wired to bridge RPCs) ──
var _directory = [];
async function reloadCareRequest(){
  try {
    var crq = await window.sb.from('care_requests').select('*')
      .eq('patient_id', _uid).in('status', ['requested','accepted'])
      .order('requested_at', { ascending: false }).maybeSingle();
    _careRequest = crq.data || null;
  } catch(e){ /* graceful */ }
}

// ── Live sync with the clinician side ──────────────────────────────────────
// The doctor updates care_requests (accept/decline) and preop_questionnaires
// (review_state) on their own surface. The patient's already-open tab must
// reflect that without a manual reload. We re-fetch the connection + review
// state and re-render on tab focus, and poll lightly while an outcome from the
// clinician is pending. Scope: connection + review_state only.
var _syncing = false, _syncTimer = null;
function _crStatus(){ return _careRequest ? _careRequest.status : 'none'; }
function _rvState(){ return _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted'; }
async function syncConnectionState(){
  if(!_uid || _syncing) return;
  _syncing = true;
  var prevCr = _crStatus(); var prevRs = _rvState();
  try {
    await reloadCareRequest();
    try { var q = await window.getQuestionnaire(_uid); if(q) _quest = q; } catch(e){}
    await reloadDoctorPlan();
    renderStatusPanel(); renderJourney();
    if(prevRs !== 'changes_requested' && _rvState() === 'changes_requested'){
      addActivity('Your anesthesiologist requested additional preparation', Date.now());
      renderActivity();
    }
    if(prevCr !== 'accepted' && _crStatus() === 'accepted'){
      addActivity('Connected with ' + ((_careRequest && _careRequest.doctor_name) || 'your clinician'), Date.now());
      renderActivity();
    }
  } finally { _syncing = false; }
  scheduleSync();
}
function scheduleSync(){
  if(_syncTimer){ clearTimeout(_syncTimer); _syncTimer = null; }
  // Poll only while the clinician still owes an outcome (acceptance or review).
  var pending = (_crStatus() === 'requested') || (_crStatus() === 'accepted' && _rvState() !== 'approved');
  if(pending && document.visibilityState === 'visible'){
    _syncTimer = setTimeout(syncConnectionState, 20000);
  }
}
function startConnectionSync(){
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') syncConnectionState();
  });
  window.addEventListener('focus', syncConnectionState);
  scheduleSync();
}
async function openDirectory(){
  ge('dir-modal').classList.add('open');
  if(!_surgery || !_surgery.id){
    ge('dir-list').innerHTML = '<div class="dir-empty">Add your surgery first, then connect a clinician.</div>';
    return;
  }
  ge('dir-list').innerHTML = '<div class="dir-empty">Loading clinicians…</div>';
  try {
    var r = await window.sb.rpc('get_clinician_directory');
    _directory = (r && r.data) || [];
  } catch(e){ _directory = []; }
  renderDirectory();
}
function closeDirectory(){ ge('dir-modal').classList.remove('open'); }
function renderDirectory(){
  if(!_surgery || !_surgery.id) return;
  var q = (ge('dir-search').value || '').toLowerCase();
  var list = _directory.filter(function(d){
    if(!q) return true;
    return ((d.name||'')+' '+(d.specialty||'')+' '+(d.clinic||'')).toLowerCase().indexOf(q) >= 0;
  });
  if(!list.length){
    ge('dir-list').innerHTML = '<div class="dir-empty">No clinicians are listed yet. Ask your clinic to enable the patient directory in their settings.</div>';
    return;
  }
  ge('dir-list').innerHTML = list.map(function(d){
    var meta = [d.specialty, d.clinic].filter(Boolean).join(' · ') || 'Anesthesiology';
    return '<div class="dir-row"><div><div class="dir-name">'+esc(d.name||'Clinician')+'</div>' +
      '<div class="dir-meta">'+esc(meta)+'</div></div>' +
      '<button class="btn-sm" onclick="requestClinician(\''+d.id+'\')">Request review</button></div>';
  }).join('');
}
async function requestClinician(doctorId){
  if(!_surgery || !_surgery.id) return;
  try {
    var r = await window.sb.rpc('request_clinician', { p_surgery_id: _surgery.id, p_doctor_id: doctorId, p_message: null });
    if(r && r.error) throw new Error(r.error.message);
  } catch(e){
    ge('dir-list').innerHTML = '<div class="dir-empty" style="color:#ff9b86;">'+esc(e.message||'Could not send request.')+'</div>';
    return;
  }
  closeDirectory();
  await reloadCareRequest(); renderStatusPanel(); renderJourney(); scheduleSync();
  addActivity('Requested clinician review', Date.now()); renderActivity();
}
async function cancelRequest(){
  if(!_surgery || !_surgery.id) return;
  try { await window.sb.rpc('revoke_care_request', { p_surgery_id: _surgery.id }); } catch(e){}
  await reloadCareRequest(); renderStatusPanel(); renderJourney(); scheduleSync();
}
async function switchClinician(){
  if(!_surgery || !_surgery.id) return;
  if(!window.confirm('Disconnect your current clinician and choose another? Any review in progress will be withdrawn.')) return;
  try { await window.sb.rpc('revoke_care_request', { p_surgery_id: _surgery.id }); } catch(e){}
  await reloadCareRequest(); renderStatusPanel(); renderJourney(); scheduleSync();
  openDirectory();
}
window.openDirectory=openDirectory; window.closeDirectory=closeDirectory; window.renderDirectory=renderDirectory;
window.requestClinician=requestClinician; window.cancelRequest=cancelRequest; window.switchClinician=switchClinician;

// ── UPCOMING SURGERY (journey style, no empty placeholder rows) ──
function daysUntil(dateStr){
  try {
    var d = new Date(dateStr); d.setHours(0,0,0,0);
    var t = new Date(); t.setHours(0,0,0,0);
    return Math.round((d - t) / 86400000);
  } catch(e){ return null; }
}
function countdownStr(dateStr){
  var dd = dateStr ? daysUntil(dateStr) : null;
  if(dd === null) return '';
  if(dd > 1) return 'in ' + dd + ' days';
  if(dd === 1) return 'tomorrow';
  if(dd === 0) return 'today';
  return Math.abs(dd) + ' days ago';
}
// Context for deriveJourney for a given surgery (Option A: questionnaire/review per-patient)
function journeyCtx(s){
  return {
    hasSurgery: !!(s && s.procedure_type),
    questionnaireStatus: _quest ? (_quest.status === 'submitted' ? 'submitted' : 'in_progress') : 'none',
    careRequestStatus: _careRequest ? _careRequest.status : 'none',
    doctorName: (_careRequest && _careRequest.doctor_name) ? _careRequest.doctor_name : 'your clinician',
    reviewState: _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted',
    readyAt: s && s.ready_at, completedAt: s && s.completed_at,
    recoveryStartedAt: s && s.recovery_started_at, archivedAt: s && s.archived_at,
    reviewerNotes: _quest ? _quest.reviewer_notes : ''
  };
}
// 6-step journey stepper, REACHED computed from derived journey_status only.
var SJ_STEPS = ['Added','Questionnaire','Preparation','Review','Ready','Surgery'];
function reached6(js, qSubmitted){
  // steps: 1 Added · 2 Questionnaire · 3 Preparation · 4 Review · 5 Ready · 6 Surgery
  switch(js){
    case 'archived': case 'in_recovery': case 'completed': return 6;
    case 'ready_for_surgery': return 6;                 // Ready done -> at Surgery
    case 'plan_approved': return 5;                     // Review done -> at Ready
    case 'submitted_for_review': case 'in_review': case 'changes_requested': return 4; // Q + Preparation done -> at Review
    default: return qSubmitted ? 3 : 2;                 // surgery added; Questionnaire done -> at Preparation
  }
}
function sjStepper(d, qSubmitted){
  var r = reached6(d.journeyStatus, qSubmitted);
  return '<div class="sjc-track">' + SJ_STEPS.map(function(st,i){
    var n = i+1, cls = n<r ? 'done' : (n===r ? 'now' : '');
    return '<div class="sjc-step '+cls+'"><span class="sjc-dot">'+(n<r?'&#10003;':n)+'</span><span class="sjc-lbl">'+st+'</span></div>';
  }).join('<span class="sjc-line"></span>') + '</div>';
}
// Primary CTA per derived stage. The prep CTA opens the origin-aware guide.
function sjCTA(s, d){
  var js = d.journeyStatus;
  if(js==='completed' || js==='in_recovery' || js==='archived')
    return '<a class="sjc-cta" href="/v2/recovery.html">&#10084;&#65039; Recovery information</a>';
  if(js==='ready_for_surgery')
    return '<button class="sjc-cta" onclick="openPrep()">&#9989; Surgery-day instructions</button>';
  if(_quest && _quest.status==='submitted')
    return '<button class="sjc-cta" onclick="openPrep()">&#128203; View Preparation Plan</button>';
  return '<a class="sjc-cta" href="/v2/questionnaire.html">&#128203; '+(_quest?'Continue':'Start')+' Questionnaire</a>';
}
function surgeryCardHtml(s, isPast){
  var d = window.deriveJourney(journeyCtx(s));
  var facts = [];
  if(s.surgery_date){ var cd = countdownStr(s.surgery_date);
    facts.push('&#128197; '+new Date(s.surgery_date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})+(cd?' &middot; '+cd:'')); }
  if(s.hospital) facts.push('&#127973; '+esc(s.hospital));
  if(s.surgeon) facts.push('&#129658; '+esc(s.surgeon));
  var qSub = !!(_quest && _quest.status==='submitted');
  return '<div class="sjc'+(isPast?' past':'')+'">' +
    '<div class="sjc-head"><div>' +
      '<div class="sjc-name">'+esc(s.procedure_type||'Your surgery')+'</div>' +
      (facts.length?'<div class="sjc-facts">'+facts.join(' &middot; ')+'</div>':'') +
    '</div><div class="sjc-pill">'+d.pill+' '+esc(d.pillLabel)+'</div></div>' +
    sjStepper(d, qSub) +
    '<div class="sjc-next">&#10148; Next: <b>'+esc(d.nextStep)+'</b></div>' +
    '<div class="sjc-actions">' + sjCTA(s, d) +
      '<button class="sjc-edit" onclick="openSurgery(\''+(s.id||'')+'\')">Edit</button>' +
    '</div></div>';
}
function renderJourney(){
  var up = ge('journey-upcoming'), past = ge('journey-past');
  if(!up || !past) return;
  if(!_surgeries.length){
    ge('upcoming-label').style.display='none'; ge('past-label').style.display='none';
    up.innerHTML =
      '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;">' +
      '<div><div style="font-size:15px;color:#fff;font-weight:500;">No surgery added yet</div>' +
      '<div style="font-size:13px;color:var(--muted);margin-top:3px;">Add your procedure to start your step-by-step journey.</div></div>' +
      '<button class="btn-sm" onclick="openSurgery(null)">Add my surgery</button></div>';
    past.innerHTML=''; return;
  }
  var upList = _surgeries.filter(function(s){ return !s.completed_at && !s.archived_at; });
  var pastList = _surgeries.filter(function(s){ return s.completed_at || s.archived_at; });
  ge('upcoming-label').style.display = upList.length ? 'block' : 'none';
  ge('past-label').style.display = pastList.length ? 'block' : 'none';
  up.innerHTML = upList.map(function(s){ return surgeryCardHtml(s, false); }).join('') ||
    '<div class="empty">No upcoming surgeries.</div>';
  past.innerHTML = pastList.map(function(s){ return surgeryCardHtml(s, true); }).join('');
}
function openSurgery(id){
  var s = id ? (_surgeries.filter(function(x){ return x.id === id; })[0] || {}) : {};
  _editId = id || null;
  ge('m-proc').value = s.procedure_type || '';
  ge('m-date').value = s.surgery_date || '';
  ge('m-hospital').value = s.hospital || '';
  ge('m-surgeon').value = s.surgeon || '';
  ge('m-anes').value = s.anesthesia_type || '';
  ge('surgery-modal').classList.add('open');
}
function closeSurgery(){ ge('surgery-modal').classList.remove('open'); }
async function loadSurgeries(){
  try {
    var r = await window.sb.from('patient_surgeries').select('*')
      .eq('patient_id', _uid).order('surgery_date', { ascending: true, nullsFirst: false });
    _surgeries = (r && r.data) || [];
  } catch(e){ _surgeries = []; }
  // Active surgery drives the status panel / prep (Option A: one review per patient).
  var active = _surgeries.filter(function(s){ return !s.archived_at && !s.completed_at; });
  _surgery = active[0] || _surgeries[0] || null;
}
async function saveSurgery(){
  ge('m-save').disabled = true; ge('m-save').textContent = 'Saving…';
  var rec = {
    patient_id: _uid,
    procedure_type: ge('m-proc').value || null,
    surgery_date: ge('m-date').value || null,
    hospital: ge('m-hospital').value || null,
    surgeon: ge('m-surgeon').value || null,
    anesthesia_type: ge('m-anes').value || null,
    // Self-service dashboard = patient-initiated journey. Preserve an existing
    // clinic origin if one was set elsewhere. (Phase-1: single row per patient
    // via UNIQUE(patient_id); true multi-surgery insert arrives with Phase-0 schema.)
    origin: (_surgery && _surgery.origin) ? _surgery.origin : 'patient'
  };
  try {
    await window.sb.from('patient_surgeries').upsert(rec, { onConflict: 'patient_id' });
  } catch(e){ console.error('save surgery:', e.message); }
  ge('m-save').disabled = false; ge('m-save').textContent = 'Save';
  closeSurgery();
  await loadSurgeries();
  renderJourney();
  renderStatusPanel();
}

// ── QUESTIONNAIRE STATUS ──────────────────────────────────
function renderQuestionnaire(q){
  var body = ge('quest-body');
  if(!q){
    body.innerHTML = '<div style="font-size:14px;color:var(--muted);margin-bottom:12px;">Not started yet.</div>' +
      '<a href="/v2/questionnaire.html" class="btn-sm">Start questionnaire</a>';
    return;
  }
  if(q.status === 'submitted'){
    window._pdQuest = q;  // keep for summary/print
    var when = q.submitted_at || q.updated_at;
    var dateFmt = when ? new Date(when).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}) : '';
    var flags = q.risk_flags || [];
    body.innerHTML =
      '<div style="font-size:15px;color:#fff;font-weight:600;">&#10003; Questionnaire complete</div>' +
      (dateFmt ? '<div style="font-size:13px;color:var(--muted);margin-top:3px;">Completed '+dateFmt+'</div>' : '') +
      '<div style="font-size:13px;color:var(--muted);margin-top:2px;">Your educational preparation guide is ready.</div>' +
      (flags.length ? '<div class="pdq-flags">'+flags.map(function(f){return '<span class="pdq-flag">&#9888; '+f+'</span>';}).join('')+'</div>' : '') +
      '<div class="pdq-btns">' +
        '<button class="btn-sm" onclick="openPrep()">View Preparation Plan</button>' +
        '<button class="btn-sm" onclick="pdSummary()">View summary</button>' +
        '<button class="btn-sm" onclick="pdPrint()">Print / Download PDF</button>' +
      '</div>';
    return;
  }
  var pct = q.completion != null ? q.completion : 0;
  body.innerHTML =
    '<div class="prog-pct" style="font-size:26px;">'+pct+'%</div>' +
    '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>' +
    '<div style="font-size:13px;color:var(--muted);margin:6px 0 12px;">In progress.</div>' +
    '<a href="/v2/questionnaire.html" class="btn-sm">Continue questionnaire</a>';
}

// View summary + Print/PDF for the registered patient's questionnaire
function pdSummary(){
  var q = window._pdQuest; if(!q) return;
  var a = q.answers || {};
  var flags = q.risk_flags || [];
  var rows = Object.keys(a).map(function(k){
    var v = a[k]; if(v && typeof v === 'object') v = Array.isArray(v) ? v.join(', ') : JSON.stringify(v);
    return '<tr><td>'+k+'</td><td>'+(v==null?'—':String(v))+'</td></tr>';
  }).join('');
  var m = document.getElementById('pd-modal');
  document.getElementById('pd-modal-body').innerHTML =
    '<div class="pd-m-head"><div class="pd-m-title">Questionnaire summary</div>' +
    '<button class="btn-sm" onclick="document.getElementById(\'pd-modal\').classList.remove(\'open\')">Close</button></div>' +
    '<div style="font-size:13px;color:var(--muted);margin-bottom:10px;">Completion '+(q.completion!=null?q.completion:100)+'%' +
      (q.submitted_at?' · '+new Date(q.submitted_at).toLocaleDateString():'')+'</div>' +
    (flags.length?'<div class="pdq-flags" style="margin-bottom:12px;">'+flags.map(function(f){return '<span class="pdq-flag">&#9888; '+f+'</span>';}).join('')+'</div>':'') +
    '<table class="pd-table">'+(rows||'<tr><td>No answers recorded</td><td></td></tr>')+'</table>';
  m.classList.add('open');
}
function pdPrint(){
  var q = window._pdQuest; if(!q) return;
  var a = q.answers || {};
  var flags = q.risk_flags || [];
  var rows = Object.keys(a).map(function(k){
    var v = a[k]; if(v && typeof v === 'object') v = Array.isArray(v) ? v.join(', ') : JSON.stringify(v);
    return '<tr><td>'+k+'</td><td>'+(v==null?'':String(v))+'</td></tr>';
  }).join('');
  var win = window.open('','_blank'); if(!win){ return; }
  win.document.write('<html><head><title>My pre-op questionnaire</title>' +
    '<style>body{font-family:Arial,sans-serif;color:#111;max-width:700px;margin:24px auto;padding:0 16px;}' +
    'h1{font-size:20px;}h2{font-size:13px;text-transform:uppercase;color:#1B6B5A;border-bottom:1px solid #ddd;padding-bottom:4px;margin-top:20px;}' +
    'table{width:100%;border-collapse:collapse;font-size:13px;}td{padding:6px 8px;border-bottom:1px solid #eee;}td:first-child{color:#555;width:42%;}' +
    '.flag{display:inline-block;background:#fff7e6;border:1px solid #f0c674;color:#8a5a00;border-radius:5px;padding:3px 8px;font-size:12px;margin:2px 4px 2px 0;}.noprint{margin-top:18px;}</style></head><body>' +
    '<h1>Pre-operative questionnaire</h1>' +
    '<div>Completion '+(q.completion!=null?q.completion:100)+'%'+(q.submitted_at?' · Completed '+new Date(q.submitted_at).toLocaleDateString():'')+'</div>' +
    '<h2>Risk flags</h2>'+(flags.length?flags.map(function(f){return '<span class="flag">⚠ '+f+'</span>';}).join(''):'<div>None identified.</div>') +
    '<h2>Answers</h2><table>'+(rows||'<tr><td>No answers</td><td></td></tr>')+'</table>' +
    '<p class="noprint"><button onclick="window.print()" style="padding:10px 18px;cursor:pointer;">Print / Save as PDF</button></p></body></html>');
  win.document.close();
}
window.pdSummary = pdSummary; window.pdPrint = pdPrint;

// ── PREPARATION PLAN ──────────────────────────────────────
// origin drives the stage: clinic-initiated keeps the "being prepared"
// message; patient-initiated gets an immediate educational guide.
function prepOrigin(){ return (_surgery && _surgery.origin) ? _surgery.origin : 'patient'; }

// Medications the patient is NOT told to start/stop — flagged for review instead.
var PREP_HIGH_RISK = {
  anticoagulants: 'Blood thinners / anticoagulants',
  insulin:        'Insulin',
  glp1:           'GLP-1 medication (e.g. Ozempic, Wegovy, Mounjaro)'
};
var PREP_MED_LABELS = {
  anticoagulants:'Blood thinners / anticoagulants', insulin:'Insulin',
  bp_meds:'Blood pressure medication', steroids:'Steroids',
  glp1:'GLP-1 medication', other:'Other medication(s)'
};

// A clinician is "actually involved" only for clinic-origin surgeries or once a
// patient has connected one (accepted care_request). Req 5: never show the
// "anesthesiologist is preparing your plan" message otherwise.
function prepClinicianInvolved(){
  return prepOrigin() === 'clinic' || (_careRequest && _careRequest.status === 'accepted');
}
function prepContentHtml(){
  // Clinic-initiated journeys keep the placeholder until the reviewed plan lands.
  if(prepOrigin() === 'clinic'){
    return '<div class="prep-clinic">Your anesthesiologist is preparing your personalized surgery plan.</div>';
  }
  // Patient-initiated: the educational guide appears immediately once the
  // questionnaire is submitted - no clinician required.
  if(!_quest || _quest.status !== 'submitted'){
    return '<div style="font-size:14px;color:var(--muted);margin-bottom:12px;">Complete your pre-op questionnaire to unlock your personalized preparation guide.</div>' +
      '<a href="/v2/questionnaire.html" class="btn-sm">' + (_quest ? 'Continue questionnaire' : 'Start questionnaire') + '</a>';
  }
  return prepBuildGuide(_quest);
}
function openPrep(){
  var body = ge('prep-modal-body'); if(!body) return;
  body.innerHTML = prepContentHtml();
  ge('prep-modal').classList.add('open');
}
function closePrep(){ ge('prep-modal').classList.remove('open'); }
window.openPrep = openPrep; window.closePrep = closePrep;

// Top-of-guide banner reflecting the real review state (single source of truth).
function prepReviewBanner(){
  var rs = _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted';
  var connected = _careRequest && _careRequest.status === 'accepted';
  var dn = (_careRequest && _careRequest.doctor_name) ? esc(_careRequest.doctor_name) : 'your anesthesiologist';
  if(rs === 'approved')
    return '<div class="prep-note" style="color:#5ee393;background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.3);">&#10003; Reviewed and approved by '+dn+'. This guide reflects their guidance.</div>';
  if(rs === 'changes_requested')
    return '<div class="prep-note">&#9888; '+dn+' requested more information. Update your questionnaire and resubmit. Meanwhile, here is your educational guide.</div>';
  if(rs === 'in_review' || rs === 'pending' || connected)
    return '<div class="prep-note">&#9888; Educational preparation guide. '+dn+' is reviewing your questionnaire and a reviewed plan will follow. Always follow the instructions your surgical and anesthesia team give you.</div>';
  // No clinician involved yet - do NOT imply one is preparing a plan.
  return '<div class="prep-note">&#9888; Educational preparation guide - not yet reviewed by a clinician. Connect a clinician to have it reviewed. Always follow the instructions your surgical and anesthesia team give you.</div>';
}

function prepBuildGuide(q){
  var a = q.answers || {};
  var flags = q.risk_flags || [];
  var s = _surgery || {};
  var h = '';

  // Context-aware banner: only imply a clinician when one is actually involved.
  h += prepReviewBanner();

  // 1. Surgery summary
  var sumRows = '';
  sumRows += '<tr><td>Procedure</td><td>'+esc(s.procedure_type || 'Not added yet')+'</td></tr>';
  if(s.surgery_date){
    var dd = daysUntil(s.surgery_date);
    var when = dd>1?('in '+dd+' days'):dd===1?'tomorrow':dd===0?'today':(Math.abs(dd)+' days ago');
    var df = new Date(s.surgery_date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
    sumRows += '<tr><td>Date</td><td>'+esc(df)+' &middot; '+esc(when)+'</td></tr>';
  }
  if(s.hospital) sumRows += '<tr><td>Hospital</td><td>'+esc(s.hospital)+'</td></tr>';
  if(s.surgeon)  sumRows += '<tr><td>Surgeon</td><td>'+esc(s.surgeon)+'</td></tr>';
  sumRows += '<tr><td>Anesthesia</td><td>'+esc(s.anesthesia_type || 'To be decided with your anesthesiologist')+'</td></tr>';
  h += prepSec('&#129656; Surgery summary', '<table class="prep-tbl">'+sumRows+'</table>');

  // 2. Preparation checklist (general, things to do before the day)
  h += prepSec('&#9989; Preparation checklist', prepChecklistHtml('prepare', [
    'Confirm your surgery date, arrival time, and where to check in',
    'Write down a full list of your medications, doses, and supplements',
    'Note any allergies and past reactions to anesthesia',
    'Arrange a responsible adult to take you home and stay with you',
    'Prepare comfortable, loose clothing and flat shoes for the day',
    'Write down questions you want to ask your anesthesiologist'
  ]));

  // 3. Fasting information
  h += prepSec('&#9201; Fasting information', '<table class="prep-tbl">' +
    '<tr><td>Solid food / milk</td><td>Usually stop at least 6 hours before surgery</td></tr>' +
    '<tr><td>Clear fluids (water, clear juice, black coffee/tea)</td><td>Usually allowed up to 2 hours before</td></tr>' +
    '<tr><td>Chewing gum / sweets</td><td>Avoid on the day of surgery</td></tr>' +
    '<tr><td>Alcohol</td><td>Avoid for 24 hours before</td></tr>' +
    '</table><div class="prep-li" style="margin-top:6px;">These are general timings — your team may give you exact fasting times to follow instead.</div>');

  // 4. What to bring
  h += prepSec('&#129509; What to bring', [
    'Photo ID and any hospital paperwork or appointment letters',
    'A complete written list of your medications and allergies',
    'Glasses, hearing aids, inhalers, or your CPAP machine if you use one',
    'A small bag with essentials; leave jewelry, valuables, and contact lenses at home'
  ].map(function(x){ return '<div class="prep-li">'+esc(x)+'</div>'; }).join(''));

  // 5. General medication review (NO start/stop instructions)
  h += prepSec('&#128138; Medication review', prepMedicationHtml(a));

  // 6. Special instructions based on the patient's answers
  var special = prepSpecial(a, flags);
  if(special.length){
    h += prepSec('&#128221; Special instructions for you',
      special.map(function(x){ return '<div class="prep-special">'+x+'</div>'; }).join(''));
  }

  // 7. Day-of-surgery checklist
  h += prepSec('&#127973; Day-of-surgery checklist', prepChecklistHtml('dayof', [
    'Follow your fasting times exactly',
    'Shower; remove makeup, nail polish, and jewelry',
    'Take only the medications you were told to take, with a small sip of water',
    'Bring your ID, medication list, and essentials',
    'Bring your CPAP, inhaler, or glasses/hearing aids if you use them',
    'Arrive on time and have your ride home arranged'
  ]));

  h += '<div class="prep-foot">This guide is generated from your questionnaire answers for education only. ' +
       'It does not tell you to start, stop, or change any medication. Your anesthesiologist will review your ' +
       'answers and give you the final, personalized plan.</div>';
  return h;
}

function prepSec(title, inner){
  return '<div class="prep-sec"><div class="prep-sec-title">'+title+'</div>'+inner+'</div>';
}

function prepMedicationHtml(a){
  var meds = a.medications || [];
  var banner = '<div class="prep-note" style="color:#cfe;background:rgba(27,107,90,.12);border-color:rgba(42,138,116,.3);">' +
    'Do <b>not</b> start, stop, or change any medication on your own. Bring a full list of everything you take. ' +
    'Your anesthesiologist will tell you what to do with each one.</div>';
  if(!meds.length){
    return banner + '<div class="prep-li">No regular medications reported. Still bring a list of anything you take, including over-the-counter drugs and supplements.</div>';
  }
  var rows = meds.map(function(v){
    var label = PREP_MED_LABELS[v] || v;
    if(PREP_HIGH_RISK[v]){
      return '<div class="prep-med hr"><div class="prep-med-name">'+esc(PREP_HIGH_RISK[v])+'</div>' +
             '<div class="prep-med-tag">&#9888; Requires anesthesiologist review</div></div>';
    }
    return '<div class="prep-med"><div class="prep-med-name">'+esc(label)+'</div>' +
           '<div class="prep-med-note">Bring details — your anesthesiologist will advise</div></div>';
  }).join('');
  return banner + rows;
}

function prepSpecial(a, flags){
  flags = flags || [];
  var h = a.history || [], m = a.medications || [];
  var items = [];
  function has(arr, v){ return arr.indexOf(v) >= 0; }
  if(has(h,'sleep_apnea') || flags.indexOf('Sleep apnea')>=0)
    items.push('You reported <b>sleep apnea</b> — bring your CPAP machine and mask, and tell staff on arrival.');
  if(a.difficult_airway === 'yes')
    items.push('You reported a <b>difficult airway / intubation</b> history — make sure your anesthesiologist knows before the procedure.');
  if(a.anes_complication === 'yes')
    items.push('You reported a <b>previous anesthesia complication</b> — share the details with your anesthesiology team.');
  if(a.allergy_present === 'severe')
    items.push('You reported a <b>severe allergy</b>'+(a.allergy_detail?' ('+esc(a.allergy_detail)+')':'')+' — inform staff on arrival and wear an allergy band if offered.');
  if(has(h,'diabetes') || has(m,'insulin'))
    items.push('You reported <b>diabetes / insulin use</b> — blood-sugar and insulin handling on the day requires anesthesiologist review. Do not adjust your insulin yourself.');
  if(has(h,'heart') || flags.indexOf('Heart disease')>=0)
    items.push('You reported <b>heart disease</b> — your anesthesiologist will review your heart history and medications.');
  if(a.smoking === 'yes')
    items.push('You reported <b>smoking</b> — stopping or cutting down before surgery lowers anesthesia and healing risks.');
  return items;
}

// Checklist boxes persist to the existing preop_checklist table (no new silo),
// merged under items.prep_guide so other checklist keys are preserved.
function prepReviewLocked(){
  var rs = _quest ? (_quest.review_state || 'not_submitted') : 'not_submitted';
  return rs !== 'not_submitted';   // submitted/in_review/approved/changes_requested -> checklist locked
}
function prepChecklistHtml(group, labels){
  var saved = (_prepChecklist[group] || []);
  var locked = prepReviewLocked();
  return labels.map(function(x, i){
    var checked = saved[i] ? ' checked' : '';
    return '<label class="prep-chk"><input type="checkbox" data-prep-group="'+group+'" data-prep-i="'+i+'"'+(locked?' disabled':'')+' onchange="prepSaveChecklist()"'+checked+'><span>'+esc(x)+'</span></label>';
  }).join('');
}
// "Preparation checklist complete" = all items of the 'prepare' group checked.
function prepChecklistComplete(){
  var p = (_prepChecklist && _prepChecklist.prepare) || [];
  var done = 0; for(var i=0;i<6;i++){ if(p[i]) done++; }
  return done >= 6;
}

async function prepSaveChecklist(){
  if(!_uid) return;
  var state = {};
  document.querySelectorAll('#prep-modal-body input[data-prep-group]').forEach(function(inp){
    var g = inp.getAttribute('data-prep-group');
    var i = parseInt(inp.getAttribute('data-prep-i'), 10);
    if(!state[g]) state[g] = [];
    state[g][i] = inp.checked;
  });
  _prepChecklist = state;
  try {
    // Merge into existing checklist items so preop_quick/dashboard survive.
    var existing = {};
    try { var c = await window.getChecklist(_uid); existing = (c && c.items) || {}; } catch(e){}
    existing.prep_guide = state;
    await window.saveChecklist(_uid, existing);
  } catch(e){ console.warn('prep checklist save:', e.message); }
}
window.prepSaveChecklist = prepSaveChecklist;

// ── QUESTIONS ─────────────────────────────────────────────
function statusBadge(st){
  var map = {new:'st-new', under_review:'st-review', answered:'st-answered', closed:'st-closed'};
  var label = {new:'New', under_review:'Under review', answered:'Answered', closed:'Closed'};
  st = st || 'new';
  return '<span class="q-status '+(map[st]||'st-new')+'">'+(label[st]||'New')+'</span>';
}
function renderQuestions(qs, replies){
  if(!qs || !qs.length){
    ge('q-body').innerHTML = '<div class="empty">No questions yet. <a href="/v2/ask.html" style="color:#7ECFC0;">Ask one →</a></div>';
    return;
  }
  ge('q-body').innerHTML = qs.slice(0,4).map(function(q){
    var subj = q.subject || q.topic || 'Question';
    var msg = q.message || q.question || '';
    var rep = (replies||[]).filter(function(r){ return r.question_id === q.id; });
    var repHtml = rep.map(function(r){ return '<div class="q-reply"><b>'+esc(r.author_role||'Reply')+':</b> '+esc(r.message)+'</div>'; }).join('');
    return '<div class="q-item"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">' +
      '<div class="q-subj">'+esc(subj)+'</div>'+statusBadge(q.status)+'</div>' +
      (msg?'<div class="q-msg">'+esc(msg)+'</div>':'') + repHtml + '</div>';
  }).join('');
}

// ── EDUCATION ─────────────────────────────────────────────
function renderEducation(vids){
  if(!vids || !vids.length){
    ge('edu-body').innerHTML = '<div class="empty">No videos watched yet. <a href="/v2/videos.html" style="color:#7ECFC0;">Browse educational videos →</a></div>';
    return;
  }
  ge('edu-body').innerHTML = vids.map(function(v){
    var when = v.last_viewed_at ? new Date(v.last_viewed_at).toLocaleDateString() : '';
    return '<div class="edu-item"><span class="edu-ico">'+(v.completed?'&#9989;':'&#127909;')+'</span>' +
      '<div class="edu-main"><div class="edu-title">'+esc(v.video_id)+'</div>' +
      '<div class="edu-meta">'+(v.completed?'Completed':(v.watched_percent||0)+'% watched')+(when?' · '+when:'')+'</div></div></div>';
  }).join('');
}

// ── PROGRESS (5 signals, 20% each) ────────────────────────
var _signals = { procedure:false, questionnaire:false, preop:false, education:false, questions:false };
function computeProgress(){
  _signals.procedure = !!(_surgery && _surgery.procedure_type);
  var pct = 0; var keys = ['procedure','questionnaire','preop','education','questions'];
  keys.forEach(function(k){ if(_signals[k]) pct += 20; });
  ge('prog-pct').textContent = pct;
  ge('prog-fill').style.width = pct + '%';
  var labels = {procedure:'Surgery added',questionnaire:'Questionnaire done',preop:'Read pre-op guide',education:'Watched a video',questions:'Asked a question'};
  ge('prog-items').innerHTML = keys.map(function(k){
    var done = _signals[k];
    return '<div class="prog-item'+(done?' done':'')+'"><span class="dot">'+(done?'&#10003;':'')+'</span>'+labels[k]+'</div>';
  }).join('');
}

// ── RECENT ACTIVITY ───────────────────────────────────────
function renderActivity(){
  _activity.sort(function(a,b){ return (b.t||0) - (a.t||0); });
  var items = _activity.slice(0, 6);
  if(!items.length){
    ge('activity-body').innerHTML = '<div class="empty">No activity yet. Start by adding your surgery or completing your questionnaire.</div>';
    return;
  }
  ge('activity-body').innerHTML = items.map(function(a){
    var when = a.t ? new Date(a.t).toLocaleDateString(undefined,{month:'short',day:'numeric'}) : '';
    return '<div class="tl-stage"><div class="tl-when">'+esc(when)+'</div><div class="tl-tasks"><div class="tl-task">'+esc(a.text)+'</div></div></div>';
  }).join('');
}
function addActivity(text, t){ _activity.push({ text:text, t: t ? new Date(t).getTime() : Date.now() }); }

// ── INIT ──────────────────────────────────────────────────
var _pdDone = false;
var _pdWatchdog = setTimeout(function(){
  if(_pdDone) return;
  console.error('PATIENT DASHBOARD WATCHDOG: exceeded 10s');
  var loader = ge('loader');
  if(loader){
    loader.innerHTML = '<div style="text-align:center;padding:40px;font-family:sans-serif;max-width:340px;">' +
      '<p style="color:#fff;font-size:15px;margin-bottom:10px;">This is taking longer than expected.</p>' +
      '<p style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:18px;">Please refresh or try again.</p>' +
      '<button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;">Refresh</button> ' +
      '<a href="/v2/patients.html" style="color:#7ECFC0;font-size:13px;margin-left:10px;">Back to portal</a></div>';
  }
}, 10000);

document.addEventListener('DOMContentLoaded', async function(){
  try {
    console.log('PATIENT DASHBOARD START');
    var auth = await window.requireAuth();
    if(!auth){ _pdDone = true; clearTimeout(_pdWatchdog); return; }
    _uid = auth.user.id;
    console.log('AUTH SUCCESS', _uid);
    var first = (auth.profile && auth.profile.full_name) ? auth.profile.full_name.split(' ')[0] : auth.user.email.split('@')[0];
    first = first.charAt(0).toUpperCase() + first.slice(1);
    ge('pd-hi').textContent = 'Welcome back, ' + first;

    // Surgeries (multi-surgery shell; graceful if table absent)
    await loadSurgeries();
    if(_surgery && _surgery.procedure_type){ addActivity('Added surgery: ' + _surgery.procedure_type, _surgery.updated_at); }

    // Questionnaire (status card + signal + activity)
    var quest = null;
    try {
      quest = await window.getQuestionnaire(_uid);
      if(quest && (quest.status === 'submitted' || (quest.completion||0) >= 100)) _signals.questionnaire = true;
      if(quest){ addActivity(quest.status === 'submitted' ? 'Submitted pre-op questionnaire' : 'Updated questionnaire ('+(quest.completion||0)+'%)', quest.updated_at); }
    } catch(e){}
    _quest = quest;
    renderQuestionnaire(quest);

    // Active care request (attachment) — graceful if table absent (Epic A foundation)
    try {
      var crq = await window.sb.from('care_requests').select('*')
        .eq('patient_id', _uid).in('status', ['requested','accepted'])
        .order('requested_at', { ascending: false }).maybeSingle();
      _careRequest = crq.data || null;
    } catch(e){ _careRequest = null; }
    await reloadDoctorPlan();
    renderStatusPanel();
    renderJourney();

    // Questions (graceful if status/replies absent)
    try {
      var qr = await window.sb.from('questions').select('*').eq('patient_id', _uid).order('created_at',{ascending:false});
      var myqs = qr.data || [];
      if(myqs.length) _signals.questions = true;
      var replies = [];
      try {
        var ids = myqs.map(function(x){ return x.id; });
        if(ids.length){
          var rr = await window.sb.from('question_replies').select('*').in('question_id', ids);
          replies = rr.data || [];
        }
      } catch(e){}
      renderQuestions(myqs, replies);
      myqs.slice(0,3).forEach(function(q){ addActivity('Asked: ' + (q.subject || q.topic || 'a question'), q.created_at); });
    } catch(e){ renderQuestions([], []); }

    // Education / video progress (graceful if table absent)
    try {
      var vr = await window.sb.from('video_progress').select('*').eq('patient_id', _uid).order('last_viewed_at',{ascending:false});
      var vids = vr.data || [];
      if(vids.length) _signals.education = true;
      renderEducation(vids);
      vids.slice(0,3).forEach(function(v){ addActivity((v.completed?'Completed':'Watched')+' video: ' + v.video_id, v.last_viewed_at); });
    } catch(e){ renderEducation([]); }

    // Pre-op guide read signal (from saved checklist, graceful)
    try {
      var c = await window.getChecklist(_uid);
      if(c && c.items && (c.items.preop_quick || c.items.dashboard)) _signals.preop = true;
      if(c && c.items && c.items.prep_guide) _prepChecklist = c.items.prep_guide;
    } catch(e){}

    // Journey cards already rendered above; refresh now that all signals loaded.
    renderJourney();
    renderActivity();

    // Keep the connection + review status in sync with the clinician side.
    startConnectionSync();

    _pdDone = true; clearTimeout(_pdWatchdog);
    ge('loader').style.display = 'none';
    ge('app').style.display = 'block';
    console.log('PATIENT DASHBOARD READY');
  } catch(e){
    _pdDone = true; clearTimeout(_pdWatchdog);
    console.error('PATIENT DASHBOARD ERROR:', e.message);
    ge('loader').innerHTML = '<div style="text-align:center;padding:30px;font-family:sans-serif;max-width:340px;"><p style="color:rgba(255,160,140,.9);font-size:14px;margin-bottom:10px;">Could not load your dashboard.</p><p style="color:rgba(255,255,255,.4);font-size:12px;margin-bottom:16px;">'+e.message+'</p><button onclick="location.reload()" style="background:#1B6B5A;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;">Try again</button></div>';
  }
});
</script>
<div class="pd-modal-bg" id="pd-modal" onclick="if(event.target===this)this.classList.remove('open')"><div class="pd-modal" id="pd-modal-body"></div></div>
</body>
</html>
