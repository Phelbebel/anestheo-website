<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Center — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/v2/supabase.js"></script>
<script src="/v2/auth.js"></script>
<script src="/v2/navbar.js"></script>
<link rel="stylesheet" href="/v2/styles.css">
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<style>
/* ============================================================
   ADMIN CENTER — Phase 1 (read-only platform control center)
   Anestheo identity: dark green ground, glass surfaces, subtle glow.
   ============================================================ */
#loader{position:fixed;inset:0;background:#0A1A15;z-index:9999;display:flex;align-items:center;justify-content:center;}
.spin{width:30px;height:30px;border:3px solid rgba(27,107,90,.25);border-top-color:#2A8A74;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:none;}

.adm-skip{position:absolute;left:-9999px;top:0;background:#0C1F18;color:#7ECFC0;padding:10px 16px;border-radius:8px;z-index:200;}
.adm-skip:focus{left:12px;top:64px;}

/* ── Shell ─────────────────────────────────────────────── */
.adm-shell{position:relative;z-index:1;display:flex;align-items:flex-start;min-height:calc(100vh - 56px);}
.adm-rail{position:sticky;top:56px;align-self:flex-start;flex:0 0 238px;width:238px;
  max-height:calc(100vh - 56px);overflow-y:auto;padding:22px 14px 34px;
  border-right:1px solid var(--border);background:linear-gradient(180deg,rgba(6,14,10,.72),rgba(6,14,10,.32));}
.adm-main{flex:1;min-width:0;padding:26px 30px 72px;}

.adm-railhead{font-family:var(--serif);font-size:15px;font-weight:700;color:#fff;padding:2px 10px 4px;}
.adm-railsub{font-size:10.5px;color:var(--hint);letter-spacing:.05em;text-transform:uppercase;padding:0 10px 16px;}
.adm-grp{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(126,207,192,.5);
  padding:16px 10px 6px;}
.adm-nav{display:block;font-size:13px;color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:8px;
  transition:background .16s,color .16s;position:relative;}
.adm-nav:hover{background:rgba(27,107,90,.14);color:#fff;}
.adm-nav.on{background:rgba(27,107,90,.24);color:#fff;box-shadow:inset 2px 0 0 #2A8A74;}
.adm-nav .adm-navn{float:right;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums;}
.adm-nav.on .adm-navn{color:var(--accent);}
.adm-nav.locked{color:rgba(255,255,255,.3);}
.adm-nav.locked:hover{background:rgba(255,255,255,.03);color:rgba(255,255,255,.45);}
.adm-lockpill{float:right;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:rgba(232,168,56,.75);border:1px solid rgba(232,168,56,.28);border-radius:4px;padding:1px 5px;margin-top:1px;}
.adm-nav.danger{color:rgba(255,140,120,.72);}
.adm-nav.danger:hover{background:rgba(192,57,43,.12);color:rgba(255,160,140,.95);}

/* ── Header + search ───────────────────────────────────── */
.adm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px;}
.adm-h1{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.15;}
.adm-crumb{font-size:11px;color:var(--hint);letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px;}
.adm-sub{font-size:13px;color:var(--muted);margin-top:5px;max-width:640px;line-height:1.6;}
.adm-searchwrap{position:relative;flex:0 0 320px;max-width:100%;}
.adm-search{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:9px;
  color:#fff;padding:10px 12px 10px 34px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s,background .2s;}
.adm-search:focus{border-color:#2A8A74;background:rgba(27,107,90,.12);}
.adm-search::placeholder{color:rgba(255,255,255,.26);}
.adm-searchico{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--hint);pointer-events:none;}
.adm-kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--hint);
  border:1px solid var(--border);border-radius:4px;padding:1px 5px;pointer-events:none;}

/* ── Glass card ────────────────────────────────────────── */
.gcard{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.022));
  border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:16px;position:relative;overflow:hidden;}
.gcard::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 80% at 0% 0%,rgba(42,138,116,.10),transparent 60%);}
.gcard>*{position:relative;}
.gcard-h{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#7ECFC0;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.gcard-h .gh-note{font-weight:400;letter-spacing:0;text-transform:none;color:var(--hint);font-size:11.5px;}

/* ── Stat grid ─────────────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;}
.stat-c{display:block;text-decoration:none;background:rgba(255,255,255,.035);border:1px solid var(--border);
  border-radius:11px;padding:14px 15px;transition:border-color .18s,background .18s,transform .18s;}
.stat-c:hover{border-color:rgba(42,138,116,.45);background:rgba(27,107,90,.13);transform:translateY(-1px);}
.stat-c:focus-visible{outline:2px solid #7ECFC0;outline-offset:2px;}
.stat-n{font-family:var(--serif);font-size:25px;font-weight:700;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
.stat-l{font-size:10.5px;color:var(--hint);text-transform:uppercase;letter-spacing:.06em;margin-top:7px;line-height:1.4;}
.stat-c.warn .stat-n{color:#E8A838;}
.stat-c.na .stat-n{color:rgba(255,255,255,.22);font-size:19px;}
.stat-c.na{cursor:default;}

/* ── Tables ────────────────────────────────────────────── */
.tbl-wrap{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.028);overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:640px;}
.tbl th{text-align:left;padding:10px 13px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--hint);border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;
  position:sticky;top:0;background:#0C1710;z-index:1;}
.tbl td{padding:10px 13px;border-bottom:1px solid rgba(27,107,90,.1);color:var(--muted);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover td{background:rgba(27,107,90,.07);}
.tbl .nm{color:#fff;font-weight:500;}
.tbl .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--hint);}
.tbl a.olink{color:var(--accent);text-decoration:none;font-size:11.5px;white-space:nowrap;}
.tbl a.olink:hover{text-decoration:underline;}
.empty{text-align:center;color:var(--hint);padding:26px 14px;font-size:12.5px;}

/* ── Badges ────────────────────────────────────────────── */
.bdg{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap;}
.bdg-ok{background:rgba(27,107,90,.22);color:#7ECFC0;border:1px solid rgba(42,138,116,.35);}
.bdg-warn{background:rgba(232,168,56,.13);color:#E8A838;border:1px solid rgba(232,168,56,.3);}
.bdg-bad{background:rgba(192,57,43,.14);color:rgba(255,140,120,.95);border:1px solid rgba(192,57,43,.32);}
.bdg-mute{background:rgba(255,255,255,.05);color:var(--hint);border:1px solid rgba(255,255,255,.1);}
.bdg-info{background:rgba(126,207,192,.1);color:#7ECFC0;border:1px solid rgba(126,207,192,.22);}

/* ── Filter chips ──────────────────────────────────────── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);padding:6px 13px;
  border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;transition:all .18s;}
.chip:hover{border-color:rgba(42,138,116,.4);color:#fff;}
.chip.on{background:rgba(27,107,90,.24);border-color:rgba(42,138,116,.45);color:#fff;}
.chip:focus-visible{outline:2px solid #7ECFC0;outline-offset:2px;}
.fsel,.finput{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;color:#fff;
  padding:6px 9px;font-size:12px;font-family:inherit;outline:none;max-width:200px;}
.fsel:focus,.finput:focus{border-color:#2A8A74;}
.fsel option{background:#132218;}

/* ── Detail view ───────────────────────────────────────── */
.dt-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;justify-content:space-between;margin-bottom:4px;}
.dt-name{font-family:var(--serif);font-size:23px;font-weight:700;color:#fff;}
.dt-meta{font-size:12.5px;color:var(--muted);margin-top:4px;}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px 20px;}
.kv-k{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--hint);margin-bottom:3px;}
.kv-v{font-size:13.5px;color:#fff;word-break:break-word;}
.kv-v.dim{color:var(--muted);}
.kv-v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);}
.tabrow{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border);margin-bottom:16px;padding-bottom:0;}
.tabb{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:9px 14px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:color .18s,border-color .18s;}
.tabb:hover{color:#fff;}
.tabb.on{color:#fff;border-bottom-color:#2A8A74;}
.tabb:focus-visible{outline:2px solid #7ECFC0;outline-offset:-2px;}

/* ── Notices ───────────────────────────────────────────── */
.notice{border-radius:10px;padding:12px 15px;font-size:12.5px;line-height:1.65;margin-bottom:14px;}
.notice b{color:#fff;}
.n-warn{background:rgba(232,168,56,.06);border:1px solid rgba(232,168,56,.24);color:rgba(255,255,255,.72);}
.n-info{background:rgba(126,207,192,.05);border:1px solid rgba(126,207,192,.2);color:rgba(255,255,255,.7);}
.n-bad{background:rgba(192,57,43,.07);border:1px solid rgba(192,57,43,.28);color:rgba(255,255,255,.75);}
.notice code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#7ECFC0;}

.jsonbox{background:rgba(0,0,0,.28);border:1px solid rgba(27,107,90,.16);border-radius:8px;padding:10px 12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:rgba(255,255,255,.66);
  white-space:pre-wrap;word-break:break-word;max-height:230px;overflow:auto;margin-top:6px;}
.lnk{color:var(--accent);text-decoration:none;}
.lnk:hover{text-decoration:underline;}
.mut{color:var(--hint);}
.rowbtn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);border-radius:7px;
  padding:5px 11px;font-size:11.5px;font-family:inherit;cursor:pointer;transition:all .18s;}
.rowbtn:hover{border-color:rgba(42,138,116,.45);color:#fff;}
.rowbtn:focus-visible{outline:2px solid #7ECFC0;outline-offset:2px;}

.meterbar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;min-width:64px;margin-top:5px;}
.meterfill{height:100%;background:linear-gradient(90deg,#1B6B5A,#2A8A74);border-radius:3px;}

/* ── Phase 2: moderation controls (same tokens, no new palette) ────────── */
.selcol{width:34px;}
.selbox{width:16px;height:16px;accent-color:#2A8A74;cursor:pointer;vertical-align:middle;}
.rowact{position:relative;text-align:right;white-space:nowrap;}
.dots{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);
  border-radius:7px;padding:3px 9px;font-size:14px;line-height:1.2;cursor:pointer;font-family:inherit;}
.dots:hover{border-color:rgba(42,138,116,.45);color:#fff;}
.dots:focus-visible{outline:2px solid #7ECFC0;outline-offset:2px;}
.menu{position:absolute;right:0;top:100%;z-index:60;min-width:212px;text-align:left;
  background:#0C1710;border:1px solid var(--border);border-radius:11px;padding:5px;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.9);}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--muted);font-family:inherit;font-size:12.5px;padding:8px 11px;border-radius:7px;cursor:pointer;}
.menu button:hover{background:rgba(27,107,90,.18);color:#fff;}
.menu button:focus-visible{outline:2px solid #7ECFC0;outline-offset:-2px;}
.menu button.danger{color:rgba(255,140,120,.9);}
.menu button.danger:hover{background:rgba(192,57,43,.14);color:rgba(255,170,150,1);}
.menu button[disabled]{color:rgba(255,255,255,.22);cursor:not-allowed;}
.menu button[disabled]:hover{background:none;color:rgba(255,255,255,.22);}
.menu-sep{height:1px;background:rgba(27,107,90,.2);margin:5px 4px;}
.menu-h{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(126,207,192,.45);padding:7px 11px 4px;}

/* Bulk-selection bar */
.selbar{display:none;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;
  border:1px solid rgba(42,138,116,.4);background:rgba(27,107,90,.16);border-radius:11px;}
.selbar.on{display:flex;}
.selbar-n{font-size:12.5px;color:#fff;font-weight:600;}

/* Confirmation dialog — reuses the card surface, adds nothing decorative. */
.dlg-bg{position:fixed;inset:0;z-index:1200;background:rgba(3,8,6,.72);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:18px;}
.dlg{width:100%;max-width:460px;max-height:calc(100vh - 40px);overflow-y:auto;
  background:#0B1613;border:1px solid var(--border);border-radius:15px;padding:22px 22px 18px;
  box-shadow:0 26px 60px -20px rgba(0,0,0,.95);}
.dlg.danger{border-color:rgba(192,57,43,.42);}
.dlg h3{font-family:var(--serif);font-size:19px;color:#fff;margin-bottom:7px;}
.dlg p{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:12px;}
.dlg label{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--hint);margin:12px 0 5px;}
.dlg input,.dlg select,.dlg textarea{width:100%;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:8px;color:#fff;padding:9px 11px;
  font-size:13.5px;font-family:inherit;outline:none;}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{border-color:#2A8A74;}
.dlg select option{background:#132218;}
.dlg textarea{min-height:64px;resize:vertical;}
.dlg-impact{background:rgba(0,0,0,.26);border:1px solid rgba(27,107,90,.18);border-radius:9px;
  padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:6px;}
.dlg-impact b{color:#fff;}
.dlg-warn{background:rgba(192,57,43,.09);border:1px solid rgba(192,57,43,.32);border-radius:9px;
  padding:10px 13px;font-size:12.5px;color:rgba(255,190,178,.95);line-height:1.6;margin-top:12px;}
.dlg-acts{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
.dbtn{min-height:40px;padding:0 16px;border-radius:9px;font-size:13px;font-family:inherit;
  cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted);}
.dbtn:hover{color:#fff;border-color:rgba(42,138,116,.45);}
.dbtn.go{background:rgba(27,107,90,.32);border-color:rgba(42,138,116,.55);color:#fff;}
.dbtn.go:hover{background:rgba(27,107,90,.5);}
.dbtn.bad{background:rgba(192,57,43,.2);border-color:rgba(192,57,43,.45);color:rgba(255,175,158,1);}
.dbtn.bad:hover{background:rgba(192,57,43,.34);}
.dbtn[disabled]{opacity:.4;cursor:not-allowed;}
.dbtn:focus-visible{outline:2px solid #7ECFC0;outline-offset:2px;}
.dlg-err{font-size:12.5px;color:rgba(255,150,130,.95);margin-top:10px;line-height:1.5;}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:1300;
  background:#0C1F18;border:1px solid rgba(42,138,116,.45);border-radius:10px;
  padding:11px 17px;font-size:13px;color:#fff;box-shadow:0 14px 34px -12px rgba(0,0,0,.9);max-width:92vw;}
.toast.bad{border-color:rgba(192,57,43,.5);color:rgba(255,185,170,1);}

/* Activity timeline */
.tl{border-left:1px solid rgba(27,107,90,.3);margin-left:6px;padding-left:16px;}
.tl-i{position:relative;padding:9px 0 11px;}
.tl-i::before{content:'';position:absolute;left:-21px;top:14px;width:8px;height:8px;border-radius:50%;
  background:#2A8A74;border:2px solid #0C1710;}
.tl-i.bad::before{background:#C0392B;}
.tl-i.warn::before{background:#E8A838;}
.tl-t{font-size:13px;color:#fff;}
.tl-m{font-size:11.5px;color:var(--hint);margin-top:2px;}
.tl-r{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic;}

/* ── Responsive ────────────────────────────────────────── */
@media (max-width:1024px){
  .adm-main{padding:22px 20px 64px;}
  .adm-rail{flex:0 0 200px;width:200px;}
}
@media (max-width:860px){
  .adm-shell{display:block;min-height:0;}
  .adm-rail{position:static;width:auto;max-width:100%;flex:none;max-height:none;overflow-x:auto;overflow-y:hidden;
    display:flex;align-items:center;gap:5px;white-space:nowrap;
    padding:10px 14px;border-right:none;border-bottom:1px solid var(--border);}
  .adm-railhead,.adm-railsub,.adm-grp{display:none;}
  /* row-reverse: the count/lock span is first in the DOM (it is floated right on
     desktop), so reversing keeps the label ahead of it here too. */
  .adm-nav{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:7px;
    padding:7px 12px;font-size:12.5px;flex:0 0 auto;}
  .adm-nav.on{box-shadow:none;}
  .adm-nav .adm-navn,.adm-lockpill{float:none;margin:0;}
  .adm-main{padding:20px 16px 60px;}
  .adm-searchwrap{flex:1 1 100%;}
  .adm-h1{font-size:23px;}
  .adm-kbd{display:none;}
}
@media (max-width:520px){
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));}
  .kv{grid-template-columns:1fr;}
}
@media (pointer:coarse){
  /* Touch devices at any width get real targets, not just phones. */
  .menu button{min-height:44px;display:flex;align-items:center;}
  .dots{min-height:44px;min-width:44px;}
  .selbox{width:22px;height:22px;}
  .dbtn{min-height:44px;}
}
@media (max-width:860px){
  .menu button{padding:11px 13px;font-size:13.5px;}
  .dots{padding:7px 12px;}
  .dlg{max-width:100%;padding:18px 16px 16px;}
  .dlg-acts .dbtn{flex:1 1 auto;}
  .selbar{position:sticky;top:56px;z-index:40;}
}
</style>
</head>
<body>
<div id="loader"><div class="spin"></div></div>
<div id="nb-placeholder"></div>
<a class="adm-skip" href="#adm-view">Skip to admin content</a>
<div id="app">
  <div class="adm-shell">
    <aside class="adm-rail" id="adm-rail" aria-label="Admin sections"></aside>
    <main class="adm-main" id="adm-view" tabindex="-1"></main>
  </div>
</div>

<script>
/* ============================================================
   Anestheo Admin Center — Phase 1
   Read-only platform visibility. Every number, row and filter below
   comes from a real table the admin is already permitted to read by RLS.
   No mutation is performed anywhere in this file.
   ============================================================ */
(function(){
'use strict';

var AC = { db:{}, cap:{}, me:null, boot:{}, warn:[] };
window.AC = AC;

/* ── helpers ─────────────────────────────────────────── */
function ge(id){ return document.getElementById(id); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fdate(v){ if(!v) return '—'; try{ return new Date(v).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return '—'; } }
function fdt(v){ if(!v) return '—'; try{ var d=new Date(v); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; } }
function ago(v){ if(!v) return ''; var s=(Date.now()-new Date(v).getTime())/1000; if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago';
  if(s<2592000) return Math.floor(s/86400)+'d ago'; return Math.floor(s/2592000)+'mo ago'; }
function dash(v){ return (v==null||v==='') ? '<span class="mut">—</span>' : esc(v); }
function short(id){ return id ? String(id).slice(0,8) : '—'; }
function pluck(o,k){ return (o&&o[k]!=null)?o[k]:null; }
function uniq(a){ var s={},o=[]; a.forEach(function(x){ if(x!=null&&!s[x]){s[x]=1;o.push(x);} }); return o; }
function q2s(o){ var p=[]; for(var k in o) if(o[k]!=null&&o[k]!=='') p.push(encodeURIComponent(k)+'='+encodeURIComponent(o[k])); return p.length?('?'+p.join('&')):''; }

/* Canonical, repo-verified status vocabularies. Values outside these sets are
   still rendered verbatim — we never rewrite what the database says. */
function badgeVerify(v){
  if(v==='approved'||v==='verified') return '<span class="bdg bdg-ok">'+esc(v)+'</span>';
  if(v==='pending')  return '<span class="bdg bdg-warn">pending</span>';
  if(v==='rejected') return '<span class="bdg bdg-bad">rejected</span>';
  if(!v||v==='not_required') return '<span class="bdg bdg-mute">'+esc(v||'not set')+'</span>';
  return '<span class="bdg bdg-mute">'+esc(v)+'</span>';
}
function badgeReview(v){
  if(v==='approved') return '<span class="bdg bdg-ok">approved</span>';
  if(v==='pending'||v==='in_review') return '<span class="bdg bdg-warn">'+esc(v)+'</span>';
  if(v==='changes_requested') return '<span class="bdg bdg-bad">changes requested</span>';
  return '<span class="bdg bdg-mute">'+esc(v||'not_submitted')+'</span>';
}
function badgeReq(v){
  if(v==='accepted') return '<span class="bdg bdg-ok">accepted</span>';
  if(v==='requested') return '<span class="bdg bdg-warn">requested</span>';
  if(v==='declined'||v==='revoked') return '<span class="bdg bdg-bad">'+esc(v)+'</span>';
  return '<span class="bdg bdg-mute">'+esc(v||'—')+'</span>';
}
function journeyState(s){
  if(s.archived_at)  return {k:'archived', h:'<span class="bdg bdg-mute">archived</span>'};
  if(s.completed_at) return {k:'completed',h:'<span class="bdg bdg-info">completed</span>'};
  if(s.ready_at)     return {k:'ready',    h:'<span class="bdg bdg-ok">ready</span>'};
  return {k:'active', h:'<span class="bdg bdg-ok">active</span>'};
}

/* ============================================================
   CAPABILITY DETECTION
   Production is not assumed to match the repository. Every module
   probes the relation it needs and records exactly what came back,
   so a module can be disabled honestly instead of erroring.
   ============================================================ */
/* ============================================================
   PHASE 2 — ACCOUNT LIFECYCLE AND MODERATION
   Active -> Suspended -> Banned -> Soft deleted -> Permanently deleted.
   Every action is an audited SECURITY DEFINER RPC. The lifecycle columns and
   the RPCs ship in one migration, so the column probe is an exact proxy for
   "are the RPCs live?" - the same pattern the journey controls use. Until it
   answers yes, no moderation control is rendered at all.
   ============================================================ */
function p2(){ return has('profiles','account_status') && has('profiles','deleted_at'); }
function accStatus(p){ return (p && p.account_status) || 'active'; }
function isDeleted(p){ return !!(p && p.deleted_at); }
function isLive(p){ return !isDeleted(p); }
function banExpired(p){ return !!(p && p.ban_expires_at && new Date(p.ban_expires_at) <= new Date()); }

/* One badge for the lifecycle, one for the doctor credential. They are
   different things and are never merged. */
function badgeStatus(p){
  var s = accStatus(p);
  if(isDeleted(p))     return '<span class="bdg bdg-bad">deleted</span>';
  if(s === 'banned')   return banExpired(p)
      ? '<span class="bdg bdg-warn">ban expired</span>'
      : '<span class="bdg bdg-bad">banned</span>';
  if(s === 'suspended')return '<span class="bdg bdg-warn">suspended</span>';
  return '<span class="bdg bdg-ok">active</span>';
}

/* ── Toast ─────────────────────────────────────────────── */
function acToast(msg, bad){
  var t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.setAttribute('role','status');
  t.textContent = msg;
  document.body.appendChild(t);

}

/* ── Confirmation dialog ───────────────────────────────────
   opts: title, body(html), impact(html), fields[], danger, confirmWord,
         confirmLabel, onConfirm(values) -> Promise
   Reason is a first-class field; destructive actions add a typed word that the
   server validates again. Focus is trapped, Escape cancels.               */
var _dlgLast = null;
function acDialog(opts){
  // Capture the return target BEFORE the menu is torn down, otherwise focus
  // would be handed back to a detached node and land on <body>.
  var back = (_menuTrigger && document.contains(_menuTrigger)) ? _menuTrigger : document.activeElement;
  acCloseMenu();
  var old = document.getElementById('ac-dlg'); if(old) old.remove();
  _dlgLast = back;
  var f = opts.fields || [];
  var bg = document.createElement('div');
  bg.className = 'dlg-bg'; bg.id = 'ac-dlg';
  bg.innerHTML =
    '<div class="dlg' + (opts.danger ? ' danger' : '') + '" role="dialog" aria-modal="true" aria-labelledby="ac-dlg-t">' +
      '<h3 id="ac-dlg-t">' + esc(opts.title) + '</h3>' +
      (opts.body ? '<p>' + opts.body + '</p>' : '') +
      (opts.impact ? '<div class="dlg-impact">' + opts.impact + '</div>' : '') +
      f.map(function(x, i){
        var id = 'ac-f' + i;
        if(x.type === 'select')
          return '<label for="' + id + '">' + esc(x.label) + '</label><select id="' + id + '" data-k="' + esc(x.key) + '">' +
            (x.options||[]).map(function(o){ return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') + '</select>';
        if(x.type === 'textarea')
          return '<label for="' + id + '">' + esc(x.label) + '</label><textarea id="' + id + '" data-k="' + esc(x.key) + '" placeholder="' + esc(x.ph||'') + '"></textarea>';
        return '<label for="' + id + '">' + esc(x.label) + '</label><input id="' + id + '" data-k="' + esc(x.key) + '" type="' + esc(x.type||'text') + '" placeholder="' + esc(x.ph||'') + '">';
      }).join('') +
      (opts.confirmWord
        ? '<div class="dlg-warn"><b>This action cannot be undone.</b><br>Type <b>' + esc(opts.confirmWord) + '</b> to confirm.</div>' +
          '<label for="ac-word">Confirmation</label><input id="ac-word" type="text" autocomplete="off" spellcheck="false" placeholder="' + esc(opts.confirmWord) + '">'
        : '') +
      '<div class="dlg-err" id="ac-err" style="display:none"></div>' +
      '<div class="dlg-acts">' +
        '<button class="dbtn" id="ac-cancel" type="button">Cancel</button>' +
        '<button class="dbtn ' + (opts.danger ? 'bad' : 'go') + '" id="ac-go" type="button"' +
          (opts.confirmWord ? ' disabled' : '') + '>' + esc(opts.confirmLabel || 'Confirm') + '</button>' +
      '</div></div>';
  document.body.appendChild(bg);

  var go = ge('ac-go'), word = ge('ac-word'), err = ge('ac-err');
  function close(){
    document.removeEventListener('keydown', key, true);
    bg.remove();
    if(_dlgLast && _dlgLast.focus && document.contains(_dlgLast)) _dlgLast.focus();
    else { var f0 = document.querySelector('#adm-view .dots, #adm-view a'); if(f0) f0.focus(); }
  }
  function key(e){
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    var els = Array.prototype.filter.call(bg.querySelectorAll('button,input,select,textarea'),
      function(el){ return !el.disabled && el.offsetParent !== null; });
    if(!els.length) return;
    var a = els[0], z = els[els.length-1];
    if(e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); }
  }
  document.addEventListener('keydown', key, true);
  bg.addEventListener('click', function(e){ if(e.target === bg) close(); });
  ge('ac-cancel').onclick = close;
  if(word) word.addEventListener('input', function(){
    go.disabled = word.value.trim().toUpperCase() !== opts.confirmWord.toUpperCase();
  });
  go.onclick = async function(){
    var vals = {};
    Array.prototype.forEach.call(bg.querySelectorAll('[data-k]'), function(el){
      vals[el.getAttribute('data-k')] = (el.value || '').trim();
    });
    if(opts.confirmWord) vals.__word = (word.value || '').trim();
    go.disabled = true; go.textContent = 'Working…';
    err.style.display = 'none';
    try {
      await opts.onConfirm(vals);
      close();
    } catch(e){
      err.textContent = (e && e.message) ? e.message : String(e);
      err.style.display = 'block';
      go.disabled = false; go.textContent = opts.confirmLabel || 'Confirm';
    }
  };
  setTimeout(function(){
    var first = bg.querySelector('input,select,textarea,button');
    if(first) first.focus();
  }, 30);
}

/* ── RPC executor ──────────────────────────────────────────
   Never optimistic: the row is only redrawn after the server confirms.    */
async function acRpc(fn, params){
  var r;
  try { r = await window.sb.rpc(fn, params || {}); }
  catch(e){ throw new Error(e.message); }
  if(r.error){
    var m = r.error.message || 'The action failed';
    if(/does not exist|schema cache|PGRST202/i.test(m))
      m = 'This action is not available yet — v2_admin_phase2.sql has not been applied.';
    throw new Error(m);
  }
  return r.data;
}
async function acAfter(msg){
  await loadAll();                 // re-read from the server, then repaint
  acSelClear();
  await render();
  acToast(msg);
}

/* ── Row action menu ───────────────────────────────────── */
var _menuOpen = null, _menuTrigger = null;
function acCloseMenu(){
  if(_menuOpen && _menuOpen.parentNode) _menuOpen.parentNode.removeChild(_menuOpen);
  _menuOpen = null;
}
document.addEventListener('click', function(e){
  if(_menuOpen && !e.target.closest('.menu') && !e.target.closest('.dots')) acCloseMenu();
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') acCloseMenu(); });

/* items: [{label, fn, danger, disabled, head}] — `head` renders a group label */
var _menuReg = {};
function acMenuBtn(regKey){
  return '<button class="dots" type="button" aria-haspopup="menu" aria-label="Actions" ' +
    'onclick="AC.menu(this,\'' + regKey + '\')">&#8943;</button>';
}
var AC_MENU_SEQ = 0;
function acRegister(items){
  var k = 'm' + (++AC_MENU_SEQ);
  _menuReg[k] = items;
  return k;
}
AC.menu = function(btn, key){
  var items = _menuReg[key] || [];
  _menuTrigger = btn;                       // where focus returns to
  if(_menuOpen && _menuOpen.dataset.k === key){ acCloseMenu(); return; }
  acCloseMenu();
  var m = document.createElement('div');
  m.className = 'menu'; m.dataset.k = key; m.setAttribute('role','menu');
  m.innerHTML = items.map(function(it, i){
    if(it.head) return '<div class="menu-h">' + esc(it.head) + '</div>';
    if(it.sep)  return '<div class="menu-sep"></div>';
    return '<button role="menuitem" type="button" data-i="' + i + '"' +
      (it.danger ? ' class="danger"' : '') + (it.disabled ? ' disabled' : '') + '>' + esc(it.label) + '</button>';
  }).join('');
  btn.parentNode.appendChild(m);
  m.addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]'); if(!b) return;
    var it = items[+b.getAttribute('data-i')];
    acCloseMenu();
    if(it && it.fn) it.fn();
  });
  _menuOpen = m;
  var first = m.querySelector('button:not([disabled])'); if(first) first.focus();
};

/* ── Bulk selection ────────────────────────────────────── */
AC.sel = { kind:null, ids:{} };
function acSelClear(){ AC.sel = { kind:null, ids:{} }; }
function acSelCount(){ return Object.keys(AC.sel.ids).length; }
AC.selToggle = function(kind, id, on){
  if(AC.sel.kind !== kind){ AC.sel = { kind:kind, ids:{} }; }
  if(on) AC.sel.ids[id] = true; else delete AC.sel.ids[id];
  acSelPaint();
};
AC.selAll = function(kind, on){
  var boxes = document.querySelectorAll('.selbox[data-id]');
  if(AC.sel.kind !== kind) AC.sel = { kind:kind, ids:{} };
  Array.prototype.forEach.call(boxes, function(b){
    if(b.id === 'sel-all') return;
    b.checked = on;
    var id = b.getAttribute('data-id');
    if(on) AC.sel.ids[id] = true; else delete AC.sel.ids[id];
  });
  acSelPaint();
};
function acSelPaint(){
  var bar = ge('ac-selbar'); if(!bar) return;
  var n = acSelCount();
  bar.classList.toggle('on', n > 0);
  var lbl = ge('ac-seln'); if(lbl) lbl.textContent = n + ' selected';
}

/* CSV export — only the columns already on screen. No clinical payloads. */
function acCsv(rows, cols, name){
  var esc2 = function(v){ v = (v==null?'':String(v)); return '"' + v.replace(/"/g,'""') + '"'; };
  var out = cols.map(function(c){ return esc2(c[0]); }).join(',') + '\n' +
    rows.map(function(r){ return cols.map(function(c){ return esc2(c[1](r)); }).join(','); }).join('\n');
  var blob = new Blob([out], { type:'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  acToast('Exported ' + rows.length + ' row' + (rows.length===1?'':'s'));
}

/* ── Activity timeline — built only from stored facts ──── */
function acTimeline(p){
  var ev = [];
  function add(ts, txt, kind, reason){ if(ts) ev.push({ ts:ts, t:txt, k:kind||'', r:reason||null }); }
  add(p.created_at, 'Account created', '');
  if(p.role === 'doctor'){
    if(p.verification_status === 'approved' || p.verification_status === 'verified')
      add(p.updated_at, 'Verification: ' + p.verification_status, '');
  }
  add(p.suspended_at, 'Suspended', 'warn', p.suspend_reason);
  add(p.banned_at, 'Banned' + (p.ban_expires_at ? (' until ' + fdate(p.ban_expires_at)) : ''), 'bad', p.ban_reason);
  add(p.deleted_at, 'Soft deleted', 'bad', p.delete_reason);
  (AC.db.audit||[]).forEach(function(a){
    if(a.target_id !== p.id) return;
    ev.push({ ts:a.created_at, t:a.action, k:/delete|ban|reject/.test(a.action)?'bad':(/suspend/.test(a.action)?'warn':''),
              r:a.reason, actor:a.actor_id });
  });
  (AC.db.parchive||[]).forEach(function(a){
    if(!(AC.db.surgeries||[]).some(function(s){ return s.id===a.surgery_id && s.patient_id===p.id; })) return;
    ev.push({ ts:a.created_at, t:'Journey ' + a.action, k:a.action==='delete'?'bad':'warn', r:a.reason, actor:a.actor_id });
  });
  ev.sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
  if(!ev.length) return '<p class="mut" style="font-size:12.5px;">No recorded history.</p>';
  return '<div class="tl">' + ev.map(function(e){
    return '<div class="tl-i ' + e.k + '"><div class="tl-t">' + esc(e.t) + '</div>' +
      '<div class="tl-m">' + esc(fdt(e.ts)) + ' &middot; ' + esc(ago(e.ts)) +
      (e.actor ? (' &middot; ' + esc(docName(e.actor))) : '') + '</div>' +
      (e.r ? '<div class="tl-r">&ldquo;' + esc(e.r) + '&rdquo;</div>' : '') + '</div>';
  }).join('') + '</div>';
}

/* ── Bulk runner ──────────────────────────────────────── */
async function acBulk(title, ids, needReason, run, opts){
  opts = opts || {};
  acDialog({ title:title + ' — ' + ids.length + ' account' + (ids.length===1?'':'s'),
    danger:!!opts.danger, confirmLabel:title, confirmWord:opts.confirmWord,
    body:'This is applied to each selected account in turn. Every one produces its own audit entry.',
    fields:[{ key:'reason', label:'Reason' + (needReason?' (required)':' (optional)'), type:'textarea' }],
    onConfirm: async function(v){
      if(needReason && !v.reason) throw new Error('A reason is required.');
      var ok = 0, fail = [];
      for(var i=0;i<ids.length;i++){
        try { await run(ids[i], v); ok++; }
        catch(e){ fail.push((AC.profById[ids[i]] ? pname(AC.profById[ids[i]]) : short(ids[i])) + ': ' + e.message); }
      }
      await loadAll(); acSelClear(); await render();
      if(fail.length) acToast(ok + ' succeeded, ' + fail.length + ' failed — ' + fail[0], true);
      else acToast(ok + ' account' + (ok===1?'':'s') + ' updated');
      if(fail.length) throw new Error(fail.join(' | '));
    }});
}

function missingCol(err){ return err && (err.code === '42703' || /column .* does not exist/i.test(err.message||'')); }
function missingRel(err){ return err && (err.code === '42P01' || /relation .* does not exist/i.test(err.message||'')); }

async function probeCap(c){
  var t0 = (window.performance&&performance.now)?performance.now():Date.now();
  var out = { key:c.key, table:c.table, label:c.label, required:!!c.required, ok:false,
              cols:{}, missing:[], error:null, code:null, ms:0 };
  try{
    if(c.discover){
      // Shape genuinely unknown in production (the ask migration may not be applied).
      // Learn the real column set from one row; fall back to per-column probing when empty.
      var d = await window.sb.from(c.table).select('*').limit(1);
      if(d.error){ out.error = d.error.message; out.code = d.error.code||null; }
      else if(d.data && d.data.length){
        out.ok = true;
        Object.keys(d.data[0]).forEach(function(k){ out.cols[k] = true; });
        c.cols.forEach(function(k){ if(!out.cols[k]){ out.cols[k]=false; out.missing.push(k); } });
      } else { out.ok = true; await perCol(c, out); }
    } else {
      var r = await window.sb.from(c.table).select(c.cols.join(',')).limit(1);
      if(!r.error){ out.ok = true; c.cols.forEach(function(k){ out.cols[k]=true; }); }
      else if(missingCol(r.error)){ out.ok = true; await perCol(c, out); }
      else { out.error = r.error.message; out.code = r.error.code||null; }
    }
  }catch(e){ out.error = e.message; }
  out.ms = Math.round(((window.performance&&performance.now)?performance.now():Date.now()) - t0);
  return out;
}
async function perCol(c, out){
  for(var i=0;i<c.cols.length;i++){
    var k = c.cols[i];
    try{
      var r = await window.sb.from(c.table).select(k).limit(1);
      if(r.error && missingCol(r.error)){ out.cols[k]=false; out.missing.push(k); }
      else if(r.error){ out.cols[k]=false; out.missing.push(k); }
      else out.cols[k]=true;
    }catch(e){ out.cols[k]=false; out.missing.push(k); }
  }
}
function has(capKey, col){ var c = AC.cap[capKey]; return !!(c && c.ok && (col ? c.cols[col] : true)); }
function capNote(capKey){
  var c = AC.cap[capKey]; if(!c) return '';
  if(!c.ok) return '<div class="notice n-bad"><b>'+esc(c.label)+' unavailable.</b> <code>'+esc(c.table)+
    '</code> returned '+(c.code?('<code>'+esc(c.code)+'</code> ') : '')+esc(c.error||'an error')+
    '. This module is disabled rather than showing an empty list that looks like real data.</div>';
  if(c.missing.length) return '<div class="notice n-warn"><b>Reduced capability.</b> <code>'+esc(c.table)+
    '</code> exists but these expected columns are absent: <code>'+esc(c.missing.join(', '))+
    '</code>. Columns that depend on them are hidden.</div>';
  return '';
}

/* ============================================================
   DATA LOADING — explicit column allowlists only.
   Bulk clinical payloads (answers, questionnaire_data, risk_flags,
   doctor_notes, plan content) are never fetched here.
   ============================================================ */
var CAP_ROWS = 2000;
AC.truncated = [];

function selCols(capKey, wanted){
  var c = AC.cap[capKey]; if(!c||!c.ok) return null;
  var ok = wanted.filter(function(k){ return c.cols[k]; });
  return ok.length ? ok.join(',') : null;
}
async function fetchTable(capKey, table, wanted, orderCol){
  var cols = selCols(capKey, wanted);
  if(!cols) return [];
  try{
    var qy = window.sb.from(table).select(cols).limit(CAP_ROWS);
    if(orderCol && has(capKey, orderCol)) qy = qy.order(orderCol, { ascending:false, nullsFirst:false });
    var r = await qy;
    if(r.error){ AC.cap[capKey].error = r.error.message; AC.cap[capKey].ok = false; return []; }
    var d = r.data || [];
    if(d.length >= CAP_ROWS) AC.truncated.push(table);
    return d;
  }catch(e){ AC.cap[capKey].error = e.message; AC.cap[capKey].ok = false; return []; }
}

/* ── real, derived warnings (never decorative) ────────── */
function buildWarnings(){
  var w = [];
  CAPS.forEach(function(c){
    var s = AC.cap[c.key];
    if(s && !s.ok) w.push({ sev:'bad', t:c.label+' unavailable',
      d:'<code>'+esc(c.table)+'</code>: '+esc(s.error||'unknown error'), go:'#/capabilities' });
    else if(s && s.missing.length) w.push({ sev:'warn', t:c.label+' partially available',
      d:'Missing columns: <code>'+esc(s.missing.join(', '))+'</code>', go:'#/capabilities' });
  });
  AC.truncated.forEach(function(t){
    w.push({ sev:'warn', t:'Row cap reached on '+t,
      d:'Loaded the first '+CAP_ROWS+' rows. Counts on this page are lower bounds for this table.', go:'#/capabilities' });
  });
  if(has('profiles')){
    var pend = (AC.db.profiles||[]).filter(function(p){ return p.role==='pending' || !p.role; });
    if(pend.length) w.push({ sev:'warn', t:pend.length+' account'+(pend.length>1?'s':'')+' with no role assigned',
      d:'These signed up but never completed role selection.', go:'#/accounts'+q2s({f:'pending'}) });
    var dv = (AC.db.profiles||[]).filter(function(p){ return isDoctor(p) && p.verification_status==='pending'; });
    if(dv.length) w.push({ sev:'warn', t:dv.length+' doctor'+(dv.length>1?'s':'')+' awaiting verification',
      d:'No verification decision has been recorded.', go:'#/doctors'+q2s({f:'pending'}) });
  }
  if(has('surgeries')){
    var un = (AC.db.surgeries||[]).filter(function(s){ return !s.archived_at && !s.completed_at && !s.assigned_doctor_id; });
    if(un.length) w.push({ sev:'warn', t:un.length+' active journey'+(un.length>1?'s':'')+' with no assigned doctor',
      d:'<code>assigned_doctor_id</code> is null on these rows.', go:'#/journeys'+q2s({f:'unassigned'}) });
  }
  if(has('quests','review_state')){
    var stale = (AC.db.quests||[]).filter(function(q){
      if(q.review_state!=='pending' && q.review_state!=='in_review') return false;
      var t = q.submitted_at || q.updated_at; if(!t) return false;
      return (Date.now()-new Date(t).getTime()) > 7*86400000;
    });
    if(stale.length) w.push({ sev:'warn', t:stale.length+' questionnaire'+(stale.length>1?'s':'')+' awaiting review for over 7 days',
      d:'Measured from <code>submitted_at</code> (or <code>updated_at</code>).', go:'#/questionnaires'+q2s({f:'review'}) });
  }
  if(questionsRlsAmbiguous()) w.push({ sev:'warn', t:'questions returned no rows',
    d:'A count of zero cannot distinguish an empty table from RLS refusing the read.', go:'#/questions' });
  AC.warn = w;
}

/* The one relation whose admin read access is genuinely unproven in production.
   The admin-aware policy q_select_own_or_staff is created by v2_ask_migration.sql,
   which was never applied (that is why question_replies is absent). Admin Phase 0
   deliberately added no policy to questions. So an empty result here is ambiguous
   and must not be presented as "there are no questions". */
function questionsRlsAmbiguous(){
  return has('questions') && !((AC.db.questions||[]).length);
}
function questionsRlsNotice(){
  if(!questionsRlsAmbiguous()) return '';
  return '<div class="notice n-warn"><b>Zero rows &mdash; and that is ambiguous.</b> '+
    '<code>questions</code> is readable (no error), but it returned nothing. That means either the table is genuinely '+
    'empty <i>or</i> row-level security is refusing this admin the read. The admin-aware policy '+
    '<code>q_select_own_or_staff</code> is created by <code>v2_ask_migration.sql</code>, which was never applied in '+
    'production &mdash; that is the same migration that would have created <code>question_replies</code>. '+
    'Admin Phase 0 added no policy to <code>questions</code> either. '+
    'Resolving this needs one explicit admin SELECT policy in the Phase 2 SQL; until then this module cannot claim '+
    'the inbox is empty.</div>';
}

function renderRail(active){
  var h = '<div class="adm-railhead">Admin Center</div><div class="adm-railsub">Phase 1 &middot; read-only</div>';
  NAV.forEach(function(g){
    if(g.grp) h += '<div class="adm-grp">'+esc(g.grp)+'</div>';
    g.items.forEach(function(it){
      var cls = 'adm-nav' + (it.id===active?' on':'') + (it.danger?' danger':'') + (it.lock?' locked':'');
      var right = '';
      if(it.lock) right = '<span class="adm-lockpill">'+esc(it.lock)+'</span>';
      else if(it.cap && !has(it.cap)) right = '<span class="adm-lockpill">n/a</span>';
      else if(it.count){ var n = it.count(); if(n!=null) right = '<span class="adm-navn">'+n+'</span>'; }
      h += '<a class="'+cls+'" href="'+it.href+'">'+right+esc(it.label)+'</a>';
    });
  });
  ge('adm-rail').innerHTML = h;
}

function wireSearch(){
  var el = ge('adm-q'); if(!el) return;
  var t = null;
  el.addEventListener('input', function(){
    clearTimeout(t); var v = el.value;
    t = setTimeout(function(){
      if(v.trim().length >= 2) go('#/search'+q2s({q:v.trim()}), true);
      else if(v.trim().length === 0 && (location.hash||'').indexOf('#/search')===0) go('#/overview', true);
    }, 260);
  });

function statCard(n, label, href, opts){
  opts = opts||{};
  if(n == null) return '<div class="stat-c na" title="'+esc(opts.why||'Not available')+'">'+
    '<div class="stat-n">n/a</div><div class="stat-l">'+esc(label)+'</div></div>';

    '<div class="stat-n">'+n+'</div><div class="stat-l">'+esc(label)+'</div></a>';
}

function vOverview(){

      R = AC.db.requests||[], QS = AC.db.questions||[], A = AC.db.audit||[];

  var active   = S.filter(function(s){ return !s.archived_at && !s.completed_at; });
  var archived = S.filter(function(s){ return !!s.archived_at; });

  else if(xOK){ openQ = QS.length; openQLabel = 'Submitted questions'; }
  else openQWhy = AC.cap.questions ? (AC.cap.questions.error||'unavailable') : 'unavailable';

  var midnight = new Date(); midnight.setHours(0,0,0,0);
  var today = aOK ? A.filter(function(r){ return new Date(r.created_at) >= midnight; }).length : null;

  var h = head('Anestheo platform', 'Control center',
    'Every figure below is a live count from a table this account is permitted to read. Selecting one opens the exact filtered list it was computed from.');

  h += '<div class="gcard"><div class="gcard-h">Overview'+
       '<span class="gh-note">'+(AC.boot.loadedAt?('data loaded '+ago(AC.boot.loadedAt)):'')+
       ' &middot; <a class="lnk" href="#/capabilities">'+CAPS.filter(function(c){return has(c.key);}).length+'/'+CAPS.length+' modules available</a></span></div>'+
    '<div class="stat-grid">'+
      statCard(pOK?P.length:null,        'Total accounts',        '#/accounts') +
      statCard(pOK?doctors.length:null,  'Doctors',               '#/doctors') +
      statCard(pOK?verified.length:null, 'Verified doctors',      '#/doctors'+q2s({f:'verified'})) +
      statCard(pOK?pending.length:null,  'Pending verification',  '#/doctors'+q2s({f:'pending'}), {warn:true}) +
      statCard(pOK?patients.length:null, 'Patients',              '#/patients') +
      statCard(sOK?active.length:null,   'Active journeys',       '#/journeys'+q2s({f:'active'})) +
      statCard(sOK?archived.length:null, 'Archived journeys',     '#/journeys'+q2s({f:'archived'})) +
      statCard(qOK?inReview.length:null, 'Questionnaires awaiting review', '#/questionnaires'+q2s({f:'review'}), {warn:true}) +
      statCard(openQ, openQLabel, '#/questions', {why:openQWhy}) +
      statCard(rOK?R.length:null,        'Care requests',         '#/care-requests') +
      statCard(today, 'Audit events today', '#/audit'+q2s({d:'today'}), {why:'admin_audit_log unavailable'}) +
    '</div></div>';

  // System warnings — derived facts only
  h += '<div class="gcard"><div class="gcard-h">System warnings<span class="gh-note">'+
       (AC.warn.length? (AC.warn.length+' active') : 'none detected')+'</span></div>';
  if(!AC.warn.length){
    h += '<p class="mut" style="font-size:12.5px;">No warnings. This reflects the checks listed under '+
      '<a class="lnk" href="#/status">System status</a> only — it is not a claim that every service is healthy.</p>';
  } else {
    h += AC.warn.map(function(w){
      return '<div class="notice '+(w.sev==='bad'?'n-bad':'n-warn')+'" style="margin-bottom:9px;">'+
        '<b>'+esc(w.t)+'</b> &mdash; '+w.d+' <a class="lnk" href="'+w.go+'">Open</a></div>';
    }).join('');

  h += '<div class="gcard"><div class="gcard-h">Pending doctor verification'+
       '<span class="gh-note"><a class="lnk" href="#/doctors'+q2s({f:'pending'})+'">View all</a></span></div>';
  if(!pOK) h += capNote('profiles');
  else h += tblDoctors(pending.slice(0,8), true);

  h += '<div class="gcard"><div class="gcard-h">Recently registered accounts'+
       '<span class="gh-note"><a class="lnk" href="#/accounts">View all</a></span></div>';
  if(!pOK) h += capNote('profiles');
  else {
    var recent = P.slice().sort(function(a,b){ return new Date(b.created_at||0)-new Date(a.created_at||0); }).slice(0,8);

       '<span class="gh-note"><a class="lnk" href="#/audit">Open audit log</a></span></div>';

    'Phase 1 is read-only, so this stays empty until the Phase 2 mutation RPCs are applied.</p>';
  else h += tblAudit(A.slice(0,8), false);
  h += '</div>';
  return h;
}

/* Row action menu for an account. Only rendered when the Phase 2 migration is
   live; every entry maps to one audited RPC. */
function acAccountMenu(p){
  var st = accStatus(p), del = isDeleted(p), doc = (p.role === 'doctor');
  var items = [{ head:'Account' },
    { label:'Open profile', fn:function(){ location.hash = (doc?'#/doctor/':'#/patient/') + p.id; } }];
  if(!del){
    items.push({ label:'Edit safe fields', fn:function(){ acEdit(p); } });
    items.push({ label:'Change role', fn:function(){ acRole(p); } });
    if(doc){
      items.push({ sep:true }, { head:'Verification' });
      items.push({ label:'Verify', disabled:(p.verification_status==='approved'), fn:function(){ acVerify(p,'approved'); } });
      items.push({ label:'Remove verification', disabled:(p.verification_status!=='approved'), fn:function(){ acVerify(p,'pending'); } });
      items.push({ label:'Reject verification', danger:true, fn:function(){ acVerify(p,'rejected'); } });
      items.push({ sep:true }, { head:'Patients' });
      items.push({ label:'Reassign patients', fn:function(){ acReassignAll(p); } });
    } else {
      items.push({ sep:true }, { head:'Clinical' });
      items.push({ label:'View journeys',       fn:function(){ location.hash = '#/patient/'+p.id+'?t=journeys'; } });
      items.push({ label:'View questionnaires', fn:function(){ location.hash = '#/patient/'+p.id+'?t=quest'; } });
      items.push({ label:'View checklist',      fn:function(){ location.hash = '#/patient/'+p.id+'?t=checklist'; } });
      items.push({ label:'Assign / reassign doctor', fn:function(){
        var mine = (AC.db.surgeries||[]).filter(function(s){ return s.patient_id===p.id && !s.archived_at; });
        if(!mine.length){ acToast('This patient has no active journey to assign', true); return; }
        acAssignJourney(mine[0]);
      }});
    }
    items.push({ sep:true }, { head:'Lifecycle' });
    if(st === 'active'){
      items.push({ label:'Suspend', fn:function(){ acSuspend(p); } });
      items.push({ label:'Ban', danger:true, fn:function(){ acBan(p); } });
    } else {
      items.push({ label:'Reactivate', fn:function(){ acReactivate(p); } });
      if(st === 'suspended') items.push({ label:'Ban', danger:true, fn:function(){ acBan(p); } });
    }
    items.push({ label:'Soft delete', danger:true, fn:function(){ acSoftDelete(p); } });
  } else {
    items.push({ sep:true }, { head:'Deleted' });
    items.push({ label:'Restore', fn:function(){ acRestore(p); } });
    items.push({ label:'Permanent delete — Danger Zone', danger:true,
                 fn:function(){ location.hash = '#/danger'; } });
  }
  return acMenuBtn(acRegister(items));
}

AC.bulk = function(kind, action){
  var ids = acSelIds();
  if(!ids.length){ acToast('Select at least one row first', true); return; }
  if(action==='suspend') return acBulk('Suspend', ids, true, function(id,v){
    return acRpc('admin_set_account_status', { p_target:id, p_status:'suspended', p_reason:v.reason }); });
  if(action==='ban') return acBulk('Ban', ids, true, function(id,v){
    return acRpc('admin_set_account_status', { p_target:id, p_status:'banned', p_reason:v.reason, p_expires:null }); },
    { danger:true });
  if(action==='restore') return acBulk('Restore', ids, false, function(id,v){
    return acRpc('admin_restore_account', { p_target:id, p_reason:v.reason||null }); });
  if(action==='delete') return acBulk('Soft delete', ids, true, function(id,v){
    return acRpc('admin_soft_delete_account', { p_target:id, p_reason:v.reason }); }, { danger:true });
  if(action==='assign'){
    var opts = acDoctorOpts(null);
    if(!opts.length){ acToast('No active doctor to receive patients', true); return; }
    acDialog({ title:'Reassign patients from '+ids.length+' doctor'+(ids.length===1?'':'s'),
      confirmLabel:'Reassign', fields:[{key:'to',label:'Receiving doctor',type:'select',options:opts},
        {key:'reason',label:'Reason (required)',type:'textarea'}],
      onConfirm: async function(v){
        if(!v.reason) throw new Error('A reason is required.');
        var moved = 0;
        for(var i=0;i<ids.length;i++){
          if(ids[i]===v.to) continue;
          var r = await acRpc('admin_reassign_doctor_patients', { p_from:ids[i], p_to:v.to, p_reason:v.reason });
          moved += (r && r.journeys_moved) || 0;
        }
        await acAfter(moved + ' journey(s) reassigned');
      }});
  }
};

function vDoctors(qs){
  if(!has('profiles')) return head('People','Doctors','') + capNote('profiles');
  var everyone = (AC.db.profiles||[]).filter(isDoctor);
  var f = qs.f || 'all', country = qs.c || '', hosp = qs.h || '', spec = qs.s || '';
  // Deleted accounts leave the normal list entirely; they live in Deleted accounts.
  var all = everyone.filter(isLive);
  var list = (f==='deleted' ? everyone.filter(isDeleted) : all).filter(function(p){
    if(f==='pending'  && p.verification_status!=='pending') return false;
    if(f==='verified' && !(p.verification_status==='approved'||p.verification_status==='verified')) return false;
    if(f==='rejected' && p.verification_status!=='rejected') return false;
    if(f==='suspended'&& accStatus(p)!=='suspended') return false;
    if(f==='banned'   && accStatus(p)!=='banned') return false;
    if(country && p.country!==country) return false;
    if(hosp && p.hospital!==hosp) return false;
    if(spec && p.specialty!==spec) return false;
    return true;
  });
  function opts(field, cur){
    var vals = uniq(all.map(function(p){ return p[field]; }).filter(Boolean)).sort();
    return '<option value="">All '+field+'s</option>' + vals.map(function(v){
      return '<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('');
  }
  var base = function(o){ var m={f:f,c:country,h:hosp,s:spec}; for(var k in o) m[k]=o[k]; return '#/doctors'+q2s(m); };

  var h = head('People','Doctors','Every column is a real <code>profiles</code> field. Counts of linked work are computed from '+
    '<code>patient_surgeries.assigned_doctor_id</code> and <code>clinic_patients.doctor_id</code>.');

  h += '<div class="chips">'+
    (p2() ? ['all','pending','verified','rejected','suspended','banned','deleted']
          : ['all','pending','verified','rejected']).map(function(k){
      var n = k==='all' ? all.length
            : k==='deleted' ? everyone.filter(isDeleted).length
            : k==='suspended' ? all.filter(function(x){return accStatus(x)==='suspended';}).length
            : k==='banned' ? all.filter(function(x){return accStatus(x)==='banned';}).length
            : all.filter(function(x){ return k==='verified'
                ? (x.verification_status==='approved'||x.verification_status==='verified')
                : x.verification_status===k; }).length;
      return '<a class="chip'+(f===k?' on':'')+'" href="'+base({f:k})+'">'+
        (k.charAt(0).toUpperCase()+k.slice(1))+' ('+n+')</a>'; }).join('')+
    '<select class="fsel" onchange="AC.nav(this.value)">'+
      '<option value="'+base({c:''})+'">All countries</option>'+
      uniq(all.map(function(p){return p.country;}).filter(Boolean)).sort().map(function(v){
        return '<option value="'+esc(base({c:v}))+'"'+(country===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+
    '</select>'+
    '<select class="fsel" onchange="AC.nav(this.value)">'+
      '<option value="'+base({h:''})+'">All hospitals</option>'+
      uniq(all.map(function(p){return p.hospital;}).filter(Boolean)).sort().map(function(v){
        return '<option value="'+esc(base({h:v}))+'"'+(hosp===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+
    '</select>'+
    '<select class="fsel" onchange="AC.nav(this.value)">'+
      '<option value="'+base({s:''})+'">All specialties</option>'+
      uniq(all.map(function(p){return p.specialty;}).filter(Boolean)).sort().map(function(v){
        return '<option value="'+esc(base({s:v}))+'"'+(spec===v?' selected':'')+'>'+esc(v)+'</option>'; }).join('')+
    '</select>'+
    '<span class="mut" style="font-size:12px;">'+list.length+' shown</span>'+

  h += selBar('doctor', list, null, 'doctors');

      (has('requests') ? tblRequests(reqs) : capNote('requests')) + '</div>';
  }

  if(tab==='activity'){
    h += '<div class="notice n-info">Only activity that is provable from a stored column is shown. '+
      'There is no per-user event stream in the schema, so this is not a login or page-view history.</div>';
    h += '<div class="gcard"><div class="gcard-h">Questionnaires reviewed by this doctor<span class="gh-note">'+
      (has('quests','reviewed_by')?reviewed.length:'n/a')+'</span></div>'+
      (has('quests','reviewed_by')
        ? (reviewed.length ? tblQuests(reviewed) : '<p class="mut" style="font-size:12.5px;">None recorded.</p>')
        : '<p class="mut" style="font-size:12.5px;"><code>preop_questionnaires.reviewed_by</code> is not available.</p>')+'</div>';
    h += '<div class="gcard"><div class="gcard-h">Documents marked reviewed<span class="gh-note">'+
      (has('documents','reviewed_by')?docsRev.length:'n/a')+'</span></div>'+

        ? (docsRev.length ? tblDocs(docsRev) : '<p class="mut" style="font-size:12.5px;">None recorded.</p>')
        : capNote('documents'))+'</div>';
    h += '<div class="gcard"><div class="gcard-h">Archive / restore actions performed<span class="gh-note">'+
      (has('parchive')?arch.length:'n/a')+'</span></div>'+
      (has('parchive')
        ? (arch.length ? tblArchiveAudit(arch) : '<p class="mut" style="font-size:12.5px;">None recorded.</p>')
        : capNote('parchive'))+'</div>';
    var responded = reqs.filter(function(r){ return r.responded_at; });
    h += '<div class="gcard"><div class="gcard-h">Care requests answered<span class="gh-note">'+
      (has('requests')?responded.length+' of '+reqs.length:'n/a')+'</span></div>'+
      (has('requests') ? tblRequests(responded) : capNote('requests'))+'</div>';
  }

  if(tab==='timeline'){
    h += '<div class="gcard"><div class="gcard-h">Activity timeline<span class="gh-note">newest first</span></div>'+
      acTimeline(p)+'</div>';
  }
  if(tab==='audit'){
    h += '<div class="gcard"><div class="gcard-h">Administrative actions involving this account</div>'+
      (has('audit') ? (aud.length ? tblAudit(aud, true)
        : '<p class="mut" style="font-size:12.5px;">No audit rows reference this account.</p>') : capNote('audit'))+'</div>';
  }
  return h;
}
function kv(k,v,note){
  return '<div><div class="kv-k">'+esc(k)+'</div><div class="kv-v'+(v?'':' dim')+'">'+
    (v?esc(v):'<span class="mut">'+esc(note||'not set')+'</span>')+'</div></div>';
}
function kvMono(k,v){
  return '<div><div class="kv-k">'+esc(k)+'</div><div class="kv-v mono">'+esc(v||'—')+'</div></div>';
}

/* ── Patients ────────────────────────────────────────── */
function tblPatients(list){

  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    (mod?'<th class="selcol"><input type="checkbox" class="selbox" id="sel-all" aria-label="Select all" onchange="AC.selAll(\'patient\',this.checked)"></th>':'')+
    '<th>Name</th><th>Email</th><th>Phone</th>'+
    (mod?'<th>Status</th>':'')+
    '<th>Active procedure</th><th>Assigned doctor</th><th>Journey</th><th>Questionnaire</th><th>Registered</th><th></th></tr></thead><tbody>'+
    list.map(function(r){
      var p = r.p, s = r.journey, q = r.quest;
      var st = s ? journeyState(s) : null;
      return '<tr>'+
        (mod?'<td class="selcol"><input type="checkbox" class="selbox" data-id="'+p.id+'" aria-label="Select '+esc(pname(p))+'" onchange="AC.selToggle(\'patient\',\''+p.id+'\',this.checked)"></td>':'')+

        '<td>'+(st?st.h:'<span class="bdg bdg-mute">none</span>')+'</td>'+
        '<td>'+(q?badgeReview(q.review_state)+' <span class="mut">'+(q.completion!=null?q.completion+'%':'')+'</span>'
                 :'<span class="bdg bdg-mute">none</span>')+'</td>'+
        '<td>'+esc(fdate(p.created_at))+'</td>'+
        '<td class="rowact"><a class="olink" href="#/patient/'+p.id+'">Open &rsaquo;</a>'+
          (mod ? ' '+acAccountMenu(p) : '')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function patientRows(includeDeleted){
  var P = (AC.db.profiles||[]).filter(function(p){
    return isPatientRole(p) && (includeDeleted ? true : isLive(p)); });
  return P.map(function(p){
    var mine = (AC.db.surgeries||[]).filter(function(s){ return s.patient_id===p.id; });
    var live = mine.filter(function(s){ return !s.archived_at && !s.completed_at; });
    var journey = live[0] || mine[0] || null;
    var quest = (AC.db.quests||[]).filter(function(q){ return q.patient_id===p.id; })[0] || null;
    return { p:p, journey:journey, quest:quest, journeys:mine };
  });
}

function vPatients(qs){
  if(!has('profiles')) return head('People','Patients','') + capNote('profiles');
  var f = qs.f || 'all';
  var rows = patientRows(f === 'deleted');
  var list = rows.filter(function(r){
    if(f==='deleted')   return isDeleted(r.p);
    if(f==='suspended') return accStatus(r.p)==='suspended';
    if(f==='banned')    return accStatus(r.p)==='banned';
    if(f==='activeacct')return accStatus(r.p)==='active';
    if(f==='active')    return r.journeys.some(function(s){ return !s.archived_at && !s.completed_at; });
    if(f==='archived')  return r.journeys.length && r.journeys.every(function(s){ return !!s.archived_at; });
    if(f==='nojourney') return r.journeys.length === 0;
    if(f==='review')    return r.quest && (r.quest.review_state==='pending'||r.quest.review_state==='in_review');
    return true;
  });
  var h = head('People','Patients','Patients are <code>profiles</code> rows with role <code>patient</code>. '+
    'Journey, doctor and questionnaire columns are joined from <code>patient_surgeries</code> and '+
    '<code>preop_questionnaires</code> by <code>patient_id</code>.');
  h += capNote('profiles') + (has('surgeries')?'':capNote('surgeries')) + p2Notice();
  var chips = [['all','All'],['active','With an active journey'],['archived','Only archived'],
     ['nojourney','No journey yet'],['review','Awaiting questionnaire review']];
  if(p2()) chips = [['all','All'],['activeacct','Active'],['suspended','Suspended'],['banned','Banned'],
     ['deleted','Deleted'],['active','With an active journey'],['nojourney','No journey yet'],
     ['review','Awaiting review']];
  h += '<div class="chips">'+
    chips.map(function(k){
      return '<a class="chip'+(f===k[0]?' on':'')+'" href="#/patients'+q2s({f:k[0]})+'">'+esc(k[1])+'</a>'; }).join('')+
    '<span class="mut" style="font-size:12px;">'+list.length+' of '+rows.length+'</span></div>';
  h += selBar('patient', list, null, 'patients');
  h += tblPatients(list);

  var orphan = (AC.db.surgeries||[]).filter(function(s){ return !s.patient_id; });
  if(orphan.length){
    h += '<div class="gcard"><div class="gcard-h">Journeys with no linked account<span class="gh-note">'+
      orphan.length+' &middot; clinic-created, not yet claimed</span></div>'+ tblJourneys(orphan) +'</div>';
  }
  return h;
}

function tblJourneys(list){

  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Patient</th><th>Procedure</th><th>Hospital</th>'+

        '<td>'+dash(s.procedure_type)+'</td><td>'+dash(s.hospital)+'</td>'+
        '<td>'+esc(fdate(s.surgery_date))+'</td>'+
        '<td>'+(s.assigned_doctor_id?esc(docName(s.assigned_doctor_id)):'<span class="mut">unassigned</span>')+'</td>'+

        '<td>'+journeyState(s).h+'</td><td>'+esc(fdate(s.created_at))+'</td>'+
        '<td class="rowact"><a class="olink" href="#/journey/'+s.id+'">Open &rsaquo;</a>'+
          (p2() ? ' '+acMenuBtn(acRegister([
            { head:'Journey' },
            { label:(s.assigned_doctor_id?'Reassign doctor':'Assign doctor'), fn:function(){ acAssignJourney(s); } },
            { label:'Open patient', disabled:!s.patient_id, fn:function(){ location.hash='#/patient/'+s.patient_id; } }
          ])) : '')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function vJourneys(qs){
  if(!has('surgeries')) return head('Clinical','Surgery journeys','') + capNote('surgeries');
  var all = AC.db.surgeries||[], f = qs.f||'all';
  var list = all.filter(function(s){
    var st = journeyState(s).k;
    if(f==='active')     return st==='active'||st==='ready';
    if(f==='archived')   return st==='archived';
    if(f==='completed')  return st==='completed';
    if(f==='unassigned') return !s.archived_at && !s.completed_at && !s.assigned_doctor_id;
    if(f==='unclaimed')  return !s.patient_id;
    return true;
  });
  var h = head('Clinical','Surgery journeys','One row per <code>patient_surgeries</code> record. '+
    'State is derived from <code>archived_at</code>, <code>completed_at</code> and <code>ready_at</code> — no status is invented.');
  h += '<div class="chips">'+
    [['all','All'],['active','Active'],['completed','Completed'],['archived','Archived'],
     ['unassigned','No doctor assigned'],['unclaimed','No linked account']].map(function(k){
      return '<a class="chip'+(f===k[0]?' on':'')+'" href="#/journeys'+q2s({f:k[0]})+'">'+esc(k[1])+'</a>'; }).join('')+
    '<span class="mut" style="font-size:12px;">'+list.length+' of '+all.length+'</span></div>';
  h += tblJourneys(list);
  return h;
}

    kv('Linked account', s.patient_id?pname(AC.profById[s.patient_id]):null, 'not claimed')+
    kv('Procedure', s.procedure_type)+kv('Hospital', s.hospital)+kv('Surgeon', s.surgeon)+
    kv('Anesthesia type', s.anesthesia_type)+kv('Surgery date', s.surgery_date?fdate(s.surgery_date):null)+
    kv('Assigned doctor', s.assigned_doctor_id?docName(s.assigned_doctor_id):null,'unassigned')+
    kv('Assigned at', s.assigned_at?fdt(s.assigned_at):null)+
    kv('Care state', s.care_state)+kv('Origin', s.origin)+kv('Contact email', s.contact_email)+
    kv('Ready at', s.ready_at?fdt(s.ready_at):null)+kv('Completed at', s.completed_at?fdt(s.completed_at):null)+
    kv('Archived at', s.archived_at?fdt(s.archived_at):null)+
    kv('Archived by', s.archived_by?docName(s.archived_by):null)+
    kv('Archive reason', s.archive_reason)+kv('Restored at', s.restored_at?fdt(s.restored_at):null)+
    kvMono('Journey ID', s.id)+kvMono('Clinic patient ID', s.clinic_patient_id||'—')+
    kv('Created', fdt(s.created_at))+kv('Updated', fdt(s.updated_at))+'</div>';
  if(s.patient_id) h += '<p style="margin-top:12px;"><a class="lnk" href="#/patient/'+s.patient_id+'">Open patient 360 &rsaquo;</a></p>';
  h += '</div>';

  if(reqs.length)  h += '<div class="gcard"><div class="gcard-h">Care requests</div>'+tblRequests(reqs)+'</div>';

  return h;
}

function tblQuests(list){
  if(!list.length) return '<div class="tbl-wrap"><table class="tbl"><tbody><tr><td class="empty">No questionnaires</td></tr></tbody></table></div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Patient</th><th>Completion</th><th>Status</th>'+
    '<th>Review state</th><th>Submitted</th><th>Reviewed</th><th>Reviewer</th><th>Updated</th><th></th></tr></thead><tbody>'+
    list.map(function(q){

/* ── Checklists ──────────────────────────────────────── */
function chkProgress(items){
  if(!items || typeof items !== 'object') return null;
  var done = 0, total = 0;
  Object.keys(items).forEach(function(k){
    var v = items[k];
    if(Array.isArray(v)) v.forEach(function(x){ total++; if(x===true) done++; });
    else if(typeof v === 'boolean'){ total++; if(v) done++; }
  });
  return total ? { done:done, total:total, pct:Math.round(done/total*100) } : null;
}
function tblChecklists(list){
  if(!list.length) return '<div class="tbl-wrap"><table class="tbl"><tbody><tr><td class="empty">No checklists</td></tr></tbody></table></div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Patient</th><th>Progress</th><th>Items</th><th>Updated</th><th></th></tr></thead><tbody>'+
    list.map(function(c){
      var p = AC.profById[c.patient_id], pr = chkProgress(c.items);
      return '<tr><td class="nm">'+(p?esc(pname(p)):'<span class="mono">'+short(c.patient_id)+'</span>')+'</td>'+
        '<td>'+(pr?(pr.pct+'%<div class="meterbar"><div class="meterfill" style="width:'+pr.pct+'%"></div></div>'):'<span class="mut">—</span>')+'</td>'+
        '<td>'+(pr?(pr.done+' of '+pr.total):'<span class="mut">no boolean items</span>')+'</td>'+
        '<td>'+esc(fdate(c.updated_at))+'</td>'+
        '<td>'+(p?'<a class="olink" href="#/patient/'+c.patient_id+q2s({t:'checklist'})+'">Open &rsaquo;</a>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ── Global search (admin_search RPC) ────────────────── */
var SEARCH_ROUTE = {
  profile: function(id){ var p = AC.profById[id]; return p ? profileHref(p) : '#/accounts'; },
  patient_surgery: function(id){ return '#/journey/'+id; },
  clinic_patient:  function(id){ return '#/journeys'+q2s({f:'all'}); },
  care_request:    function(id){ return '#/care-requests'; },
  questionnaire:   function(id){ return '#/questionnaires'; },
  question:        function(id){ return '#/questions'; }
};
async function vSearch(qs){
  var term = qs.q||'';
  var h = head('Search','Global search','Backed by the <code>admin_search()</code> RPC. '+
    'Only the entity types that the live function actually compiled are returned — nothing is added client-side.');
  h += '<div id="sr"><p class="mut" style="font-size:12.5px;">Searching…</p></div>';
  setTimeout(async function(){
    var box = ge('sr'); if(!box) return;
    if(term.length < 2){ box.innerHTML = '<div class="notice n-info">Enter at least 2 characters.</div>'; return; }
    var r;
    try { r = await window.sb.rpc('admin_search', { p_q: term, p_limit: 50 }); }
    catch(e){ r = { error:{ message:e.message } }; }
    if(r.error){
      box.innerHTML = '<div class="notice n-bad"><b>Search unavailable.</b> <code>admin_search()</code> returned: '+
        esc(r.error.message)+'</div>'; return;
    }
    var rows = r.data||[];
    if(!rows.length){ box.innerHTML = '<div class="notice n-info">No matches for <b>'+esc(term)+'</b>.</div>'; return; }
    var types = {};
    rows.forEach(function(x){ types[x.entity_type] = (types[x.entity_type]||0)+1; });
    box.innerHTML = '<div class="chips">'+Object.keys(types).map(function(t){
        return '<span class="chip on">'+esc(t)+' ('+types[t]+')</span>'; }).join('')+
      '<span class="mut" style="font-size:12px;">'+rows.length+' result'+(rows.length>1?'s':'')+' for &ldquo;'+esc(term)+'&rdquo;</span></div>'+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th>Result</th><th>Detail</th><th>Status</th><th></th></tr></thead><tbody>'+
      rows.map(function(x){
        var route = SEARCH_ROUTE[x.entity_type];
        var href = route ? route(x.entity_id) : (x.destination||'');
        return '<tr><td><span class="bdg bdg-info">'+esc(x.entity_type)+'</span></td>'+
          '<td class="nm">'+dash(x.label)+'</td><td>'+dash(x.sublabel)+'</td>'+
          '<td><span class="bdg bdg-mute">'+esc(x.status||'—')+'</span></td>'+
          '<td>'+(href?'<a class="olink" href="'+esc(href)+'">Open &rsaquo;</a>':'')+'</td></tr>';
      }).join('')+'</tbody></table></div>';
  }, 0);
  return h;

function jsonBox(label, v){
  if(v==null) return '';
  var s; try{ s = JSON.stringify(v, null, 2); }catch(e){ s = String(v); }
  if(s==='null'||s==='{}') return '';
  return '<div class="kv-k" style="margin-top:8px;">'+esc(label)+'</div><div class="jsonbox">'+esc(s)+'</div>';
}
function tblAudit(list, detail){
  if(!list.length) return '<div class="tbl-wrap"><table class="tbl"><tbody><tr><td class="empty">No audit entries</td></tr></tbody></table></div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Actor</th><th>Action</th>'+
    '<th>Target type</th><th>Target</th><th>Reason</th>'+(detail?'<th>Correlation</th>':'')+'</tr></thead><tbody>'+
    list.map(function(a){
      var actor = a.actor_id ? (AC.profById[a.actor_id] ? pname(AC.profById[a.actor_id]) : short(a.actor_id)) : '—';
      var tgt = a.target_label || (a.target_id?short(a.target_id):'—');
      var tgtHref = '';
      if(a.target_type==='profile' && a.target_id && AC.profById[a.target_id]) tgtHref = profileHref(AC.profById[a.target_id]);
      else if(a.target_type==='patient_surgery' && a.target_id) tgtHref = '#/journey/'+a.target_id;
      var main = '<tr><td>'+esc(fdt(a.created_at))+'<div class="mut" style="font-size:10.5px;">'+esc(ago(a.created_at))+'</div></td>'+
        '<td class="nm">'+esc(actor)+'<div class="mut" style="font-size:10.5px;">'+esc(a.actor_role||'')+'</div></td>'+
        '<td><span class="bdg bdg-info">'+esc(a.action)+'</span></td>'+
        '<td>'+dash(a.target_type)+'</td>'+
        '<td>'+(tgtHref?('<a class="olink" href="'+tgtHref+'">'+esc(tgt)+'</a>'):esc(tgt))+'</td>'+
        '<td>'+dash(a.reason)+'</td>'+(detail?('<td class="mono">'+esc(a.correlation_id||'—')+'</td>'):'')+'</tr>';
      if(detail){
        var extra = jsonBox('Before', a.before_state)+jsonBox('After', a.after_state)+jsonBox('Metadata', a.metadata);
        if(extra) main += '<tr><td colspan="7" style="padding-top:0;">'+extra+'</td></tr>';
      }
      return main;
    }).join('')+'</tbody></table></div>';
}
function vAudit(qs){
  var h = head('Operations','Audit log','Every row written by <code>admin_log()</code>. '+
    'The table is append-only at the database level and is strictly read-only here — there is no edit or delete control.');
  if(!has('audit')) return h + capNote('audit');
  var all = AC.db.audit||[];
  var fa = qs.actor||'', fac = qs.a||'', ft = qs.tt||'', fd = qs.d||'', fid = qs.id||'';
  var list = all.filter(function(r){
    if(fa && r.actor_id !== fa) return false;
    if(fac && r.action !== fac) return false;
    if(ft && r.target_type !== ft) return false;
    if(fid && String(r.target_id||'').indexOf(fid) < 0) return false;
    if(fd){
      var d = new Date(r.created_at), n = new Date();
      if(fd==='today'){ var m = new Date(); m.setHours(0,0,0,0); if(d < m) return false; }
      if(fd==='7d'  && (n-d) > 7*86400000)  return false;
      if(fd==='30d' && (n-d) > 30*86400000) return false;
    }
    return true;
  });
  var base = function(o){ var m={actor:fa,a:fac,tt:ft,d:fd,id:fid}; for(var k in o) m[k]=o[k]; return '#/audit'+q2s(m); };
  function sel(cur, field, label, values){
    return '<select class="fsel" onchange="AC.nav(this.value)"><option value="'+base((function(){var x={};x[field]='';return x;})())+'">'+esc(label)+'</option>'+
      values.map(function(v){ var o={}; o[field]=v[0];
        return '<option value="'+esc(base(o))+'"'+(cur===v[0]?' selected':'')+'>'+esc(v[1])+'</option>'; }).join('')+'</select>';
  }
  h += '<div class="chips">'+
    sel(fa,'actor','All actors', uniq(all.map(function(r){return r.actor_id;}).filter(Boolean)).map(function(id){
      return [id, AC.profById[id]?pname(AC.profById[id]):short(id)]; }))+
    sel(fac,'a','All actions', uniq(all.map(function(r){return r.action;}).filter(Boolean)).sort().map(function(v){return [v,v];}))+
    sel(ft,'tt','All target types', uniq(all.map(function(r){return r.target_type;}).filter(Boolean)).sort().map(function(v){return [v,v];}))+
    sel(fd,'d','Any date', [['today','Today'],['7d','Last 7 days'],['30d','Last 30 days']])+
    '<input class="finput" id="aud-id" placeholder="Target ID contains…" value="'+esc(fid)+'" '+
      'onchange="AC.nav(\''+base({id:'__V__'}).replace('__V__','\'+encodeURIComponent(this.value)+\'')+'\')">'+
    '<span class="mut" style="font-size:12px;">'+list.length+' of '+all.length+'</span></div>';
  if(!all.length) h += '<div class="notice n-info">No admin actions recorded yet. Phase 1 performs no mutations, '+
    'so the first entries will appear once the Phase 2 RPCs are applied and used.</div>';
  h += tblAudit(list, true);
  return h;
}
