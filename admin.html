AC.runStatus = async function(){
  var box = ge('st-rows'); if(!box) return;
  box.innerHTML = '<tr><td colspan="4" class="empty">Running…</td></tr>';
  var rows = [];
  function t(){ return (window.performance&&performance.now)?performance.now():Date.now(); }
  // 1. session
  var t0=t(), sess=null;
  try{ sess = await window.getSession(); }catch(e){}
  rows.push(['Authenticated session','supabase.auth.getSession()',
    sess ? '<span class="bdg bdg-ok">active</span> <span class="mut">expires '+esc(fdt(sess.expires_at?sess.expires_at*1000:null))+'</span>'
         : '<span class="bdg bdg-bad">none</span>', Math.round(t()-t0)+' ms']);
  // 2. admin predicate
  t0=t(); var pa;
  try{ pa = await window.sb.rpc('is_platform_admin'); }catch(e){ pa={error:{message:e.message}}; }
  rows.push(['Server-side admin predicate','rpc is_platform_admin()',
    pa.error ? '<span class="bdg bdg-bad">'+esc(pa.error.message)+'</span>'
             : (pa.data===true?'<span class="bdg bdg-ok">true</span>':'<span class="bdg bdg-bad">false</span>'),
    Math.round(t()-t0)+' ms']);
  // 3. REST round trip
  t0=t(); var rr;
  try{ rr = await window.sb.from('profiles').select('id').limit(1); }catch(e){ rr={error:{message:e.message}}; }
  rows.push(['PostgREST round trip','select id from profiles limit 1',
    rr.error?'<span class="bdg bdg-bad">'+esc(rr.error.message)+'</span>':'<span class="bdg bdg-ok">ok</span>',
    Math.round(t()-t0)+' ms']);
  // 4. audit read
  t0=t(); var ar;
  try{ ar = await window.sb.from('admin_audit_log').select('id').limit(1); }catch(e){ ar={error:{message:e.message}}; }
  rows.push(['Audit log readable','select id from admin_audit_log limit 1',
    ar.error?'<span class="bdg bdg-bad">'+esc(ar.error.message)+'</span>':'<span class="bdg bdg-ok">ok</span>',
    Math.round(t()-t0)+' ms']);
  // 5. search rpc
  t0=t(); var sr;
  try{ sr = await window.sb.rpc('admin_search', { p_q:'zz', p_limit:1 }); }catch(e){ sr={error:{message:e.message}}; }
  rows.push(['Global search RPC','rpc admin_search(\'zz\',1)',
    sr.error?'<span class="bdg bdg-bad">'+esc(sr.error.message)+'</span>':'<span class="bdg bdg-ok">ok</span>',
    Math.round(t()-t0)+' ms']);
  // 6. admin-api edge function (Phase 3) — measured, not assumed
  t0=t();
  var fnState = '<span class="bdg bdg-mute">not deployed</span>';
  try{
    var fr = await fetch((window.SUPA_URL||'')+'/functions/v1/admin-api', { method:'OPTIONS' });
    fnState = fr.ok ? '<span class="bdg bdg-ok">responds ('+fr.status+')</span>'
                    : '<span class="bdg bdg-mute">'+fr.status+' — not deployed</span>';
  }catch(e){ fnState = '<span class="bdg bdg-mute">unreachable — not deployed</span>'; }
  rows.push(['admin-api Edge Function','OPTIONS /functions/v1/admin-api', fnState, Math.round(t()-t0)+' ms']);

  box.innerHTML = rows.map(function(r){
    return '<tr><td class="nm">'+esc(r[0])+'</td><td class="mono">'+esc(r[1])+'</td><td>'+r[2]+'</td><td>'+esc(r[3])+'</td></tr>';
  }).join('');
};

function parseHash(){
  var raw = (location.hash||'').replace(/^#\/?/, '');
  var qi = raw.indexOf('?'), qs = {};
  if(qi >= 0){
    raw.slice(qi+1).split('&').forEach(function(kv){
      if(!kv) return; var i = kv.indexOf('=');
      var k = decodeURIComponent(i<0?kv:kv.slice(0,i));
      var v = i<0?'':decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
      qs[k]=v;
    });
    raw = raw.slice(0, qi);
  }
  var parts = raw.split('/').filter(Boolean);
  return { section: parts[0]||'overview', id: parts[1]||null, qs: qs };
}
var RAIL_FOR = { doctor:'doctors', patient:'patients', journey:'journeys', search:'overview' };

async function render(){
  var r = parseHash();
  renderRail(RAIL_FOR[r.section] || r.section);
  var view = ge('adm-view');
  var html;
  switch(r.section){
    case 'overview':       html = vOverview(); break;
    case 'doctors':        html = vDoctors(r.qs); break;
    case 'doctor':         html = vDoctor(r.id, r.qs); break;
    case 'patients':       html = vPatients(r.qs); break;
    case 'patient':        html = vPatient(r.id, r.qs); break;
    case 'accounts':       html = vAccounts(r.qs); break;
    case 'journeys':       html = vJourneys(r.qs); break;
    case 'journey':        html = vJourney(r.id); break;
    case 'questionnaires': html = vQuests(r.qs); break;
    case 'checklists':     html = vChecklists(); break;
    case 'questions':      html = vQuestions(r.qs); break;
    case 'care-requests':  html = vRequests(r.qs); break;
    case 'content':        html = vContent(); break;
    case 'deleted':        html = vDeleted(r.qs); break;
    case 'audit':          html = vAudit(r.qs); break;
    case 'status':         html = vStatus(); break;
    case 'capabilities':   html = vCaps(); break;
    case 'settings':       html = vSettings(); break;
    case 'danger':         html = vDanger(); break;
    case 'search':         html = await vSearch(r.qs); break;
    default:
      html = head('Admin','Section not found','') +
        '<div class="notice n-bad">No admin section named <code>'+esc(r.section)+'</code>. '+
        '<a class="lnk" href="#/overview">Back to overview</a></div>';
  }
  view.innerHTML = html;
  acCloseMenu();
  acSelPaint();
  wireSearch();
  if(r.section==='search' && r.qs.q){ var s = ge('adm-q'); if(s){ s.value = r.qs.q; } }
  window.scrollTo(0,0);
}
function go(hash, replace){
  if(replace && location.hash !== hash) history.replaceState(null,'',hash);
  else if(!replace) location.hash = hash;
  if(replace) render();
}
AC.nav = function(h){ if(h) location.hash = h; };

/* ============================================================
   BOOT
   ============================================================ */
function fail(msg, detail){
  var l = ge('loader');
  l.innerHTML = '<div style="text-align:center;padding:30px;max-width:460px;">'+
    '<p style="color:rgba(255,160,140,.92);font-size:14px;font-family:DM Sans,sans-serif;">'+esc(msg)+'</p>'+
    (detail?'<p style="color:rgba(255,255,255,.4);font-size:12px;margin-top:8px;font-family:DM Sans,sans-serif;">'+esc(detail)+'</p>':'')+
    '<p style="margin-top:16px;"><a href="/v2/dashboard.html" style="color:#7ECFC0;font-size:13px;">Back to dashboard</a></p></div>';
}

document.addEventListener('DOMContentLoaded', async function(){
  var safety = setTimeout(function(){
    var l = ge('loader');
    if(l && l.style.display !== 'none') fail('Taking longer than expected.', 'The Admin Center could not finish loading.');
  }, 20000);
  try{
    // 1. UX guard (frontend only — never the security boundary)
    var auth = await window.requireRole('admin');
    if(!auth){ clearTimeout(safety); return; }
    AC.me = auth.profile || {};

    // 2. Canonical server-side gate. RLS is the real boundary; this makes the
    //    server's own answer explicit instead of trusting the local profile row.
    var gate;
    try { gate = await window.sb.rpc('is_platform_admin'); }
    catch(e){ gate = { error:{ message:e.message } }; }
    if(gate.error){ clearTimeout(safety);
      return fail('Admin gate unavailable.', 'is_platform_admin(): '+gate.error.message); }
    if(gate.data !== true){ clearTimeout(safety);
      return fail('Admin privileges required.', 'The server does not recognise this account as a platform administrator.'); }

    // 3. Probe, then load
    var probes = await Promise.all(CAPS.map(probeCap));
    probes.forEach(function(p){ AC.cap[p.key] = p; });
    var req = probes.filter(function(p){ return p.required && !p.ok; });
    if(req.length){ clearTimeout(safety);
      return fail('Required data is not readable.', req.map(function(p){ return p.table+': '+(p.error||'unknown'); }).join(' | ')); }

    await loadAll();
    AC.boot.loadedAt = new Date().toISOString();

    if(!location.hash || location.hash === '#') location.hash = '#/overview';
    await render();
    window.addEventListener('hashchange', function(){ render(); });

    clearTimeout(safety);
    ge('loader').style.display = 'none';
    ge('app').style.display = 'block';
    console.log('ADMIN CENTER READY — modules '+
      CAPS.filter(function(c){ return has(c.key); }).length+'/'+CAPS.length+
      ', profiles '+(AC.db.profiles||[]).length+
      ', journeys '+(AC.db.surgeries||[]).length+
      ', audit '+(AC.db.audit||[]).length);
  }catch(e){
    clearTimeout(safety);
    console.error('ADMIN ERROR:', e.message);
    fail('Could not load Admin Center.', e.message);
  }
});

/* keyboard: "/" focuses search, Escape leaves a detail view */
document.addEventListener('keydown', function(e){
  if(e.key === '/' && document.activeElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    var s = ge('adm-q'); if(s){ e.preventDefault(); s.focus(); s.select(); }
  }
  if(e.key === 'Escape'){
    var r = parseHash();
    if(r.section==='doctor')  location.hash = '#/doctors';
    else if(r.section==='patient') location.hash = '#/patients';
    else if(r.section==='journey') location.hash = '#/journeys';
  }
});

})();
