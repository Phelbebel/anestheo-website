/* ── Journeys ────────────────────────────────────────── */
/* A journey is a record in its own right. Every action below targets
   patient_surgeries.id — never patient_id, which is legitimately NULL for a
   clinic-created journey that has not been claimed.
     archive / restore  -> archive_patient() / restore_patient()  (shipped, admin-capable)
     soft delete / restore / purge -> admin_record_action('journey', ...)  (phase 3)
     assign / reassign  -> admin_assign_doctor()                  (phase 2)
   No new RPC was required. */
function jClaimed(s){ return !!(s && s.patient_id); }
function jDeleted(s){ return !!(s && s.deleted_at); }
function jArchived(s){ return !!(s && s.archived_at); }
function canSoftDeleteJourney(){ return has('surgeries','deleted_at'); }

function acJourneyMenu(s){
  var items = [{ head:'Journey' },
    { label:'Open journey', fn:function(){ location.hash = '#/journey/'+s.id; } }];
  // Account actions only exist when an account actually exists.
  if(jClaimed(s)) items.push({ label:'Open patient account', fn:function(){ location.hash = '#/patient/'+s.patient_id; } });
  if(s.assigned_doctor_id) items.push({ label:'Open assigned doctor', fn:function(){ location.hash = '#/doctor/'+s.assigned_doctor_id; } });

  if(jDeleted(s)){
    items.push({ sep:true }, { head:'Deleted' });
    items.push({ label:'Restore from Recycle Bin', fn:function(){ acJourneyUndelete(s); } });
    items.push({ label:'Permanently delete', danger:true, disabled:!canSoftDeleteJourney(),
                 fn:function(){ AC.binPurge('journey', s.id); } });
    return acMenuBtn(acRegister(items));
  }
  items.push({ sep:true }, { head:'Assignment' });
  items.push({ label:(s.assigned_doctor_id ? 'Change doctor' : 'Assign doctor'), fn:function(){ acAssignJourney(s); } });
  items.push({ sep:true }, { head:'Lifecycle' });
  if(jArchived(s)) items.push({ label:'Restore from archive', fn:function(){ acRestoreJourney(s); } });
  else             items.push({ label:'Archive journey', fn:function(){ acArchiveJourney(s); } });
  items.push({ label:'Soft delete', danger:true, disabled:!canSoftDeleteJourney(),
               fn:function(){ acSoftDeleteJourney(s); } });
  return acMenuBtn(acRegister(items));
}

function jLabel(s){ return s.patient_name || (s.patient_id ? pname(AC.profById[s.patient_id]) : null) || 'Journey'; }

function acArchiveJourney(s){
  acDialog({ title:'Archive journey — '+jLabel(s), confirmLabel:'Archive journey',
    body:'Archiving is historical, not deletion. The journey moves to <b>archived</b>, stays fully readable, '+
      'and can be restored at any time. It does not go to the Recycle Bin.',
    impact:'<b>Nothing is removed.</b> Questionnaire, checklist, documents and the assigned doctor are untouched.',
    fields:[{ key:'reason', label:'Note (optional)', type:'textarea',
              ph:'Recorded in the audit log.' }],
    onConfirm: async function(v){
      await acRpc('archive_patient', { p_surgery_id:s.id, p_reason:v.reason||null });
      await acAfter('Journey archived');
    }});
}
function acRestoreJourney(s){
  acDialog({ title:'Restore from archive — '+jLabel(s), confirmLabel:'Restore journey',
    body:'The journey returns to its active state, derived from its own clinical columns.',
    onConfirm: async function(){
      await acRpc('restore_patient', { p_surgery_id:s.id });
      await acAfter('Journey restored from archive');
    }});
}
function acSoftDeleteJourney(s){
  var q = (AC.db.quests||[]).filter(function(x){ return s.patient_id && x.patient_id===s.patient_id; }).length;
  var d = (AC.db.documents||[]).filter(function(x){ return x.surgery_id===s.id; }).length;
  var r = (AC.db.requests||[]).filter(function(x){ return x.surgery_id===s.id; }).length;
  acDialog({ title:'Delete journey — '+jLabel(s), danger:true, confirmLabel:'Move to Recycle Bin',
    body:'This soft-deletes <b>only this journey</b>. Nothing is erased and it can be restored.',
    impact:'<b>This journey only.</b> '+d+' document(s) and '+r+' care request(s) stay attached to it. '+
      (jClaimed(s) ? ('The patient account and its '+q+' questionnaire(s) are <b>not</b> touched.')
                   : 'There is no patient account to affect.')+
      ' The assigned doctor is never affected.',
    fields:[{ key:'reason', label:'Reason (optional)', type:'textarea',
              ph:'Recorded in the audit log. Leave blank for "' + REASON_DELETE + '".' }],
    onConfirm: async function(v){
      await acRpc('admin_record_action', { p_entity:'journey', p_id:s.id, p_action:'soft_delete',
        p_reason:reasonOr(v.reason, REASON_DELETE), p_confirm:null });
      await acAfter('Journey moved to the Recycle Bin');
    }});
}
function acJourneyUndelete(s){
  acDialog({ title:'Restore journey — '+jLabel(s), confirmLabel:'Restore',
    body:'The journey returns to its normal list with every relationship intact. '+
      (jClaimed(s) ? '' : 'It has no linked account, so it returns to <b>Journeys with no linked account</b>.'),
    fields:[{ key:'reason', label:'Reason (optional)', type:'textarea' }],
    onConfirm: async function(v){
      await acRpc('admin_record_action', { p_entity:'journey', p_id:s.id, p_action:'restore',
        p_reason:v.reason||null, p_confirm:null });
      await acAfter('Journey restored');
    }});
}
AC.jAct = function(id, what){
  var s = AC.surgById[id]; if(!s) return;
  if(what==='assign')   return acAssignJourney(s);
  if(what==='archive')  return acArchiveJourney(s);
  if(what==='unarch')   return acRestoreJourney(s);
  if(what==='delete')   return acSoftDeleteJourney(s);
  if(what==='undelete') return acJourneyUndelete(s);
  if(what==='purge')    return AC.binPurge('journey', s.id);
};

    '<th>Surgery date</th><th>Doctor</th><th>Care state</th><th>Origin</th><th>State</th><th>Created</th><th></th></tr></thead><tbody>'+

        (mod?'<td class="selcol"><input type="checkbox" class="selbox" data-id="'+s.id+'" aria-label="Select journey" onchange="AC.selToggle(\'journey\',\''+s.id+'\',this.checked)"></td>':'')+

function vJourneys(qs){
  if(!has('surgeries')) return head('Clinical','Surgery journeys','') + capNote('surgeries');
  var everything = AC.db.surgeries||[], f = qs.f||'all';
  var all = everything.filter(function(s){ return !jDeleted(s); });
  var list = (f==='deleted' ? everything.filter(jDeleted) : all).filter(function(s){
    var st = journeyState(s).k;
    if(f==='active')     return st==='active'||st==='ready';
    if(f==='archived')   return st==='archived';
    if(f==='completed')  return st==='completed';
    if(f==='unassigned') return !s.archived_at && !s.completed_at && !s.assigned_doctor_id;
    if(f==='unclaimed')  return !s.patient_id;
    if(f==='deleted')    return true;
    return true;
  });
  var h = head('Clinical','Surgery journeys','Every surgery journey on the platform. State is derived from the '+
    'journey\'s own recorded milestones — no status is invented.');
  h += '<div class="chips">'+
    [['all','All'],['active','Active'],['completed','Completed'],['archived','Archived'],
     ['unassigned','No doctor assigned'],['unclaimed','No linked account']]
    .concat(canSoftDeleteJourney() ? [['deleted','Deleted']] : []).map(function(k){
      return '<a class="chip'+(f===k[0]?' on':'')+'" href="#/journeys'+q2s({f:k[0]})+'">'+esc(k[1])+'</a>'; }).join('')+
    '<span class="mut" style="font-size:12px;">'+list.length+' of '+all.length+'</span></div>';
  h += selBar('journey', list, null, 'journeys') + tblJourneys(list, true);
  return h;
}

/* ── Checklists ──────────────────────────────────────── */
function chkProgress(items){
  if(!items || typeof items !== 'object') return null;
  var done = 0, total = 0;
  Object.keys(items).forEach(function(k){
    var v = items[k];
    if(Array.isArray(v)) v.forEach(function(x){ total++; if(x===true) done++; });
    else if(typeof v === 'boolean'){ total++; if(v) done++; }
  });
  return total ? { done:done, total:total, pct:Math.round(done/total*100) } : null;
}
function tblChecklists(list){
  if(!list.length) return '<div class="tbl-wrap"><table class="tbl"><tbody><tr><td class="empty">No checklists</td></tr></tbody></table></div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Patient</th><th>Progress</th><th>Items</th><th>Updated</th><th></th></tr></thead><tbody>'+
    list.map(function(c){
      var p = AC.profById[c.patient_id], pr = chkProgress(c.items);
      return '<tr><td class="nm">'+(p?esc(pname(p)):'<span class="mono">'+short(c.patient_id)+'</span>')+'</td>'+
        '<td>'+(pr?(pr.pct+'%<div class="meterbar"><div class="meterfill" style="width:'+pr.pct+'%"></div></div>'):'<span class="mut">—</span>')+'</td>'+
        '<td>'+(pr?(pr.done+' of '+pr.total):'<span class="mut">no boolean items</span>')+'</td>'+
        '<td>'+esc(fdate(c.updated_at))+'</td>'+
        '<td>'+(p?'<a class="olink" href="#/patient/'+c.patient_id+q2s({t:'checklist'})+'">Open &rsaquo;</a>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function vChecklists(){
  if(!has('checklists')) return head('Clinical','Checklists','') + capNote('checklists');
  var all = (AC.db.checklists||[]).filter(function(c){ return !c.deleted_at; });
  return head('Clinical','Checklists','Completion progress only. The checklist content itself is not displayed.') +
    '<div class="chips"><span class="mut" style="font-size:12px;">'+all.length+' checklist'+(all.length===1?'':'s')+'</span></div>' +
    tblChecklists(all);
}

function tblQuestions(list){
  var c = AC.cap.questions || {cols:{}};
  var portal = !!c.cols.subject, legacy = !!c.cols.question;
  if(!list.length) return '<div class="tbl-wrap"><table class="tbl"><tbody><tr><td class="empty">No questions</td></tr></tbody></table></div>';
  var cols = [];
  if(portal) cols.push(['subject','Subject']);
  if(legacy){ if(c.cols.name) cols.push(['name','Name']); if(c.cols.topic) cols.push(['topic','Topic']); cols.push(['question','Question']); }
  if(c.cols.email) cols.push(['email','Email']);
  if(c.cols.patient_id) cols.push(['__patient','Patient account']);
  if(c.cols.status) cols.push(['status','Status']);
  cols.push(['created_at','Received']);
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    cols.map(function(x){ return '<th>'+esc(x[1])+'</th>'; }).join('')+'</tr></thead><tbody>'+
    list.map(function(q){
      return '<tr'+hlRow(q.id)+'>'+cols.map(function(x){
        var k = x[0];
        if(k==='__patient'){ var p = AC.profById[q.patient_id];
          return '<td>'+(p?'<a class="olink" href="#/patient/'+q.patient_id+'">'+esc(pname(p))+'</a>':'<span class="mut">—</span>')+'</td>'; }
        if(k==='status')     return '<td><span class="bdg bdg-mute">'+esc(q.status||'—')+'</span></td>';
        if(k==='created_at') return '<td>'+esc(fdate(q.created_at))+'</td>';

        return '<td'+(k==='subject'||k==='name'?' class="nm"':'')+'>'+dash(v)+'</td>';
      }).join('')+'</tr>';

/* ── Tiny inline charts. No library, no animation, theme tokens only. ───── */
function svgBars(rows, opts){
  opts = opts || {};
  if(!rows.length) return '<p class="mut" style="font-size:12.5px;">No data.</p>';
  var max = Math.max.apply(null, rows.map(function(r){ return r[1]; })) || 1;
  return '<div class="chart">' + rows.map(function(r){
    var pct = Math.round(r[1] / max * 100);
    return '<div class="chart-row"><span class="chart-lb" title="' + esc(r[0]) + '">' + esc(r[0]) + '</span>' +
      '<span class="chart-track"><span class="chart-fill" style="width:' + pct + '%"></span></span>' +
      '<span class="chart-v">' + r[1] + (opts.suffix || '') + '</span></div>';
  }).join('') + '</div>';
}
function svgLine(points, label){
  if(points.length < 2) return '<p class="mut" style="font-size:12.5px;">Not enough data points yet.</p>';
  var W = 640, H = 132, pad = 26;
  var max = Math.max.apply(null, points.map(function(p){ return p[1]; })) || 1;
  var step = (W - pad * 2) / (points.length - 1);
  var xy = points.map(function(p, i){
    return [pad + i * step, H - pad - (p[1] / max) * (H - pad * 2)];
  });
  var d = xy.map(function(c, i){ return (i ? 'L' : 'M') + c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' ');
  var area = d + ' L' + xy[xy.length-1][0].toFixed(1) + ',' + (H-pad) + ' L' + pad + ',' + (H-pad) + ' Z';
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' +
    '<path d="' + area + '" fill="rgba(42,138,116,.16)"/>' +
    '<path d="' + d + '" fill="none" stroke="#2A8A74" stroke-width="2" stroke-linejoin="round"/>' +
    xy.map(function(c){ return '<circle cx="' + c[0].toFixed(1) + '" cy="' + c[1].toFixed(1) + '" r="2.5" fill="#7ECFC0"/>'; }).join('') +
    '<text x="' + pad + '" y="' + (H - 6) + '" fill="rgba(255,255,255,.3)" font-size="10">' + esc(points[0][0]) + '</text>' +
    '<text x="' + (W - pad) + '" y="' + (H - 6) + '" fill="rgba(255,255,255,.3)" font-size="10" text-anchor="end">' +
      esc(points[points.length-1][0]) + '</text>' +
    '<text x="' + pad + '" y="14" fill="rgba(255,255,255,.3)" font-size="10">peak ' + max + '</text></svg>';
}
function topCounts(list, fn, n){
  var m = {};
  list.forEach(function(x){ var k = fn(x); if(k) m[k] = (m[k]||0) + 1; });
  return Object.keys(m).map(function(k){ return [k, m[k]]; })
    .sort(function(a,b){ return b[1]-a[1]; }).slice(0, n || 8);
}

function vQueueBuckets(){
  var d = (AC.db.profiles||[]).filter(function(p){ return isDoctor(p) && isLive(p); });
  var recent = Date.now() - 30*86400000;
  return {
    pending:  d.filter(function(p){ return vstate(p)==='pending'; }),
    changes:  d.filter(function(p){ return vstate(p)==='changes_requested' || vstate(p)==='verification_suspended'; }),
    rejected: d.filter(function(p){ return vstate(p)==='rejected'; }),
    approved: d.filter(function(p){ return (vstate(p)==='approved'||vstate(p)==='verified') &&

    esc(fdt(AC.boot.loadedAt))+'</span></div><div class="stat-grid">'+
    statCard(live.length, 'Accounts', '#/accounts') +
    statCard(doctors.length, 'Doctors', '#/doctors') +
    statCard(verified.length, 'Verified doctors', '#/doctors'+q2s({f:'verified'})) +
    statCard(patients.length, 'Patients', '#/patients') +
    statCard(S.filter(function(s){ return !s.archived_at && !s.completed_at; }).length, 'Active journeys', '#/journeys'+q2s({f:'active'})) +
    statCard(S.filter(function(s){ return !!s.completed_at; }).length, 'Completed journeys', '#/journeys'+q2s({f:'completed'})) +
    '</div></div>';

  // Registrations by month (real created_at)
  var byMonth = {};
  P.forEach(function(p){ if(!p.created_at) return;
    var k = String(p.created_at).slice(0,7); byMonth[k] = (byMonth[k]||0)+1; });
  var months = Object.keys(byMonth).sort().slice(-12).map(function(k){ return [k, byMonth[k]]; });
  var last30 = P.filter(function(p){ return new Date(p.created_at) >= new Date(Date.now()-30*86400000); }).length;
  var prev30 = P.filter(function(p){ var d=new Date(p.created_at);
    return d >= new Date(Date.now()-60*86400000) && d < new Date(Date.now()-30*86400000); }).length;
  var growth = prev30 ? Math.round((last30-prev30)/prev30*100) : null;

  h += '<div class="gcard"><div class="gcard-h">Registrations by month'+
    '<span class="gh-note">'+last30+' in the last 30 days'+
    (growth===null ? ' &middot; no prior month to compare' : (' &middot; '+(growth>=0?'+':'')+growth+'% vs the previous 30 days'))+
    '</span></div>'+ svgLine(months, 'Registrations by month') +'</div>';

  h += '<div class="anz">'+
    '<div class="gcard"><div class="gcard-h">Countries</div>'+ svgBars(topCounts(live, function(p){ return p.country; })) +'</div>'+
    '<div class="gcard"><div class="gcard-h">Hospitals</div>'+ svgBars(topCounts(live, function(p){ return p.hospital; })) +'</div>'+
    '<div class="gcard"><div class="gcard-h">Specialties</div>'+ svgBars(topCounts(doctors, function(p){ return p.specialty; })) +'</div>'+
    '<div class="gcard"><div class="gcard-h">Most common procedures</div>'+
      svgBars(topCounts(S, function(s){ return s.procedure_type; })) +'</div>'+
    '</div>';

  // Questionnaire + journey completion (real)
  var submitted = Q.filter(function(q){ return q.status==='submitted' || q.submitted_at; }).length;
  var qavg = Q.length ? Math.round(Q.reduce(function(a,q){ return a + (q.completion||0); },0) / Q.length) : 0;
  var jDone = S.filter(function(s){ return !!s.completed_at; }).length;
  h += '<div class="gcard"><div class="gcard-h">Completion</div><div class="stat-grid">'+
    statCard(Q.length, 'Questionnaires started', '#/questionnaires') +
    statCard(submitted, 'Submitted', '#/questionnaires'+q2s({f:'review'})) +
    statCard(qavg, 'Average completion %', '#/questionnaires') +
    statCard(Q.filter(function(q){ return q.review_state==='approved'; }).length, 'Approved', '#/questionnaires'+q2s({f:'approved'})) +
    statCard(S.length, 'Journeys total', '#/journeys') +
    statCard(jDone, 'Journeys completed', '#/journeys'+q2s({f:'completed'})) +
    '</div></div>';

  // Consultations + response time (real timestamps)
  var answered = R.filter(function(r){ return r.responded_at && r.requested_at; });
  var avgMs = answered.length ? answered.reduce(function(a,r){
    return a + (new Date(r.responded_at) - new Date(r.requested_at)); }, 0) / answered.length : null;
  function dur(ms){ if(ms==null) return null;
    var hrs = ms/3600000; return hrs < 48 ? (Math.round(hrs*10)/10 + ' h') : (Math.round(hrs/24*10)/10 + ' days'); }
  h += '<div class="gcard"><div class="gcard-h">Consultation requests</div><div class="stat-grid">'+
    statCard(R.filter(function(r){ return !r.deleted_at; }).length, 'Requests total', '#/care-requests') +
    statCard(R.filter(function(r){ return r.status==='requested'; }).length, 'Awaiting a doctor', '#/care-requests'+q2s({f:'requested'}), {warn:true}) +
    statCard(R.filter(function(r){ return r.status==='accepted'; }).length, 'Accepted', '#/care-requests'+q2s({f:'accepted'})) +
    statCard(R.filter(function(r){ return r.status==='closed'; }).length, 'Completed', '#/care-requests'+q2s({f:'closed'})) +
    statCard(R.filter(function(r){ return r.status==='declined'; }).length, 'Declined', '#/care-requests'+q2s({f:'declined'})) +
    '</div>'+
    '<p class="mut" style="font-size:12.5px;margin-top:12px;">Average time to first response: <b style="color:#fff">'+
      (avgMs===null ? 'not computable — no request has a responded_at yet' : esc(dur(avgMs)))+
      '</b> across '+answered.length+' answered request'+(answered.length===1?'':'s')+
      ', measured from when each request was sent to when it was answered.</p></div>';

  // Videos — real, from video_progress
  h += '<div class="gcard"><div class="gcard-h">Most watched videos'+
    '<span class="gh-note">'+(has('videos') ? (V.length+' viewing record'+(V.length===1?'':'s')) : '')+'</span></div>';
  if(!has('videos')) h += capNote('videos');
  else if(!V.length) h += '<p class="mut" style="font-size:12.5px;">No watch progress recorded yet.</p>';
  else h += svgBars(topCounts(V, function(v){ return v.video_id; }), { suffix:' viewers' });
  h += '</div>';

  h += '<div class="gcard"><div class="gcard-h">Not reported</div>'+
    '<p class="mut" style="font-size:12.5px;line-height:1.75;">'+
    'Usage of the clinical tools and of site search is not collected, so no figures are shown for them. '+
    'Every number elsewhere on this page is counted from real records.</p></div>';
  return h;
}

function vRecycle(qs){
  var h = head('Operations','Recycle Bin',
    'Everything that was soft deleted, with who removed it, when and why. Restoring puts it back exactly as it was. '+
    'Permanent deletion lives only in the Danger Zone.');
  // Categories that are not available are hidden entirely, not shown as "n/a".
  var avail = BIN.filter(function(b){ return b.need(); });
  if(!avail.length) return h + featureNote();
  var tab = qs.t || avail[0].k;
  if(!avail.some(function(b){ return b.k===tab; })) tab = avail[0].k;
  h += '<div class="tabrow">'+ avail.map(function(b){
      return '<a class="tabb'+(tab===b.k?' on':'')+'" href="#/recycle'+q2s({t:b.k})+'">'+esc(b.label)+
        ' ('+b.rows().length+')</a>'; }).join('') +'</div>';

  var sec = avail.filter(function(b){ return b.k===tab; })[0];
  var rows = sec.rows();
  if(!rows.length) return h + '<div class="notice n-info">Nothing deleted in '+esc(sec.label.toLowerCase())+'.</div>';

  /* Bulk here is restore only — a reversible action. Permanent deletion is not
     offered in bulk from the Recycle Bin; it lives in the Danger Zone behind a
     typed confirmation. */
  var bmod = p2();
  h += selBar('bin', rows, null, 'recycle-bin');
  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    (bmod?'<th class="selcol"><input type="checkbox" class="selbox" id="sel-all" aria-label="Select all" onchange="AC.selAll(\'bin\',this.checked)"></th>':'')+
    '<th>Item</th><th>Detail</th><th>Type</th>'+
    '<th>Deleted</th><th>Deleted by</th><th>Reason</th><th></th></tr></thead><tbody>'+
    rows.map(function(r){
      var isAcct = (r.entity==='account');
      return '<tr>'+
        (bmod?'<td class="selcol"><input type="checkbox" class="selbox" data-id="'+r.id+'" aria-label="Select '+esc(r.label||'item')+'" onchange="AC.selToggle(\'bin\',\''+r.id+'\',this.checked)"></td>':'')+
        '<td class="nm">'+(r.href?('<a class="olink" href="'+r.href+'">'+dash(r.label)+'</a>'):dash(r.label))+'</td>'+
        '<td>'+dash(r.sub)+'</td><td>'+dash(r.kind)+'</td>'+
        '<td>'+esc(fdt(r.at))+'<div class="mut" style="font-size:10.5px;">'+esc(ago(r.at))+'</div></td>'+
        '<td>'+(r.by?esc(docName(r.by)):'<span class="mut">—</span>')+'</td>'+
        '<td>'+dash(r.why)+'</td>'+
        '<td class="rowact"><button class="rowbtn" onclick="AC.binRestore(\''+esc(r.entity)+'\',\''+r.id+'\')">Restore</button>'+
          ' <button class="rowbtn" style="border-color:rgba(192,57,43,.4);color:rgba(255,150,130,.95)" '+
          'onclick="AC.binPurge(\''+esc(r.entity)+'\',\''+r.id+'\')">Permanently delete&hellip;</button></td></tr>';
    }).join('')+'</tbody></table></div>';
  return h;
}
AC.binRestore = function(entity, id){
  if(entity === 'account'){ var p = AC.profById[id]; if(p) acRestore(p); return; }
  acDialog({ title:'Restore '+esc(entity), confirmLabel:'Restore',
    body:'The record returns to its normal list with every relationship intact.',
    fields:[{ key:'reason', label:'Reason (optional)', type:'textarea' }],
    onConfirm: async function(v){
      await acRpc('admin_record_action', { p_entity:entity, p_id:id, p_action:'restore', p_reason:v.reason||null, p_confirm:null });
      await acAfter('Restored');
    }});
};
AC.binPurge = function(entity, id){
  var label = entity;
  BIN.forEach(function(bn){ if(!bn.need()) return;
    bn.rows().forEach(function(r){ if(r.id === id) label = r.label || entity; }); });
  acDialog({ title:'Permanently delete '+esc(label), danger:true, confirmWord:'DELETE',
    confirmLabel:'Permanently delete',
    body:'This erases the record. The audit entry is written first and survives.',
    fields:[{ key:'reason', label:'Reason (optional)', type:'textarea',
              ph:'Recorded in the audit log. Leave blank for "' + REASON_DELETE + '".' }],
    onConfirm: async function(v){
      await acRpc('admin_record_action', { p_entity:entity, p_id:id, p_action:'purge',
        p_reason:reasonOr(v.reason, REASON_DELETE), p_confirm:v.__word });
      await acAfter('Permanently deleted');
    }});
};

function activityEvents(){
  var ev = [];
  (AC.db.profiles||[]).forEach(function(p){
    ev.push({ ts:p.created_at, k:'account', t:(p.role||'account')+' registered', who:pname(p),
              href:(p.role==='doctor'?'#/doctor/':'#/patient/')+p.id });
    if(p.deleted_at) ev.push({ ts:p.deleted_at, k:'account', t:'account soft deleted', who:pname(p), href:'#/recycle' });
    if(p.suspended_at) ev.push({ ts:p.suspended_at, k:'account', t:'account suspended', who:pname(p), href:'' });
    if(p.banned_at) ev.push({ ts:p.banned_at, k:'account', t:'account banned', who:pname(p), href:'' });
  });
  (AC.db.surgeries||[]).forEach(function(s){
    ev.push({ ts:s.created_at, k:'journey', t:'journey created', who:s.patient_name||'Patient', href:'#/journey/'+s.id });
    if(s.assigned_at) ev.push({ ts:s.assigned_at, k:'journey', t:'doctor assigned', who:s.patient_name||'Patient', href:'#/journey/'+s.id });
    if(s.ready_at) ev.push({ ts:s.ready_at, k:'journey', t:'marked ready', who:s.patient_name||'Patient', href:'#/journey/'+s.id });
    if(s.completed_at) ev.push({ ts:s.completed_at, k:'journey', t:'journey completed', who:s.patient_name||'Patient', href:'#/journey/'+s.id });
    if(s.archived_at) ev.push({ ts:s.archived_at, k:'journey', t:'journey archived', who:s.patient_name||'Patient', href:'#/journey/'+s.id });
  });
  (AC.db.quests||[]).forEach(function(q){
    var p = AC.profById[q.patient_id];
    if(q.submitted_at) ev.push({ ts:q.submitted_at, k:'clinical', t:'questionnaire submitted',
      who:(p?pname(p):short(q.patient_id)), href:p?('#/patient/'+q.patient_id+'?t=quest'):'' });
    if(q.reviewed_at) ev.push({ ts:q.reviewed_at, k:'clinical', t:'questionnaire reviewed',
      who:(p?pname(p):short(q.patient_id)), href:p?('#/patient/'+q.patient_id+'?t=quest'):'' });
  });
  (AC.db.requests||[]).forEach(function(r){
    var p = AC.profById[r.patient_id];
    ev.push({ ts:r.requested_at, k:'consult', t:'consultation requested', who:(p?pname(p):short(r.patient_id)), href:'#/care-requests' });
    if(r.responded_at) ev.push({ ts:r.responded_at, k:'consult', t:'consultation '+(r.status||'answered'),
      who:(p?pname(p):short(r.patient_id)), href:'#/care-requests' });
  });
  (AC.db.audit||[]).forEach(function(a){
    ev.push({ ts:a.created_at, k:'admin', t:a.action, who:a.target_label||short(a.target_id),
              actor:a.actor_id, reason:a.reason, href:'#/audit' });
  });
  (AC.db.reports||[]).forEach(function(r){
    ev.push({ ts:r.created_at, k:'moderation', t:'report raised ('+(MOD_CATS[r.category]||r.category)+')',
              who:r.target_label||'', href:'#/moderation' });
  });
  return ev.filter(function(e){ return e.ts; })
           .sort(function(a,b){ return new Date(b.ts) - new Date(a.ts); });
}
var ACT_KINDS = { account:'Accounts', journey:'Journeys', clinical:'Clinical', consult:'Consultations',
                  admin:'Admin actions', moderation:'Moderation' };
function vActivity(qs){
  var h = head('Operations','Activity Center',
    'One chronological stream, newest first, assembled from the timestamps the database already stores. '+
    'Nothing here is a notification — every line is a stored fact.');
  var all = activityEvents();
  var k = qs.k || '', win = qs.d || '30d', limit = +(qs.n || 200);
  var cutoff = win==='today' ? (function(){ var d=new Date(); d.setHours(0,0,0,0); return d; })()
             : win==='7d'  ? new Date(Date.now()-7*86400000)
             : win==='30d' ? new Date(Date.now()-30*86400000)
             : null;
  var list = all.filter(function(e){
    if(k && e.k !== k) return false;
    if(cutoff && new Date(e.ts) < cutoff) return false;
    return true;
  });
  h += '<div class="chips">'+
    [['','All']].concat(Object.keys(ACT_KINDS).map(function(x){ return [x, ACT_KINDS[x]]; }))
      .map(function(t){
        var n = all.filter(function(e){ return (!t[0] || e.k===t[0]) && (!cutoff || new Date(e.ts)>=cutoff); }).length;
        return '<a class="chip'+(k===t[0]?' on':'')+'" href="#/activity'+q2s({k:t[0],d:win})+'">'+esc(t[1])+' ('+n+')</a>'; }).join('')+
    '</div>';
  h += '<div class="chips">'+
    [['today','Today'],['7d','Last 7 days'],['30d','Last 30 days'],['all','All time']].map(function(t){
      return '<a class="chip'+(win===t[0]?' on':'')+'" href="#/activity'+q2s({k:k,d:t[0]})+'">'+esc(t[1])+'</a>'; }).join('')+
    '<span class="mut" style="font-size:12px;">'+list.length+' event'+(list.length===1?'':'s')+
    (list.length>limit?(' · showing the newest '+limit):'')+'</span></div>';

  if(!list.length) return h + '<div class="notice n-info">No activity in this window.</div>';
  h += '<div class="gcard"><div class="tl">'+ list.slice(0,limit).map(function(e){
      return '<div class="tl-i '+(/delete|ban|reject/.test(e.t)?'bad':(/suspend|archiv/.test(e.t)?'warn':''))+'">'+
        '<div class="tl-t">'+(e.href?('<a class="lnk" href="'+e.href+'">'+esc(e.t)+'</a>'):esc(e.t))+
          (e.who?(' — <span class="mut">'+esc(e.who)+'</span>'):'')+'</div>'+
        '<div class="tl-m">'+esc(fdt(e.ts))+' &middot; '+esc(ago(e.ts))+
          (e.actor?(' &middot; by '+esc(docName(e.actor))):'')+'</div>'+
        (e.reason?('<div class="tl-r">&ldquo;'+esc(e.reason)+'&rdquo;</div>'):'')+'</div>';
    }).join('') +'</div></div>';
  return h;
}

/* ── Global search (admin_search RPC) ────────────────── */
/* Entity -> exact destination. A route is only offered when it can select the
   record itself; anything that would merely dump the admin into a directory
   returns null, and the UI renders a disabled control with the reason instead
   of a link that looks actionable and is not. */
var SEARCH_ROUTE = {
  profile: function(id){ var p = AC.profById[id]; return p ? profileHref(p) : null; },
  patient_surgery: function(id){ return AC.surgById[id] ? ('#/journey/'+id) : null; },
  clinic_patient: function(id){
    // No clinic-patient detail view exists. Open its journey when one is linked.
    var s = (AC.db.surgeries||[]).filter(function(x){ return x.clinic_patient_id===id; })[0];
    return s ? ('#/journey/'+s.id) : null;
  },
  care_request:  function(id){ return '#/care-requests'+q2s({id:id}); },
  questionnaire: function(id){ return '#/questionnaires'+q2s({id:id}); },
  question:      function(id){ return '#/questions'+q2s({id:id}); }
};
var SEARCH_WHY = {
  clinic_patient:'This clinic patient has not been linked to a surgery journey yet.',
  profile:'This account is no longer available.',
  patient_surgery:'This journey is no longer available.'
};
async function vSearch(qs){
  var term = qs.q||'';
  var h = head('Search','Global search','Search across people, journeys and requests.');
  h += '<div id="sr"><p class="mut" style="font-size:12.5px;">Searching…</p></div>';
  setTimeout(async function(){
    var box = ge('sr'); if(!box) return;
    if(term.length < 2){ box.innerHTML = '<div class="notice n-info">Enter at least 2 characters.</div>'; return; }
    var r;
    try { r = await window.sb.rpc('admin_search', { p_q: term, p_limit: 50 }); }
    catch(e){ r = { error:{ message:e.message } }; }
    if(r.error){
      box.innerHTML = '<div class="notice n-warn">Search is not available right now.</div>'; return;
    }
    var rows = r.data||[];
    if(!rows.length){ box.innerHTML = '<div class="notice n-info">No matches for <b>'+esc(term)+'</b>.</div>'; return; }
    var types = {};
    rows.forEach(function(x){ types[x.entity_type] = (types[x.entity_type]||0)+1; });
    box.innerHTML = '<div class="chips">'+Object.keys(types).map(function(t){
        return '<span class="chip on">'+esc(t)+' ('+types[t]+')</span>'; }).join('')+
      '<span class="mut" style="font-size:12px;">'+rows.length+' result'+(rows.length>1?'s':'')+' for &ldquo;'+esc(term)+'&rdquo;</span></div>'+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Type</th><th>Result</th><th>Detail</th><th>Status</th><th></th></tr></thead><tbody>'+
      rows.map(function(x){
        var route = SEARCH_ROUTE[x.entity_type];
        var href = route ? route(x.entity_id) : (x.destination||'');
        return '<tr><td><span class="bdg bdg-info">'+esc(x.entity_type)+'</span></td>'+
          '<td class="nm">'+dash(x.label)+'</td><td>'+dash(x.sublabel)+'</td>'+
          '<td><span class="bdg bdg-mute">'+esc(x.status||'—')+'</span></td>'+
          '<td>'+(href ? '<a class="olink" href="'+esc(href)+'">Open &rsaquo;</a>'
                       : '<span class="mut" title="'+esc(SEARCH_WHY[x.entity_type]||'No detail view exists for this record type.')+
                         '" style="font-size:11.5px;">No detail view</span>')+'</td></tr>'+
          searchFacetRow(x);
      }).join('')+'</tbody></table></div>';
  }, 0);
  return h;
}

/* Phase G — a search hit expands into everything already known about it, from
   rows loaded at boot. No extra request, so it appears with the result. */
function searchFacetRow(x){
  var links = [];
  function add(label, n, href){ links.push('<a class="olink" href="'+href+'">'+esc(label)+
    (n===null?'':' ('+n+')')+'</a>'); }
  if(x.entity_type === 'profile'){
    var p = AC.profById[x.entity_id]; if(!p) return '';
    var isDoc = isDoctor(p);
    add('Profile', null, (isDoc?'#/doctor/':'#/patient/')+x.entity_id);
    if(isDoc){
      add('Verification', null, '#/doctor/'+x.entity_id+q2s({t:'verification'}));
      add('Patients', (AC.db.surgeries||[]).filter(function(s){ return s.assigned_doctor_id===p.id; }).length,
          '#/doctor/'+x.entity_id+q2s({t:'patients'}));
    } else {
      add('Journeys', (AC.db.surgeries||[]).filter(function(s){ return s.patient_id===p.id; }).length,
          '#/patient/'+x.entity_id+q2s({t:'journeys'}));
      add('Questionnaires', (AC.db.quests||[]).filter(function(q){ return q.patient_id===p.id; }).length,
          '#/patient/'+x.entity_id+q2s({t:'quest'}));
      add('Checklist', (AC.db.checklists||[]).filter(function(c){ return c.patient_id===p.id; }).length,
          '#/patient/'+x.entity_id+q2s({t:'checklist'}));
      add('Consultations', (AC.db.requests||[]).filter(function(r){ return r.patient_id===p.id; }).length, '#/care-requests');
    }
    add('Audit', (AC.db.audit||[]).filter(function(a){ return a.target_id===p.id; }).length,
        '#/'+(isDoc?'doctor':'patient')+'/'+x.entity_id+q2s({t:'audit'}));
    if(hasMod()) add('Reports', (AC.db.reports||[]).filter(function(r){ return r.target_id===p.id && !r.deleted_at; }).length,
        '#/moderation'+q2s({t:'all'}));
    var extra = isDeleted(p) ? ' <span class="bdg bdg-bad">deleted</span>'
              : (p2() && accStatus(p)!=='active' ? ' '+badgeStatus(p) : '');
    return '<tr><td></td><td colspan="4" style="padding-top:0;">'+
      '<span class="mut" style="font-size:11.5px;margin-right:8px;">Jump to</span>'+
      links.join('<span class="mut"> · </span>')+extra+'</td></tr>';
  }
  if(x.entity_type === 'patient_surgery'){
    var sg = AC.surgById[x.entity_id]; if(!sg) return '';
    add('Journey', null, '#/journey/'+x.entity_id);
    if(sg.patient_id){
      add('Patient', null, '#/patient/'+sg.patient_id);
      add('Questionnaires', (AC.db.quests||[]).filter(function(q){ return q.patient_id===sg.patient_id; }).length,
          '#/patient/'+sg.patient_id+q2s({t:'quest'}));
    }
    if(sg.assigned_doctor_id) add('Assigned doctor', null, '#/doctor/'+sg.assigned_doctor_id);
    return '<tr><td></td><td colspan="4" style="padding-top:0;">'+
      '<span class="mut" style="font-size:11.5px;margin-right:8px;">Jump to</span>'+
      links.join('<span class="mut"> · </span>')+'</td></tr>';
  }
  return '';
}

/* ── Audit log ───────────────────────────────────────── */
function jsonBox(label, v){
  if(v==null) return '';
  var s; try{ s = JSON.stringify(v, null, 2); }catch(e){ s = String(v); }
  if(s==='null'||s==='{}') return '';
  return '<div class="kv-k" style="margin-top:8px;">'+esc(label)+'</div><div class="jsonbox">'+esc(s)+'</div>';
}
function tblAudit(list, detail){
  if(!list.length) return '<div class="tbl-wrap"><table class="tbl"><tbody><tr><td class="empty">No audit entries</td></tr></tbody></table></div>';
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Actor</th><th>Action</th>'+
    '<th>Target type</th><th>Target</th><th>Reason</th>'+(detail?'<th>Correlation</th>':'')+'</tr></thead><tbody>'+
    list.map(function(a){
      var actor = a.actor_id ? (AC.profById[a.actor_id] ? pname(AC.profById[a.actor_id]) : short(a.actor_id)) : '—';
      var tgt = a.target_label || (a.target_id?short(a.target_id):'—');
      var tgtHref = '';
      if(a.target_type==='profile' && a.target_id && AC.profById[a.target_id]) tgtHref = profileHref(AC.profById[a.target_id]);
      else if(a.target_type==='patient_surgery' && a.target_id) tgtHref = '#/journey/'+a.target_id;
      var main = '<tr><td>'+esc(fdt(a.created_at))+'<div class="mut" style="font-size:10.5px;">'+esc(ago(a.created_at))+'</div></td>'+
        '<td class="nm">'+esc(actor)+'<div class="mut" style="font-size:10.5px;">'+esc(a.actor_role||'')+'</div></td>'+
        '<td><span class="bdg bdg-info">'+esc(a.action)+'</span></td>'+
        '<td>'+dash(a.target_type)+'</td>'+
        '<td>'+(tgtHref?('<a class="olink" href="'+tgtHref+'">'+esc(tgt)+'</a>'):esc(tgt))+'</td>'+
        '<td>'+dash(a.reason)+'</td>'+(detail?('<td class="mono">'+esc(a.correlation_id||'—')+'</td>'):'')+'</tr>';
      if(detail){
        var extra = jsonBox('Before', a.before_state)+jsonBox('After', a.after_state)+jsonBox('Metadata', a.metadata);
        if(extra) main += '<tr><td colspan="7" style="padding-top:0;">'+extra+'</td></tr>';
      }
      return main;
    }).join('')+'</tbody></table></div>';
}
function vAudit(qs){
  var h = head('Operations','Audit log','A permanent record of every administrator action. Entries can never be '+
    'edited or removed.');
  if(!has('audit')) return h + capNote('audit');
  var all = AC.db.audit||[];
  var fa = qs.actor||'', fac = qs.a||'', ft = qs.tt||'', fd = qs.d||'', fid = qs.id||'';
  var list = all.filter(function(r){
    if(fa && r.actor_id !== fa) return false;
    if(fac && r.action !== fac) return false;
    if(ft && r.target_type !== ft) return false;
    if(fid && String(r.target_id||'').indexOf(fid) < 0) return false;
    if(fd){
      var d = new Date(r.created_at), n = new Date();
      if(fd==='today'){ var m = new Date(); m.setHours(0,0,0,0); if(d < m) return false; }
      if(fd==='7d'  && (n-d) > 7*86400000)  return false;
      if(fd==='30d' && (n-d) > 30*86400000) return false;
    }
    return true;
  });
  var base = function(o){ var m={actor:fa,a:fac,tt:ft,d:fd,id:fid}; for(var k in o) m[k]=o[k]; return '#/audit'+q2s(m); };
  function sel(cur, field, label, values){
    return '<select class="fsel" onchange="AC.nav(this.value)"><option value="'+base((function(){var x={};x[field]='';return x;})())+'">'+esc(label)+'</option>'+
      values.map(function(v){ var o={}; o[field]=v[0];
        return '<option value="'+esc(base(o))+'"'+(cur===v[0]?' selected':'')+'>'+esc(v[1])+'</option>'; }).join('')+'</select>';
  }
  h += '<div class="chips">'+
    sel(fa,'actor','All actors', uniq(all.map(function(r){return r.actor_id;}).filter(Boolean)).map(function(id){
      return [id, AC.profById[id]?pname(AC.profById[id]):short(id)]; }))+
    sel(fac,'a','All actions', uniq(all.map(function(r){return r.action;}).filter(Boolean)).sort().map(function(v){return [v,v];}))+
    sel(ft,'tt','All target types', uniq(all.map(function(r){return r.target_type;}).filter(Boolean)).sort().map(function(v){return [v,v];}))+
    sel(fd,'d','Any date', [['today','Today'],['7d','Last 7 days'],['30d','Last 30 days']])+
    '<input class="finput" id="aud-id" placeholder="Target ID contains…" value="'+esc(fid)+'" '+
      'onchange="AC.nav(\''+base({id:'__V__'}).replace('__V__','\'+encodeURIComponent(this.value)+\'')+'\')">'+
    '<span class="mut" style="font-size:12px;">'+list.length+' of '+all.length+'</span></div>';
  if(!all.length) h += '<div class="notice n-info">No administrator actions have been recorded yet.</div>';
  /* The audit log is append-only and read-only. The only bulk affordance is
     export; no mutation is offered because none exists or should. */
  h += '<div class="selbar" id="ac-selbar"><span class="selbar-n" id="ac-seln">0 selected</span>'+
    '<button class="rowbtn" onclick="AC.exportAudit()">Export CSV</button></div>';
  h += '<div class="chips"><button class="rowbtn" onclick="AC.exportAudit()">Export '+list.length+
       ' filtered row'+(list.length===1?'':'s')+' to CSV</button></div>';
  h += tblAudit(list, true);
  return h;
}
/* Exports exactly the rows the current filter shows. Read-only, no mutation. */
AC.exportAudit = function(){
  var r = parseHash(), qs = r.qs || {};
  var all = AC.db.audit||[];
  var list = all.filter(function(x){
    if(qs.actor && x.actor_id !== qs.actor) return false;
    if(qs.a && x.action !== qs.a) return false;
    if(qs.tt && x.target_type !== qs.tt) return false;
    if(qs.id && String(x.target_id||'').indexOf(qs.id) < 0) return false;
    if(qs.d){
      var d = new Date(x.created_at), n = new Date();
      if(qs.d==='today'){ var m = new Date(); m.setHours(0,0,0,0); if(d < m) return false; }
      if(qs.d==='7d'  && (n-d) > 7*86400000)  return false;
      if(qs.d==='30d' && (n-d) > 30*86400000) return false;
    }
    return true;
  });
  if(!list.length){ acToast('No rows to export', true); return; }
  acCsv(list, [
    ['When', function(x){ return x.created_at; }],
    ['Actor', function(x){ return AC.profById[x.actor_id] ? pname(AC.profById[x.actor_id]) : x.actor_id; }],
    ['Actor role', function(x){ return x.actor_role; }],
    ['Action', function(x){ return x.action; }],
    ['Target type', function(x){ return x.target_type; }],
    ['Target', function(x){ return x.target_label; }],
    ['Reason', function(x){ return x.reason; }],
    ['Correlation', function(x){ return x.correlation_id; }]
  ], 'audit-log');
};

function vStatus(){
  var h = head('Operations','System status','Each service below is checked live when this page loads. '+
    'Nothing is reported as healthy unless it was actually checked.');
  h += '<div class="gcard"><div class="gcard-h">Service checks<span class="gh-note">'+
    '<button class="rowbtn" onclick="AC.runStatus()">Check again</button></span></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Service</th><th>Status</th><th>Response time</th></tr></thead>'+
    '<tbody id="st-rows"><tr><td colspan="3" class="empty">Checking…</td></tr></tbody></table></div></div>';
  h += '<div class="notice n-info">Email delivery, scheduled processing and infrastructure capacity are '+
    'monitored outside the Admin Center and are not shown on this page.</div>';
  setTimeout(AC.runStatus, 0);
  return h;
}
AC.runStatus = async function(){
  var box = ge('st-rows'); if(!box) return;
  box.innerHTML = '<tr><td colspan="3" class="empty">Checking…</td></tr>';
  var rows = [];
  function t(){ return (window.performance&&performance.now)?performance.now():Date.now(); }
  var OK   = '<span class="bdg bdg-ok">operational</span>';
  var BAD  = '<span class="bdg bdg-bad">unavailable</span>';
  var MUTE = function(txt){ return '<span class="bdg bdg-mute">'+esc(txt)+'</span>'; };

  // 1. Session
  var t0=t(), sess=null;
  try{ sess = await window.getSession(); }catch(e){}
  rows.push(['Your session',
    sess ? OK + ' <span class="mut">expires '+esc(fdt(sess.expires_at?sess.expires_at*1000:null))+'</span>' : BAD,
    Math.round(t()-t0)+' ms']);
  // 2. Administrator permissions, confirmed by the server
  t0=t(); var pa;
  try{ pa = await window.sb.rpc('is_platform_admin'); }catch(e){ pa={error:true}; }
  rows.push(['Administrator permissions',
    (!pa.error && pa.data===true) ? OK : BAD, Math.round(t()-t0)+' ms']);
  // 3. Core data service
  t0=t(); var rr;
  try{ rr = await window.sb.from('profiles').select('id').limit(1); }catch(e){ rr={error:true}; }
  rows.push(['Account records', rr.error ? BAD : OK, Math.round(t()-t0)+' ms']);
  // 4. Audit log
  t0=t(); var ar;
  try{ ar = await window.sb.from('admin_audit_log').select('id').limit(1); }catch(e){ ar={error:true}; }
  rows.push(['Audit log', ar.error ? BAD : OK, Math.round(t()-t0)+' ms']);
  // 5. Search
  t0=t(); var sr;
  try{ sr = await window.sb.rpc('admin_search', { p_q:'zz', p_limit:1 }); }catch(e){ sr={error:true}; }
  rows.push(['Search', sr.error ? BAD : OK, Math.round(t()-t0)+' ms']);
  // 6. Supporting services — each checked individually, never assumed
  var FNS = [['Administration service','admin-api'],
             ['Video feed service','youtube-latest'],
             ['Clinic patient service','convert_clinic_patient']];
  for(var fi=0; fi<FNS.length; fi++){
    t0=t();
    var st = MUTE('not enabled');
    try{
      var fr = await fetch((window.SUPA_URL||'')+'/functions/v1/'+FNS[fi][1], { method:'OPTIONS' });
      st = fr.ok ? OK : MUTE('not enabled');
    }catch(e){ st = MUTE('not enabled'); }
    rows.push([FNS[fi][0], st, Math.round(t()-t0)+' ms']);
  }
  // 7. File storage
  t0=t();
  var stState = MUTE('not checked');
  try{
    var fsr = await fetch((window.SUPA_URL||'')+'/storage/v1/bucket', { method:'GET',
      headers:{ apikey:(window.SUPA_ANON||''), Authorization:'Bearer '+(window.SUPA_ANON||'') } });
    stState = (fsr.status<500) ? OK : BAD;
  }catch(e){ stState = BAD; }
  rows.push(['File storage', stState, Math.round(t()-t0)+' ms']);

  box.innerHTML = rows.map(function(r){
    return '<tr><td class="nm">'+esc(r[0])+'</td><td>'+r[1]+'</td><td>'+esc(r[2])+'</td></tr>';
  }).join('');
};

  h += '<div class="notice n-bad"><b>Permanent deletion cannot be undone.</b> '+

          '<td class="nm">'+dash(p.full_name)+'</td><td>'+dash(p.email)+'</td>'+
          '<td>'+dash(p.role)+'</td><td>'+esc(fdate(p.deleted_at))+'</td>'+
          '<td>'+dash(p.delete_reason)+'</td>'+
          '<td>'+j+' journey'+(j===1?'':'s')+', '+q+' questionnaire'+(q===1?'':'s')+'</td>'+
          '<td class="rowact"><button class="rowbtn" style="border-color:rgba(192,57,43,.4);color:rgba(255,150,130,.95)" '+
            'onclick="AC.purge(\''+p.id+'\')">Permanently delete…</button></td></tr>';
      }).join('')+'</tbody></table></div>';
  }
  h += '</div>';

  // Non-account records that are soft deleted are purgeable here too.
  var recs = [];
  BIN.filter(function(bn){ return bn.k!=='accounts' && bn.need(); })
     .forEach(function(bn){ bn.rows().forEach(function(r){ recs.push(r); }); });
  h += '<div class="gcard"><div class="gcard-h">Permanently delete a record'+
    '<span class="gh-note">'+recs.length+' soft-deleted record'+(recs.length===1?'':'s')+'</span></div>';
  if(!recs.length) h += '<p class="mut" style="font-size:12.5px;">Nothing eligible. Soft delete a record first; '+
    'it then appears in the <a class="lnk" href="#/recycle">Recycle Bin</a> and here.</p>';
  else h += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item</th><th>Type</th><th>Deleted</th>'+
    '<th>Reason</th><th></th></tr></thead><tbody>'+
    recs.map(function(r){
      return '<tr><td class="nm">'+dash(r.label)+'</td><td>'+dash(r.kind)+'</td>'+
        '<td>'+esc(fdate(r.at))+'</td><td>'+dash(r.why)+'</td>'+
        '<td class="rowact"><button class="rowbtn" style="border-color:rgba(192,57,43,.4);color:rgba(255,150,130,.95)" '+
          'onclick="AC.binPurge(\''+esc(r.entity)+'\',\''+r.id+'\')">Permanently delete…</button></td></tr>';
    }).join('')+'</tbody></table></div>';
  h += '</div>';

  return h;
}
AC.purge = function(id){ var p = AC.profById[id]; if(p) acPurge(p); };

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  var raw = (location.hash||'').replace(/^#\/?/, '');
  var qi = raw.indexOf('?'), qs = {};
  if(qi >= 0){
    raw.slice(qi+1).split('&').forEach(function(kv){
      if(!kv) return; var i = kv.indexOf('=');
      var k = decodeURIComponent(i<0?kv:kv.slice(0,i));
      var v = i<0?'':decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
      qs[k]=v;
    });
    raw = raw.slice(0, qi);
  }
  var parts = raw.split('/').filter(Boolean);
  return { section: parts[0]||'overview', id: parts[1]||null, qs: qs };
}
var RAIL_FOR = { doctor:'doctors', patient:'patients', journey:'journeys', search:'overview' };

var _lastSection = null;
async function render(){
  var r = parseHash();
  /* Selection is scoped to one list. Leaving that list drops it, so a stale
     selection can never be acted on somewhere else. */
  if(_lastSection !== null && _lastSection !== r.section) acSelClear();
  _lastSection = r.section;
  renderRail(RAIL_FOR[r.section] || r.section);
  var view = ge('adm-view');
  var html;
  switch(r.section){
    case 'overview':       html = vOverview(); break;
    case 'doctors':        html = vDoctors(r.qs); break;
    case 'doctor':         html = vDoctor(r.id, r.qs); break;
    case 'patients':       html = vPatients(r.qs); break;
    case 'patient':        html = vPatient(r.id, r.qs); break;
    case 'accounts':       html = vAccounts(r.qs); break;
    case 'journeys':       html = vJourneys(r.qs); break;
    case 'journey':        html = vJourney(r.id); break;
    case 'questionnaires': html = vQuests(r.qs); break;
    case 'checklists':     html = vChecklists(); break;
    case 'questions':      html = vQuestions(r.qs); break;
    case 'care-requests':  html = vRequests(r.qs); break;
    case 'content':        html = vContent(); break;
    case 'verification':   html = vVerification(r.qs); break;
    case 'moderation':     html = vModeration(r.qs); break;
    case 'analytics':      html = vAnalytics(r.qs); break;
    case 'activity':       html = vActivity(r.qs); break;
    case 'recycle':        html = vRecycle(r.qs); break;
    case 'deleted':        html = vRecycle({ t:'accounts' }); break;   // one destination, old link kept
    case 'audit':          html = vAudit(r.qs); break;
    case 'status':         html = vStatus(); break;
    case 'capabilities':   location.hash = '#/overview'; return;   // retired page, old links kept working
    case 'settings':       html = vSettings(); break;
    case 'danger':         html = vDanger(); break;
    case 'search':         html = await vSearch(r.qs); break;
    default:
      html = head('Admin','Page not found','') +
        '<div class="notice n-warn">This page could not be found. '+
        '<a class="lnk" href="#/overview">Back to overview</a></div>';
  }
  view.innerHTML = html;
  acCloseMenu();
  acSelPaint();
  applyHl();
  wireSearch();
  if(r.section==='search' && r.qs.q){ var s = ge('adm-q'); if(s){ s.value = r.qs.q; } }
  window.scrollTo(0,0);
}
function go(hash, replace){
  if(replace && location.hash !== hash) history.replaceState(null,'',hash);
  else if(!replace) location.hash = hash;
  if(replace) render();
}
AC.nav = function(h){ if(h) location.hash = h; };

/* ============================================================
   BOOT
   ============================================================ */
function fail(msg, detail){
  var l = ge('loader');
  l.innerHTML = '<div style="text-align:center;padding:30px;max-width:460px;">'+
    '<p style="color:rgba(255,160,140,.92);font-size:14px;font-family:DM Sans,sans-serif;">'+esc(msg)+'</p>'+
    (detail?'<p style="color:rgba(255,255,255,.4);font-size:12px;margin-top:8px;font-family:DM Sans,sans-serif;">'+esc(detail)+'</p>':'')+
    '<p style="margin-top:16px;"><a href="/v2/dashboard.html" style="color:#7ECFC0;font-size:13px;">Back to dashboard</a></p></div>';
}

document.addEventListener('DOMContentLoaded', async function(){
  var safety = setTimeout(function(){
    var l = ge('loader');
    if(l && l.style.display !== 'none') fail('Taking longer than expected.', 'The Admin Center could not finish loading.');
  }, 20000);
  try{
    // 1. UX guard (frontend only — never the security boundary)
    var auth = await window.requireRole('admin');
    if(!auth){ clearTimeout(safety); return; }
    AC.me = auth.profile || {};

    // 2. Canonical server-side gate. RLS is the real boundary; this makes the
    //    server's own answer explicit instead of trusting the local profile row.
    var gate;
    try { gate = await window.sb.rpc('is_platform_admin'); }
    catch(e){ gate = { error:{ message:e.message } }; }
    if(gate.error){ clearTimeout(safety);
      return fail('Your administrator access could not be confirmed.', 'Please try again in a moment.'); }
    if(gate.data !== true){ clearTimeout(safety);
      return fail('Admin privileges required.', 'The server does not recognise this account as a platform administrator.'); }

    // 3. Probe, then load
    var probes = await Promise.all(CAPS.map(probeCap));
    probes.forEach(function(p){ AC.cap[p.key] = p; });
    var req = probes.filter(function(p){ return p.required && !p.ok; });
    if(req.length){ clearTimeout(safety);
      return fail('The Admin Center could not load your data.', 'Please try again in a moment.'); }

    await loadAll();
    AC.boot.loadedAt = new Date().toISOString();

    if(!location.hash || location.hash === '#') location.hash = '#/overview';
    await render();
    window.addEventListener('hashchange', function(){ render(); });

    clearTimeout(safety);
    ge('loader').style.display = 'none';
    ge('app').style.display = 'block';
  }catch(e){
    clearTimeout(safety);
    console.error('ADMIN ERROR:', e.message);
    fail('The Admin Center could not be loaded.', 'Please try again in a moment.');
  }
});

/* keyboard: "/" focuses search, Escape leaves a detail view */
document.addEventListener('keydown', function(e){
  if(e.key === '/' && document.activeElement && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    var s = ge('adm-q'); if(s){ e.preventDefault(); s.focus(); s.select(); }
  }
  if(e.key === 'Escape'){
    var r = parseHash();
    if(r.section==='doctor')  location.hash = '#/doctors';
    else if(r.section==='patient') location.hash = '#/patients';
    else if(r.section==='journey') location.hash = '#/journeys';
  }
});

})();
