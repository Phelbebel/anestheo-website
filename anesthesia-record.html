/* ── 4. Access & Monitoring ──────────────────────────────────────────────── */
function secAccess(){
  var devs = (D.devices || []).map(function(v){
    return '<div class="row"><div class="row-t">' + hhmm(v.started_at) + '</div><div class="row-m">' +
      '<div class="row-x">' + esc(v.label || v.kind) + '</div><div class="row-s">' +
      esc(v.category || '') + (v.stopped_at ? ' · stopped ' + hhmm(v.stopped_at) : ' · running') + '</div></div>' +
      (v.stopped_at || _locked ? '' : '<button class="btn ghost" style="padding:6px 11px;min-height:38px;font-size:12px" ' +
        'onclick="stopDevice(\'' + v.id + '\')">Stop</button>') + rowActions('devices', v.id) + '</div>';
  });
  var acc = (D.access || []).map(function(a){
    return '<div class="row"><div class="row-t">' + hhmm(a.inserted_at) + '</div><div class="row-m">' +
      '<div class="row-x">' + esc([a.gauge, a.kind].filter(Boolean).join(' ')) +
      (a.site ? ' — ' + esc(a.site) : '') + (a.side ? ' (' + esc(a.side) + ')' : '') + '</div>' +
      '<div class="row-s">' + esc([
        ANES.yes(a.placed_before_or) ? 'pre-existing' : null,
        a.lumens ? a.lumens + ' lumen' : null,
        ANES.yes(a.ultrasound) ? 'ultrasound' : null,
        a.attempts ? a.attempts + ' attempt(s)' : null,
        ANES.yes(a.waveform_confirmed) ? 'waveform confirmed' : null,
        a.complications ? 'complication: ' + a.complications : null
      ].filter(Boolean).join(' · ')) + '</div></div>' + rowActions('access', a.id) + '</div>';
  });

  var quick = Object.keys(ANES.MONITORS).map(function(cat){
    return '<div style="margin-top:12px"><span class="flab">' + esc(cat.replace(/_/g,' ')) + '</span>' +
      '<div class="qgrid">' + ANES.MONITORS[cat].map(function(k){
        var on = (D.devices||[]).some(function(v){ return v.kind === k && !v.stopped_at; });
        return '<button class="qbtn' + (on ? ' done' : '') + '"' + (_locked || on ? ' disabled' : '') +
          ' onclick="startDevice(' + JSON.stringify(cat).replace(/"/g,'&quot;') + ',' +
          JSON.stringify(k).replace(/"/g,'&quot;') + ')"><b>' + esc(k) + '</b><small>' +
          (on ? 'running' : 'start now') + '</small></button>';
      }).join('') + '</div></div>';
  }).join('');

  var kind = fvals('access').kind;
  var allowed = kind ? (ANES.ACCESS_FIELDS[kind] || []) : [];

  return editCard('access') + sectionError('devices','Monitoring') + sectionError('access','Vascular access') +
    '<div class="card"><div class="card-h"><span class="card-t">Monitoring &amp; devices</span></div>' +
    '<div class="card-b"><div class="lead">One tap starts a device session and stamps the time. ' +
    'Tap Stop when it comes off.</div>' + quick +
    '<div class="savest" id="save-device" style="margin-top:10px"></div></div></div>' +

    '<div class="card"><div class="card-h"><span class="card-t">Device sessions</span></div>' +
    '<div class="card-b">' + listOr(devs, 'No devices recorded yet.') + '</div></div>' +

    '<div class="card"><div class="card-h"><span class="card-t">Vascular access</span>' +
    '<span class="card-t" style="color:var(--muted);font-weight:500">' + acc.length + ' recorded</span></div>' +
    '<div class="card-b">' + listOr(acc, 'No access recorded yet.') + '</div></div>' +

    '<div class="card"><div class="card-h"><span class="card-t">Add access</span></div><div class="card-b">' +
    // Only the fields that mean something for the chosen type are shown.
    renderForm('access', ANES.FORMS.access, { fieldFilter:function(f){
      if(f.k === 'kind' || f.k === 'inserted_at' || f.k === 'note' || f.k === 'complications' ||
         f.k === 'placed_before_or') return true;
      return allowed.indexOf(f.k) >= 0;
    }}) +
    saveBar('access','Record access', kind ? null : 'Choose a type to see the fields that apply to it.') +
    '</div></div>';
}

/* ── 6. Ventilation ─────────────────────────────────────────────────────── */
function secVent(){
  var cur = ANES.currentVentilation(D);
  var summary = cur ? '<dl class="totals">' + [
      ['Mode', cur.mode || '—'], ['VT', cur.tidal_volume_ml ? cur.tidal_volume_ml + ' mL' : '—'],
      ['RR', cur.respiratory_rate || '—'], ['PEEP', cur.peep_cmh2o != null ? cur.peep_cmh2o : '—'],
      ['FiO₂', cur.fio2_pct ? cur.fio2_pct + '%' : '—'], ['I:E', cur.ie_ratio || '—'],
      ['Peak', cur.peak_pressure_cmh2o || '—'], ['Plateau', cur.plateau_pressure_cmh2o || '—'],
      ['MV', cur.minute_ventilation_l ? cur.minute_ventilation_l + ' L' : '—']
    ].map(function(i){ return '<div><dt>' + i[0] + '</dt><dd>' + esc(i[1]) + '</dd></div>'; }).join('') + '</dl>'
    : '<div class="empty">No ventilation recorded yet.</div>';

  var hist = (D.ventilation || []).slice().reverse().map(function(v){
    return '<div class="row"><div class="row-t">' + hhmm(v.occurred_at) + '</div><div class="row-m">' +

/* ── small field helpers for the hand-built quick forms ─────────────────── */
function fldText(id, label){ return '<div class="fld"><span class="flab">' + esc(label) +
  '</span><input id="' + id + '"></div>'; }
function fldNum(id, label){ return '<div class="fld"><span class="flab">' + esc(label) +
  '</span><input type="number" step="any" id="' + id + '"></div>'; }
function fldSelect(id, label, opts){ return '<div class="fld"><span class="flab">' + esc(label) +
  '</span><select id="' + id + '">' + opts.map(function(o){
    return '<option value="' + esc(o) + '">' + esc(o || '—') + '</option>'; }).join('') + '</select></div>'; }
function val(id){ var n = el(id); return n ? n.value.trim() : ''; }
function num(id){ var n = el(id); if(!n || n.value === '') return null; var f = parseFloat(n.value);
  return (f === f) ? f : null; }
function on(id){ var n = el(id); return !!(n && n.classList.contains('on')); }

/* ═══════════ VITALS GRAPH ═════════════════════════════════════════════════
   Plain inline SVG: no chart library, nothing to load, and it redraws the
   moment a value is entered. Designed so that when a monitor eventually writes
   to anesthesia_vitals the same axes render the same picture — the graph reads
   rows, and does not care who produced them. */
function vitalsGraph(){
  var vitals = (D.vitals || []).filter(function(v){ return v.measured_at && v.value != null; });
  if(!vitals.length)
    return '<div class="empty">No values yet.<br>The chart draws itself as you record vitals below.</div>';

  var series = {};
  ANES.VITAL_GRAPH.forEach(function(s){ series[s.k] = []; });
  vitals.forEach(function(v){
    var k = String(v.parameter).toLowerCase();
    if(series[k]) series[k].push({ t:new Date(v.measured_at).getTime(), y:+v.value });
  });
  var used = ANES.VITAL_GRAPH.filter(function(s){ return series[s.k].length > 0; });
  if(!used.length)
    return '<div class="empty">Values recorded, but none of them are plotted parameters yet.</div>';

  var t0 = Math.min.apply(null, vitals.map(function(v){ return new Date(v.measured_at).getTime(); }));
  var t1 = Math.max.apply(null, vitals.map(function(v){ return new Date(v.measured_at).getTime(); }));
  if(t1 - t0 < 600000) t1 = t0 + 600000;           // at least ten minutes of axis

  var W = Math.max(680, Math.min(1400, 120 + Math.round((t1-t0)/60000) * 9));
  var H = 260, PL = 44, PR = 14, PT = 12, PB = 26;
  var x = function(t){ return PL + (t - t0) / (t1 - t0) * (W - PL - PR); };

  // Two scales: pressures/rates share one, percentages the other. Temperature
  // rides the percentage axis scaled, because one line on its own axis would
  // need a third gutter for very little gain.
  var pressVals = [], pctVals = [];
  used.forEach(function(s){
    series[s.k].forEach(function(p){
      if(s.axis === 'pressure') pressVals.push(p.y);
      else if(s.axis === 'pct') pctVals.push(p.y);
    });
  });
  var pMax = pressVals.length ? Math.max(160, Math.ceil(Math.max.apply(null, pressVals)/20)*20) : 160;
  var yP = function(v){ return PT + (1 - v / pMax) * (H - PT - PB); };
  var yPct = function(v){ return PT + (1 - v / 100) * (H - PT - PB); };
  var tempVals = series.temp || [];
  var yTemp = function(v){ return PT + (1 - (v - 32) / 12) * (H - PT - PB); };  // 32–44 °C
  var yFor = function(s, v){ return s.axis === 'pct' ? yPct(v) : (s.axis === 'temp' ? yTemp(v) : yP(v)); };

  var grid = '';
  for(var g = 0; g <= 4; g++){
    var gv = pMax * g / 4, gy = yP(gv);
    grid += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W-PR) + '" y2="' + gy +
      '" stroke="rgba(255,255,255,.07)"/>' +
      '<text x="' + (PL-6) + '" y="' + (gy+4) + '" text-anchor="end" font-size="10" ' +
      'fill="rgba(255,255,255,.35)">' + gv + '</text>';
  }
  // Time labels every ten minutes.
  var ticks = '';
  var step = Math.max(600000, Math.ceil((t1-t0)/8/600000)*600000);
  for(var tt = t0; tt <= t1; tt += step){
    ticks += '<text x="' + x(tt) + '" y="' + (H-8) + '" text-anchor="middle" font-size="10" ' +
      'fill="rgba(255,255,255,.35)">' + hhmm(new Date(tt).toISOString()) + '</text>';
  }

  var paths = used.map(function(s){
    var pts = series[s.k].sort(function(a,b){ return a.t - b.t; });
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + yFor(s, p.y).toFixed(1); }).join(' ');
    var dots = pts.map(function(p){
      return '<circle cx="' + x(p.t).toFixed(1) + '" cy="' + yFor(s, p.y).toFixed(1) +
        '" r="2.6" fill="' + s.colour + '"><title>' + esc(s.label + ' ' + p.y + ' at ' +
        hhmm(new Date(p.t).toISOString())) + '</title></circle>'; }).join('');
    return '<path d="' + d + '" fill="none" stroke="' + s.colour + '" stroke-width="1.8" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' + dots;
  }).join('');

  var legend = '<div class="glegend">' + used.map(function(s){
    return '<span class="gkey"><span class="gdot" style="background:' + s.colour + '"></span>' +
      esc(s.label) + '</span>'; }).join('') +
    '<span class="gkey" style="color:var(--hint)">left axis mmHg / bpm · SpO₂ and BIS as %</span></div>';

  return '<div class="gwrap"><svg width="' + W + '" height="' + H + '" role="img" ' +
    'aria-label="Intraoperative vitals chart">' + grid + ticks + paths + '</svg></div>' + legend;
}

/* ═══════════ ACTIONS ══════════════════════════════════════════════════════ */
function msg(id, text){ var e = el(id); if(!e) return; e.textContent = text; e.style.display = 'block';
  setTimeout(function(){ e.style.display = 'none'; }, 7000); }

async function markMilestone(key){
  if(_locked) return msg('rec-err','This record is finalized. Record an amendment instead.');
  var r = await ANES.setMilestone(CASE_ID, key);
  if(r.error) return msg('rec-err', r.error.message);
  await reload();
}
/* A favourite PREFILLS. It does not administer.
   A system-wide preset dose is a guess about a patient it has never seen: it
   knows nothing of their weight, their age, their kidneys or what they have
   already had. Committing that guess on the first tap would turn a convenience
   into a clinical entry nobody read. So the dose is placed in front of the
   clinician, editable, and one deliberate action records it. */
function prefillFav(i){
  var f = ANES.FAVOURITES[i]; if(!f || _locked) return;
  var set = function(id, v){ var n = el(id); if(n) n.value = v; };
  set('m-name', f.name); set('m-dose', f.dose);
  set('m-unit', f.unit); set('m-route', 'iv'); set('m-cat', f.cat);
  var r = el('m-redose'); if(r) r.classList.remove('on');
  setSaveState('fav', 'busy', 'Check the dose for this patient, then tap Record administration.');
  var d = el('m-dose');
  if(d){ d.focus(); if(d.select) d.select(); d.scrollIntoView({ behavior:'smooth', block:'center' }); }
}
async function giveCustom(){
  var name = val('m-name'), dose = num('m-dose');
  if(!name || !(dose > 0)) return setSaveState('med','err','Enter a medication and a dose.');
  var ok = await runSave('med', function(){
    return ANES.addMedication(CASE_ID, { medication:name, dose:dose, unit:val('m-unit'),
      route:val('m-route'), category:val('m-cat'), concentration:val('m-conc'), line:val('m-line'),
      indication:val('m-ind'), administered_by:val('m-by'), is_redose:on('m-redose') }); }, 'Recorded');
  if(ok) await reload();
}
async function startInfusion(){
  var med = val('i-med');
  if(!med) return setSaveState('inf','err','Enter a medication.');
  var rate = num('i-rate');
  var ok = await runSave('inf', async function(){
    var r = await ANES.insert('anesthesia_infusions', CASE_ID, {
      medication:med, concentration:val('i-conc'), rate_unit:val('i-unit'), line:val('i-line'),
      tci_model:val('i-tci'), tci_target_kind:val('i-tcik'), started_at:ANES.nowIso() });
    if(r.error || !r.data) return r;
    if(rate != null) return await ANES.addInfusionRate(CASE_ID, r.data.id, rate);
    return r;
  }, 'Infusion started');
  if(ok) await reload();
}
async function changeRate(id){
  var rate = num('rate-' + id);
  if(rate == null) return setSaveState('inf','err','Enter the new rate.');
  var ok = await runSave('inf', function(){ return ANES.addInfusionRate(CASE_ID, id, rate); }, 'Rate recorded');
  if(ok) await reload();
}
async function stopInfusion(id){
  var ok = await runSave('inf', function(){
    return ANES.update('anesthesia_infusions', id, { stopped_at:ANES.nowIso() }); }, 'Infusion stopped');
  if(ok) await reload();
}
async function startDevice(category, kind){
  var ok = await runSave('device', function(){
    return ANES.insert('anesthesia_device_sessions', CASE_ID,
      { category:category, kind:kind, label:kind, started_at:ANES.nowIso() }); }, kind + ' started');
  if(ok) await reload();
}
async function stopDevice(id){
  var ok = await runSave('device', function(){
    return ANES.update('anesthesia_device_sessions', id, { stopped_at:ANES.nowIso() }); }, 'Stopped');
  if(ok) await reload();
}
async function addFluidFav(i){
  var f = ANES.FLUID_FAVOURITES[i]; if(!f) return;
  var ok = await runSave('fluid', function(){
    return ANES.addFluid(CASE_ID, { fluid:f.name, category:f.category, volume_ml:f.volume_ml }); },
    f.name + ' recorded');
  if(ok) await reload();
}
async function addFluidCustom(){
  var name = val('f-name'), v = num('f-vol');
  if(!name || !(v > 0)) return setSaveState('fluid','err','Enter a fluid and a volume.');
  var ok = await runSave('fluid', function(){
    return ANES.addFluid(CASE_ID, { fluid:name, category:val('f-cat'), volume_ml:v,
      line:val('f-line'), warmed:on('f-warm') }); }, 'Recorded');
  if(ok) await reload();
}
async function addBlood(){
  var units = num('b-units'), vol = num('b-vol');
  if(units == null && vol == null) return setSaveState('blood','err','Enter units or a volume.');
  var ok = await runSave('blood', function(){
    return ANES.addBlood(CASE_ID, { product:val('b-prod'), units:units, volume_ml:vol,
      unit_identifier:val('b-id'), reaction:val('b-react'), warmed:on('b-warm') }); }, 'Recorded');
  if(ok) await reload();
}
async function addOutput(){
  var v = num('o-vol');
  if(!(v > 0)) return setSaveState('output','err','Enter a volume.');
  var ok = await runSave('output', function(){
    return ANES.addOutput(CASE_ID, { kind:val('o-kind'), volume_ml:v, label:val('o-label') }); }, 'Recorded');
  if(ok) await reload();
}
async function addVital(){
  var p = val('v-param'), v = num('v-value');
  if(v == null) return setSaveState('vital','err','Enter a value.');
  var param = p, unit = ANES.VITAL_UNITS[p] || null;
  if(p === '__custom'){
    param = val('v-custom'); unit = val('v-unit') || null;
    if(!param) return setSaveState('vital','err','Name the custom parameter.');
  }
  var ok = await runSave('vital', function(){
    return ANES.addVital(CASE_ID, { parameter:param, value:v, unit:unit }); }, 'Recorded');
  if(ok) await reload();
}
async function saveABG(){
  var when = ANES.nowIso(), rows = [];
  ANES.ABG_ANALYTES.forEach(function(a){
    var n = el('abg-' + a.k.replace(/[^A-Za-z0-9]/g,''));
    if(n && n.value !== ''){
      var f = parseFloat(n.value);
      if(f === f) rows.push({ sampled_at:when, panel:'ABG', analyte:a.k, value:f, unit:a.unit || null });
    }
  });
  if(!rows.length) return setSaveState('abg','err','Enter at least one value.');
  var ok = await runSave('abg', async function(){
    for(var i = 0; i < rows.length; i++){
      var r = await ANES.insert('anesthesia_labs', CASE_ID, rows[i]);
      if(r.error) return r;
    }
    return { error:null };
  }, rows.length + ' values recorded');
  if(ok) await reload();
}
async function addLab(){
  var a = val('l-analyte');
  if(!a) return setSaveState('lab','err','Name the analyte.');
  var raw = val('l-value'), f = parseFloat(raw);
  var ok = await runSave('lab', function(){
    return ANES.insert('anesthesia_labs', CASE_ID, { sampled_at:ANES.nowIso(), panel:val('l-panel'),
      analyte:a, value:(f === f ? f : null), value_text:(f === f ? null : raw), unit:val('l-unit') }); },
    'Recorded');
  if(ok) await reload();
}
async function quickEvent(i){
  var e = ANES.EVENTS[i]; if(!e) return;
  var ok = await runSave('qev', function(){
    return ANES.addEvent(CASE_ID, { event_type:e, category:'complication' }); },
    e + ' recorded — add detail below');
  if(ok) await reload();
}
async function histFinding(topic){
  var text = prompt('Finding for ' + topic + ':');
  if(text == null || !text.trim()) return;
  var r = await ANES.saveHistory(CASE_ID, topic, { reviewed:true, finding:text.trim() });
  if(r.error){ setSaveState('history','err', r.error.message); return; }
  setSaveState('history','ok','Saved');
  await reload();
}
async function histSet(topic, what){
  var cur = (D.history || []).filter(function(h){ return h.topic === topic; })[0] || {};
  var patch = what === 'clear' ? { reviewed:true, finding:null, significant:false }
                               : { reviewed:true, significant:!ANES.yes(cur.significant) };
  var r = await ANES.saveHistory(CASE_ID, topic, patch);
  if(r.error){ setSaveState('history','err', r.error.message); return; }
  setSaveState('history','ok','Saved');
  await reload();
}

/* Described-form saves. Each captures its own inputs, so nothing typed is lost
   if the server refuses. */
function save_fasting(){ savePre('fasting'); }
function save_airwayAssessment(){ savePre('airwayAssessment'); }
function save_investigations(){ savePre('investigations'); }
async function savePre(spec){
  var v = captureInputs(spec);
  var ok = await runSave(spec, function(){ return ANES.savePreassessment(CASE_ID, v); }, 'Saved');
  if(ok) await reload();
}
async function save_caseHeader(){
  var v = captureInputs('caseHeader');
  /* Caught before the round trip so the message names the field. The database
     refuses the same things, but "check constraint anes_case_age_pair_chk" is
     not something to read in an anesthetic room. */
  var bad = dobError('caseHeader');
  if(bad){ setSaveState('caseHeader', 'err', bad); return; }
  var ok = await runSave('caseHeader', function(){ return ANES.updateCase(CASE_ID, v); }, 'Saved');
  if(ok) await reload();
}
function save_airway(){ saveNew('airway','anesthesia_airway'); }
function save_access(){ saveNew('access','anesthesia_access'); }
function save_positioning(){ saveNew('positioning','anesthesia_positioning'); }
function save_ventilation(){ saveNew('ventilation','anesthesia_ventilation'); }
function save_regional(){ saveNew('regional','anesthesia_regional'); }
function save_event(){ saveNew('event','anesthesia_events'); }
async function save_handoff(){
  var v = captureInputs('handoff');
  if(!v.handoff_at) v.handoff_at = ANES.nowIso();
  var existing = (D.handoffs || [])[0];
  var ok = await runSave('handoff', function(){
    return existing ? ANES.update('anesthesia_handoffs', existing.id, v)
                    : ANES.insert('anesthesia_handoffs', CASE_ID, v); }, 'Saved');
  if(ok) await reload();
}

async function finalizeCase(){
  if(_locked) return;
  if(!confirm('Sign and finalize this anesthesia record?\n\n' +
    'The record becomes immutable. Later corrections must be recorded as amendments, ' +
    'which are appended with your name, the time and the reason.')) return;
  var r = await ANES.finalize(CASE_ID);
  if(r.error) return msg('rec-err', r.error.message);
  msg('rec-ok','Record finalized.');
  await reload();
}
async function openAmend(){
  var area = prompt('Which part of the record does this amendment concern?\n(e.g. medications, airway, handover)');
  if(area === null) return;
  var text = prompt('What is the correction?');
  if(!text) return;
  var reason = prompt('Why is it being amended? (required)');
  if(!reason) return msg('rec-err','An amendment needs a reason.');
  var r = await ANES.amend(CASE_ID, area || 'general', null, text, reason);
  if(r.error) return msg('rec-err', r.error.message);
  msg('rec-ok','Amendment recorded.');
  await reload();
}

/* ═══════════ HEADER, NAV, RENDER ══════════════════════════════════════════ */
function renderHeader(){
  var c = _case;
  el('h-name').textContent = c.display_name || 'Unnamed case';
  var bits = [];
  if(c.mrn) bits.push('MRN ' + c.mrn);
  // Derived from the birthday when there is one, and otherwise exactly the age
  // that was entered. ageLabel never shows both.
  var ageBit = ANES.ageLabel(c);
  if(ageBit) bits.push(ageBit);
  if(c.sex) bits.push(c.sex);
  if(c.operating_room) bits.push(c.operating_room);
  if(c.planned_procedure) bits.push(c.planned_procedure);
  if(c.surgeon) bits.push('Surg ' + c.surgeon);
  el('h-sub').textContent = bits.join(' · ') || 'No identifiers recorded';

  var peds = (c.case_modes || []).some(function(m){ return m === 'pediatric' || m === 'neonatal'; });
  var chips = [];
  if(c.weight_kg != null)
    chips.push('<span class="chip weight' + (peds ? ' peds' : '') + '">' + esc(c.weight_kg) + ' kg</span>');
  if(c.height_cm != null) chips.push('<span class="chip k">' + esc(c.height_cm) + ' cm</span>');
  var bmi = ANES.bmi(c.weight_kg, c.height_cm);
  if(bmi) chips.push('<span class="chip k">BMI ' + bmi + '</span>');
  if(c.asa_class) chips.push('<span class="chip">ASA ' + esc(c.asa_class) + (c.asa_emergency ? 'E' : '') + '</span>');
  // Whether this record is still being written is a fact about the record, and
  // it belongs beside the patient rather than only in a banner further down.
  chips.push(c.status === 'finalized'
    ? '<span class="chip k">Finalized</span>'
    : '<span class="chip">In progress</span>');
  if(c.urgency && c.urgency !== 'elective')
    chips.push('<span class="chip ' + (c.urgency === 'emergency' ? 'stop' : 'warn') + '">' + esc(c.urgency) + '</span>');
  // An empty allergy field means nobody has written anything, which is NOT the
  // same as a clinician confirming there are none. The schema has one free-text
  // column and no separate confirmed-NKDA state, so the header says exactly what
  // is true: undocumented. If a clinician writes "No known allergies" it shows
  // that, because then it really was documented.
  chips.push(c.allergies
    ? '<span class="chip stop">⚠ ' + esc(c.allergies) + '</span>'
    : '<span class="chip warn">Allergy status not documented</span>');
  // The one fact from this chart most likely to matter to the next
  // anesthetist who meets this patient.
  if(ANES.hasDifficultAirway(D)) chips.push('<span class="chip da">⚠ DIFFICULT AIRWAY</span>');
  (c.anesthesia_types || []).forEach(function(t){ chips.push('<span class="chip k">' + esc(t) + '</span>'); });
  (c.case_modes || []).forEach(function(m){ chips.push('<span class="chip warn">' + esc(m) + '</span>'); });
  if(c.diagnosis) chips.push('<span class="chip k">' + esc(c.diagnosis) + '</span>');
  el('h-chips').innerHTML = chips.join('');

  _locked = (c.status === 'finalized');
  el('h-locked').style.display = _locked ? 'block' : 'none';
}

/* The clock counts from anesthesia start, not from page load: the number a
   clinician wants is "how long has this patient been under". */
function tickClock(){
  // The page may have been replaced by the "record not available" view, and a
  // timer that keeps firing against a page that no longer exists throws every
  // fifteen seconds into a console nobody is reading.
  var c = el('h-clock'), l = el('h-clock-l');
  if(!c || !l) return;
  if(!_clockBase){ c.textContent = '--:--'; l.textContent = 'anesthesia not started'; return; }
  var mins = Math.floor((Date.now() - new Date(_clockBase).getTime()) / 60000);
  if(mins < 0) mins = 0;
  c.textContent = Math.floor(mins/60) + ':' + String(mins%60).padStart(2,'0');
  // The elapsed time means little without the moment it is counted from.
  l.textContent = 'since anesthesia start ' + hhmm(_clockBase);
}

function renderRail(){
  el('rail').innerHTML = SECTIONS.map(function(s){
    var n = 0; try { n = s.count() || 0; } catch(e){ n = 0; }
    return '<button class="rnav' + (s.id === _sec ? ' on' : '') + '" onclick="goSection(\'' + s.id + '\')">' +
      '<span class="ic">' + s.ic + '</span><span>' + esc(s.label) + '</span>' +
      (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
}
function goSection(id){
  var moved = (_sec !== id);
  if(moved){ _sec = id; _forms = _forms || {}; _pop = null; _drawer = null; }
  renderRail(); redrawSection();
  // Arriving at the chart, put the present moment on screen — that is where a
  // clinician in a live case needs to be looking.
  if(moved && id === 'chart') jumpToNow();
  window.scrollTo({ top:0, behavior:'smooth' });
}
window.goSection = goSection;

function redrawSection(){
  var host = el('sections');
  if(!host) return;                       // the page has been replaced by an error view
  /* Where the clinician had scrolled the sheet to is part of what they were
     looking at. Recording a drug must not throw them back to the start of a
     three-hour case. */
  var w0 = el('chartwrap'), keep = w0 ? w0.scrollLeft : null;
  var s = SECTIONS.filter(function(x){ return x.id === _sec; })[0] || SECTIONS[0];
  host.innerHTML = '<div class="sec on">' + s.render() + '</div>';
  if(keep != null){ var w1 = el('chartwrap'); if(w1) w1.scrollLeft = keep; }
  applySaveStates();
}

/* ── Load ───────────────────────────────────────────────────────────────── */
function seedForms(){
  // The single-row forms open showing what is already recorded, so a clinician
  // adding one field does not silently blank the other thirty.
  var pre = ANES.toForm('anesthesia_preassessment', D.preassessment || {});
  ['fasting','airwayAssessment','investigations'].forEach(function(spec){
    var v = {};
    ANES.FORMS[spec].fields.forEach(function(f){ if(pre[f.k] != null) v[f.k] = pre[f.k]; });
    _forms[spec] = v;
  });
  var ch = ANES.toForm('anesthesia_cases', _case), v = {};
  ANES.FORMS.caseHeader.fields.forEach(function(f){ if(ch[f.k] != null) v[f.k] = ch[f.k]; });
  /* age_value and age_unit have no field of their own — the date-of-birth
     control owns them — so they are seeded by name, or the form opens in
     Date-of-birth mode for a patient recorded only as "4 days old". */
  ['age_value','age_unit'].forEach(function(k){ if(ch[k] != null) v[k] = ch[k]; });
  _forms.caseHeader = v;
  var h0 = (D.handoffs || [])[0];
  if(h0){
    var h = ANES.toForm('anesthesia_handoffs', h0), hv = {};
    ANES.FORMS.handoff.fields.forEach(function(f){ if(h[f.k] != null) hv[f.k] = h[f.k]; });
    _forms.handoff = hv;
  }
}

/* Returns false when the record could not be opened and the page has been
   replaced by an explanation. The caller must then stop: continuing would
   reach for elements that are no longer on the page. */
async function reload(){
  D = await ANES.loadCase(CASE_ID);
  if(!D.case){
    document.body.innerHTML = '<div style="max-width:560px;margin:80px auto;padding:24px;font-family:DM Sans,sans-serif;' +
      'color:#fff;text-align:center"><h1 style="font-size:20px;margin-bottom:10px">Record not available</h1>' +
      '<p style="color:rgba(255,255,255,.5);line-height:1.6">' +
      (D.errors && D.errors.case
        ? 'The record could not be read: ' + esc(D.errors.case)
        : 'This anesthesia record does not exist, or you do not have access to it. Access is decided by the ' +
          'database, not by this page.') +
      '</p><p style="margin-top:18px"><a href="/anesthesia-cases.html" style="color:#7ECFC0">Back to Live Chart</a></p></div>';
    return false;
  }
  _case = D.case;
  seedForms();
  renderHeader();
  _clockBase = D.milestones.anesthesia_start || null;
  tickClock();
  renderRail();
  redrawSection();
  return true;
}

(async function(){
  // Verified doctors only. requireRole sends a pending doctor to the pending
  // page and a patient to their own area; the database refuses them regardless.
  var auth = await window.requireRole('staff');
  if(!auth) return;
  if(!CASE_ID){ location.replace('/anesthesia-cases.html'); return; }
  if(!await reload()) return;          // the page now explains why; nothing more to show
  setInterval(tickClock, 15000);
  var ld = el('loader'), ap = el('app');
  if(ld) ld.style.display = 'none';
  if(ap) ap.style.display = 'block';
})();
</script>
