<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up your account — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js?v=2026.08.07-18"></script>
<script src="/auth.js?v=2026.08.07-18"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--teal:#1B6B5A;--teal2:#2A8A74;--accent:#7ECFC0;--dark:#0A1A15;
  --border:rgba(27,107,90,.22);--text:#fff;--muted:rgba(255,255,255,.5);}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;}
.card{background:rgba(10,22,15,.98);border:1px solid var(--border);
  border-radius:18px;width:100%;max-width:500px;overflow:hidden;
  box-shadow:0 32px 80px rgba(0,0,0,.5);}
.card-head{padding:28px 28px 22px;border-bottom:1px solid var(--border);text-align:center;}
.card-head h1{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:5px;}
.card-head p{font-size:13px;color:var(--muted);}
.card-body{padding:24px 28px 28px;}
.step{display:none;} .step.active{display:block;}
/* Role grid */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.role-opt{background:rgba(255,255,255,.03);border:2px solid rgba(255,255,255,.08);
  border-radius:11px;padding:18px 14px;text-align:center;cursor:pointer;transition:all .2s;
  -webkit-tap-highlight-color:transparent;}
.role-opt:hover{border-color:rgba(42,138,116,.4);background:rgba(27,107,90,.1);}
.role-opt.sel{border-color:var(--teal2);background:rgba(27,107,90,.18);}
.role-opt.wide{grid-column:1/-1;}
.ro-ico{font-size:26px;margin-bottom:8px;}
.ro-name{font-size:14px;font-weight:600;margin-bottom:3px;font-family:'Playfair Display',serif;}
.ro-desc{font-size:11px;color:var(--muted);line-height:1.4;}
/* Profile form */
.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.06em;
  text-transform:uppercase;font-weight:600;margin-bottom:5px;}
.field input,.field select{width:100%;background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.11);border-radius:8px;padding:11px 13px;
  color:var(--text);font-size:14px;font-family:inherit;outline:none;
  transition:border-color .2s;min-height:44px;appearance:none;}
.field input:focus,.field select:focus{border-color:var(--teal2);}
.field select option{background:#132218;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
/* Buttons */
.btn{width:100%;padding:13px;border-radius:9px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;border:none;min-height:48px;transition:all .2s;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal2);}
.btn-primary:disabled{opacity:.4;cursor:default;}
.msg{display:none;border-radius:7px;padding:9px 12px;font-size:13px;margin-top:10px;}
.msg-err{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);color:rgba(255,160,140,.93);}
.verify-note{background:rgba(232,168,56,.07);border:1px solid rgba(232,168,56,.2);
  border-radius:8px;padding:11px 13px;font-size:12px;color:rgba(255,220,150,.88);
  line-height:1.7;margin-bottom:14px;}
@media(max-width:440px){
  .row2{grid-template-columns:1fr;}
  .card-head,.card-body{padding-left:18px;padding-right:18px;}
}
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <h1>Set up your account</h1>
    <p id="rs-sub">Choose how you will use Anestheo</p>
  </div>
  <div class="card-body">

    <!-- STEP 1: pick role -->
    <div class="step active" id="step-role">
      <div class="role-grid">
        <div class="role-opt" id="ro-patient" onclick="pickRole('patient')">
          <div class="ro-ico">&#129656;</div>
          <div class="ro-name">Patient</div>
          <div class="ro-desc">I am preparing for surgery</div>
        </div>
        <div class="role-opt" id="ro-doctor" onclick="pickRole('doctor')">
          <div class="ro-ico">&#128104;&#8205;&#9877;</div>
          <div class="ro-name">Doctor</div>
          <div class="ro-desc">Anesthesiologist or physician</div>
        </div>
        <div class="role-opt wide" id="ro-other" onclick="pickRole('other')">
          <div class="ro-ico">&#127979;</div>
          <div class="ro-name">Nurse / Student / Other</div>
          <div class="ro-desc">Nurse, medical student, or other healthcare professional</div>
        </div>
      </div>
      <button class="btn btn-primary" id="role-next-btn" onclick="goProfile()" disabled style="opacity:.35">
        Continue &#8594;
      </button>
      <div class="msg msg-err" id="role-err"></div>
    </div>

    <!-- STEP 2: fill profile -->
    <div class="step" id="step-profile">
      <!-- doctor extra -->
      <div id="doctor-note" style="display:none">
        <div class="verify-note">&#128274; Doctors are verified before full access is granted. Usually within 24 hours.</div>
      </div>
      <div class="row2">
        <div class="field"><label>First name *</label><input type="text" id="pf-first" placeholder="Your first name" autocomplete="given-name"></div>
        <div class="field"><label>Last name *</label><input type="text" id="pf-last" placeholder="Your last name" autocomplete="family-name"></div>
      </div>
      <div class="field"><label>Country</label>
        <select id="pf-country">
          <option value="">Select…</option>
          <option value="Israel">Israel</option>
          <option value="Georgia">Georgia</option>
          <option value="USA">USA</option>
          <option value="UK">UK</option>
          <option value="Germany">Germany</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <!-- doctor-only fields -->
      <div id="doctor-fields" style="display:none">
        <div class="field"><label>Hospital / Clinic *</label><input type="text" id="pf-hospital" placeholder="Your institution"></div>
        <div class="row2">
          <div class="field"><label>Specialty *</label>
            <select id="pf-specialty">
              <option value="">Select…</option>
              <option>Anesthesiology</option>
              <option>Anesthesiology &amp; ICU</option>
              <option>Intensive Care / ICU</option>
              <option>Resident — Anesthesiology</option>
              <option>Pain Medicine</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field"><label>Medical license #</label><input type="text" id="pf-license" placeholder="e.g. IL-12345"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="profile-save-btn" onclick="saveProfileAndGo()">
        Save &amp; open dashboard &#8594;
      </button>
      <div class="msg msg-err" id="profile-err"></div>
    </div>

  </div>
</div>

<script>
var _role = null;
var _session = null;

(async function(){
  var session = await getSession();
  if(!session){ window.location.href='/index.html'; return; }
  _session = session;
  // If they already have a role, go straight to their default landing:
  // patients → Patient Home, staff → workspace.
  var profile = await getProfile(session.user.id);
  if(profile && profile.role && profile.role !== 'pending'){
    var isAdm = (profile.is_admin === true || profile.role === 'admin');
    window.location.href = (!isAdm && profile.role === 'patient') ? '/index.html' : '/dashboard.html';
  }
})();

function pickRole(role){
  _role = role;
  ['patient','doctor','other'].forEach(function(r){
    document.getElementById('ro-'+r).classList.toggle('sel', r===role);
  });
  var btn = document.getElementById('role-next-btn');
  btn.disabled = false; btn.style.opacity = '1';
  document.getElementById('role-err').style.display = 'none';
}

function goProfile(){
  if(!_role){ document.getElementById('role-err').textContent='Please pick a role.'; document.getElementById('role-err').style.display='block'; return; }
  document.getElementById('step-role').classList.remove('active');
  document.getElementById('step-profile').classList.add('active');
  document.getElementById('rs-sub').textContent = 'Tell us a bit about yourself';
  if(_role === 'doctor'){
    document.getElementById('doctor-note').style.display = 'block';
    document.getElementById('doctor-fields').style.display = 'block';
  }
}

async function saveProfileAndGo(){
  var first = document.getElementById('pf-first').value.trim();
  var last  = document.getElementById('pf-last').value.trim();
  var errEl = document.getElementById('profile-err');
  var btn   = document.getElementById('profile-save-btn');
  errEl.style.display = 'none';

  if(!first || !last){ errEl.textContent='Please enter your first and last name.'; errEl.style.display='block'; return; }
  if(_role === 'doctor'){
    if(!document.getElementById('pf-hospital').value.trim() || !document.getElementById('pf-specialty').value){
      errEl.textContent='Please fill in hospital and specialty.'; errEl.style.display='block'; return;
    }
  }

  btn.disabled = true; btn.textContent = 'Saving…';

  // Two writes, deliberately separate: the ROLE is privileged and is set by the
  // server (which also decides verification_status), while the rest are ordinary
  // self-editable profile fields.
  var roleRes = await window.setOwnRole(_role === 'other' ? 'other' : _role);
  if(roleRes && roleRes.error){
    btn.disabled=false; btn.textContent='Save & open dashboard →';
    errEl.textContent=roleRes.error.message; errEl.style.display='block'; return;
  }

  var data = {
    id:        _session.user.id,
    email:     _session.user.email,
    full_name: (first + ' ' + last).trim(),
    country:   document.getElementById('pf-country').value || null
  };
  if(_role === 'doctor'){
    data.hospital               = document.getElementById('pf-hospital').value.trim();
    data.specialty              = document.getElementById('pf-specialty').value;
    data.medical_license_number = document.getElementById('pf-license').value.trim() || null;
  }

  var { error } = await saveProfile(_session.user.id, data);
  if(error){ btn.disabled=false; btn.textContent='Save & open dashboard →'; errEl.textContent=error.message; errEl.style.display='block'; return; }

  // Onboarding complete: patients land on the Patient Home, staff on the workspace.
  window.location.href = (_role === 'patient') ? '/index.html' : '/dashboard.html';
}
</script>
</body>
</html>
