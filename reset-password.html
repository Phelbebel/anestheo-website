<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Choose a new password — Anestheo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js?v=2026.08.07-18"></script>
<script src="/auth.js?v=2026.08.07-18"></script>
<style>
:root{--accent:#7ECFC0;--teal:#2A8A74;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0A1A15;color:#fff;font-family:'DM Sans',-apple-system,system-ui,sans-serif;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:52px 52px;}
.rp{width:100%;max-width:420px;}
.rp-logo{font-size:20px;font-weight:600;margin-bottom:26px;text-align:center;}
.rp-logo span{color:#2A8A74;}
.rp-card{background:rgba(255,255,255,.035);border:1px solid rgba(27,107,90,.24);border-radius:14px;padding:26px 24px;}
.rp-t{font-size:18px;font-weight:700;margin-bottom:5px;}
.rp-s{font-size:13.5px;color:rgba(255,255,255,.6);margin-bottom:20px;}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin-bottom:6px;margin-top:14px;}
input[type=password]{width:100%;padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.16);color:#fff;font-family:inherit;font-size:15px;min-height:44px;}
input[type=password]:focus{outline:none;border-color:#7ECFC0;}
.rp-btn{width:100%;margin-top:18px;padding:12px 16px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#2A8A74,#1B6B5A);min-height:46px;}
.rp-btn:disabled{opacity:.6;cursor:default;}
.rp-msg{margin-top:14px;font-size:13.5px;padding:10px 12px;border-radius:9px;display:none;}
.rp-err{color:#FFB4A8;background:rgba(255,120,100,.1);border:1px solid rgba(255,120,100,.3);}
.rp-ok{color:#A8FFD4;background:rgba(126,207,192,.1);border:1px solid rgba(126,207,192,.32);}
.rp-hint{font-size:12px;color:rgba(255,255,255,.42);margin-top:9px;}
.rp-link{display:block;text-align:center;margin-top:16px;font-size:13.5px;color:#7ECFC0;text-decoration:none;}
</style>
</head>
<body>
<div class="rp">
  <div class="rp-logo">Anest<span>heo</span></div>
  <div class="rp-card">
    <div class="rp-t" id="rp-t">Checking your link…</div>
    <div class="rp-s" id="rp-s">One moment.</div>
    <div id="rp-form" style="display:none">
      <label for="rp-p1">New password</label>
      <input type="password" id="rp-p1" autocomplete="new-password" placeholder="At least 8 characters">
      <label for="rp-p2">Confirm new password</label>
      <input type="password" id="rp-p2" autocomplete="new-password" placeholder="Repeat it">
      <button class="rp-btn" id="rp-btn" onclick="submitNew()">Set new password</button>
      <div class="rp-hint">Use at least 8 characters. Longer is better than complicated.</div>
    </div>
    <div class="rp-msg rp-err" id="rp-err"></div>
    <div class="rp-msg rp-ok" id="rp-ok"></div>
    <a class="rp-link" id="rp-back" href="/index.html" style="display:none">Back to sign in</a>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   PASSWORD RECOVERY

   Before this page existed, resetPasswordForEmail() had no redirectTo. The
   link therefore landed on the Supabase Site URL, where detectSessionInUrl
   quietly signed the person in and left them on the homepage with no prompt
   and no way to set a password. The mechanism worked; the destination did not
   exist.

   WHY THERE IS NO requireAuth() GUARD HERE. A recovery link produces a real
   but special session. Putting the ordinary guard in front of this page would
   be circular — the guard bounces unauthenticated visitors to the homepage,
   which is exactly the dead end being fixed. This page therefore accepts the
   recovery session directly and asks for nothing else. It only ever calls
   updateUser({password}) for the already-authenticated user, so it grants no
   access that the link itself did not already carry.
   ═══════════════════════════════════════════════════════════════════════════ */

var _ready = false;

function setHead(t, s){ document.getElementById('rp-t').textContent = t;
                        document.getElementById('rp-s').textContent = s; }
function err(m){ var e=document.getElementById('rp-err'); e.textContent=m; e.style.display='block';
                 document.getElementById('rp-ok').style.display='none'; }
function ok(m){ var e=document.getElementById('rp-ok'); e.textContent=m; e.style.display='block';
                document.getElementById('rp-err').style.display='none'; }
function showBack(){ document.getElementById('rp-back').style.display='block'; }

function linkProblem(){
  var raw = (window.location.hash.slice(1) + '&' + window.location.search.slice(1));
  var p = {};
  raw.split('&').forEach(function(kv){ if(!kv) return; var i=kv.indexOf('='); if(i<0) return;
    p[decodeURIComponent(kv.slice(0,i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' ')); });
  return (p.error || p.error_code) ? (p.error_description || p.error) : null;
}

async function waitForSession(maxMs){
  var t0 = Date.now();
  while(Date.now() - t0 < maxMs){
    try { var r = await window.sb.auth.getSession();
          if(r && r.data && r.data.session) return r.data.session; } catch(e){}
    await new Promise(function(r){ setTimeout(r, 250); });
  }
  return null;
}

(async function(){
  var problem = linkProblem();
  if(problem){
    setHead('This reset link is no longer valid',
            'Reset links expire after a short time and can only be used once.');
    err(/expired/i.test(problem)
      ? 'The link has expired. Request a new password reset and use the newest email.'
      : 'This link could not be used. Request a new password reset.');
    showBack();
    return;
  }

  var session = await waitForSession(8000);
  if(!session){
    setHead('We could not open your reset link',
            'It may have expired, already been used, or been opened in a different browser.');
    err('Request a new password reset, then open the link in the same browser.');
    showBack();
    return;
  }

  _ready = true;
  var who = (session.user && session.user.email) ? session.user.email : 'your account';
  setHead('Choose a new password', 'Setting a new password for ' + who + '.');
  document.getElementById('rp-form').style.display = 'block';
  var f = document.getElementById('rp-p1'); if(f) try{ f.focus(); }catch(e){}
})();

async function submitNew(){
  if(!_ready) return;
  var p1 = document.getElementById('rp-p1').value;
  var p2 = document.getElementById('rp-p2').value;
  var btn = document.getElementById('rp-btn');

  if(!p1 || p1.length < 8){ err('Use at least 8 characters.'); return; }
  if(p1 !== p2){ err('Those two passwords do not match.'); return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    var r = await window.sb.auth.updateUser({ password: p1 });
    if(r && r.error){
      btn.disabled = false; btn.textContent = 'Set new password';
      var m = String(r.error.message || '');
      // Never surface raw provider text; it leaks policy detail and reads badly.
      if(/same as the old|should be different/i.test(m)){ err('That is already your current password. Choose a different one.'); }
      else if(/weak|short|at least/i.test(m)){ err('That password is too weak. Try a longer one.'); }
      else if(/expired|invalid|not authenticated|session/i.test(m)){
        err('Your reset link expired before the password was saved. Request a new one.'); showBack();
      }
      else { err('We could not save that password. Please try again.'); }
      return;
    }

    document.getElementById('rp-form').style.display = 'none';
    setHead('Password updated', 'You are signed in and can continue.');
    ok('Your password has been changed.');

    /* The recovery session is now an ordinary session, so route on the real
       database role exactly as any other landing would — no assumptions about
       who this person is. */
    var dest = '/index.html';
    try { var res = await window.resolveAuthDestination(); if(res && res.ok) dest = res.dest; } catch(e){}
    setTimeout(function(){ window.location.replace(dest); }, 1200);

  }catch(e){
    btn.disabled = false; btn.textContent = 'Set new password';
    err('We could not reach the server. Check your connection and try again.');
  }
}
</script>
</body>
</html>
